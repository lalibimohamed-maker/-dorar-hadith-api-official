services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--requirepass",${REDIS_PASSWORD:?REDIS_PASSWORD is required}]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
