name: dinullah-open-runtime

services:
  nats:
    image: nats:2.15.0
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  nifi:
    image: apache/nifi:2.12.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8443/nifi-api/system-diagnostics >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  colmap:
    build:
      context: ../../
      dockerfile: runtime/colmap/Dockerfile
    restart: "no"
    entrypoint: ["colmap"]
    command: ["-h"]
    profiles: ["3d"]

  video2x:
    image: ghcr.io/k4yt3x/video2x:6.4.0@sha256:e21b6893269b4cb6f5603802726fd7537be241f6b39217b73530478861acbca1
    restart: "no"
    command: ["--help"]
    profiles: ["gpu"]
    gpus: all

  media-runtime:
    build:
      context: ../../
      dockerfile: runtime/media/Dockerfile
    restart: "no"
    profiles: ["media"]
    volumes:
      - ../../runtime-data:/runtime-data
    environment:
      DINULLAH_MEDIA_WEIGHTS_DIR: /runtime-data/weights
