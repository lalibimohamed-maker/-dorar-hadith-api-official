name: Rechercher - Waqfeya Century 15 governed acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - fix/pr367-waqfeya-6422-governed-harvest

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory the live Waqfeya Century-15 catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total: ${{ steps.inventory.outputs.total }}
    steps:
      - id: inventory
        name: Crawl all catalog pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15
          python3 - <<'PY'
          import html.parser, json, os, re, time, urllib.parse, urllib.request

          BASE='https://waqfeya.net'
          FIRST=BASE + '/centuries/%D8%A7%D9%84%D9%82%D8%B1%D9%86-15-%D9%87%D9%80-426d13bd9086441e84cbb8b7ed9d3a1a'
          PAGE='https://waqfeya.com/top.php?st={}'

          class Parser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]; self.text=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  h=d.get('href')
                  if h: self.hrefs.append(h)
              def handle_data(self, data): self.text.append(data)

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Rechercher-governed-acquisition/1.0'})
              return urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')

          first=get(FIRST)
          m=re.search(r'عدد الكتب:\s*([0-9,]+)', first)
          if not m: raise SystemExit('Unable to determine live Waqfeya Century-15 count')
          total=int(m.group(1).replace(',',''))
          page_size=50
          pages=[]
          for offset in range(0,total,page_size):
              pages.append((offset,PAGE.format(offset)))

          records=[]
          seen=set()
          for offset,url in pages:
              try:
                  p=Parser(); p.feed(get(url))
              except Exception as e:
                  raise SystemExit(f'catalog page offset {offset} failed: {e}')
              for h in p.hrefs:
                  u=urllib.parse.urljoin(BASE,h)
                  if '/books/' not in u: continue
                  if u in seen: continue
                  seen.add(u)
                  records.append({'ordinal':len(records)+1,'sourcePage':u,'catalogOffset':offset})
              time.sleep(.05)

          # The live catalog can change while crawling. Preserve both the reported total and observed unique URLs.
          json.dump({'source':FIRST,'reportedCount':total,'pageSize':page_size,'pagesCrawled':len(pages),'observedUniqueBookPages':len(records)},open('artifacts/waqfeya-century15/source-count.json','w'),ensure_ascii=False,indent=2)
          with open('artifacts/waqfeya-century15/inventory.jsonl','w',encoding='utf-8') as f:
              for r in records: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          print(f'Live reported count: {total}')
          print(f'Observed unique book pages: {len(records)}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'total={total}\n')
          PY
          test -s artifacts/waqfeya-century15/inventory.jsonl
          cat artifacts/waqfeya-century15/source-count.json

      - name: Publish complete inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-inventory-${{ github.run_id }}
          path: artifacts/waqfeya-century15
          if-no-files-found: error
          retention-days: 30

  shard:
    needs: inventory
    name: Governed acquisition shard
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        start: [0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000,2100,2200,2300,2400,2500,2600,2700,2800,2900,3000,3100,3200,3300,3400,3500,3600,3700,3800,3900,4000,4100,4200,4300,4400,4500,4600,4700,4800,4900,5000,5100,5200,5300,5400,5500,5600,5700,5800,5900,6000,6100,6200,6300,6400,6500,6600]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the live inventory artifact from this workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15
          curl --fail --silent --show-error --retry 4 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=rechercher-waqfeya-century15-inventory-${{ github.run_id }}" \
            -o /tmp/artifacts.json
          artifact_url=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/artifacts.json'))
          a=d.get('artifacts') or []
          if not a: raise SystemExit('inventory artifact not found')
          print(a[0]['archive_download_url'])
          PY
          )
          curl --fail --silent --show-error --retry 4 -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' "$artifact_url" -o /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d /tmp/inventory
          cp /tmp/inventory/source-count.json artifacts/waqfeya-century15/source-count.json
          cp /tmp/inventory/inventory.jsonl artifacts/waqfeya-century15/inventory.jsonl

      - name: Govern and acquire this shard
        env:
          START: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from html.parser import HTMLParser

          START=int(os.environ['START']); COUNT=100
          rows=open('artifacts/waqfeya-century15/inventory.jsonl',encoding='utf-8').read().splitlines()[START:START+COUNT]
          out='artifacts/waqfeya-century15/shard-%05d' % START
          os.makedirs(out+'/pdf',exist_ok=True)

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  h=dict(attrs).get('href');
                  if h: self.links.append(h)
              def handle_data(self,d): self.text.append(d)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Rechercher-governed-acquisition/1.0'})
              return urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')

          results=[]; eligible=0; downloaded=0
          for line in rows:
              rec=json.loads(line); url=rec['sourcePage']
              try:
                  p=P(); p.feed(fetch(url)); text=' '.join(p.text)
                  explicit=bool(re.search(r'وقف لله|وقفٌ لله|وقف لله تعالى|يوزع مجانا|يوزّع مجانا|مجانا ولا يجوز بيعه|إتاحة حرة|متاح مجانا',text,re.I))
                  candidates=[]
                  for h in p.links:
                      u=urllib.parse.urljoin(url,h)
                      if u.lower().endswith('.pdf') and ('waqfeya.net' in u.lower() or 'archive.org' in u.lower()):
                          candidates.append(u)
                  item={'ordinal':rec['ordinal'],'sourcePage':url,'explicitWaqfOrFreeEvidence':explicit,'downloadCandidates':candidates[:10]}
                  if explicit and candidates:
                      eligible += 1
                      for j,u in enumerate(candidates[:10],1):
                          try:
                              req=urllib.request.Request(u,headers={'User-Agent':'Rechercher-governed-acquisition/1.0'})
                              data=urllib.request.urlopen(req,timeout=180).read()
                              if not data.startswith(b'%PDF-'): continue
                              sha=hashlib.sha256(data).hexdigest(); path=f'{out}/pdf/{rec["ordinal"]:05d}-{sha[:16]}.pdf'
                              open(path,'wb').write(data)
                              item.update(download=u,bytes=len(data),sha256=sha,localPath=path,status='VERIFIED_PDF'); downloaded += 1; break
                          except Exception as e: item['downloadError']=str(e)
                  else:
                      item['status']='READ_ONLY_OR_UNCLEARED'
                  results.append(item)
              except Exception as e:
                  results.append({'ordinal':rec['ordinal'],'sourcePage':url,'status':'ERROR','error':str(e)})

          json.dump(results,open(out+'/results.json','w'),ensure_ascii=False,indent=2)
          json.dump({'start':START,'countRequested':COUNT,'recordsProcessed':len(results),'rightsClearedCandidates':eligible,'verifiedPdfs':downloaded},open(out+'/summary.json','w'),ensure_ascii=False,indent=2)
          with open(out+'/pdfs.sha256','w') as f:
              for root,_,files in os.walk(out+'/pdf'):
                  for name in sorted(files):
                      p=os.path.join(root,name); f.write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')
          print(json.dumps({'start':START,'processed':len(results),'rightsCleared':eligible,'verifiedPdfs':downloaded},ensure_ascii=False))

      - name: Publish shard ledger and verified PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-shard-${{ matrix.start }}-${{ github.run_id }}
          path: artifacts/waqfeya-century15/shard-${{ matrix.start }}
          if-no-files-found: error
          retention-days: 30
