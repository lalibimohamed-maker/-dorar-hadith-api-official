name: Rechercher - Waqfeya Century 15 governed acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - fix/pr367-waqfeya-6422-governed-harvest

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory the live Waqfeya Century-15 catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      total: ${{ steps.inventory.outputs.total }}
    steps:
      - id: inventory
        name: Crawl all catalog pages with curl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15/pages
          first='https://waqfeya.net/centuries/%D8%A7%D9%84%D9%82%D8%B1%D9%86-15-%D9%87%D9%80-426d13bd9086441e84cbb8b7ed9d3a1a'
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors --connect-timeout 20 --max-time 60 \
            -A 'Rechercher-governed-acquisition/1.0' "$first" -o artifacts/waqfeya-century15/pages/century.html
          total=$(python3 - <<'PY'
          import re
          html=open('artifacts/waqfeya-century15/pages/century.html',encoding='utf-8',errors='replace').read()
          matches=re.findall(r'عدد الكتب\s*[:：]\s*([0-9,٬]+)',html)
          if not matches:
              raise SystemExit('Could not parse Waqfeya Century-15 live count')
          print(int(matches[0].replace(',','').replace('٬','')))
          PY
          )
          echo "Live reported count: $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          : > artifacts/waqfeya-century15/inventory.jsonl
          base='https://waqfeya.com/top.php?st='
          page_size=50
          for offset in $(seq 0 50 $(( ((total-1)/50)*50 )) ); do
            url="${base}${offset}"
            out="artifacts/waqfeya-century15/pages/top-${offset}.html"
            curl --fail --location --silent --show-error --retry 6 --retry-all-errors --connect-timeout 20 --max-time 60 \
              -A 'Rechercher-governed-acquisition/1.0' "$url" -o "$out"
            OFFSET="$offset" python3 - <<'PY' >> /tmp/waqfeya-rows.jsonl
          import json,os,urllib.parse
          from html.parser import HTMLParser
          path=f"artifacts/waqfeya-century15/pages/top-{os.environ['OFFSET']}.html"
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  h=dict(attrs).get('href')
                  if h: self.hrefs.append(h)
          p=P(); p.feed(open(path,encoding='utf-8',errors='replace').read())
          seen=set()
          for h in p.hrefs:
              u=urllib.parse.urljoin('https://waqfeya.net',h)
              if '/books/' not in u or u in seen: continue
              seen.add(u); print(json.dumps({'sourcePage':u,'catalogOffset':int(os.environ['OFFSET'])},ensure_ascii=False))
          PY
          done
          python3 - <<'PY'
          import json
          seen=set(); rows=[]
          for line in open('/tmp/waqfeya-rows.jsonl',encoding='utf-8'):
              r=json.loads(line)
              if r['sourcePage'] in seen: continue
              seen.add(r['sourcePage']); r['ordinal']=len(rows)+1; rows.append(r)
          with open('artifacts/waqfeya-century15/inventory.jsonl','w',encoding='utf-8') as f:
              for r in rows: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          json.dump({'source':'https://waqfeya.net/centuries/القرن-15-هـ-426d13bd9086441e84cbb8b7ed9d3a1a','reportedCount':int(open('artifacts/waqfeya-century15/pages/century.html',encoding='utf-8',errors='replace').read() and 0)},open('/tmp/unused','w'))
          print(f'Observed unique book pages: {len(rows)}')
          if len(rows) < int(__import__('os').environ.get('MIN_EXPECTED','1')): raise SystemExit('No book pages were discovered')
          PY
          python3 - <<'PY'
          import json,re
          html=open('artifacts/waqfeya-century15/pages/century.html',encoding='utf-8',errors='replace').read()
          total=int(re.findall(r'عدد الكتب\s*[:：]\s*([0-9,٬]+)',html)[0].replace(',','').replace('٬',''))
          rows=sum(1 for _ in open('artifacts/waqfeya-century15/inventory.jsonl',encoding='utf-8'))
          json.dump({'source':'https://waqfeya.net/centuries/القرن-15-هـ-426d13bd9086441e84cbb8b7ed9d3a1a','reportedCount':total,'pageSize':50,'observedUniqueBookPages':rows},open('artifacts/waqfeya-century15/source-count.json','w'),ensure_ascii=False,indent=2)
          PY
          test -s artifacts/waqfeya-century15/inventory.jsonl
          cat artifacts/waqfeya-century15/source-count.json

      - name: Publish complete inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-inventory-${{ github.run_id }}
          path: artifacts/waqfeya-century15
          if-no-files-found: error
          retention-days: 30

  shard:
    needs: inventory
    name: Governed acquisition shard
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        start: [0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000,2100,2200,2300,2400,2500,2600,2700,2800,2900,3000,3100,3200,3300,3400,3500,3600,3700,3800,3900,4000,4100,4200,4300,4400,4500,4600,4700,4800,4900,5000,5100,5200,5300,5400,5500,5600,5700,5800,5900,6000,6100,6200,6300,6400,6500,6600]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the live inventory artifact from this workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=rechercher-waqfeya-century15-inventory-${{ github.run_id }}" \
            -o /tmp/artifacts.json
          artifact_url=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/artifacts.json'))
          a=d.get('artifacts') or []
          if not a: raise SystemExit('inventory artifact not found')
          print(a[0]['archive_download_url'])
          PY
          )
          curl --fail --silent --show-error --retry 6 --retry-all-errors -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' "$artifact_url" -o /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d /tmp/inventory
          cp /tmp/inventory/source-count.json artifacts/waqfeya-century15/source-count.json
          cp /tmp/inventory/inventory.jsonl artifacts/waqfeya-century15/inventory.jsonl

      - name: Govern and acquire this shard
        env:
          START: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from html.parser import HTMLParser

          START=int(os.environ['START']); COUNT=100
          rows=open('artifacts/waqfeya-century15/inventory.jsonl',encoding='utf-8').read().splitlines()[START:START+COUNT]
          out='artifacts/waqfeya-century15/shard-%05d' % START
          os.makedirs(out+'/pdf',exist_ok=True)

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  h=dict(attrs).get('href')
                  if h: self.links.append(h)
              def handle_data(self,d): self.text.append(d)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Rechercher-governed-acquisition/1.0'})
              return urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')

          results=[]; eligible=0; downloaded=0
          for line in rows:
              rec=json.loads(line); url=rec['sourcePage']
              try:
                  p=P(); p.feed(fetch(url)); text=' '.join(p.text)
                  explicit=bool(re.search(r'وقف لله|وقفٌ لله|وقف لله تعالى|يوزع مجانا|يوزّع مجانا|مجانا ولا يجوز بيعه|إتاحة حرة|متاح مجانا',text,re.I))
                  candidates=[]
                  for h in p.links:
                      u=urllib.parse.urljoin(url,h)
                      if u.lower().endswith('.pdf') and ('waqfeya.net' in u.lower() or 'archive.org' in u.lower()): candidates.append(u)
                  item={'ordinal':rec['ordinal'],'sourcePage':url,'explicitWaqfOrFreeEvidence':explicit,'downloadCandidates':candidates[:10]}
                  if explicit and candidates:
                      eligible += 1
                      for u in candidates[:10]:
                          try:
                              req=urllib.request.Request(u,headers={'User-Agent':'Rechercher-governed-acquisition/1.0'})
                              data=urllib.request.urlopen(req,timeout=180).read()
                              if not data.startswith(b'%PDF-'): continue
                              sha=hashlib.sha256(data).hexdigest(); path=f'{out}/pdf/{rec["ordinal"]:05d}-{sha[:16]}.pdf'
                              open(path,'wb').write(data)
                              item.update(download=u,bytes=len(data),sha256=sha,localPath=path,status='VERIFIED_PDF'); downloaded += 1; break
                          except Exception as e: item['downloadError']=str(e)
                  else: item['status']='READ_ONLY_OR_UNCLEARED'
                  results.append(item)
              except Exception as e: results.append({'ordinal':rec['ordinal'],'sourcePage':url,'status':'ERROR','error':str(e)})

          json.dump(results,open(out+'/results.json','w'),ensure_ascii=False,indent=2)
          json.dump({'start':START,'countRequested':COUNT,'recordsProcessed':len(results),'rightsClearedCandidates':eligible,'verifiedPdfs':downloaded},open(out+'/summary.json','w'),ensure_ascii=False,indent=2)
          with open(out+'/pdfs.sha256','w') as f:
              for root,_,files in os.walk(out+'/pdf'):
                  for name in sorted(files):
                      p=os.path.join(root,name); f.write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')
          print(json.dumps({'start':START,'processed':len(results),'rightsCleared':eligible,'verifiedPdfs':downloaded},ensure_ascii=False))

      - name: Publish shard ledger and verified PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-shard-${{ matrix.start }}-${{ github.run_id }}
          path: artifacts/waqfeya-century15/shard-${{ matrix.start }}
          if-no-files-found: error
          retention-days: 30
