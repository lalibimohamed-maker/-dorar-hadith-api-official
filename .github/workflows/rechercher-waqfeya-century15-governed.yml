name: Rechercher - Waqfeya Century 15 governed acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - fix/pr367-waqfeya-6422-governed-harvest

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: Inventory the live Waqfeya Century-15 catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      total: ${{ steps.inventory.outputs.total }}
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - id: inventory
        name: Crawl the live Century-15 page
        shell: bash
        env:
          WAQFEYA_CENTURY_URL: https://www.waqfeya.net/centuries/%D8%A7%D9%84%D9%82%D8%B1%D9%86-15-%D9%87%D9%80-426d13bd9086441e84cbb8b7ed9d3a1a
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15/pages
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors --connect-timeout 20 --max-time 90 \
            -A 'Mozilla/5.0 (compatible; Rechercher-governed-acquisition/1.0)' \
            -H 'Accept: text/html,application/xhtml+xml' \
            "$WAQFEYA_CENTURY_URL" -o artifacts/waqfeya-century15/pages/century.html

          WAQFEYA_CENTURY_URL="$WAQFEYA_CENTURY_URL" python3 - <<'PY'
          import html as htmlmod
          import json, os, re, urllib.parse
          from html.parser import HTMLParser

          path='artifacts/waqfeya-century15/pages/century.html'
          source=os.environ['WAQFEYA_CENTURY_URL']
          raw=open(path,encoding='utf-8',errors='replace').read()
          decoded=htmlmod.unescape(raw).replace('\\/','/')
          if '<title' not in decoded.lower() and len(decoded) < 1000:
              raise SystemExit('Waqfeya response is unexpectedly small; refusing to build an incomplete inventory')

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  h=dict(attrs).get('href')
                  if h: self.hrefs.append(h)

          p=P(); p.feed(decoded)
          found=[]; seen=set()
          for h in p.hrefs:
              u=urllib.parse.urljoin('https://www.waqfeya.net',h)
              if '/books/' not in u: continue
              u=u.split('#',1)[0]
              if u in seen: continue
              seen.add(u); found.append(u)

          for m in re.finditer(r'https?://(?:www\\.)?waqfeya\\.net/books/[^"\\s<>]+|/books/[^"\\s<>]+', decoded):
              u=urllib.parse.urljoin('https://www.waqfeya.net',m.group(0)).split('#',1)[0]
              if u not in seen:
                  seen.add(u); found.append(u)

          if not found:
              raise SystemExit('No /books/ links found in the live Century-15 response; refusing guessed offsets/counts')

          count_match=re.search(r'عدد الكتب\\s*[:：]?\\s*([0-9,٬\\s]+)', decoded)
          reported=int(re.sub(r'[^0-9]','',count_match.group(1))) if count_match else None
          records=[{'ordinal':i+1,'sourcePage':u,'catalogPage':source} for i,u in enumerate(found)]

          with open('artifacts/waqfeya-century15/inventory.jsonl','w',encoding='utf-8') as f:
              for r in records: f.write(json.dumps(r,ensure_ascii=False)+'\\n')

          observed=len(records)
          metadata={
              'source':source,
              'reportedCount':reported,
              'observedUniqueBookPages':observed,
              'countDelta': (observed-reported) if reported is not None else None,
              'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'policy':'Inventory is source-discovery only; acquisition remains rights-gated per edition.'
          }
          json.dump(metadata,open('artifacts/waqfeya-century15/source-count.json','w'),ensure_ascii=False,indent=2)

          shard_size=100
          matrix={'include':[{'start':s} for s in range(0,observed,shard_size)]}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'total={observed}\\n')
              out.write(f'matrix={json.dumps(matrix,separators=(",",":"))}\\n')
          print(json.dumps(metadata,ensure_ascii=False))
          print(f'Built {len(found)} Century-15 book records; reported site count={reported!r}')
          PY

          test -s artifacts/waqfeya-century15/inventory.jsonl
          cat artifacts/waqfeya-century15/source-count.json

      - name: Publish complete inventory
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-inventory-${{ github.run_id }}
          path: artifacts/waqfeya-century15
          if-no-files-found: error
          retention-days: 30

  shard:
    needs: inventory
    name: Governed acquisition shard
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the live inventory artifact from this workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-century15
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=rechercher-waqfeya-century15-inventory-${{ github.run_id }}" \
            -o /tmp/artifacts.json
          artifact_url=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/artifacts.json')); a=d.get('artifacts') or []
          if not a: raise SystemExit('inventory artifact not found')
          print(a[0]['archive_download_url'])
          PY
          )
          curl --fail --silent --show-error --retry 6 --retry-all-errors -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' "$artifact_url" -o /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d /tmp/inventory
          cp /tmp/inventory/source-count.json artifacts/waqfeya-century15/source-count.json
          cp /tmp/inventory/inventory.jsonl artifacts/waqfeya-century15/inventory.jsonl
      - name: Govern and acquire this shard
        env:
          START: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          START=int(os.environ['START']); COUNT=100
          lines=open('artifacts/waqfeya-century15/inventory.jsonl',encoding='utf-8').read().splitlines()
          rows=[json.loads(x) for x in lines[START:START+COUNT]]
          out=f'artifacts/waqfeya-century15/shard-{START:05d}'
          os.makedirs(out+'/pdf',exist_ok=True)
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  h=dict(attrs).get('href')
                  if h: self.links.append(h)
              def handle_data(self,d): self.text.append(d)
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Rechercher-governed-acquisition/1.0)'})
              return urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')
          results=[]; cleared=downloaded=0
          for rec in rows:
              url=rec['sourcePage']
              try:
                  p=P(); p.feed(fetch(url)); text=' '.join(p.text)
                  explicit=bool(re.search(r'وقف لله|وقف\\s*لله\\s*تعالى|يوزع\\s*مجانا|يوزّع\\s*مجانا|مجانا\\s*ولا\\s*يجوز\\s*بيعه|إتاحة\\s*حرة|متاح\\s*مجانا',text,re.I))
                  candidates=[]
                  for h in p.links:
                      u=urllib.parse.urljoin(url,h)
                      if not u.lower().endswith('.pdf'): continue
                      host=urllib.parse.urlsplit(u).hostname or ''
                      if host in {'waqfeya.net','www.waqfeya.net','archive.org','www.archive.org'}: candidates.append(u)
                  item={'ordinal':rec['ordinal'],'sourcePage':url,'explicitWaqfOrFreeEvidence':explicit,'downloadCandidates':list(dict.fromkeys(candidates))[:10]}
                  if explicit and candidates:
                      cleared += 1
                      for u in item['downloadCandidates']:
                          try:
                              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; Rechercher-governed-acquisition/1.0)'})
                              data=urllib.request.urlopen(req,timeout=180).read()
                              if not data.startswith(b'%PDF-'): continue
                              sha=hashlib.sha256(data).hexdigest(); path=f'{out}/pdf/{rec["ordinal"]:05d}-{sha[:16]}.pdf'
                              open(path,'wb').write(data); item.update(downloadUrl=u,bytes=len(data),sha256=sha,localPath=path,status='VERIFIED_PDF'); downloaded += 1; break
                          except Exception as e: item['downloadError']=str(e)
                      if 'status' not in item: item['status']='RIGHTS_CLEARED_NO_VERIFIED_PDF'
                  else: item['status']='READ_ONLY_OR_UNCLEARED'
                  results.append(item)
              except Exception as e: results.append({'ordinal':rec['ordinal'],'sourcePage':url,'status':'ERROR','error':str(e)})
          json.dump(results,open(out+'/results.json','w'),ensure_ascii=False,indent=2)
          summary={'start':START,'countRequested':COUNT,'recordsProcessed':len(results),'rightsClearedCandidates':cleared,'verifiedPdfs':downloaded,'policy':'Rights are evaluated per edition; catalog inventory does not itself authorize mirroring.'}
          json.dump(summary,open(out+'/summary.json','w'),ensure_ascii=False,indent=2)
          with open(out+'/pdfs.sha256','w') as f:
              for name in sorted(os.listdir(out+'/pdf')):
                  p=os.path.join(out+'/pdf',name); f.write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Publish shard ledger and verified PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-waqfeya-century15-shard-${{ matrix.start }}-${{ github.run_id }}
          path: artifacts/waqfeya-century15/shard-${{ matrix.start }}
          if-no-files-found: error
          retention-days: 30
