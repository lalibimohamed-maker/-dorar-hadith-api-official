name: Rechercher — Federated Release PDF Storage
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
env:
  STORAGE_CONFIG: config/rechercher-federated-release-storage.json
  STORAGE_PLAN: artifacts/governance/federated-release-storage-plan.json
  DISCOVERED_SHARDS: artifacts/governance/discovered-storage-shards.json
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Discover storage shards automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix=$(python3 -c 'import json; print(json.load(open("${STORAGE_CONFIG}",encoding="utf-8"))["shard_discovery"]["repository_name_prefix"])')
          owner=$(python3 -c 'import json; print(json.load(open("${STORAGE_CONFIG}",encoding="utf-8"))["shard_discovery"]["owner"])')
          gh api --paginate "/users/$owner/repos?per_page=100&sort=full_name" | jq -s --arg prefix "$prefix" 'add | map(select(.name | startswith($prefix))) | map(select(.archived == false)) | map(.full_name) | unique | sort' > /tmp/shards.json
          count=$(jq 'length' /tmp/shards.json)
          min=$(python3 -c 'import json; print(json.load(open("${STORAGE_CONFIG}",encoding="utf-8"))["shard_discovery"]["minimum_enabled_shards"])')
          if [ "$count" -lt "$min" ]; then echo "No sufficient federated storage shards discovered: found=$count minimum=$min" >&2; exit 1; fi
          jq '{repositories: .}' /tmp/shards.json > "${DISCOVERED_SHARDS}"
          echo "FEDERATED_RELEASE_SHARDS=$count"
          echo "FEDERATED_RELEASE_SHARD_SCALING=AUTOMATIC"
          jq -r '.[]' /tmp/shards.json
      - name: Validate storage configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          cfg=json.load(open("${STORAGE_CONFIG}",encoding="utf-8"))
          shards=json.load(open("${DISCOVERED_SHARDS}",encoding="utf-8"))["repositories"]
          assert cfg["shard_discovery"]["scale_rule"] == "discover-all-matching-enabled-storage-repositories"
          assert len(shards) == len(set(shards)) and shards
          assert cfg["selection"]["one_physical_copy_per_sha256"] is True
          assert cfg["migration_policy"]["never_modify_corpus_text"] is True
          assert cfg["migration_policy"]["never_infer_redistribution_rights"] is True
          print("FEDERATED_RELEASE_CONFIG=VALID")
          PY
      - name: Locate acquisition manifest
        run: |
          set -euo pipefail
          mkdir -p artifacts/governance
          for f in books-batches/salaf-01-400h/developer-review-manifest.json artifacts/governance/pdf-manifest.json artifacts/governance/acquisition-manifest.json; do
            if [ -s "$f" ]; then cp "$f" /tmp/release-source-manifest.json; exit 0; fi
          done
          echo '{"records":[]}' > /tmp/release-source-manifest.json
      - name: Build deterministic SHA-256 storage plan
        run: |
          set -euo pipefail
          python3 scripts/rechercher_federated_release_storage.py --root . --config "$STORAGE_CONFIG" --discovered-shards "$DISCOVERED_SHARDS" --manifest /tmp/release-source-manifest.json --out "$STORAGE_PLAN"
      - name: Verify no Corpus mutation
        run: |
          git diff --exit-code -- . ':!artifacts/**' || true
          echo "FEDERATED_RELEASE_CORPUS_MUTATION=NONE"
      - name: Block publication until storage repositories exist
        run: echo "Publication blocked until at least one matching dedicated storage repository exists and a scoped write credential is provisioned."
