name: Rijal ingestion validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/rijal-*.json'
      - 'src/rijal-*.js'
      - 'scripts/validate-rijal-*.js'
      - 'data/rijal/**'
      - '.github/workflows/rijal-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'config/rijal-*.json'
      - 'src/rijal-*.js'
      - 'scripts/validate-rijal-*.js'
      - 'data/rijal/**'
      - '.github/workflows/rijal-ingestion.yml'

permissions:
  contents: read

concurrency:
  group: rijal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate complete Rijal corpus configuration
        run: npm run rijal:validate
      - name: Validate source-backed dataset
        run: node scripts/validate-rijal-dataset.js
