name: Rijal ingestion validation

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source ID (optional)'
        required: false
        default: 'bukhari-tarikh-kabir'
      limit:
        description: 'Maximum records to process'
        required: false
        default: '250'
  pull_request:
    paths:
      - 'config/rijal-*.json'
      - 'src/rijal-*.js'
      - 'scripts/validate-rijal-*.js'
      - 'data/rijal/**'
      - '.github/workflows/rijal-ingestion.yml'
  push:
    branches: [main]
    paths:
      - 'config/rijal-*.json'
      - 'src/rijal-*.js'
      - 'scripts/validate-rijal-*.js'
      - 'data/rijal/**'
      - '.github/workflows/rijal-ingestion.yml'

permissions:
  contents: read

concurrency:
  group: rijal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete Rijal corpus configuration
        run: npm run rijal:validate
      - name: Validate source-backed dataset
        run: node scripts/validate-rijal-dataset.js
