name: Rechercher — Legacy PDF migration to Releases

on:
  workflow_dispatch:

# security-justification: contents: write is required only to migrate legacy encrypted Release assets: the workflow validates/decrypts them, uploads verified plaintext PDFs to the protected private Releases destination, and deletes the legacy encrypted Release assets. It does not commit PDF payloads to the repository tree or use Git LFS.
permissions:
  contents: write

concurrency:
  group: rechercher-legacy-pdf-migration
  cancel-in-progress: false

env:
  PROTECTED_REPO: lalibimohamed82-coder/rechercher-pdf-storage

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout main state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Install migration tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssl qpdf poppler-utils

      - name: Verify private protected Releases destination
        env:
          PROTECTED_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PROTECTED_TOKEN"
          visibility=$(GH_TOKEN="$PROTECTED_TOKEN" gh repo view "$PROTECTED_REPO" --json visibility --jq .visibility)
          test "$visibility" = PRIVATE || { echo 'ERROR: protected PDF destination must be private.'; exit 1; }

      - name: Convert legacy encrypted Releases assets to plaintext PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_VAULT_KEY"
          test -n "$PROTECTED_TOKEN"
          work="$RUNNER_TEMP/encrypted-release-migration"
          mkdir -p "$work"
          migrated=0

          mapfile -t tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName |
              jq -r '.[].tagName | select(startswith("rechercher-vault-"))'
          )

          for tag in "${tags[@]}"; do
            mapfile -t assets < <(
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets |
                jq -r '.assets[].name | select(test("\\.(pdf\\.enc|enc|encrypted)$"; "i"))'
            )
            [ "${#assets[@]}" -gt 0 ] || continue

            private_tag="rechercher-migrated-${tag#rechercher-vault-}"
            if ! GH_TOKEN="$PROTECTED_TOKEN" gh release view "$private_tag" --repo "$PROTECTED_REPO" >/dev/null 2>&1; then
              GH_TOKEN="$PROTECTED_TOKEN" gh release create "$private_tag" --repo "$PROTECTED_REPO"                 --title "Rechercher migrated plaintext PDFs ${tag#rechercher-vault-}"                 --notes "Legacy encrypted assets converted to verified plaintext PDFs. Private repository; no .pdf.enc or Git LFS."
            fi

            for name in "${assets[@]}"; do
              rm -f "$work"/* || true
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$work"
              enc="$work/$name"
              case "$name" in
                *.pdf.enc) out="$work/${name%.enc}" ;;
                *.enc) out="$work/${name%.enc}.pdf" ;;
                *.encrypted) out="$work/${name%.encrypted}.pdf" ;;
                *) continue ;;
              esac

              openssl enc -d -aes-256-cbc -pbkdf2 -md sha256                 -pass env:REVIEW_VAULT_KEY -in "$enc" -out "$out"
              test -s "$out"
              head -c 5 "$out" | grep -qx '%PDF-'
              qpdf --check "$out" >/dev/null

              GH_TOKEN="$PROTECTED_TOKEN" gh release upload "$private_tag" "$out" --repo "$PROTECTED_REPO" --clobber
              gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes

              sha=$(sha256sum "$out" | awk '{print $1}')
              echo "[ENC->PRIVATE-RELEASE] source=$tag/$name sha256=$sha"
              migrated=$((migrated+1))
            done
          done

          echo "ENCRYPTED_RELEASE_ASSETS_MIGRATED=$migrated"

      - name: Verify no encrypted assets remain in legacy vault releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          leftovers=0
          mapfile -t tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName |
              jq -r '.[].tagName | select(startswith("rechercher-vault-"))'
          )
          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets |
              jq -e '[.assets[].name | select(test("\\.(pdf\\.enc|enc|encrypted)$"; "i"))] | length > 0' >/dev/null; then
              echo "ERROR: encrypted asset remains in $tag"
              leftovers=1
            fi
          done
          test "$leftovers" -eq 0
          echo "LEGACY_ENCRYPTED_RELEASES_CLEAN=1"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-legacy-pdf-migration-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-release-migration
          if-no-files-found: warn
          retention-days: 30
