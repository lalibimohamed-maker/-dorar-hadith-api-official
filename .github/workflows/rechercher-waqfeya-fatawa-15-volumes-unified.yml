name: Rechercher - Waqfeya Fatawa 15-volume unified download

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches:
      - rechercher/waqfeya-fatawa-15-volumes-unified
    paths-ignore:
      - artifacts/waqfeya-fatawa-committee-15-volumes.pdf
      - artifacts/waqfeya-fatawa-15-volumes-manifest.txt
      - artifacts/waqfeya-fatawa-committee-collection.pdf
      - artifacts/sha256.txt
      - artifacts/size.txt
      - .gitattributes
  workflow_dispatch:

permissions:
  # security-justification: required only to persist the verified unified Waqfeya PDF and manifest via Git LFS on this dedicated same-repository PR branch.
  contents: write

jobs:
  build-unified-book:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build verified 15-volume unified PDF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test -n "$branch"
          workdir="${RUNNER_TEMP}/waqfeya-fatawa-15"
          rm -rf "$workdir"
          git lfs version || (sudo apt-get update && sudo apt-get install -y git-lfs)
          sudo apt-get update
          sudo apt-get install -y qpdf
          git clone --branch "$branch" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$workdir"
          cd "$workdir"
          git lfs install --local
          mkdir -p source-pdfs artifacts

          urls=(
            'https://archive.org/download/FP124536/01_124536.pdf'
            'https://archive.org/download/FP124536/02_124537.pdf'
            'https://archive.org/download/FP124536/03_124538.pdf'
            'https://archive.org/download/FP124536/04_124539.pdf'
            'https://archive.org/download/FP124536/05_124540.pdf'
            'https://archive.org/download/FP124536/06_124541.pdf'
            'https://archive.org/download/FP124536/07_124542.pdf'
            'https://archive.org/download/FP124536/08_124543.pdf'
            'https://archive.org/download/FP124536/09_124544.pdf'
            'https://archive.org/download/FP124536/10_124545.pdf'
            'https://archive.org/download/FP124536/11_124546.pdf'
            'https://archive.org/download/FP124536/12_124547.pdf'
            'https://archive.org/download/FP124536/13_124548.pdf'
            'https://archive.org/download/FP124536/14_124549.pdf'
            'https://archive.org/download/FP124536/15_124550.pdf'
          )

          : > artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          echo '# Source: Waqfeya — فتاوى اللجنة الدائمة للبحوث العلمية والإفتاء - المجموعتان الأولي والثانية' >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          echo '# Waqfeya page: https://www.waqfeya.net/books/فتاوى-اللجنة-الدائمة-للبحوث-العلمية-والإفتاء-المجموعتان-الأولي-والثانية-e86cd2074e934dfbaa7e21796e395492' >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          echo '# Verified Waqfeya scope: 15 volumes; item marked وقف لله تعالى.' >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          echo '# Independent cross-check: المجموعة الثانية has 11 volumes; combined edition is 15 volumes total.' >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          echo >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt

          for idx in $(seq 1 15); do
            i=$(printf '%02d' "$idx")
            url="${urls[$((idx-1))]}"
            out="source-pdfs/${i}.pdf"
            echo "Downloading volume ${i}: ${url}"
            curl -L --fail --retry 5 --retry-delay 2 -o "$out" "$url"
            test "$(head -c 4 "$out")" = '%PDF'
            qpdf --check "$out"
            bytes=$(stat --format='%s' "$out")
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf 'volume=%s\tbytes=%s\tsha256=%s\turl=%s\n' "$i" "$bytes" "$sha" "$url" >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          done

          qpdf --empty --pages source-pdfs/01.pdf source-pdfs/02.pdf source-pdfs/03.pdf source-pdfs/04.pdf source-pdfs/05.pdf source-pdfs/06.pdf source-pdfs/07.pdf source-pdfs/08.pdf source-pdfs/09.pdf source-pdfs/10.pdf source-pdfs/11.pdf source-pdfs/12.pdf source-pdfs/13.pdf source-pdfs/14.pdf source-pdfs/15.pdf -- artifacts/waqfeya-fatawa-committee-15-volumes.pdf
          qpdf --check artifacts/waqfeya-fatawa-committee-15-volumes.pdf
          final_bytes=$(stat --format='%s' artifacts/waqfeya-fatawa-committee-15-volumes.pdf)
          final_sha=$(sha256sum artifacts/waqfeya-fatawa-committee-15-volumes.pdf | awk '{print $1}')
          printf '\nunified_bytes=%s\nunified_sha256=%s\nvolume_count=15\n' "$final_bytes" "$final_sha" >> artifacts/waqfeya-fatawa-15-volumes-manifest.txt

          git lfs track 'artifacts/waqfeya-fatawa-committee-15-volumes.pdf'
          rm -f artifacts/waqfeya-fatawa-committee-collection.pdf artifacts/sha256.txt artifacts/size.txt
          git add .gitattributes artifacts/waqfeya-fatawa-committee-15-volumes.pdf artifacts/waqfeya-fatawa-15-volumes-manifest.txt
          git add -u
          if git diff --cached --quiet; then
            echo 'No persistent changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(waqfeya): persist all 15 volumes as one unified PDF [skip ci]'
          git push origin "HEAD:$branch"
