name: Rechercher — Continuous whole-encyclopedia chronological acquisition

on:
  workflow_dispatch:
  schedule:
    # Automatic continuation. The persistent queue decides what remains;
    # there is no finite book-count target.
    - cron: '0 */6 * * *'

# security-justification: trusted default-branch caller only; it invokes the
# current central governed acquisition workflow and persists verified PDF bytes
# only as Release assets in the unified 6,384-matrix storage repository.
permissions:
  contents: write

# All acquisition callers publish to the same Release repository. A shared
# group prevents concurrent duplicate-release races.
concurrency:
  group: rechercher-unified-release-persistence
  cancel-in-progress: false

jobs:
  acquire:
    name: Resume chronological acquisition
    uses: ./.github/workflows/rechercher-governed-acquisition.yml
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_MATRIX_STORAGE_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
