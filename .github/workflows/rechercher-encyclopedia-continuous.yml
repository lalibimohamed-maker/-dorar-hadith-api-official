name: Rechercher — Continuous whole-encyclopedia chronological acquisition

on:
  workflow_dispatch:
  schedule:
    # Automatic continuation. The persistent queue decides what remains;
    # there is no finite book-count target.
    # Keep the interval longer than the normal acquisition window so
    # scheduled requests do not build a superseding concurrency queue.
    - cron: '0 */6 * * *'

# security-justification: trusted default-branch caller only; it invokes the
# reviewed central reusable acquisition workflow and persists only verified
# PDF/state outputs to the governed acquisition branch and secondary PDF pool.
permissions:
  contents: write

# All acquisition callers write to the same secondary LFS repository. A shared
# group prevents cross-queue non-fast-forward races on secondary/main.
concurrency:
  group: rechercher-secondary-lfs-persistence
  cancel-in-progress: false

jobs:
  acquire:
    name: Resume chronological acquisition
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@2e8a1c2ed2a5e1aa67973bcc64b0f5c838f2a3f5
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
