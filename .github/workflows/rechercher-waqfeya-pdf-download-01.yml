name: Rechercher - Waqfeya PDF download 01

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - rechercher/waqfeya-pdf-download-01
    paths-ignore:
      - artifacts/waqfeya-fatawa-committee-collection.pdf
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: write # security-justification: required only to persist the verified PDF via Git LFS on this dedicated branch.

jobs:
  download-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Keep a real repository change here so the latest PR head receives fresh checks.
      - name: Download explicitly marked Waqf PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          url='https://archive.org/download/FP124536/15_124550.pdf'
          curl -L --fail --retry 5 --retry-delay 2 --output artifacts/waqfeya-fatawa-committee-collection.pdf "$url"
          file artifacts/waqfeya-fatawa-committee-collection.pdf
          test "$(head -c 4 artifacts/waqfeya-fatawa-committee-collection.pdf)" = '%PDF'
          sha256sum artifacts/waqfeya-fatawa-committee-collection.pdf | tee artifacts/sha256.txt
          stat --format='bytes=%s' artifacts/waqfeya-fatawa-committee-collection.pdf | tee artifacts/size.txt

      - name: Persist verified PDF with Git LFS
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -x "$(command -v git)"
          git lfs version || (sudo apt-get update && sudo apt-get install -y git-lfs)

          workdir="${RUNNER_TEMP}/waqfeya-lfs-repo"
          rm -rf "$workdir"
          git clone --branch "${GITHUB_REF_NAME}" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$workdir"
          cd "$workdir"
          git lfs install --local

          mkdir -p artifacts
          cp "${GITHUB_WORKSPACE}/artifacts/waqfeya-fatawa-committee-collection.pdf" artifacts/waqfeya-fatawa-committee-collection.pdf
          cp "${GITHUB_WORKSPACE}/artifacts/sha256.txt" artifacts/sha256.txt
          cp "${GITHUB_WORKSPACE}/artifacts/size.txt" artifacts/size.txt

          git lfs track "artifacts/waqfeya-fatawa-committee-collection.pdf"
          git add .gitattributes artifacts/waqfeya-fatawa-committee-collection.pdf artifacts/sha256.txt artifacts/size.txt

          if git diff --cached --quiet; then
            echo 'No persistent changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(waqfeya): persist verified PDF with Git LFS [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          git lfs ls-files --long
          test -f artifacts/waqfeya-fatawa-committee-collection.pdf

      - name: Upload verified PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waqfeya-pdf-download-01
          path: artifacts/
          retention-days: 30
