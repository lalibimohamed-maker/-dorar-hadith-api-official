          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE"             --discovery books-batches/salaf-01-400h/master-discovery-additions-2026.json             --discovery books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json             --discovery books-batches/salaf-01-400h/engine-source-overlay.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json

      - name: Validate private review PDFs
        run: |
          set -euo pipefail
          if compgen -G 'artifacts/developer-review-vault/*.pdf' > /dev/null; then
            for f in artifacts/developer-review-vault/*.pdf; do
              test "$(head -c 5 "$f")" = '%PDF-'
              qpdf --check "$f"
            done
          fi

      - name: Normalize encrypted review inputs into ordinary PDFs
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
