name: Rechercher — Developer review acquisition

on:
  workflow_dispatch:

# security-justification: the workflow downloads catalogued research copies for developer review, encrypts retained copies with a GitHub secret, and never publishes plaintext restricted copies.
permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators and LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf git-lfs
          git lfs install --local
          git lfs track 'artifacts/developer-review-vault/*.pdf'
          git add .gitattributes

      - name: Acquire and validate copies
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE"

      - name: Preserve the original PDFs as the sole book representation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-developer-review-pdfs-${{ github.run_id }}
          path: artifacts/developer-review-vault/*.pdf
          if-no-files-found: ignore
          retention-days: 90

      - name: Persist original PDFs and manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          pdf_files=(artifacts/developer-review-vault/*.pdf)
          git add .gitattributes books-batches/salaf-01-400h/developer-review-manifest.json
          if [ "${#pdf_files[@]}" -gt 0 ]; then git add "${pdf_files[@]}"; fi
          if git diff --cached --quiet; then echo 'No acquisition changes.'; exit 0; fi
          git commit -m 'data(rechercher): retain original PDF developer review copies'
          git fetch origin "$REVIEW_BRANCH"
          git rebase "origin/$REVIEW_BRANCH"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" push origin "HEAD:refs/heads/$REVIEW_BRANCH"
