              *.encrypted) base="$(basename "${f%.encrypted}")" ;;
            esac
            out="artifacts/developer-review-vault/${base}.pdf"
            python3 scripts/rechercher_decrypt_review_copy.py "$f" "$out"
            test "$(head -c 5 "$out")" = '%PDF-'
            qpdf --check "$out"
            rm -f -- "$f"
          done < <(find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print0)
          if [ "$found" -eq 1 ]; then
            echo 'Encrypted review input was converted to ordinary .pdf and the encrypted input was removed.'
          else
