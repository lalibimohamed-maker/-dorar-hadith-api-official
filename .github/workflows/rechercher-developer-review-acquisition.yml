          fi

      - name: Reject encrypted PDF artifacts after normalization
        run: |
          set -euo pipefail
          if find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit | grep -q .; then
            echo 'ERROR: encrypted PDF artifacts remain after normalization.'
            exit 1
          fi

      - name: Upload private developer-review PDFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-developer-review-pdfs-${{ github.run_id }}
          path: artifacts/developer-review-vault/*.pdf
          if-no-files-found: warn
          retention-days: 90
