name: Rechercher — Developer review PDF acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Prepare private plaintext review workspace
        run: |
          set -euo pipefail
          mkdir -p artifacts/developer-review-vault artifacts/governance

      - name: Acquire and validate review copies
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE"             --discovery books-batches/salaf-01-400h/master-discovery-additions-2026.json             --discovery books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json             --discovery books-batches/salaf-01-400h/engine-source-overlay.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json

      - name: Validate private review PDFs
        run: |
          set -euo pipefail
          if compgen -G 'artifacts/developer-review-vault/*.pdf' > /dev/null; then
            for f in artifacts/developer-review-vault/*.pdf; do
              test "$(head -c 5 "$f")" = '%PDF-'
              qpdf --check "$f"
            done
          fi

      - name: Normalize encrypted review inputs into ordinary PDFs when possible
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          found=0
          recovered=0
          retained_encrypted=0
          mkdir -p artifacts/developer-review-vault
          while IFS= read -r -d '' f; do
            found=1
            base="$(basename "${f%.*}")"
            case "$f" in
              *.pdf.enc) base="$(basename "${f%.pdf.enc}")" ;;
              *.enc) base="$(basename "${f%.enc}")" ;;
              *.encrypted) base="$(basename "${f%.encrypted}")" ;;
            esac
            out="artifacts/developer-review-vault/${base}.pdf"
            if python3 scripts/rechercher_decrypt_review_copy.py "$f" "$out" && test "$(head -c 5 "$out")" = '%PDF-' && qpdf --check "$out"; then
              recovered=$((recovered+1))
              echo "[DEVELOPER-REVIEW-PDF] $out"
              # Keep the encrypted durable source; plaintext is a review working copy.
            else
              rm -f -- "$out"
              retained_encrypted=$((retained_encrypted+1))
              echo "[ENCRYPTED-RETAINED] $f could not be converted; keeping the encrypted source."
            fi
          done < <(find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print0)
          echo "ENCRYPTED_INPUTS_FOUND=$found"
          echo "PLAINTEXT_REVIEW_PDFS_RECOVERED=$recovered"
          echo "ENCRYPTED_INPUTS_RETAINED=$retained_encrypted"

      - name: Record encrypted-review retention state
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print > artifacts/encrypted-review-retained.txt || true
          echo 'Encrypted review sources are retained when plaintext conversion is unavailable.'