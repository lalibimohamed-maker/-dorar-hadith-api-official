name: Rechercher — Developer review acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# security-justification: the workflow downloads catalogued research copies for developer review, encrypts retained copies with a GitHub secret, and never publishes plaintext restricted copies.
permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators and LFS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf git-lfs
          git lfs install --local
          git lfs track 'artifacts/developer-review-vault/*.enc'
          git add .gitattributes

      - name: Require vault key
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_VAULT_KEY" || { echo 'REVIEW_VAULT_KEY is required; refusing to acquire or persist copies.'; exit 1; }

      - name: Acquire and validate copies
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE"
          test -s books-batches/salaf-01-400h/developer-review-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('books-batches/salaf-01-400h/developer-review-manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('ACQUISITION_COUNTS', json.dumps(d.get('counts',{}), ensure_ascii=False, sort_keys=True))
          PY

      - name: Encrypt retained copies
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in artifacts/developer-review-vault/*.pdf; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
              -pass env:REVIEW_VAULT_KEY -in "$f" -out "$f.enc"
            rm -f -- "$f"
          done

      - name: Persist encrypted vault and manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f books-batches/salaf-01-400h/developer-review-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes artifacts/developer-review-vault books-batches/salaf-01-400h/developer-review-manifest.json
          echo '--- staged acquisition state ---'
          git status --short
          if git diff --cached --quiet; then
            echo 'ERROR: acquisition produced no persistable change; manifest was not persisted.'
            exit 1
          fi
          git commit -m 'data(rechercher): retain encrypted developer review copies'
          ACQ_COMMIT=$(git rev-parse HEAD)
          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git cherry-pick "$ACQ_COMMIT"
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=${GIT_AUTH_HEADER}" push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "PERSISTED_COMMIT=$ACQ_COMMIT"
