name: Auto File Recovery
# workflow-run-justification: privileged workflow stays on trusted main code and never checks out or executes PR code.
# security-justification: contents: write is limited to restoring allowlisted workflow files on same-repository PR branches through the GitHub API; protected main is never updated.

on:
  workflow_run:
    workflows: [Workflow Integrity Check]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover allowlisted workflow files through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$PR_BRANCH" in
            ''|*[!A-Za-z0-9._/-]*) echo 'Unsafe PR branch name; refusing automatic recovery.'; exit 1;;
          esac
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          pr_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          pr_base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$pr_json")"
          pr_base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          pr_head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          if [ "$pr_head_sha" != "$EVENT_HEAD_SHA" ]; then echo 'PR advanced since the triggering workflow_run; refusing automatic recovery.'; exit 1; fi
          if [ "$pr_head_repo" != "$REPOSITORY" ] || [ "$pr_base_repo" != "$REPOSITORY" ] || [ "$pr_base_ref" != 'main' ]; then echo 'PR repository/base validation failed; refusing automatic recovery.'; exit 1; fi
          if [ "$pr_head_ref" != "$PR_BRANCH" ]; then echo 'PR branch mismatch; refusing automatic recovery.'; exit 1; fi
          files_json="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          mapfile -t workflow_paths < <(jq -r '.[] | select(.filename | test("^\\.github/workflows/[^/]+\\.(yml|yaml)$")) | .filename' <<<"$files_json")
          if [ "${#workflow_paths[@]}" -eq 0 ]; then echo 'No allowlisted workflow files changed; nothing to restore.'; exit 0; fi
          mapfile -t recovery_paths < <(
            while IFS= read -r path; do
              status="$(jq -r --arg p "$path" '.[] | select(.filename == $p) | .status' <<<"$files_json")"
              [ "$status" != 'added' ] || continue
              if gh api "/repos/${REPOSITORY}/contents/${path}?ref=main" >/dev/null 2>&1; then printf '%s\n' "$path"; fi
            done < <(printf '%s\n' "${workflow_paths[@]}")
          )
          if [ "${#recovery_paths[@]}" -eq 0 ]; then echo 'No changed workflow file has a trusted main counterpart; manual review required.'; exit 0; fi
          head_commit_json="$(gh api "/repos/${REPOSITORY}/git/commits/${pr_head_sha}")"
          base_tree_sha="$(jq -r '.tree.sha' <<<"$head_commit_json")"
          tree_entries='[]'; changed_count=0
          for path in "${recovery_paths[@]}"; do
            main_file="$(gh api "/repos/${REPOSITORY}/contents/${path}?ref=main")"
            main_content="$(jq -r '.content' <<<"$main_file" | tr -d '\n')"
            blob_sha="$(gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/git/blobs" -f encoding='base64' -f content="$main_content" --jq '.sha')"
            tree_entries="$(jq -c --arg path "$path" --arg sha "$blob_sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<<"$tree_entries")"
            changed_count=$((changed_count + 1))
          done
          new_tree_sha="$(gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/git/trees" -f "base_tree=$base_tree_sha" -F "tree=$tree_entries" --jq '.sha')"
          new_commit_sha="$(gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/git/commits" -f message='security: auto-recover trusted workflow files' -f "tree=$new_tree_sha" -f "parents[]=$pr_head_sha" --jq '.sha')"
          gh api --method PATCH -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/git/refs/heads/${PR_BRANCH}" -f "sha=$new_commit_sha" -F force=false >/dev/null
          echo "Recovery commit created from trusted main for ${changed_count} workflow file(s): ${new_commit_sha}"
          echo 'No PR code was checked out or executed.'
          echo 'The PR branch was advanced only through the GitHub API; fresh CI and independent review are required.'
