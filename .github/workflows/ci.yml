name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Syntax check
        run: |
          npm run health
          node --check web/app.js

      - name: Validate required project files
        run: |
          test -f dorar_json_api.js
          test -f openapi.yaml
          test -f web/index.html
          test -f web/app.js
          grep -q 'web/app.js' web/index.html
          test -f src/dorar-client.js
          test -f src/unified-search.js
          test -f src/fiqh-research.js
          test -f src/knowledge-context.js
          test -f config/fiqh-research-framework.json
          test -f config/fiqh-fatawa-sources.json
          test -f config/fiqh-classical-fatwa-books.json
          test -f config/prophets-companions-genealogy-v2.json
          test -f src/inheritance-calculator.js
          test -f src/faraid-complex-cases.js
          test -f src/faraid-advanced.js
          test -f src/tajweed-curriculum.js
          test -f src/prophets-companions-genealogy.js
          test -f config/knowledge-source-expansion-2026.json
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('config/knowledge-source-expansion-2026.json','utf8')); console.log('Expanded source catalog JSON OK')"

      - name: Smoke test client configuration
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('src/dorar-client.js','utf8'); if(!s.includes('https://dorar.net/dorar_api.json')) process.exit(1); console.log('Dorar client configuration OK')"

      - name: Run test suite
        run: npm test -- --test-reporter=spec
