name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Syntax check
        run: |
          npm run health
          node --check web/app.js
          node --check src/hadith-narrator-methodology.js
          node --check src/query-intent-router.js
      - name: Validate required project files
        run: |
          required_files=(
            dorar_json_api.js openapi.yaml web/index.html web/app.js
            src/dorar-client.js src/unified-search.js src/scholar-research.js src/fiqh-research.js src/knowledge-context.js
            src/hadith-narrator-methodology.js src/query-intent-router.js src/concept_resolver.js
            data/scholars/registry.json data/concept-index-seed-2026.json test/scholar-registry.test.js test/query-intent-router.test.js
            config/fiqh-research-framework.json config/fiqh-fatawa-sources.json config/fiqh-classical-fatwa-books.json
            config/prophets-companions-genealogy-v2.json config/hadith-narrator-methodology-2026.json
            src/inheritance-calculator.js src/faraid-complex-cases.js src/faraid-advanced.js src/tajweed-curriculum.js
            src/prophets-companions-genealogy.js config/knowledge-source-expansion-2026.json
            config/corpus-source-routing-2026.json config/corpus-seed-content-batch-05-2026-08-22.json
            config/concept-knowledge-schema-2026.json config/ghaib-source-framework-2026.json
            src/corpus_repository.js src/corpus_search.js src/corpus_api.js src/http_server.js src/index.js
            test/ghaib-source-framework.test.js
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then echo "MISSING REQUIRED FILE: $file"; exit 1; fi
          done
          grep -q './app.js' web/index.html
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['config/knowledge-source-expansion-2026.json','config/hadith-narrator-methodology-2026.json','config/corpus-source-routing-2026.json','config/corpus-seed-content-batch-05-2026-08-22.json','config/concept-knowledge-schema-2026.json','config/ghaib-source-framework-2026.json','data/concept-index-seed-2026.json','data/scholars/registry.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Corpus/source/scholar/ghaib JSON OK')"
          node --input-type=module -e "import { listNarratorGrades, listCoreRijalBooks, listChainPhenomena } from './src/hadith-narrator-methodology.js'; if(listNarratorGrades().length < 10 || listCoreRijalBooks().length < 10 || listChainPhenomena().length < 5) process.exit(1); console.log('Hadith methodology registry OK')"
          node --input-type=module -e "import registry from './data/scholars/registry.json' with { type: 'json' }; if(registry.records.length < 100 || !registry.records.some(x => x.name_ar === 'أبو بكر الجزائري') || !registry.records.some(x => x.name_ar === 'القاضي عياض')) process.exit(1); console.log('Scholar registry OK:', registry.records.length)"
      - name: Smoke test client configuration
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('src/dorar-client.js','utf8'); if(!s.includes('https://dorar.net/dorar_api.json')) process.exit(1); console.log('Dorar client configuration OK')"
      - name: Run query intent tests
        run: node test/query-intent-router.test.js
      - name: Run ghaib framework tests
        run: node test/ghaib-source-framework.test.js
      - name: Run corpus API integration tests
        run: npm run test:corpus
      - name: Run full test suite
        run: npm test -- --test-reporter=spec
