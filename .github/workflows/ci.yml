name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate package metadata
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(!p.name || !p.scripts || !p.scripts.test) process.exit(1); console.log('package metadata OK')"
      - name: Install dependencies reproducibly when a lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo 'No npm lockfile in repository; using npm install without lockfile.'
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi
      - name: Syntax check
        run: |
          npm run health
          node --check web/app.js
          node --check web/quran-recitation.js
          node --check web/voice.js
          node --check src/hadith-narrator-methodology.js
          node --check src/query-intent-router.js
          node --check src/ghayb-router.js
          node --check src/worship-learning-engine.js
          node --check src/free-core.js
          node --check src/corpus-provenance.js
          node --check src/corpus-source-map.js
          node --check src/encyclopedia-api.js
          node --check src/source-coverage.js
          node --check src/unified-search.js
          node --check src/corpus-index.js
          node --check src/corpus_search.js
          node --check src/transactions-riba-engine.js
          node --check src/multilingual-search-runtime.js
          node --check src/search-provider-federation.js
      - name: Validate required project files
        run: |
          required_files=(
            dorar_json_api.js openapi.yaml web/index.html web/app.js web/quran-recitation.js web/voice.js
            src/dorar-client.js src/unified-search.js src/unified-knowledge-index.js src/source-registry.js src/source-coverage.js src/scholar-research.js src/fiqh-research.js src/knowledge-context.js
            src/hadith-narrator-methodology.js src/query-intent-router.js src/concept_resolver.js src/corpus-index.js src/corpus-provenance.js src/corpus-source-map.js src/encyclopedia-api.js src/multilingual-search-runtime.js src/search-provider-federation.js
            data/scholars/registry.json data/concept-index-seed-2026.json test/scholar-registry.test.js test/query-intent-router.test.js test/corpus-search.test.js test/corpus-search-quality.test.js test/source-coverage.test.js test/unified-source-search.test.js test/corpus-provenance.test.js test/corpus-source-map.test.js test/encyclopedia-api.test.js test/http_server.encyclopedia.test.js test/multilingual-search-runtime.test.js test/quran-recitation.test.js test/quran-recitation-ci.test.js test/search-provider-federation.test.js
            config/source-coverage-2026.json config/search-quality-policy-2026.json config/corpus-provenance-policy-2026.json config/corpus-source-map-2026.json config/fiqh-research-framework.json config/fiqh-fatawa-sources.json config/fiqh-classical-fatwa-books.json
            config/prophets-companions-genealogy-v2.json config/hadith-narrator-methodology-2026.json
            src/inheritance-calculator.js src/faraid-complex-cases.js src/faraid-advanced.js src/tajweed-curriculum.js
            src/prophets-companions-genealogy.js config/knowledge-source-expansion-2026.json
            config/corpus-source-routing-2026.json config/corpus-seed-content-batch-05-2026-08-22.json
            config/concept-knowledge-schema-2026.json config/ghaib-source-framework-2026.json config/ghaib-evidence-catalog-2026.json config/ghayb-knowledge-domains-2026.json
            config/specialized-engines-2026.json config/worship-learning-2026.json config/free-core-2026.json
            src/worship-learning-engine.js src/free-core.js src/transactions-riba-engine.js test/worship-learning-engine.test.js test/free-core.test.js test/transactions-riba-engine.test.js
            src/corpus_repository.js src/corpus_search.js src/corpus_api.js src/specialized-engines.js src/ghayb-router.js src/http_server.js src/index.js
            test/ghaib-source-framework.test.js test/ghaib-evidence-api.test.js test/specialized-engines.test.js
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then echo "MISSING REQUIRED FILE: $file"; exit 1; fi
          done
          grep -q './app.js' web/index.html
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['config/source-coverage-2026.json','config/search-quality-policy-2026.json','config/corpus-provenance-policy-2026.json','config/corpus-source-map-2026.json','config/knowledge-source-expansion-2026.json','config/hadith-narrator-methodology-2026.json','config/corpus-source-routing-2026.json','config/corpus-seed-content-batch-05-2026-08-22.json','config/concept-knowledge-schema-2026.json','config/ghaib-source-framework-2026.json','config/ghaib-evidence-catalog-2026.json','config/ghayb-knowledge-domains-2026.json','config/specialized-engines-2026.json','config/worship-learning-2026.json','config/free-core-2026.json','data/concept-index-seed-2026.json','data/scholars/registry.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Source/corpus/search/scholar/ghaib/worship/free-core JSON OK')"
          node --input-type=module -e "import { listNarratorGrades, listCoreRijalBooks, listChainPhenomena } from './src/hadith-narrator-methodology.js'; if(listNarratorGrades().length < 10 || listCoreRijalBooks().length < 10 || listChainPhenomena().length < 5) process.exit(1); console.log('Hadith methodology registry OK')"
          node --input-type=module -e "import registry from './data/scholars/registry.json' with { type: 'json' }; if(registry.records.length < 100 || !registry.records.some(x => x.name_ar === 'أبو بكر الجزائري') || !registry.records.some(x => x.name_ar === 'القاضي عياض')) process.exit(1); console.log('Scholar registry OK:', registry.records.length)"
      - name: Smoke test client configuration
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('src/dorar-client.js','utf8'); if(!s.includes('https://dorar.net/dorar_api.json')) process.exit(1); console.log('Dorar client configuration OK')"
      - name: Run search federation tests
        run: node test/search-provider-federation.test.js
      - name: Run query intent tests
        run: node test/query-intent-router.test.js
      - name: Run multilingual search runtime tests
        run: node test/multilingual-search-runtime.test.js
      - name: Run corpus search tests
        run: node test/corpus-search.test.js
      - name: Run corpus search quality tests
        run: node test/corpus-search-quality.test.js
      - name: Run source coverage tests
        run: node test/source-coverage.test.js
      - name: Run unified source search tests
        run: node test/unified-source-search.test.js
      - name: Run corpus provenance tests
        run: node test/corpus-provenance.test.js && node test/corpus-source-map.test.js && node test/encyclopedia-api.test.js
      - name: Run encyclopedia HTTP endpoint tests
        run: node test/http_server.encyclopedia.test.js
      - name: Run Quran recitation tests
        run: node test/quran-recitation.test.js && node test/quran-recitation-ci.test.js
      - name: Run ghaib framework tests
        run: node test/ghaib-source-framework.test.js
      - name: Run ghaib evidence API tests
        run: node test/ghaib-evidence-api.test.js
      - name: Run free encyclopedia core tests
        run: node test/free-core.test.js
      - name: Run worship learning engine tests
        run: node test/worship-learning-engine.test.js
      - name: Run specialized engine tests
        run: node test/specialized-engines.test.js && node test/transactions-riba-engine.test.js
      - name: Run corpus API integration tests
        run: npm run test:corpus
      - name: Run full test suite
        run: npm test -- --test-reporter=spec
