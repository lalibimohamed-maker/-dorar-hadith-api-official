name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Syntax check
        run: |
          npm run health
          node --check web/app.js

      - name: Validate required project files
        run: |
          required_files=(
            dorar_json_api.js openapi.yaml web/index.html web/app.js
            src/dorar-client.js src/unified-search.js src/fiqh-research.js src/knowledge-context.js
            config/fiqh-research-framework.json config/fiqh-fatawa-sources.json config/fiqh-classical-fatwa-books.json
            config/prophets-companions-genealogy-v2.json src/inheritance-calculator.js src/faraid-complex-cases.js
            src/faraid-advanced.js src/tajweed-curriculum.js src/prophets-companions-genealogy.js
            config/knowledge-source-expansion-2026.json
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then echo "MISSING REQUIRED FILE: $file"; exit 1; fi
          done
          grep -q 'web/app.js' web/index.html
          node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('config/knowledge-source-expansion-2026.json','utf8')); console.log('Expanded source catalog JSON OK')"

      - name: Smoke test client configuration
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('src/dorar-client.js','utf8'); if(!s.includes('https://dorar.net/dorar_api.json')) process.exit(1); console.log('Dorar client configuration OK')"

      - name: Run test suite
        run: npm test -- --test-reporter=spec
