name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Syntax check
        run: npm run health

      - name: Run test suite
        run: npm test

      - name: Validate required project files
        run: |
          test -f dorar_json_api.js
          test -f openapi.yaml
          test -f src/dorar-client.js
          test -f src/unified-search.js
          test -f src/inheritance-calculator.js
          test -f src/faraid-complex-cases.js
          test -f src/faraid-advanced.js
          test -f src/tajweed-curriculum.js

      - name: Smoke test client configuration
        run: node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('src/dorar-client.js','utf8'); if(!s.includes('https://dorar.net/dorar_api.json')) process.exit(1); console.log('Dorar client configuration OK')"
