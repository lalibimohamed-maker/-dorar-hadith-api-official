name: Rechercher — build Al-Huda wake word
on:
  push:
    branches:
      - feat/rechercher-voice-harmony-acquisition-v2
    paths:
      - scripts/train-al-huda-kws.py
      - scripts/al-huda-kws-runner.py
      - src/al-huda-wakeword-provider.js
      - .github/workflows/rechercher-build-al-huda-kws.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: al-huda-kws-2026-10
      samples:
        description: Synthetic training samples
        required: true
        default: "720"
      dry_run:
        description: Validate only without publishing
        required: true
        default: "false"
        type: boolean
permissions:
  # SECURITY-JUSTIFICATION: contents: write is required only when publishing the verified Al-Huda KWS ONNX model and evidence to a GitHub Release. No binary is committed to git and Git LFS is not used.
  contents: write
concurrency:
  group: rechercher-al-huda-kws
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Inspect existing Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'al-huda-kws-2026-10' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install training runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y espeak-ng python3 python3-pip libsndfile1
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy scipy soundfile scikit-learn skl2onnx onnx onnxruntime

      - name: Train Al-Huda KWS
        env:
          SAMPLES: ${{ inputs.samples || '720' }}
        run: |
          set -euo pipefail
          rm -rf al-huda-kws-release
          mkdir -p al-huda-kws-release
          python3 scripts/train-al-huda-kws.py --out-dir al-huda-kws-release --samples "$SAMPLES"
          test -s al-huda-kws-release/al-huda-kws.onnx
          test -s al-huda-kws-release/al-huda-kws-metadata.json

      - name: Real ONNX inference positive and negative
        run: |
          set -euo pipefail
          espeak-ng -v ar -s 165 -p 50 -a 140 -w al-huda-positive.wav 'الهُدَى'
          espeak-ng -v ar -s 165 -p 50 -a 140 -w al-huda-negative.wav 'الحمد لله'
          positive="$(printf '%s
' '{"model":"al-huda-kws-release/al-huda-kws.onnx","audio":"al-huda-positive.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          negative="$(printf '%s
' '{"model":"al-huda-kws-release/al-huda-kws.onnx","audio":"al-huda-negative.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          python3 - "$positive" "$negative" <<'PY'
          import json,sys
          pos=json.loads(sys.argv[1]); neg=json.loads(sys.argv[2])
          assert pos["ok"] and neg["ok"], (pos,neg)
          assert pos["detected"], pos
          assert not neg["detected"], neg
          print(json.dumps({"positive":pos,"negative":neg},ensure_ascii=False))
          PY

      - name: Record runtime evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          def run(audio):
              p=subprocess.run(
                  ["python3","scripts/al-huda-kws-runner.py"],
                  input=json.dumps({"model":"al-huda-kws-release/al-huda-kws.onnx","audio":audio,"threshold":0.80})+"\n",
                  text=True,capture_output=True,check=True
              )
              return json.loads(p.stdout.strip().splitlines()[-1])
          pos=run("al-huda-positive.wav"); neg=run("al-huda-negative.wav")
          json.dump({
              "model":"dinullah-al-huda-kws-v1",
              "assistant":"Al-Huda",
              "wakeWord":"الهُدَى",
              "runtime":"onnxruntime-cpu",
              "positive":pos,
              "negative":neg,
              "deviceRuntimeStillRequired":True
          },open("al-huda-kws-release/runtime-verification.json","w"),ensure_ascii=False,indent=2)
          PY
          rm -f al-huda-positive.wav al-huda-negative.wav

      - name: Package and checksum
        run: |
          set -euo pipefail
          cd al-huda-kws-release
          sha256sum al-huda-kws.onnx al-huda-kws-metadata.json runtime-verification.json > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish Release
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'al-huda-kws-2026-10' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in al-huda-kws-release/al-huda-kws.onnx al-huda-kws-release/al-huda-kws-metadata.json al-huda-kws-release/runtime-verification.json al-huda-kws-release/SHA256SUMS.txt; do
              name=$(basename "$asset")
              if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets | jq -e --arg n "$name" '.assets[] | select(.name==$n)' >/dev/null; then
                gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Al-Huda KWS — الهُدَى" --notes "Custom Arabic wake-word model. ONNX model and runtime evidence were produced by the repository training workflow. Device runtime evidence remains a separate gate."
            gh release upload "$TAG" al-huda-kws-release/al-huda-kws.onnx al-huda-kws-release/al-huda-kws-metadata.json al-huda-kws-release/runtime-verification.json al-huda-kws-release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          fi
