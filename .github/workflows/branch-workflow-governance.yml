name: Branch Workflow Governance — Self-Heal

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

# security-justification: audits every branch; workflow-file writes are deferred when
# the installed GitHub App lacks the Workflows repository permission.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-workflow-governance
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce branch workflow policy on every branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Audit and repair every branch safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/governance-worktrees

          while read -r branch; do
            [ -n "$branch" ] || continue
            before_sha="$(git rev-parse "origin/$branch")"
            safe_name="$(printf '%s' "$branch" | tr '/ ' '__')"
            worktree="/tmp/governance-worktrees/$safe_name"
            rm -rf "$worktree"

            echo "=== auditing $branch @ $before_sha ==="
            git worktree add --detach "$worktree" "$before_sha" >/dev/null

            mkdir -p "$worktree/scripts"
            cp scripts/enforce_all_branch_governance.py "$worktree/scripts/enforce_all_branch_governance.py"
            chmod 0755 "$worktree/scripts/enforce_all_branch_governance.py"

            if ! (cd "$worktree" && python3 scripts/enforce_all_branch_governance.py); then
              echo "POLICY_ERROR $branch"
              git worktree remove --force "$worktree"
              continue
            fi

            governance_status="$(git -C "$worktree" status --porcelain --untracked-files=all               | awk '$2 ~ /^(.github/workflows|scripts)// {print}')"

            if [ -z "$governance_status" ]; then
              echo "COMPLIANT $branch"
              git worktree remove --force "$worktree"
              continue
            fi

            workflow_status="$(printf '%s\n' "$governance_status" | awk '$2 ~ /^.github/workflows// {print}')"
            script_status="$(printf '%s\n' "$governance_status" | awk '$2 ~ /^scripts// {print}')"

            if [ "$branch" = "main" ]; then
              echo "PROTECTED_MAIN_DRIFT $branch"
              printf '%s\n' "$governance_status"
              echo "NOTICE workflow-file repair on protected main is deferred to reviewed PR."
              git worktree remove --force "$worktree"
              continue
            fi

            current_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ "$current_sha" != "$before_sha" ]; then
              echo "DRIFT_RACE $branch expected=$before_sha actual=$current_sha"
              git worktree remove --force "$worktree"
              continue
            fi

            # The installed GitHub App token has no Workflows permission. Never push
            # .github/workflows changes with it; GitHub rejects such pushes.
            if [ -n "$workflow_status" ]; then
              echo "POLICY_DEFERRED_WORKFLOW_PERMISSION $branch"
              printf '%s\n' "$workflow_status"
            fi

            if [ -n "$script_status" ]; then
              git -C "$worktree" add scripts
              git -C "$worktree" commit -m 'chore(governance): repair branch workflow policy'

              current_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
              if [ "$current_sha" != "$before_sha" ]; then
                echo "DRIFT_RACE_AFTER_REPAIR $branch expected=$before_sha actual=$current_sha"
                git worktree remove --force "$worktree"
                continue
              fi

              git -C "$worktree" push origin "HEAD:refs/heads/$branch"
              echo "REPAIRED_SCRIPTS $branch"
            fi

            git worktree remove --force "$worktree"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | sort -u)
