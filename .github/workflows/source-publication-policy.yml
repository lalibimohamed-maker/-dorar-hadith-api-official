name: Source publication policy check

on:
  pull_request:
    paths:
      - 'config/source-registry.json'
      - 'config/official-islamic-sources-2026.json'
      - 'docs/security/source-publication-gate.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate publication policy
        run: |
          test -f docs/security/source-publication-gate.md
          echo "Source publication remains subject to identity, provenance, rights, schema, integrity, quality, quarantine, atomic publication and rollback gates."
