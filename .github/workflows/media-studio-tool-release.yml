# final-current-head-refresh: 2026-09-29T01:28Z
# final-release-refresh: 2026-09-29
name: Media Studio Tools — Release Cache

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to populate"
        required: true
        default: "dinullah-media-studio-v2026.09.29"
      publish:
        description: "Publish the release after all verification gates"
        required: true
        default: "true"
  push:
    branches:
      - feat/omega-media-conversation-final-2026-v2
    paths:
      - config/media-studio-toolchain-2026.json
      - .github/workflows/media-studio-tool-release.yml

# security-justification: this workflow publishes only verified release assets from pinned upstream sources after checksum, size and security gates.
permissions:
  contents: write

jobs:
  release:
    name: Acquire, verify and cache free/open media tools
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'dinullah-media-studio-v2026.09.29' }}
      PUBLISH: ${{ inputs.publish || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manifest
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 - <<'PY'
          import json
          d=json.load(open("config/media-studio-toolchain-2026.json",encoding="utf-8"))
          assert d["policy"]["freeAndOpenSourceRequired"] is True
          assert d["policy"]["paidDependencyAllowed"] is False
          assert len(d["tools"]) >= 10
          for x in d["tools"]:
              assert x["version"] and x["license"] and x["source"] and x["licenseEvidence"]
          print("MEDIA_STUDIO_MANIFEST_OK")
          PY

      - name: Acquire verified upstream assets
        run: |
          set -euo pipefail
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/blender-5.2.2-linux-x64.tar.xz             https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/blender-5.2.2.sha256             https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb             https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/audacity-linux-4.0.0-x86_64.AppImage             https://sourceforge.net/projects/audacity/files/Audacity-4.0.0/audacity-linux-4.0.0-x86_64.AppImage/download
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/GIMP-3.2.6-x86_64.AppImage             https://download.gimp.org/gimp/v3.2/linux/GIMP-3.2.6-x86_64.AppImage
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/GIMP-SHA256SUMS             https://download.gimp.org/gimp/v3.2/linux/SHA256SUMS
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/glaxnimate-0.6.0-x86_64.AppImage             https://download.kde.org/stable/glaxnimate/0.6.0/linux/glaxnimate-0.6.0-x86_64.AppImage
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/kdenlive-26.08.1.tar.xz             https://download.kde.org/stable/release-service/26.08.1/src/kdenlive-26.08.1.tar.xz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/ardour-9.8.0.tar.bz2             https://community.ardour.org/src/ardour-9.8.0.tar.bz2
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/ImageMagick-7.1.2-32.tar.xz             https://download.imagemagick.org/releases/ImageMagick-7.1.2-32.tar.xz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/OpenTimelineIO-0.18.1.tar.gz             https://github.com/AcademySoftwareFoundation/OpenTimelineIO/archive/refs/tags/v0.18.1.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/OpenColorIO-2.5.2.tar.gz             https://codeload.github.com/AcademySoftwareFoundation/OpenColorIO/tar.gz/refs/tags/v2.5.2
          python3 - <<'PY'
          import html, re, urllib.request
          from pathlib import Path
          page="https://inkscape.org/release/1.4.2/gnulinux/"
          req=urllib.request.Request(page,headers={"User-Agent":"Dinullah-Media-Release/1.0"})
          body=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          hrefs=re.findall(r'href=["\\']([^"\\']+Inkscape[^"\\']+\\.AppImage)["\\']',body,re.I)
          candidates=[html.unescape(h) for h in hrefs if "x86_64" in h.lower()]
          if not candidates: raise SystemExit("No official Inkscape 1.4.2 x86_64 AppImage found.")
          url=candidates[0]
          if url.startswith("/"): url="https://inkscape.org"+url
          urllib.request.urlretrieve(url,"release-assets/Inkscape-1.4.2-x86_64.AppImage")
          Path("release-assets/Inkscape-1.4.2-source-url.txt").write_text(url+"\n",encoding="utf-8")
          print("INKSCAPE_RESOLVED",url)
          PY

      - name: Acquire remaining media foundation and production assets
        run: |
          set -euo pipefail
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/mlt-7.40.0.tar.gz https://github.com/mltframework/mlt/archive/refs/tags/v7.40.0.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/frei0r-3.5.0.tar.gz https://github.com/dyne/frei0r/archive/refs/tags/v3.5.0.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/MediaInfo-26.05.tar.gz https://github.com/MediaArea/MediaInfo/archive/refs/tags/v26.05.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/subtitlecomposer-0.8.2.tar.gz https://github.com/KDE/subtitlecomposer/archive/refs/tags/v0.8.2.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/pipewire-1.6.0.tar.gz https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.0/pipewire-1.6.0.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/openimageio-3.1.17.0.tar.gz https://github.com/AcademySoftwareFoundation/OpenImageIO/archive/refs/tags/v3.1.17.0.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/Natron-2.5.0-Linux-x86_64.tgz https://github.com/NatronGitHub/Natron/releases/download/v2.5.0/Natron-2.5.0-Linux-x86_64.tgz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/flamenco-3.9.3-linux-amd64.tar.gz https://flamenco.blender.org/files/flamenco-3.9.3-linux-amd64.tar.gz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/Video2X-x86_64.AppImage https://github.com/K4YT3X/video2x/releases/download/6.4.0/Video2X-x86_64.AppImage

      - name: Verify publisher checksums
        run: |
          set -euo pipefail
          grep 'blender-5.2.2-linux-x64.tar.xz' release-assets/blender-5.2.2.sha256 | (cd release-assets && sha256sum -c -)
          echo "b6557ca2059287210332accc94c267094050489cffffc5c832e746e3a418dab0  release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb" | sha256sum -c -
          echo "772663b0b407be44232193b8402cde4da4665c7f6e81edb5b70e3b14e8b9b5b4  release-assets/audacity-linux-4.0.0-x86_64.AppImage" | sha256sum -c -
          grep 'GIMP-3.2.6-x86_64.AppImage' release-assets/GIMP-SHA256SUMS | (cd release-assets && sha256sum -c -)
          echo "8a0e2cc6451de6901fec778a8b6d00165399879233a264ca5bb1b1b283266513  release-assets/kdenlive-26.08.1.tar.xz" | sha256sum -c -
          test -s release-assets/Inkscape-1.4.2-x86_64.AppImage
          sha256sum release-assets/Inkscape-1.4.2-x86_64.AppImage > release-assets/Inkscape-1.4.2-x86_64.AppImage.sha256
          echo "Inkscape 1.4.2: official release-page binary; resolved URL and SHA-256 recorded."

      - name: Record OpenColorIO release provenance
        run: |
          set -euo pipefail
          test -s release-assets/OpenColorIO-2.5.2.tar.gz
          sha256sum release-assets/OpenColorIO-2.5.2.tar.gz > release-assets/OpenColorIO-2.5.2.tar.gz.sha256
          echo "OpenColorIO 2.5.2 source archive captured and SHA-256 recorded."

      - name: Validate archive contents
        run: |
          set -euo pipefail
          tar -tzf release-assets/ardour-source-7abcc0eba5578d531e4710db5a6adb9235f88d62.tar.gz >/dev/null
          tar -tzf release-assets/mlt-7.40.0.tar.gz >/dev/null
          tar -tzf release-assets/frei0r-3.5.0.tar.gz >/dev/null
          tar -tzf release-assets/MediaInfo-26.05.tar.gz >/dev/null
          tar -tzf release-assets/subtitlecomposer-0.8.2.tar.gz >/dev/null
          tar -tzf release-assets/pipewire-1.6.0.tar.gz >/dev/null
          tar -tzf release-assets/openimageio-3.1.17.0.tar.gz >/dev/null
          tar -tzf release-assets/Natron-2.5.0-Linux-x86_64.tgz >/dev/null
          tar -tzf release-assets/flamenco-3.9.3-linux-amd64.tar.gz >/dev/null
          tar -tJf release-assets/ffmpeg-9.0.2.tar.xz >/dev/null

      - name: Record Video2X release provenance
        run: |
          set -euo pipefail
          file --brief --mime-type release-assets/Video2X-x86_64.AppImage
          sha256sum release-assets/Video2X-x86_64.AppImage > release-assets/Video2X-x86_64.AppImage.sha256
          echo "Video2X 6.4.0: official GitHub release asset; SHA-256 recorded in this Din Allah Release."

      - name: Validate asset types, executable boundaries and sizes
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            mime=$(file --brief --mime-type "$f")
            echo "[MEDIA ASSET] $f :: $mime"
          done < <(find release-assets -type f -print0)
          if find release-assets -type f -size +1900M -print -quit | grep -q .; then
            echo "RELEASE_ASSET_TOO_LARGE"
            exit 1
          fi
          sha256sum release-assets/* > release-assets/media-studio-sha256.txt

      - name: Generate license and provenance manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, datetime
          d=json.load(open("config/media-studio-toolchain-2026.json",encoding="utf-8"))
          lines=[
            "# Din Allah Media Studio — Third-Party License & Provenance Manifest",
            "",
            "Free/open-source media software cached from declared upstream sources.",
            "This release contains software assets/source archives only; it is not scholarly Corpus content and does not replace model-weight governance.",
            ""
          ]
          for x in d["tools"]:
              lines += [
                f"## {x['id']} {x['version']}",
                f"- License: {x['license']}",
                f"- Role: {x['role']}",
                f"- Distribution: {x['distribution']}",
                f"- Upstream source: {x['source']}",
                f"- License evidence: {x['licenseEvidence']}",
                ""
              ]
          lines.append(f"Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}")
          open("release-assets/THIRD_PARTY_MEDIA_LICENSES.md","w",encoding="utf-8").write("\n".join(lines)+"\n")
          PY

      - name: Publish release cache
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$PUBLISH" = "true" ]; then
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Studio Tools $RELEASE_TAG" --notes "Free/open-source media production tool cache with upstream provenance, licensing evidence and SHA-256 verification. Separate from scholarly Corpus and AI model-weight releases."
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Studio Tools $RELEASE_TAG" --notes "Draft free/open-source media tool cache." --draft
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,assets
