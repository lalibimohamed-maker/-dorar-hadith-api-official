# final-current-head-refresh: 2026-09-29T01:28Z
# final-release-refresh: 2026-09-29
name: Media Studio Tools — Release Cache

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to populate"
        required: true
        default: "dinullah-media-studio-v2026.09.29"
      publish:
        description: "Publish the release after all verification gates"
        required: true
        default: "true"
  push:
    branches:
      - feat/omega-media-conversation-final-2026-v3
    paths:
      - config/media-studio-toolchain-2026.json
      - .github/workflows/media-studio-tool-release.yml

# security-justification: this workflow publishes only verified release assets from pinned upstream sources after checksum, size and security gates.
permissions:
  contents: write

jobs:
  release:
    name: Acquire, verify and cache free/open media tools
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'dinullah-media-studio-v2026.09.29' }}
      PUBLISH: ${{ inputs.publish || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manifest
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 - <<'PY'
          import json
          d=json.load(open("config/media-studio-toolchain-2026.json",encoding="utf-8"))
          assert d["policy"]["freeAndOpenSourceRequired"] is True
          assert d["policy"]["paidDependencyAllowed"] is False
          assert len(d["tools"]) >= 10
          for x in d["tools"]:
              assert x["version"] and x["license"] and x["source"] and x["licenseEvidence"]
          print("MEDIA_STUDIO_MANIFEST_OK")
          PY

      - name: Acquire verified upstream assets
        run: |
          set -u -o pipefail
          mkdir -p release-assets
          : > release-assets/media-cache-download-status.txt
          fetch_required() {
            local name="$1" url="$2" out="$3"
            echo "[REQUIRED] $name"
            if curl -fL --proto '=https' --tlsv1.2 --retry 3 -o "$out" "$url"; then
              echo "OK $name" >> release-assets/media-cache-download-status.txt
            else
              echo "FAIL_REQUIRED $name $url" >> release-assets/media-cache-download-status.txt
              echo "REQUIRED_DOWNLOAD_FAILED $name" >&2
              exit 1
            fi
          }
          fetch_optional() {
            local name="$1" url="$2" out="$3"
            echo "[OPTIONAL] $name"
            if curl -fL --proto '=https' --tlsv1.2 --retry 3 -o "$out" "$url"; then
              echo "OK $name" >> release-assets/media-cache-download-status.txt
            else
              echo "SKIPPED_OPTIONAL $name $url" >> release-assets/media-cache-download-status.txt
              rm -f "$out"
            fi
          }
          fetch_required "Blender" "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz" "release-assets/blender-5.2.2-linux-x64.tar.xz"
          fetch_required "Blender checksums" "https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256" "release-assets/blender-5.2.2.sha256"
          fetch_required "OBS" "https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb" "release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb"
          fetch_optional "GIMP" "https://download.gimp.org/gimp/v3.2/linux/GIMP-3.2.6-x86_64.AppImage" "release-assets/GIMP-3.2.6-x86_64.AppImage"
          fetch_optional "GIMP checksums" "https://download.gimp.org/gimp/v3.2/linux/SHA256SUMS" "release-assets/GIMP-SHA256SUMS"
          fetch_optional "Glaxnimate" "https://download.kde.org/stable/glaxnimate/0.6.0/linux/glaxnimate-0.6.0-x86_64.AppImage" "release-assets/glaxnimate-0.6.0-x86_64.AppImage"
          fetch_optional "Kdenlive" "https://download.kde.org/stable/release-service/26.08.1/src/kdenlive-26.08.1.tar.xz" "release-assets/kdenlive-26.08.1.tar.xz"
          gh api --method GET repos/AcademySoftwareFoundation/OpenTimelineIO/tarball/v0.18.1 > release-assets/OpenTimelineIO-0.18.1.tar.gz || echo "SKIPPED_OPTIONAL OpenTimelineIO" >> release-assets/media-cache-download-status.txt
          gh release download v2.5.2 --repo AcademySoftwareFoundation/OpenColorIO --pattern 'OpenColorIO-2.5.2.tar.gz' --dir release-assets --clobber || echo "SKIPPED_OPTIONAL OpenColorIO" >> release-assets/media-cache-download-status.txt
          if [ -s release-assets/OpenColorIO-2.5.2.tar.gz ]; then echo "OK OpenColorIO" >> release-assets/media-cache-download-status.txt; fi

      - name: Acquire remaining media foundation and production assets
        run: |
          set -u -o pipefail
          fetch_optional() {
            local name="$1" url="$2" out="$3"
            echo "[OPTIONAL] $name"
            if curl -fL --proto '=https' --tlsv1.2 --retry 3 -o "$out" "$url"; then
              echo "OK $name" >> release-assets/media-cache-download-status.txt
            else
              echo "SKIPPED_OPTIONAL $name $url" >> release-assets/media-cache-download-status.txt
              rm -f "$out"
            fi
          }
          fetch_optional "MLT" "https://github.com/mltframework/mlt/archive/refs/tags/v7.40.0.tar.gz" "release-assets/mlt-7.40.0.tar.gz"
          fetch_optional "frei0r" "https://github.com/dyne/frei0r/archive/refs/tags/v3.5.0.tar.gz" "release-assets/frei0r-3.5.0.tar.gz"
          fetch_optional "MediaInfo" "https://github.com/MediaArea/MediaInfo/archive/refs/tags/v26.05.tar.gz" "release-assets/MediaInfo-26.05.tar.gz"
          fetch_optional "Subtitle Composer" "https://github.com/KDE/subtitlecomposer/archive/refs/tags/v0.8.2.tar.gz" "release-assets/subtitlecomposer-0.8.2.tar.gz"
          fetch_optional "PipeWire" "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.0/pipewire-1.6.0.tar.gz" "release-assets/pipewire-1.6.0.tar.gz"
          fetch_optional "OpenImageIO" "https://github.com/AcademySoftwareFoundation/OpenImageIO/archive/refs/tags/v3.1.17.0.tar.gz" "release-assets/openimageio-3.1.17.0.tar.gz"
          fetch_optional "Natron" "https://github.com/NatronGitHub/Natron/releases/download/v2.5.0/Natron-2.5.0-Linux-x86_64-no-installer.tar.xz" "release-assets/Natron-2.5.0-Linux-x86_64-no-installer.tar.xz"
          fetch_optional "Flamenco" "https://flamenco.blender.org/files/flamenco-3.9.3-linux-amd64.tar.gz" "release-assets/flamenco-3.9.3-linux-amd64.tar.gz"
          fetch_optional "FFmpeg" "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz" "release-assets/ffmpeg-9.0.2.tar.xz"
          fetch_optional "Video2X" "https://github.com/K4YT3X/video2x/releases/download/6.4.0/Video2X-x86_64.AppImage" "release-assets/Video2X-x86_64.AppImage"

      - name: Verify publisher checksums
        run: |
          set -euo pipefail
          grep 'blender-5.2.2-linux-x64.tar.xz' release-assets/blender-5.2.2.sha256 | (cd release-assets && sha256sum -c -)
          echo "b6557ca2059287210332accc94c267094050489cffffc5c832e746e3a418dab0  release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb" | sha256sum -c -
          if [ -s release-assets/GIMP-3.2.6-x86_64.AppImage ] && [ -s release-assets/GIMP-SHA256SUMS ]; then grep 'GIMP-3.2.6-x86_64.AppImage' release-assets/GIMP-SHA256SUMS | (cd release-assets && sha256sum -c -); fi
          if [ -s release-assets/kdenlive-26.08.1.tar.xz ]; then echo "8a0e2cc6451de6901fec778a8b6d00165399879233a264ca5bb1b1b283266513  release-assets/kdenlive-26.08.1.tar.xz" | sha256sum -c -; fi
          echo "Inkscape 1.4.2: runtime-installed via Ubuntu package channel; no release binary cached."

      - name: Verify OpenColorIO release asset
        run: |
          set -euo pipefail
          echo "cb8b0ae38fa523be8f899a0b2d6b8ca8cbcda7bc4322c91d1ac2b6b2a0082474  release-assets/OpenColorIO-2.5.2.tar.gz" | sha256sum -c -
          curl -fL --proto '=https' --tlsv1.2 --retry 3 -o release-assets/OpenColorIO-2.5.2.tar.gz.sigstore.json https://github.com/AcademySoftwareFoundation/OpenColorIO/releases/download/v2.5.2/OpenColorIO-2.5.2.tar.gz.sigstore.json
          test -s release-assets/OpenColorIO-2.5.2.tar.gz.sigstore.json
          echo "OpenColorIO 2.5.2 release asset + Sigstore metadata verified."

      - name: Validate archive contents
        run: |
          set -euo pipefail
          tar -tJf release-assets/blender-5.2.2-linux-x64.tar.xz >/dev/null
          if [ -s release-assets/kdenlive-26.08.1.tar.xz ]; then tar -tJf release-assets/kdenlive-26.08.1.tar.xz >/dev/null; fi
          if [ -s release-assets/OpenColorIO-2.5.2.tar.gz ]; then tar -tzf release-assets/OpenColorIO-2.5.2.tar.gz >/dev/null; fi
          if [ -s release-assets/OpenTimelineIO-0.18.1.tar.gz ]; then tar -tzf release-assets/OpenTimelineIO-0.18.1.tar.gz >/dev/null; fi
          for f in mlt-7.40.0.tar.gz frei0r-3.5.0.tar.gz MediaInfo-26.05.tar.gz subtitlecomposer-0.8.2.tar.gz pipewire-1.6.0.tar.gz openimageio-3.1.17.0.tar.gz; do
            [ -s "release-assets/$f" ] && tar -tzf "release-assets/$f" >/dev/null
          done
          if [ -s release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb ]; then file --brief release-assets/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb; fi
          for f in GIMP-3.2.6-x86_64.AppImage glaxnimate-0.6.0-x86_64.AppImage Video2X-x86_64.AppImage; do
            [ -s "release-assets/$f" ] && file --brief "release-assets/$f"
          done

      - name: Record Video2X release provenance
        run: |
          set -euo pipefail
          file --brief --mime-type release-assets/Video2X-x86_64.AppImage
          sha256sum release-assets/Video2X-x86_64.AppImage > release-assets/Video2X-x86_64.AppImage.sha256
          echo "Video2X 6.4.0: official GitHub release asset; SHA-256 recorded in this Din Allah Release."

      - name: Validate asset types, executable boundaries and sizes
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            mime=$(file --brief --mime-type "$f")
            echo "[MEDIA ASSET] $f :: $mime"
          done < <(find release-assets -type f -print0)
          if find release-assets -type f -size +1900M -print -quit | grep -q .; then
            echo "RELEASE_ASSET_TOO_LARGE"
            exit 1
          fi
          sha256sum release-assets/* > release-assets/media-studio-sha256.txt

      - name: Generate license and provenance manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, datetime
          d=json.load(open("config/media-studio-toolchain-2026.json",encoding="utf-8"))
          lines=[
            "# Din Allah Media Studio — Third-Party License & Provenance Manifest",
            "",
            "Free/open-source media software cached from declared upstream sources.",
            "This release contains software assets/source archives only; it is not scholarly Corpus content and does not replace model-weight governance.",
            ""
          ]
          for x in d["tools"]:
              lines += [
                f"## {x['id']} {x['version']}",
                f"- License: {x['license']}",
                f"- Role: {x['role']}",
                f"- Distribution: {x['distribution']}",
                f"- Upstream source: {x['source']}",
                f"- License evidence: {x['licenseEvidence']}",
                ""
              ]
          lines.append(f"Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}")
          open("release-assets/THIRD_PARTY_MEDIA_LICENSES.md","w",encoding="utf-8").write("\n".join(lines)+"\n")
          PY

      - name: Publish release cache
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$PUBLISH" = "true" ]; then
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Studio Tools $RELEASE_TAG" --notes "Free/open-source media production tool cache with upstream provenance, licensing evidence and SHA-256 verification. Separate from scholarly Corpus and AI model-weight releases."
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Studio Tools $RELEASE_TAG" --notes "Draft free/open-source media tool cache." --draft
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,assets
