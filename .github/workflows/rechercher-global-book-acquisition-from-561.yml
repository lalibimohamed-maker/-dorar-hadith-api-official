name: Rechercher — Global books acquisition from PR #561

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  # security-justification: contents: write is required only for governed acquisition progress; publication-eligible PDF bytes are persisted as Release assets in the unified 6,384-matrix repository.
  contents: write

concurrency:
  group: rechercher-unified-release-persistence-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REGISTRY_URL: https://raw.githubusercontent.com/lalibimohamed-maker/-dorar-hadith-api-official/feat/rechercher-worldwide-source-link-registry-2026-09-24/research/evidence/global-multilingual/worldwide-source-link-registry-2026-09-24.json
  SOURCE_REGISTRY_PR: "561"
  MATRIX_STORAGE_REPO: lalibimohamed-maker/dinullah-matrix-6384-storage-01
  STATE_BRANCH: rechercher/global-book-acquisition-state
  STATE_FILES: >-
    config/rechercher-global-book-acquisition-561.json
    books-batches/encyclopedia-master/catalog.json
    artifacts/governance/source-registry-561.json
    artifacts/governance/source-registry-561-bridge.json
    artifacts/governance/global-acquisition-engine-exit.txt
    artifacts/acquisition-run-summary.json
    artifacts/governance/sequential-acquisition/volume-resolution.json

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout acquisition branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore governed acquisition state from dedicated state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_ref="refs/heads/$STATE_BRANCH"
          state_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${STATE_BRANCH}" --jq '.object.sha')"
          test -n "$state_sha"
          git fetch origin "$state_ref:refs/remotes/origin/$STATE_BRANCH"
          for path in $STATE_FILES; do
            git checkout "origin/$STATE_BRANCH" -- "$path"
          done
          echo "ACQUISITION_STATE_RESTORED branch=$STATE_BRANCH sha=$state_sha"

      - name: Remove merged legacy #411 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_branch="feat/rechercher-master-global-source-registry-2026-09-v2"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${old_branch}" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${old_branch}"
            echo "LEGACY_411_BRANCH_DELETED=${old_branch}"
          else
            echo "LEGACY_411_BRANCH_ALREADY_ABSENT=${old_branch}"
          fi

      - name: Install PDF validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils libreoffice

      - name: Fetch live #561 source registry
        run: |
          set -euo pipefail
          mkdir -p artifacts/governance
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90             "$SOURCE_REGISTRY_URL"             -o artifacts/governance/source-registry-561.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/governance/source-registry-561.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          sources=[s for s in d.get("sources",[]) if isinstance(s,dict)]
          urls=[s.get("url") for s in sources if s.get("url")]
          if len(sources) < 1:
              raise SystemExit("SOURCE_REGISTRY_EMPTY")
          if len(urls) != len(set(urls)):
              raise SystemExit("SOURCE_REGISTRY_DUPLICATE_URL")
          if any(s.get("rights_status") != "review_required" for s in sources):
              raise SystemExit("SOURCE_REGISTRY_RIGHTS_GATE_INVALID")
          print("SOURCE_REGISTRY_561_OK sources=%d unique_urls=%d" % (len(sources), len(set(urls))))
          PY

      - name: Materialize unbounded chronological master catalog
        run: |
          set -euo pipefail
          python3 scripts/rechercher_materialize_master_catalog.py
          test -s books-batches/encyclopedia-master/catalog.json

      - name: Attach matching PDF candidates from all #561 sources
        run: |
          set -euo pipefail
          python3 scripts/rechercher_registry_source_bridge.py             --root "$GITHUB_WORKSPACE"             --registry artifacts/governance/source-registry-561.json             --catalog books-batches/encyclopedia-master/catalog.json
          test -s artifacts/governance/source-registry-561-bridge.json

      - name: Resolve expected volume evidence
        run: |
          set -euo pipefail
          python3 scripts/rechercher_resolve_volume_evidence.py

      - name: Acquire real PDFs with quality and resume gates
        env:
          RECHERCHER_MAX_BOOK_WORKERS: "12"
        run: |
          set -euo pipefail
          set +e
          python3 scripts/rechercher_acquisition_engine.py
          rc=$?
          set -e
          echo "ACQUISITION_ENGINE_EXIT=$rc" | tee artifacts/governance/global-acquisition-engine-exit.txt
          test -s artifacts/acquisition-run-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("artifacts/acquisition-run-summary.json").read_text(encoding="utf-8"))
          counts={}
          for r in rows:
              counts[r.get("status","unknown")]=counts.get(r.get("status","unknown"),0)+1
          print("ACQUISITION_STATUS_COUNTS",json.dumps(counts,ensure_ascii=False,sort_keys=True))
          unexpected=[r for r in rows if r.get("status")=="unexpected-error"]
          if unexpected:
              raise SystemExit("UNEXPECTED_ACQUISITION_ERRORS=%d" % len(unexpected))
          PY

      - name: Validate every retained PDF
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.pdf)
          for f in "${files[@]}"; do
            test "$(head -c 5 "$f")" = "%PDF-"
            test -s "$f"
            qpdf --check --warning-exit-0 "$f" >/dev/null
          done
          echo "VALID_PDF_COUNT=${#files[@]}"

      - name: Persist acquisition state to dedicated state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_head="$(git ls-remote origin "refs/heads/$STATE_BRANCH" | awk '{print $1}')"
          test -n "$state_head"
          state_worktree="$RUNNER_TEMP/rechercher-global-book-acquisition-state"
          rm -rf "$state_worktree"
          git worktree add --detach "$state_worktree" "$state_head" >/dev/null
          cleanup() { git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for path in $STATE_FILES; do
            if [ -e "$path" ]; then
              mkdir -p "$state_worktree/$(dirname "$path")"
              cp -a "$path" "$state_worktree/$path"
            fi
          done

          git -C "$state_worktree" add -- $STATE_FILES
          if git -C "$state_worktree" diff --cached --quiet; then
            echo "NO_STATE_CHANGES"
            exit 0
          fi

          git -C "$state_worktree" commit -m "data(rechercher): persist global acquisition progress"
          current_state_head="$(git ls-remote origin "refs/heads/$STATE_BRANCH" | awk '{print $1}')"
          if [ "$current_state_head" != "$state_head" ]; then
            echo "STATE_BRANCH_RACE expected=$state_head actual=$current_state_head"
            exit 1
          fi

          cat > "$RUNNER_TEMP/askpass-state.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass-state.sh"
          GIT_ASKPASS="$RUNNER_TEMP/askpass-state.sh" GIT_TERMINAL_PROMPT=0 \
            git -C "$state_worktree" push origin "HEAD:refs/heads/$STATE_BRANCH"
          echo "ACQUISITION_STATE_PERSISTED branch=$STATE_BRANCH"

      - name: Persist publication-eligible PDFs to unified matrix Releases
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.pdf)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NO_PDFS_THIS_RUN"
            exit 0
          fi
          test -n "${MATRIX_STORAGE_REPO:-}"
          tag="rechercher-books-${GITHUB_RUN_ID}"
          gh release create "$tag" --repo "$MATRIX_STORAGE_REPO" --target main --title "Rechercher books — $tag" --notes "Publication-eligible real PDFs acquired from live PR #561 sources. Item-level rights and integrity gates are mandatory; no Corpus write." --latest=false
          declare -A existing_sha=()
          while IFS=$'\t' read -r digest release_tag asset_name; do
            [ -n "$digest" ] && existing_sha["$digest"]="$release_tag/$asset_name"
          done < <(
            gh api --paginate -H "Accept: application/vnd.github+json" "/repos/$MATRIX_STORAGE_REPO/releases?per_page=100"               --jq '.[] | .tag_name as $tag | .assets[]? | select(.state == "uploaded" and (.digest // "" | startswith("sha256:"))) | [ .digest,$tag,.name] | @tsv'
          )
          uploaded=0
          skipped=0
          blocked=0
          for f in "${files[@]}"; do
            stem="${f%.pdf}"
            stem="${stem#artifacts/}"
            manifest="artifacts/${stem}.manifest.json"
            if [ ! -s "$manifest" ]; then
              echo "BLOCKED_NO_MANIFEST file=$(basename "$f")"
              blocked=$((blocked+1))
              continue
            fi
            eligible="$(python3 - "$manifest" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("yes" if d.get("storage_visibility") == "publication-eligible" and d.get("public_browser") is True else "no")
          PY
          )"
            if [ "$eligible" != "yes" ]; then
              echo "BLOCKED_RIGHTS file=$(basename "$f")"
              blocked=$((blocked+1))
              continue
            fi
            sha=$(sha256sum "$f" | awk '{print $1}')
            digest="sha256:$sha"
            if [ -n "${existing_sha[$digest]+x}" ]; then
              echo "DEDUP_SKIP sha256=$sha file=$(basename "$f")"
              skipped=$((skipped+1))
              continue
            fi
            asset="${sha}_$(basename "$f")"
            gh release upload "$tag" "$f#${asset}" --repo "$MATRIX_STORAGE_REPO" --clobber=false
            existing_sha["$digest"]="$tag/${asset}"
            uploaded=$((uploaded+1))
            python3 - "$manifest" "$MATRIX_STORAGE_REPO" "$tag" "${asset}" "$sha" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding="utf-8"))
          d.update({
            "storage_state":"persisted",
            "storage_model":"github-releases-only",
            "storage_repository":sys.argv[2],
            "storage_release":sys.argv[3],
            "storage_asset":sys.argv[4],
            "storage_sha256":sys.argv[5]
          })
          d.pop("unified_file",None)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          done
          echo "MATRIX_RELEASE_PUBLISH_OK uploaded=$uploaded skipped=$skipped blocked=$blocked"
      - name: Remove local PDF bytes after Release persistence
        run: |
          set -euo pipefail
          rm -f artifacts/*.pdf 2>/dev/null || true
          echo "LOCAL_PDF_BYTES_REMOVED_AFTER_RELEASE=OK"

      - name: Upload run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-global-book-acquisition-${{ github.run_id }}
          path: |
            artifacts/governance/
            artifacts/acquisition-run-summary.json
            books-batches/encyclopedia-master/catalog.json
          if-no-files-found: warn
          retention-days: 30
