name: Rechercher Ω — normalize starter Release

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-engine-release-normalize.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped maintenance of the dedicated model Release asset inventory; no source or Corpus writes.

concurrency:
  group: rechercher-omega-engine-release-normalize
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize starter Release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Restore missing Qwen3 model asset
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ runner.temp }}/omega-release-normalize
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'qwen3-model.safetensors'; then
            hf download "Qwen/Qwen3-0.6B" model.safetensors               --revision "c1899de289a04d12100db370d81485cdf75e47ca"               --local-dir "$WORKDIR/qwen3"
            test -s "$WORKDIR/qwen3/model.safetensors"
            test "$(stat -c '%s' "$WORKDIR/qwen3/model.safetensors")" -lt 2147483647
            gh release upload "$TAG" "$WORKDIR/qwen3/model.safetensors#qwen3-model.safetensors" --clobber
          fi

      - name: Remove obsolete shard assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            case "$name" in
              paddleocr-vl-model.safetensors.part-*)
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done <<< "$assets"

      - name: Verify exact starter Release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          cfg=json.load(open("config/rechercher-omega-engine-release.json"))
          actual=set(subprocess.check_output(
              ["gh","release","view",cfg["release_tag"],"--json","assets","--jq",".assets[].name"],
              text=True
          ).splitlines())
          expected={name for engine in cfg["engines"] for name in engine["asset_plan"]}
          missing=sorted(expected-actual)
          unexpected=sorted(actual-expected)
          if missing or unexpected:
              print("Missing:",missing)
              print("Unexpected:",unexpected)
              raise SystemExit(1)
          print("Release inventory exact:",len(expected),"assets")
          PY
