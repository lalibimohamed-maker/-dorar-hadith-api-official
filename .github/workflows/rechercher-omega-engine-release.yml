      - name: Download, package, hash and publish one engine at a time
        env:
          MANIFEST: config/rechercher-omega-engine-release.json
          WORKDIR: ${{ runner.temp }}/omega-release
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          python3 - <<'PY' > "$WORKDIR/engines.tsv"
          import json
          m=json.load(open("config/rechercher-omega-engine-release.json"))
          for e in m["engines"]:
              print("\t".join([e["logical_id"], e["model_id"], e["revision"], e["license"], e["source_url"]]))
          PY

          while IFS=$'\t' read -r id model revision license source_url; do
            echo "=== Acquiring $id ==="
            dir="$WORKDIR/$id"
            rm -rf "$dir"
            mkdir -p "$dir"

            case "$id" in
              qwen3)
                hf download "$model"                   model.safetensors LICENSE README.md .gitattributes config.json generation_config.json merges.txt tokenizer.json tokenizer_config.json vocab.json                   --revision "$revision" --local-dir "$dir"
                shard_prefix="$WORKDIR/qwen3-model.safetensors.part-"
                bundle="$WORKDIR/qwen3-runtime-files.tar.gz"
                ;;
              paddleocr-vl)
                hf download "$model"                   model.safetensors LICENSE README.md .gitattributes config.json configuration_paddleocr_vl.py generation_config.json image_processing_paddleocr_vl.py inference.yml modeling_paddleocr_vl.py preprocessor_config.json processing_paddleocr_vl.py processor_config.json special_tokens_map.json tokenizer.json tokenizer.model tokenizer_config.json                   --revision "$revision" --local-dir "$dir"
                shard_prefix="$WORKDIR/paddleocr-vl-model.safetensors.part-"
                bundle="$WORKDIR/paddleocr-vl-runtime-files.tar.gz"
                ;;
              whisper-tiny)
                hf download "$model"                   model.safetensors LICENSE README.md .gitattributes added_tokens.json config.json generation_config.json merges.txt normalizer.json preprocessor_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json                   --revision "$revision" --local-dir "$dir"
                shard_prefix="$WORKDIR/whisper-tiny-model.safetensors.part-"
                bundle="$WORKDIR/whisper-tiny-runtime-files.tar.gz"
                ;;
              *) echo "Unknown engine: $id"; exit 1 ;;
            esac

            test -s "$dir/model.safetensors"
            split -b 512M -d -a 2 "$dir/model.safetensors" "$shard_prefix"
            rm -f "$dir/model.safetensors"
            tar -C "$dir" -czf "$bundle" .
            max_bytes=2147483647
            for shard in "$shard_prefix"*; do
              test "$(stat -c '%s' "$shard")" -lt "$max_bytes"
            done
            test "$(stat -c '%s' "$bundle")" -lt "$max_bytes"

            manifest_path="$WORKDIR/$id-release-manifest.json"
            printf '{\n  "schema_version": "1.0.0",\n  "logical_id": "%s",\n  "model_id": "%s",\n  "revision": "%s",\n  "license": "%s",\n  "source_url": "%s",\n  "reconstruction": {"method": "cat_sorted_parts", "output": "model.safetensors"},\n  "assets": [\n' "$id" "$model" "$revision" "$license" "$source_url" > "$manifest_path"

            first=1
            for shard in "$shard_prefix"* "$bundle"; do
              [ "$first" -eq 1 ] || printf ',\n' >> "$manifest_path"
              first=0
              printf '    {"name": "%s", "bytes": %s, "sha256": "%s"}'                 "$(basename "$shard")"                 "$(stat -c '%s' "$shard")"                 "$(sha256sum "$shard" | awk '{print $1}')" >> "$manifest_path"
            done
            printf '\n  ]\n}\n' >> "$manifest_path"

            assets=( "$shard_prefix"* "$bundle" "$manifest_path" )
            gh release upload "$TAG" "${assets[@]}" --clobber

            rm -rf "$dir" "$WORKDIR"/"$id"-model.safetensors.part-* "$bundle" "$manifest_path"
            echo "=== Published $id shards ==="
          done < "$WORKDIR/engines.tsv"

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: config/rechercher-omega-engine-release.json
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,url,assets
          python3 - <<'PY'
          import json, os, subprocess
          m=json.load(open(os.environ["MANIFEST"]))
          raw=subprocess.check_output(
              ["gh","release","view",m["release_tag"],"--json","assets"],
              text=True
          )
          assets={x["name"] for x in json.loads(raw)["assets"]}
          expected={name for e in m["engines"] for name in e["asset_plan"]}
          missing=sorted(expected-assets)
          if missing:
              raise SystemExit("missing release assets: "+", ".join(missing))
          print("All expected Rechercher Ω starter assets are published.")
          PY
