name: Rechercher Ω — publish starter engine release

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-engine-release.json"
      - ".github/workflows/rechercher-omega-engine-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: required only to create/update the dedicated model Release assets; no source or Corpus writes are performed.

concurrency:
  group: rechercher-omega-engine-release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish persistent starter engine release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Verify GitHub CLI
        run: gh --version

      - name: Create release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "Rechercher Ω Starter Engines v0.1.0"               --prerelease               --notes "Persistent lightweight starter engines for Rechercher Ω. Binary weights are distributed as Release assets; Git history contains manifests and code only."
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download, verify and publish engines one at a time
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ runner.temp }}/omega-release
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          publish_engine() {
            local id="$1"
            local model="$2"
            local revision="$3"
            local license="$4"
            shift 4
            local -a files=( "$@" )

            local dir="$WORKDIR/$id"
            local model_asset="$WORKDIR/$id-model.safetensors"
            local bundle="$WORKDIR/$id-runtime-files.tar.gz"
            local manifest="$WORKDIR/$id-release-manifest.json"

            rm -rf "$dir"
            mkdir -p "$dir"
            echo "=== Downloading $id ==="
            hf download "$model" "${files[@]}" --revision "$revision" --local-dir "$dir"

            test -s "$dir/model.safetensors"
            mv "$dir/model.safetensors" "$model_asset"

            tar -C "$dir" -czf "$bundle" .
            test "$(stat -c '%s' "$model_asset")" -lt 2147483647
            test "$(stat -c '%s' "$bundle")" -lt 2147483647

            model_sha="$(sha256sum "$model_asset" | awk '{print $1}')"
            bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
            cat > "$manifest" <<EOF
{
  "schema_version": "1.0.0",
  "logical_id": "$id",
  "model_id": "$model",
  "revision": "$revision",
  "license": "$license",
  "source_url": "https://huggingface.co/$model/tree/$revision",
  "assets": [
    {"name":"$id-model.safetensors","bytes":$(stat -c '%s' "$model_asset"),"sha256":"$model_sha"},
    {"name":"$id-runtime-files.tar.gz","bytes":$(stat -c '%s' "$bundle"),"sha256":"$bundle_sha"}
  ]
}
EOF

            gh release upload "$TAG"               "$model_asset"               "$bundle"               "$manifest"               --clobber

            rm -rf "$dir" "$model_asset" "$bundle" "$manifest"
            echo "=== Published $id ==="
          }

          publish_engine             "qwen3"             "Qwen/Qwen3-0.6B"             "c1899de289a04d12100db370d81485cdf75e47ca"             "apache-2.0"             model.safetensors LICENSE README.md .gitattributes config.json generation_config.json merges.txt tokenizer.json tokenizer_config.json vocab.json

          publish_engine             "paddleocr-vl"             "PaddlePaddle/PaddleOCR-VL"             "7fa00a8c55b735ba51ba49a9058f3f9c57a99a11"             "apache-2.0"             model.safetensors LICENSE README.md .gitattributes config.json configuration_paddleocr_vl.py generation_config.json image_processing_paddleocr_vl.py inference.yml modeling_paddleocr_vl.py preprocessor_config.json processing_paddleocr_vl.py processor_config.json special_tokens_map.json tokenizer.json tokenizer.model tokenizer_config.json

          publish_engine             "whisper-tiny"             "openai/whisper-tiny"             "169d4a4341b33bc18d8881c4b69c2e104e1cc0af"             "apache-2.0"             model.safetensors LICENSE README.md .gitattributes added_tokens.json config.json generation_config.json merges.txt normalizer.json preprocessor_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json

      - name: Verify published Release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,url,assets
          python3 - <<'PY'
          import json, subprocess
          manifest=json.load(open("config/rechercher-omega-engine-release.json"))
          raw=subprocess.check_output(
              ["gh","release","view",manifest["release_tag"],"--json","assets"],
              text=True
          )
          actual={item["name"] for item in json.loads(raw)["assets"]}
          expected={name for engine in manifest["engines"] for name in engine["asset_plan"]}
          missing=sorted(expected-actual)
          if missing:
              raise SystemExit("missing Release assets: "+", ".join(missing))
          print("All expected Rechercher Ω starter assets are published.")
          PY
