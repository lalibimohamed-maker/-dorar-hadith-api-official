name: Scientific Religious Video Engine Registry

on:
  pull_request:
    paths:
      - 'config/scientific-religious-video-engine-2026.json'
      - 'config/video-color-purity-perceptual-fidelity-2026.json'
      - 'docs/scientific-religious-video-engine-48k.md'
      - 'config/source-registry.json'
      - '.github/workflows/scientific-religious-video-engine.yml'
  push:
    branches: [main]
    paths:
      - 'config/scientific-religious-video-engine-2026.json'
      - 'config/video-color-purity-perceptual-fidelity-2026.json'
      - 'docs/scientific-religious-video-engine-48k.md'
      - 'config/source-registry.json'
      - '.github/workflows/scientific-religious-video-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-video-engine-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted repository content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate registry invariants
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('config/scientific-religious-video-engine-2026.json', 'utf8'));
          const p = x.principles;
          if (x.scope !== 'candidate_benchmark_only') throw new Error('registry must remain candidate_benchmark_only');
          if (x.runtimeBoundary?.runtimeDependency !== false) throw new Error('runtime dependency boundary drifted');
          if (x.runtimeBoundary?.canonicalCorpusMutation !== false) throw new Error('Corpus mutation boundary drifted');
          if (x.runtimeBoundary?.automaticModelOrMediaPromotion !== false) throw new Error('automatic promotion boundary drifted');
          const requiredClaimTypes = [
            'quran_text','quran_translation_meaning','quran_tafsir','hadith_text','hadith_grading',
            'scientific_observation','scientific_consensus','scientific_hypothesis','historical_report','interpretive_relationship'
          ];
          for (const type of requiredClaimTypes) {
            if (!x.claimPolicy?.separatedClaimTypes?.includes(type)) throw new Error(`missing claim type: ${type}`);
          }
          if (x.claimPolicy?.interpretiveRelationshipCannotBecomeScientificFact !== true) throw new Error('interpretive/scientific separation missing');
          if (x.claimPolicy?.interpretiveRelationshipCannotBecomeReligiousRuling !== true) throw new Error('interpretive/religious separation missing');
          if (x.sceneContract?.sceneMustReferenceClaimEvidence !== true) throw new Error('scene evidence binding missing');
          if (x.sceneContract?.publicOnInternetDoesNotMeanReusable !== true) throw new Error('media reuse gate missing');
          const mediaClasses = new Set(x.mediaRightsPolicy?.embeddableClasses || []);
          for (const required of ['public_domain','compatible_open_license','explicit_permission','original_generated']) {
            if (!mediaClasses.has(required)) throw new Error(`missing media class: ${required}`);
          }
          if (x.mediaRightsPolicy?.thirdPartySearchResultDefault !== 'reference_only_not_embeddable') throw new Error('third-party reference-only policy drifted');
          if (x.quranSynchronization?.quranArabicText !== 'verbatim_source_bound') throw new Error('Quran Arabic binding drifted');
          if (x.quranSynchronization?.recitationRightsRequired !== true) throw new Error('recitation rights gate missing');
          if (!Array.isArray(x.quranSynchronization?.wordLevelModeRequires) || x.quranSynchronization.wordLevelModeRequires.length < 2) throw new Error('word-level timing/rights requirements incomplete');
          if (x.quranSynchronization?.fallbackMode !== 'ayah_level') throw new Error('ayah-level synchronization fallback missing');
          const renderStages = x.renderArchitecture?.stages || [];
          const requiredRenderStages = [
            'evidence_and_storyboard','generation_or_lawful_media_acquisition','scene_analysis','composition',
            'quran_hadith_translation_audio_synchronization','text_vector_render_at_target_resolution',
            'eligible_raster_restoration_upscaling','final_encode','provenance_manifest'
          ];
          for (const stage of requiredRenderStages) if (!renderStages.includes(stage)) throw new Error(`missing render stage: ${stage}`);
          if (x.renderArchitecture?.landscape48K !== '46080x25920') throw new Error('48K landscape ceiling drifted');
          if (x.renderArchitecture?.portrait48K !== '25920x46080') throw new Error('48K portrait ceiling drifted');
          if (x.renderArchitecture?.native48KGenerationNotRequired !== true) throw new Error('native 48K disclaimer missing');
          if (x.renderArchitecture?.textQuranCitationsAndFactualDiagramsRenderedAsFinalResolutionVectorOrText !== true) throw new Error('final-resolution text/vector rule missing');
          if (x.reproducibility?.deterministicTimelineManifest !== true) throw new Error('deterministic manifest requirement missing');
          for (const field of ['visual','audio','model','citation']) {
            if (!x.reproducibility?.assetProvenanceRequired?.includes(field)) throw new Error(`missing provenance class: ${field}`);
          }
          const expectedGates = ['rights','evidence_verification','scientific_religious_integrity','security','arabic_quality','audiovisual_quality','performance_resource_cost','provenance','human_review','CI'];
          for (const gate of expectedGates) if (!x.promotionPolicy?.gates?.includes(gate)) throw new Error(`missing promotion gate: ${gate}`);
          if (x.promotionPolicy?.automaticRuntimePromotion !== false) throw new Error('automatic promotion must remain disabled');
          const islamReligion = (x.islamicVideoSources || []).find((s) => s.sourceId === 'islamreligion-videos');
          if (!islamReligion) throw new Error('IslamReligion video source binding missing');
          if (islamReligion.localizedEntryPoints?.fr !== 'https://www.islamreligion.com/fr/videos') throw new Error('IslamReligion French video URL drifted');
          if (islamReligion.rightsDefault !== 'restricted') throw new Error('IslamReligion default rights state must remain restricted');
          if (islamReligion.mediaBoundary !== 'reference_only_until_explicit_license_or_permission') throw new Error('IslamReligion media boundary missing');
          if (islamReligion.evidenceBoundary !== 'secondary_dawah_context_not_scientific_primary_evidence') throw new Error('IslamReligion evidence boundary missing');
          const registry = JSON.parse(fs.readFileSync('config/source-registry.json', 'utf8'));
          const source = (registry.sources || []).find((s) => s.id === 'islamreligion-videos');
          if (!source) throw new Error('IslamReligion source registry entry missing');
          if (source.rights?.defaultStatus !== 'restricted') throw new Error('source registry rights state drifted');
          if (source.url !== 'https://www.islamreligion.com/fr/videos') throw new Error('source registry URL drifted');
          const requiredTrue = [
            'freeFirst','selfHostedPreferred','noPaidCoreDependency','noAutomaticPromotion',
            'noSilentReplacement','noCorpusMutation','noUnlicensedMediaReuse','noUnverifiedReligiousClaim',
            'scientificClaimMustBeSourced','quranTextMustRemainVerbatim','quranTranslationIsDistinctFromArabicText',
            'softwareModelVoiceAssetLicensesRemainSeparate','voiceCloningRequiresExplicitRights','provenanceRequiredPerAsset',
            'renderResolutionIsIndependentFromGenerationResolution'
          ];
          for (const key of requiredTrue) if (p[key] !== true) throw new Error(`policy invariant failed: ${key}`);
          if (!Array.isArray(x.pipeline) || x.pipeline.length < 20) throw new Error('video synthesis pipeline incomplete');
          const requiredStages = [
            'question_understanding','islamic_evidence_retrieval','scientific_evidence_retrieval','claim_verification',
            'evidence_graph','global_media_discovery','rights_and_license_gate','original_scene_generation',
            'semantic_scene_composer','quran_word_alignment','multilingual_translation','voice_and_audio_rights_layer',
            'timeline_composer','documentary_director','provenance_manifest','multi_stage_render_and_delivery'
          ];
          for (const stage of requiredStages) if (!x.pipeline.includes(stage)) throw new Error(`missing pipeline stage: ${stage}`);
          const out = x.outputProfiles['48K'];
          if (!out || out.maxWidth !== 46080 || out.maxHeight !== 25920) throw new Error('48K landscape output must remain 46080x25920');
          if (x.outputProfiles['8K'].maxWidth !== 7680) throw new Error('8K profile drifted');
          if (x.outputPolicy.maximumHorizontalPixels !== 46080 || x.outputPolicy.maximumVerticalPixels !== 25920) throw new Error('output ceiling drifted');
          if (x.outputPolicy.maximumLandscapeProfile !== '46080x25920') throw new Error('landscape ceiling drifted');
          if (x.outputPolicy.maximumPortraitProfile !== '25920x46080') throw new Error('portrait ceiling drifted');
          const c = x.outputPolicy.importantConstraint || '';
          if (!c.includes('48K is an output/render ceiling')) throw new Error('48K policy clarification missing');
          if (!c.includes('not a claim that every generation model produces native 48K frames')) throw new Error('48K native-generation disclaimer missing');
          if (x.videoCreationEngines.voice_engine.status !== 'license_gated') throw new Error('voice engine must remain license_gated');
          for (const [groupName, group] of Object.entries(x.technicalCandidates)) {
            if (!Array.isArray(group)) throw new Error(`technical candidate group must be an array: ${groupName}`);
            for (const candidate of group) {
              if (!candidate.status || !candidate.name) throw new Error(`technical candidate record incomplete: ${groupName}`);
            }
          }
          console.log('Scientific-religious video engine registry: PASS');
          console.log(`Pipeline stages: ${x.pipeline.length}; output ceiling: ${out.maxWidth}x${out.maxHeight}.`);
          NODE

      - name: Validate color purity and perceptual fidelity registry
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('config/video-color-purity-perceptual-fidelity-2026.json', 'utf8'));
          const p = x.principles;
          for (const key of ['sourceFaithful','noArtificialColorClaims','preserveScientificLabels','preserveQuranAndHadithText','noCorpusMutation','noAutomaticPromotion','displayAwareOutput','renderingResolutionIndependent']) {
            if (p[key] !== true) throw new Error(`color policy invariant failed: ${key}`);
          }
          if (!Array.isArray(x.pipeline) || x.pipeline.length < 18) throw new Error('color-purity pipeline incomplete');
          const required = ['input_color_metadata_detection','temporal_chroma_noise_reduction','shot_to_shot_color_matching','wide_gamut_working_space','gamut_mapping','hdr_tone_mapping','source_fidelity_check','vector_text_overlay_at_final_resolution','display_target_transform','final_quality_gate'];
          for (const stage of required) if (!x.pipeline.includes(stage)) throw new Error(`missing color stage: ${stage}`);
          if (x.outputPolicy.maximumLandscape !== '46080x25920') throw new Error('color output landscape ceiling drifted');
          if (x.outputPolicy.maximumPortrait !== '25920x46080') throw new Error('color output portrait ceiling drifted');
          if (!x.outputPolicy.qualityRequirement && !x.qualityRules) throw new Error('color quality rules missing');
          console.log('Video color purity/perceptual fidelity registry: PASS');
          NODE

      - name: Enforce no runtime or Corpus mutation
        run: |
          set -euo pipefail
          BASE_SHA="${GITHUB_BASE_SHA:-}"
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            forbidden='^(corpus/|config/corpus\.json|src/|app/|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
            if printf '%s\n' "$changed" | grep -E "$forbidden"; then
              echo 'Forbidden runtime/Corpus mutation detected.'
              exit 1
            fi
          fi
          echo 'No-runtime / no-Corpus mutation gate: PASS'
