name: Waqfeya Harvest 10
on:
  push:
    branches: [feat/real-corpus-acquisition-2026]
    paths: [data/corpus/waqfeya/century-15/index.jsonl]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        book_start: [7200,7300,7400,7500,7600,7700,7800,7900]
    uses: ./.github/workflows/waqfeya-harvest-reusable.yml
    with:
      shard_id: century15-${{ matrix.book_start }}
      book_start: ${{ matrix.book_start }}
      book_count: 100
