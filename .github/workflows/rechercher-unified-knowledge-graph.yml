name: Rechercher — Unified multilingual knowledge graph

on:
  pull_request:
    branches: [feat/rechercher-world-knowledge-engines-v1]
  schedule:
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      catalog_only:
        description: 'Build connector/service catalog without crawling TerminologyEnc'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate graph contract
        run: node --test test/rechercher-deep-islamcontent-terminology.test.js
      - name: Build unified graph
        env:
          RECHERCHER_GRAPH_MAX_CATEGORIES: 24
          RECHERCHER_GRAPH_MAX_TERMS: 120
          RECHERCHER_GRAPH_LANG_LIMIT: 3
        run: |
          if [ "${{ inputs.catalog_only }}" = "true" ]; then
            node scripts/rechercher-unified-knowledge-graph.mjs --catalog-only
          else
            node scripts/rechercher-unified-knowledge-graph.mjs
          fi
      - name: Upload graph artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rechercher-unified-knowledge-graph-${{ github.run_id }}
          path: artifacts/rechercher/unified-knowledge-graph.json
          if-no-files-found: error
          retention-days: 14
