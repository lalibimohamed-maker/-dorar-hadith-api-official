name: Rechercher — Central governed PDF acquisition

# One central downloader for the WHOLE encyclopedia. No era-specific acquisition pin.
# Order is unbounded: Prophet era -> Hijri chronology -> present day -> future catalog additions.
# Storage rule: ONE physical PDF copy per book. Primary and secondary pools are complementary shards, never mirrors.
# security-justification: This workflow requires contents: write solely to persist verified, quality-gated PDF shards and governance manifests to the governed acquisition branch and secondary PDF storage; no source-code mutation is performed by the acquisition engine.
permissions:
  contents: write

env:
  RECHERCHER_MAX_BOOK_WORKERS: 12
  RECHERCHER_CATALOG_GLOB: books-batches/**/catalog.json
  RECHERCHER_SECONDARY_STORAGE_REPO: lalibimohamed82-coder/rechercher-pdf-storage

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch holding the persistent chronological queue and verified PDF state.'
        required: true
        type: string
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN:
        description: 'Required write token for the secondary PDF storage repository.'
        required: true

jobs:
  acquire:
    name: Continuous whole-encyclopedia real-PDF acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    steps:
      - name: Checkout persistent chronological acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest governed engine and catalogs from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize whole-encyclopedia catalogs, engine and chronology policy
        run: |
          set -euo pipefail
          test -s .governance-source/config/rechercher-encyclopedia-catalog-registry.json
          test -s .governance-source/config/rechercher-central-sequential-scope.json
          mkdir -p books-batches scripts
          cp -a .governance-source/books-batches/. books-batches/
          for script in rechercher_sequential_acquisition.py rechercher_acquisition_engine.py rechercher_pdf_storage_hygiene.py rechercher_pdf_quality_gate.py; do
            test -s ".governance-source/scripts/$script"
            cp -f ".governance-source/scripts/$script" "scripts/$script"
          done
          test ! -e scripts/rechercher_pdf_acquire.py || { echo 'legacy rechercher_pdf_acquire.py must not be present in governed execution state'; exit 1; }
          test ! -e scripts/rechercher_waqfeya_acquire_original.py || { echo 'legacy rechercher_waqfeya_acquire_original.py must not be present in governed execution state'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/rechercher-central-sequential-scope.json').read_text(encoding='utf-8'))
          if d.get('mode') != 'unbounded_continuous_chronological': raise SystemExit('Central acquisition is still configured as a finite or era-bounded queue.')
          if d.get('finite_book_count_targets') is not False or d.get('book_count_targets'): raise SystemExit('Finite book-count targeting is forbidden.')
          if d.get('catalog_glob') != 'books-batches/**/catalog.json' or d.get('output_format') != '.pdf': raise SystemExit('Central chronological acquisition scope is invalid.')
          print('CHRONOLOGY=', d['chronology'])
          print('FINITE_BOOK_COUNT_TARGETS=', d['finite_book_count_targets'])
          print('ACQUISITION_ENGINE_SOURCE=governed-main')
          PY

      - name: Connect to secondary PDF pool for state discovery and cleanup
        run: |
          set -euo pipefail
          test -n "$SECONDARY_STORAGE_TOKEN"
          cat > "$RUNNER_TEMP/rechercher-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SECONDARY_STORAGE_TOKEN" ;;
            *) printf '%s\n' "$SECONDARY_STORAGE_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-askpass" GIT_TERMINAL_PROMPT=0
          git ls-remote "https://github.com/${RECHERCHER_SECONDARY_STORAGE_REPO}.git" >/dev/null
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://github.com/${RECHERCHER_SECONDARY_STORAGE_REPO}.git" .secondary-storage
          cd .secondary-storage
          git lfs install
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git lfs pull --include='artifacts/*.pdf' --exclude='' || true
          else
            git switch --orphan main
          fi
          find artifacts/permanent-pdfs -type f -name '*.pdf' -delete 2>/dev/null || true
          rm -rf artifacts/permanent-pdfs
          find . -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -delete
          python3 ../scripts/rechercher_pdf_storage_hygiene.py --root "$PWD" --glob 'artifacts/**/*.pdf' --glob 'artifacts/*.pdf'
          mkdir -p ../artifacts
          while IFS= read -r -d '' f; do
            base="$(basename "${f#./}")"
            if [ ! -e "../artifacts/$base" ]; then cp -- "$f" "../artifacts/$base"; fi
          done < <(find artifacts -type f -name '*.pdf' -print0)

      - name: Build census and discovery index
        run: |
          set -euo pipefail
          python3 .governance-source/scripts/rechercher_encyclopedia_catalog_census.py
          python3 .governance-source/scripts/rechercher_dorar_book_index.py --root "$GITHUB_WORKSPACE"

      - name: Clean primary PDF working storage
        run: python3 scripts/rechercher_pdf_storage_hygiene.py --root "$GITHUB_WORKSPACE" --glob 'artifacts/**/*.pdf' --glob 'artifacts/*.pdf'

      - name: Acquire PDFs through the single unbounded Hijri chronological queue
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          git lfs install
          git lfs pull --include='artifacts/*.pdf' --exclude='' || true
          python3 scripts/rechercher_sequential_acquisition.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source

      - name: Enforce non-destructive PDF quality and completeness gate
        run: |
          set -euo pipefail
          python3 scripts/rechercher_pdf_quality_gate.py --root artifacts --report artifacts/governance/pdf-quality-gate.json

      - name: Reject encrypted or invalid primary PDFs
        run: |
          set -euo pipefail
          if find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit | grep -q .; then echo 'encrypted artifact remains'; exit 1; fi
          while IFS= read -r -d '' f; do
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "not a real PDF: $f"; exit 1; }
            test -s "$f"
            qpdf --check "$f" >/dev/null
          done < <(find artifacts -type f -name '*.pdf' -print0)

      - name: Deterministically partition PDFs across the two pools
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          primary=Path('artifacts'); secondary=Path('.secondary-storage/artifacts')
          primary.mkdir(parents=True, exist_ok=True); secondary.mkdir(parents=True, exist_ok=True)

          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()

          def valid_pdf(path):
              try:
                  with path.open('rb') as fh: return path.is_file() and path.stat().st_size>0 and fh.read(5)==b'%PDF-'
              except OSError: return False

          def route_for(pdf):
              manifest=pdf.with_suffix('.manifest.json')
              if not manifest.exists():
                  raise SystemExit(f'MISSING_RIGHTS_MANIFEST: {manifest}')
              data=json.loads(manifest.read_text(encoding='utf-8'))
              visibility=data.get('storage_visibility')
              if visibility == 'publication-eligible' and data.get('public_browser') is True:
                  return 'public'
              if visibility == 'private-protected' and data.get('developer_private_access') is True:
                  return 'protected'
              raise SystemExit(f'RIGHTS_ROUTING_BLOCKED: {pdf.name} visibility={visibility!r}')

          # Rights determine the destination; the old hash-based sharding is removed.
          # Public-eligible files go once to the public primary pool.
          # Everything else goes once to the protected secondary pool.
          routes={}
          for path in sorted(primary.glob('*.pdf')):
              if not valid_pdf(path): raise SystemExit(f'not a real PDF: {path}')
              routes[path] = route_for(path)

          for path,route in list(routes.items()):
              destination_root = primary if route == 'public' else secondary
              destination = destination_root / path.name
              if destination != path:
                  if destination.exists():
                      if sha256(destination) != sha256(path):
                          destination=destination_root/f'{path.stem}--{sha256(path)[:12]}{path.suffix}'
                      else:
                          path.unlink(missing_ok=True)
                          continue
                  shutil.move(str(path),str(destination))

          # Remove any stale duplicate copy with the same SHA from the opposite pool.
          seen={}
          for pool,root in (('public',primary),('protected',secondary)):
              for path in sorted(root.glob('*.pdf')):
                  if not valid_pdf(path): raise SystemExit(f'invalid PDF after routing: {pool}/{path.name}')
                  sha=sha256(path)
                  if sha in seen: raise SystemExit(f'DUPLICATE_PDF_COPY: {path.name} already stored in {seen[sha]}')
                  seen[sha]=f'{pool}/{path.name}'

          print(f'RIGHTS_ROUTING_OK public={sum(1 for v in seen.values() if v.startswith("public/"))} protected={sum(1 for v in seen.values() if v.startswith("protected/"))} total={len(seen)}')
          PY

      - name: Persist verified PDFs to primary LFS storage
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rechercher-primary-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-primary-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-primary-askpass" GIT_TERMINAL_PROMPT=0
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches scripts .gitattributes artifacts/governance
          git reset -- ':(glob)scripts/**/__pycache__/**' ':(glob)scripts/**/*.py[cod]' 2>/dev/null || true
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find artifacts -maxdepth 1 -type f -name '*.pdf' -print0)
          if ! git diff --cached --quiet; then
            git commit -m 'data(rechercher): persist chronological acquisition state and primary PDFs'
            git pull --rebase --autostash origin "$TARGET_BRANCH"
            git lfs fsck --pointers HEAD; git lfs push --dry-run origin HEAD
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Persist verified PDFs to secondary LFS storage
        env:
          SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SECONDARY_STORAGE_TOKEN"
          cd .secondary-storage
          cat > "$RUNNER_TEMP/rechercher-secondary-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SECONDARY_STORAGE_TOKEN" ;;
            *) printf '%s\n' "$SECONDARY_STORAGE_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-secondary-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-secondary-askpass" GIT_TERMINAL_PROMPT=0
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes
          git reset -- ':(glob)**/__pycache__/**' ':(glob)**/*.py[cod]' 2>/dev/null || true
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find artifacts -maxdepth 1 -type f -name '*.pdf' -print0)
          if ! git diff --cached --quiet; then
            git commit -m 'data(rechercher): persist secondary chronological PDF shard'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git lfs fsck --pointers HEAD
              git lfs push --dry-run origin HEAD
              if git push origin HEAD:refs/heads/main; then
                echo "SECONDARY_PUSH_OK attempt=$attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'ERROR: secondary storage remained non-fast-forward after 3 synchronized attempts.' >&2
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Verify exactly one stored copy per verified PDF
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          primary=Path('artifacts'); secondary=Path('.secondary-storage/artifacts'); seen={}
          for pool,root in [('primary',primary),('secondary',secondary)]:
              for pdf in sorted(root.glob('*.pdf')):
                  data=pdf.read_bytes()
                  if not data.startswith(b'%PDF-') or not data: raise SystemExit(f'invalid PDF: {pool}/{pdf.name}')
                  sha=hashlib.sha256(data).hexdigest()
                  if sha in seen: raise SystemExit(f'DUPLICATE_PDF_COPY: {pdf.name} already stored in {seen[sha]}')
                  seen[sha]=f'{pool}/{pdf.name}'
          Path('artifacts/governance/storage-end-to-end-proof.json').write_text(json.dumps({'status':'VERIFIED','storage_model':'ONE_COPY_ONLY_RIGHTS_ROUTED','verified_real_pdfs':len(seen),'public_storage':'primary public asset','protected_storage':'secondary developer-access pool','developer_access_public':True,'developer_access_protected':True,'sha256':'integrity_only_not_storage_path','encrypted_final_artifacts':False,'duplicate_pdf_copies':0},indent=2)+'\n',encoding='utf-8')
          print(f'ONE_COPY_STORAGE=VERIFIED count={len(seen)}')
          PY
          git lfs fsck --pointers HEAD
          cd .secondary-storage; git lfs fsck --pointers HEAD
