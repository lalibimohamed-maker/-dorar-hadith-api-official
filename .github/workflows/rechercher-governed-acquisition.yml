name: Rechercher — Central governed PDF acquisition

# Persistent PDF downloader for the encyclopedia. It consumes every
# books-batches/**/catalog.json present on main and persists verified PDFs on
# the governed acquisition branch.
# security-justification: reviewed; contents: write is required only to persist verified PDF artifacts/manifests to the governed acquisition branch.
permissions:
  contents: write

env:
  RECHERCHER_MAX_BOOK_WORKERS: 12

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch where verified PDF artifacts and manifests are persisted.'
        required: true
        type: string

jobs:
  acquire:
    name: Continuous encyclopedia PDF download and verification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout governed acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest main catalogs and acquisition implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize all saved book catalogs
        run: |
          set -euo pipefail
          mkdir -p books-batches
          cp -a .governance-source/books-batches/. books-batches/

      - name: Download real PDFs, verify, hash, and record failures
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install
          echo "Parallel PDF workers: ${RECHERCHER_MAX_BOOK_WORKERS}"
          python3 .governance-source/scripts/rechercher_waqfeya_acquire.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_AUTH_HEADER="AUTHORIZATION: bearer ${GITHUB_TOKEN}"
          git add books-batches scripts artifacts .gitattributes
          if git diff --cached --quiet; then
            echo 'No new PDF changes; saved failures will be retried on the next cycle.'
            exit 0
          fi
          git commit -m 'data(rechercher): download and verify encyclopedia PDFs in parallel'
          git -c "http.extraheader=${GIT_AUTH_HEADER}" fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git -c "http.extraheader=${GIT_AUTH_HEADER}" push origin "HEAD:refs/heads/$TARGET_BRANCH"
