name: Rechercher — Central governed PDF acquisition

# Persistent PDF downloader for the WHOLE encyclopedia, not only 1-400H.
# Scope: Prophet era -> Companions -> Followers -> 1-400H -> 401-800H ->
# 801-1200H -> 1201H -> Modern era -> any new book appearing in saved sources.
# It consumes every books-batches/**/catalog.json present on main and persists verified PDFs.
# security-justification: reviewed; contents: write is required only to persist verified PDF artifacts/manifests to the governed acquisition branch.
permissions:
  contents: write

env:
  RECHERCHER_MAX_BOOK_WORKERS: 12
  RECHERCHER_CATALOG_GLOB: books-batches/**/catalog.json
  RECHERCHER_SECONDARY_STORAGE_REPO: lalibimohamed82-coder/rechercher-pdf-storage

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch where verified PDF artifacts and manifests are persisted.'
        required: true
        type: string
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN:
        description: 'Optional write token owned by the secondary GitHub account for the separate PDF storage repository.'
        required: false

jobs:
  acquire:
    name: Continuous whole-encyclopedia PDF download and verification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    steps:
      - name: Checkout governed acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest main catalogs and acquisition implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize the whole encyclopedia scope
        run: |
          set -euo pipefail
          test -s .governance-source/config/rechercher-encyclopedia-download-scope.json
          mkdir -p books-batches
          cp -a .governance-source/books-batches/. books-batches/
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.governance-source/config/rechercher-encyclopedia-download-scope.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected=['Prophet era','Companions','Followers','1-400H','401-800H','801-1200H','1201H','Modern era']
          if d.get('eras') != expected:
              raise SystemExit('Encyclopedia era scope is incomplete or reordered.')
          if d.get('catalog_glob') != 'books-batches/**/catalog.json':
              raise SystemExit('Whole-encyclopedia catalog scope is not enabled.')
          print('Whole encyclopedia PDF scope enabled:', ' -> '.join(d['eras']), ' -> future books')
          PY

      - name: Download real PDFs, verify, hash, and record failures
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install

          # Hydrate any existing LFS objects before acquisition/staging. A missing
          # object must never be turned into a new PDF pointer by this workflow.
          git lfs fetch origin --all || true
          git lfs checkout || true

          echo "Whole-encyclopedia PDF scope: ${RECHERCHER_CATALOG_GLOB}"
          echo "Parallel PDF workers: ${RECHERCHER_MAX_BOOK_WORKERS}"
          python3 .governance-source/scripts/rechercher_waqfeya_acquire.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage metadata/code first. PDFs are staged individually only after the
          # workspace proves they contain real PDF bytes, never an LFS pointer.
          git add books-batches scripts .gitattributes
          while IFS= read -r -d '' f; do
            if head -c 5 "$f" | grep -qx '%PDF-' && test -s "$f"; then
              git add -- "$f"
            else
              echo "[SKIP] non-PDF artifact (pointer/missing LFS object): $f"
              git reset -- "$f" >/dev/null 2>&1 || true
              if ! git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                rm -f -- "$f"
              fi
            fi
          done < <(find artifacts -type f -name '*.pdf' -print0)

          if git diff --cached --quiet; then
            echo 'No new verified PDF changes; saved failures will be retried on the next cycle.'
          else
            # Fail closed: validate ONLY PDFs that are actually staged. A stale
            # unhydrated worktree pointer can no longer poison an otherwise valid run.
            while IFS= read -r -d '' f; do
              case "$f" in
                *.pdf)
                  head -c 5 "$f" | grep -qx '%PDF-' || { echo "ERROR: staged PDF is not real PDF bytes: $f"; exit 1; }
                  test -s "$f"
                  ;;
              esac
            done < <(git diff --cached --name-only -z)

            # Integrity check remains mandatory; never suppress a real LFS corruption.
            git lfs fsck --objects
            git commit -m 'data(rechercher): download and verify whole-encyclopedia PDFs in parallel'
            gh auth setup-git
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git lfs fsck --objects
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Mirror verified PDFs to secondary storage account
        if: ${{ env.SECONDARY_STORAGE_TOKEN != '' }}
        env:
          SECONDARY_STORAGE_REPO: ${{ env.RECHERCHER_SECONDARY_STORAGE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SECONDARY_STORAGE_TOKEN"
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://x-access-token:${SECONDARY_STORAGE_TOKEN}@github.com/${SECONDARY_STORAGE_REPO}.git" .secondary-storage
          cd .secondary-storage
          git lfs install
          git lfs fetch --all origin
          git lfs checkout || true
          git lfs track 'artifacts/*.pdf'
          mkdir -p artifacts

          # Never copy a pointer as if it were a PDF. Existing pointers are hydrated
          # from secondary LFS first; newly acquired files must contain real PDF bytes.
          while IFS= read -r -d '' f; do
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "ERROR: secondary source is not real PDF bytes: $f"; exit 1; }
            test -s "$f"
          done < <(find ../artifacts -type f -name '*.pdf' -print0)

          cp -a ../artifacts/. artifacts/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts .gitattributes
          if git diff --cached --quiet; then
            echo 'Secondary PDF storage is already synchronized.'
            exit 0
          fi

          while IFS= read -r -d '' f; do
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "ERROR: staged secondary PDF is a pointer/non-PDF: $f"; exit 1; }
            test -s "$f"
          done < <(find artifacts -type f -name '*.pdf' -print0)
          git lfs fsck --objects
          git commit -m 'data(rechercher): mirror verified encyclopedia PDFs'
          git lfs fsck --objects
          git push origin HEAD
