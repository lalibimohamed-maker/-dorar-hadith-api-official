name: Rechercher — Central governed PDF acquisition

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch holding acquisition manifests and release indexes only.'
        required: true
        type: string
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN:
        description: 'Token for the private protected Releases repository; never used for Git LFS.'
        required: true

permissions:
  contents: write

env:
  RECHERCHER_CATALOG_GLOB: books-batches/**/catalog.json
  RECHERCHER_PROTECTED_RELEASE_REPO: lalibimohamed82-coder/rechercher-pdf-storage

jobs:
  acquire:
    name: Whole-encyclopedia real-PDF acquisition to Releases
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Checkout governed engine and catalogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize governed acquisition state
        run: |
          set -euo pipefail
          test -s .governance-source/config/rechercher-encyclopedia-catalog-registry.json
          test -s .governance-source/config/rechercher-central-sequential-scope.json
          mkdir -p books-batches scripts artifacts/governance
          cp -a .governance-source/books-batches/. books-batches/
          for script in rechercher_sequential_acquisition.py rechercher_acquisition_engine.py rechercher_pdf_storage_hygiene.py rechercher_pdf_quality_gate.py; do
            test -s .governance-source/scripts/$script
            cp -f .governance-source/scripts/$script scripts/$script
          done
          test ! -e scripts/rechercher_pdf_acquire.py

      - name: Install PDF validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Remove forbidden encrypted working outputs
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -delete

      - name: Acquire real PDFs
        run: |
          set -euo pipefail
          python3 scripts/rechercher_sequential_acquisition.py --root "$GITHUB_WORKSPACE"

      - name: Validate every acquired PDF
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: zero PDFs acquired.'; exit 1; }
          for f in "${files[@]}"; do
            test -s "$f"
            head -c 5 "$f" | grep -qx '%PDF-'
            qpdf --check "$f" >/dev/null
            sha256sum "$f"
          done
          if find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit | grep -q .; then exit 1; fi

      - name: Publish verified PDFs as Releases assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
          PROTECTED_REPO: ${{ env.RECHERCHER_PROTECTED_RELEASE_REPO }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts')
          items=[]
          for f in sorted(root.glob('*.pdf')):
              side=root/(f.stem+'.manifest.json')
              visibility='private-protected'
              public_browser=False
              if side.exists():
                  try:
                      d=json.loads(side.read_text(encoding='utf-8'))
                      visibility=d.get('storage_visibility') or visibility
                      public_browser=d.get('public_browser') is True
                  except Exception:
                      pass
              items.append({'file':str(f),'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'route':'public' if visibility=='publication-eligible' and public_browser else 'protected'})
          Path('artifacts/governance/release-input.json').write_text(json.dumps({'schema':'din-allah-encyclopedia/rechercher-release-input/v1','assets':items},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          public_count=$(python3 -c "import json; d=json.load(open('artifacts/governance/release-input.json')); print(sum(x['route']=='public' for x in d['assets']))")
          protected_count=$(python3 -c "import json; d=json.load(open('artifacts/governance/release-input.json')); print(sum(x['route']=='protected' for x in d['assets']))")
          public_tag="rechercher-pdf-${GITHUB_RUN_ID}"
          protected_tag="rechercher-protected-pdf-${GITHUB_RUN_ID}"
          export PUBLIC_TAG="$public_tag" PROTECTED_TAG="$protected_tag"
          if [ "$public_count" -gt 0 ]; then
            gh release create "$public_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rechercher plaintext PDFs ${GITHUB_RUN_ID}" --notes "Verified plaintext PDF assets. PDF storage is GitHub Releases only; Git LFS and Actions artifacts are not storage backends."
          fi
          if [ "$protected_count" -gt 0 ]; then
            test -n "$PROTECTED_TOKEN"
            visibility=$(GH_TOKEN="$PROTECTED_TOKEN" gh repo view "$PROTECTED_REPO" --json visibility --jq .visibility)
            test "$visibility" = PRIVATE || { echo 'ERROR: protected PDF repository must be private.'; exit 1; }
            GH_TOKEN="$PROTECTED_TOKEN" gh release create "$protected_tag" --repo "$PROTECTED_REPO" --title "Rechercher protected plaintext PDFs ${GITHUB_RUN_ID}" --notes "Verified plaintext PDF assets in a private repository. No .pdf.enc and no Git LFS."
          fi
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path('artifacts/governance/release-input.json'); d=json.loads(p.read_text(encoding='utf-8'))
          pub=os.environ.get('PUBLIC_TAG','')
          pro=os.environ.get('PROTECTED_TAG','')
          for a in d['assets']:
              tag=pub if a['route']=='public' else pro
              repo=os.environ['GITHUB_REPOSITORY'] if a['route']=='public' else os.environ['PROTECTED_REPO']
              token=os.environ.get('GH_TOKEN') if a['route']=='public' else os.environ.get('PROTECTED_TOKEN')
              GH={**os.environ,'GH_TOKEN':token}
              subprocess.run(['gh','release','upload',tag,a['file'],'--repo',repo,'--clobber'],env=GH,check=True)
              a.update({'release_tag':tag,'release_repo':repo,'access':'public' if a['route']=='public' else 'private','download_url':f'https://github.com/{repo}/releases/download/{tag}/{Path(a["file"]).name}'})
              print(f"RELEASE_ASSET_OK {a['file']} {a['sha256']}",flush=True)
          Path('artifacts/governance/release-publication.json').write_text(json.dumps({'schema':'din-allah-encyclopedia/rechercher-release-publication/v1','storage_model':'github-releases-assets','git_lfs':False,'github_actions_artifacts_as_pdf_storage':False,'encrypted_pdf_final_format':False,'counts':{'pdf':len(d['assets']),'public':sum(x['route']=='public' for x in d['assets']),'protected':sum(x['route']=='protected' for x in d['assets']),'pdf_enc':0},'assets':d['assets']},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          find artifacts -maxdepth 1 -type f -name '*.pdf' -delete
          test -z "$(find artifacts -maxdepth 1 -type f -name '*.pdf' -print -quit)"

      - name: Verify release-only final storage
        run: |
          set -euo pipefail
          test -s artifacts/governance/release-publication.json
          test -z "$(find artifacts -type f \( -name '*.pdf' -o -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit)"
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/governance/release-publication.json'))
          assert d['git_lfs'] is False
          assert d['github_actions_artifacts_as_pdf_storage'] is False
          assert d['encrypted_pdf_final_format'] is False
          assert d['counts']['pdf_enc']==0
          print('RELEASE_ONLY_STORAGE_OK',d['counts'])
          PY

      - name: Persist release index only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/governance/release-publication.json artifacts/governance/pdf-quality-gate.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(rechercher): persist release-only PDF acquisition evidence'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
