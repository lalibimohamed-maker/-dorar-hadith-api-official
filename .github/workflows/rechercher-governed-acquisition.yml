name: Rechercher — Central governed PDF acquisition

# One central downloader for the WHOLE encyclopedia.
# Storage rule: verified real PDFs are persistent GitHub Release assets.
# Git LFS is NOT used for PDF persistence. Each release shard contains <=950 PDF assets.
# security-justification: contents: write is required to publish only verified real-PDF release assets and persist their SHA-256 governance manifest; it does not modify the Corpus.
permissions:
  contents: write

env:
  RECHERCHER_MAX_BOOK_WORKERS: 12
  RECHERCHER_CATALOG_GLOB: books-batches/**/catalog.json

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch holding persistent chronological acquisition state.'
        required: true
        type: string

jobs:
  acquire:
    name: Continuous whole-encyclopedia real-PDF acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout persistent chronological acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest governed engine and catalogs from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize governed acquisition engine and catalogs
        run: |
          set -euo pipefail
          test -s .governance-source/config/rechercher-encyclopedia-catalog-registry.json
          test -s .governance-source/config/rechercher-central-sequential-scope.json
          mkdir -p books-batches scripts
          cp -a .governance-source/books-batches/. books-batches/
          for script in rechercher_sequential_acquisition.py rechercher_acquisition_engine.py rechercher_pdf_storage_hygiene.py rechercher_pdf_quality_gate.py; do
            test -s ".governance-source/scripts/$script"
            cp -f ".governance-source/scripts/$script" "scripts/$script"
          done
          test ! -e scripts/rechercher_pdf_acquire.py
          test ! -e scripts/rechercher_waqfeya_acquire_original.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/rechercher-central-sequential-scope.json').read_text(encoding='utf-8'))
          if d.get('mode') != 'unbounded_continuous_chronological': raise SystemExit('finite/era-bounded acquisition policy detected')
          if d.get('finite_book_count_targets') is not False or d.get('book_count_targets'): raise SystemExit('finite book-count targeting is forbidden')
          if d.get('catalog_glob') != 'books-batches/**/catalog.json' or d.get('output_format') != '.pdf': raise SystemExit('invalid central acquisition scope')
          PY

      - name: Build census and discovery index
        run: |
          set -euo pipefail
          python3 .governance-source/scripts/rechercher_encyclopedia_catalog_census.py
          python3 .governance-source/scripts/rechercher_dorar_book_index.py --root "$GITHUB_WORKSPACE"

      - name: Acquire PDFs through the unbounded chronological queue
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils
          python3 scripts/rechercher_sequential_acquisition.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source

      - name: Enforce real-PDF quality gate
        run: |
          set -euo pipefail
          python3 scripts/rechercher_pdf_quality_gate.py --root artifacts --report artifacts/governance/pdf-quality-gate.json
          if find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit | grep -q .; then
            echo 'encrypted artifact remains in governed primary working state'
            exit 1
          fi
          while IFS= read -r -d '' f; do
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "not a real PDF: $f"; exit 1; }
            test -s "$f"
            qpdf --check "$f" >/dev/null
          done < <(find artifacts -maxdepth 1 -type f -name '*.pdf' -print0)

      - name: Persist verified PDFs as Release assets
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          mkdir -p artifacts/governance
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          mp=Path('artifacts/governance/release-storage-manifest.json')
          if mp.exists():
              data=json.loads(mp.read_text(encoding='utf-8'))
          else:
              data={'schema':'rechercher/github-release-pdf-storage/v1','storage_model':'github-release-assets','records':[]}
          known={r.get('sha256') for r in data.get('records',[]) if r.get('sha256')}
          rows=[]
          for pdf in sorted(Path('artifacts').glob('*.pdf')):
              sha=hashlib.sha256(pdf.read_bytes()).hexdigest()
              if sha in known: continue
              book_id=None
              for m in sorted(Path('artifacts').glob('*.manifest.json')):
                  try: md=json.loads(m.read_text(encoding='utf-8'))
                  except Exception: continue
                  if Path(str(md.get('unified_file') or '')).name == pdf.name:
                      book_id=md.get('id'); break
              rows.append((str(pdf),sha,str(book_id or '')))
          out=Path(os.environ['RUNNER_TEMP'])/'rechercher-release-pending.tsv'
          out.write_text(''.join('\t'.join(r)+'\n' for r in rows),encoding='utf-8')
          mp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('NEW_RELEASE_PDFS=',len(rows))
          PY

          pending="$RUNNER_TEMP/rechercher-release-pending.tsv"
          batch=0
          while [ -s "$pending" ]; do
            batch=$((batch+1))
            tag="rechercher-pdf-storage-${GITHUB_RUN_ID}-$(printf '%03d' "$batch")"
            mapfile -t files < <(head -n 950 "$pending" | cut -f1)
            gh release create "$tag" --target "$TARGET_BRANCH" --title "Rechercher PDF storage ${GITHUB_RUN_ID} / $(printf '%03d' "$batch")" --notes "Verified real PDFs. Persistent storage shard; <=950 PDF assets." --draft --latest=false
            for f in "${files[@]}"; do gh release upload "$tag" "$f"; done
            gh release edit "$tag" --draft=false --latest=false
            gh release view "$tag" --json assets,tagName > "$RUNNER_TEMP/release-$batch.json"
            python3 - "$RUNNER_TEMP/release-$batch.json" "$pending" <<'PY'
          import json, hashlib, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          pending=Path(sys.argv[2])
          assets={a['name']:a for a in payload.get('assets',[])}
          rows=[x.split('\t') for x in pending.read_text(encoding='utf-8').splitlines() if x]
          selected=rows[:950]
          if len(selected)>len(assets): raise SystemExit('release asset count mismatch')
          mp=Path('artifacts/governance/release-storage-manifest.json')
          data=json.loads(mp.read_text(encoding='utf-8'))
          for path,sha,book_id in selected:
              name=Path(path).name; a=assets.get(name)
              if not a: raise SystemExit('missing release asset: '+name)
              if a.get('digest') != 'sha256:'+sha: raise SystemExit('release digest mismatch: '+name)
              data['records'].append({'book_id':book_id or None,'filename':name,'sha256':sha,'release_tag':payload['tagName'],'download_url':a.get('browserDownloadUrl')})
          mp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rest=rows[950:]
          pending.write_text('\n'.join('\t'.join(x) for x in rest)+('\n' if rest else ''),encoding='utf-8')
          PY
          done

          find artifacts -maxdepth 1 -type f -name '*.pdf' -delete
          if [ -f .gitattributes ]; then sed -i '/artifacts\/\*\.pdf/d' .gitattributes; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches scripts .gitattributes artifacts/governance
          git reset -- ':(glob)scripts/**/__pycache__/**' ':(glob)scripts/**/*.py[cod]' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'data(rechercher): persist verified PDFs in release assets'
            git pull --rebase --autostash origin "$TARGET_BRANCH"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Verify Release storage manifest
        run: |
          set -euo pipefail
          test -s artifacts/governance/release-storage-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/governance/release-storage-manifest.json').read_text(encoding='utf-8'))
          h=[r.get('sha256') for r in d.get('records',[])]
          if any(not isinstance(x,str) or len(x)!=64 for x in h): raise SystemExit('invalid SHA-256')
          if len(h)!=len(set(h)): raise SystemExit('DUPLICATE_RELEASE_PDF_SHA256')
          if list(Path('artifacts').glob('*.pdf')): raise SystemExit('plaintext PDF remains in persistent branch')
          print(f'RELEASE_PDF_STORAGE=VERIFIED records={len(h)}')
          PY
