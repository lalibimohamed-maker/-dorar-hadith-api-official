name: Rechercher — Central governed multi-volume acquisition

on:
  workflow_call:

permissions:
  contents: write

jobs:
  acquire:
    name: Acquire and unify verified multi-volume books
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout central acquisition implementation
        uses: actions/checkout@v4
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Acquire, validate, repair, and unify
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install
          python3 .governance-source/scripts/rechercher_waqfeya_acquire.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches scripts artifacts .gitattributes
          if git diff --cached --quiet; then
            echo 'No changes to persist.'
            exit 0
          fi
          git commit -m 'data(rechercher): acquire verified multi-volume books'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
