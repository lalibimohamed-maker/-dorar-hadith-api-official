name: Rechercher — Central governed multi-volume acquisition

# security-justification: this reusable workflow writes verified book artifacts and manifests to the governed acquisition branch.
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch where verified acquisition artifacts and manifests are persisted.'
        required: true
        type: string

jobs:
  acquire:
    name: Acquire and unify verified multi-volume books
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout central acquisition implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Acquire, validate, repair, and unify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install
          python3 .governance-source/scripts/rechercher_waqfeya_acquire.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source
          git lfs track 'artifacts/*.pdf'
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches scripts artifacts .gitattributes
          if git diff --cached --quiet; then
            echo 'No changes to persist.'
            exit 0
          fi
          git commit -m 'data(rechercher): acquire verified multi-volume books'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
