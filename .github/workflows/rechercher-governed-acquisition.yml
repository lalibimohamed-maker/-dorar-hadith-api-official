name: Rechercher — Central governed PDF acquisition

# One central downloader for the WHOLE encyclopedia. No era-specific acquisition pin.
# Order: Prophet era -> Quran -> Seerah -> Companions -> Followers -> 1-400H -> 401-800H -> 801-1200H -> 1201H -> Modern era -> Future books.
permissions:
  contents: write

env:
  RECHERCHER_MAX_BOOK_WORKERS: 12
  RECHERCHER_CATALOG_GLOB: books-batches/**/catalog.json
  RECHERCHER_SECONDARY_STORAGE_REPO: lalibimohamed82-coder/rechercher-pdf-storage

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Governed branch for verified real PDFs and manifests.'
        required: true
        type: string
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN:
        description: 'Required write token for the secondary PDF storage repository.'
        required: true

jobs:
  acquire:
    name: Continuous whole-encyclopedia real-PDF acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    steps:
      - name: Checkout governed acquisition state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest central catalogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: main
          path: .governance-source
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize whole-encyclopedia catalogs
        run: |
          set -euo pipefail
          test -s .governance-source/config/rechercher-encyclopedia-download-scope.json
          test -s .governance-source/config/rechercher-encyclopedia-catalog-registry.json
          mkdir -p books-batches
          cp -a .governance-source/books-batches/. books-batches/
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.governance-source/config/rechercher-encyclopedia-download-scope.json').read_text(encoding='utf-8'))
          expected=['Prophet era','Companions','Followers','1-400H','401-800H','801-1200H','1201H','Modern era']
          if d.get('eras') != expected or d.get('catalog_glob') != 'books-batches/**/catalog.json': raise SystemExit('Whole-encyclopedia scope is invalid.')
          PY

      - name: Build census and discovery index
        run: |
          set -euo pipefail
          python3 .governance-source/scripts/rechercher_encyclopedia_catalog_census.py
          python3 .governance-source/scripts/rechercher_dorar_book_index.py --root "$GITHUB_WORKSPACE"

      - name: Clean primary PDF storage before acquisition
        run: python3 scripts/rechercher_pdf_storage_hygiene.py --root "$GITHUB_WORKSPACE" --glob 'artifacts/**/*.pdf' --glob 'artifacts/*.pdf'

      - name: Acquire real PDFs through the central sequential engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install
          git lfs fetch origin --all || true
          git lfs checkout || true
          python3 scripts/rechercher_sequential_acquisition.py --root "$GITHUB_WORKSPACE"
          rm -rf .governance-source

      - name: Reject encrypted or invalid primary PDFs
        run: |
          set -euo pipefail
          if find artifacts -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -print -quit | grep -q .; then echo 'encrypted artifact remains'; exit 1; fi
          while IFS= read -r -d '' f; do head -c 5 "$f" | grep -qx '%PDF-' || { echo "not a real PDF: $f"; exit 1; }; test -s "$f"; qpdf --check "$f" >/dev/null; done < <(find artifacts -type f -name '*.pdf' -print0)

      - name: Build ascending Hijri chronological index
        run: python3 scripts/rechercher_build_chronological_index.py

      - name: Persist verified PDFs to primary LFS storage
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git lfs track 'artifacts/*.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches scripts .gitattributes artifacts/governance
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find artifacts -type f -name '*.pdf' -print0)
          if ! git diff --cached --quiet; then git commit -m 'data(rechercher): persist verified real PDFs and chronological index'; git pull --rebase --autostash origin "$TARGET_BRANCH"; git lfs fsck --pointers HEAD; git lfs push --dry-run origin HEAD; git push origin "HEAD:refs/heads/$TARGET_BRANCH"; fi

      - name: Connect to secondary storage and clean it
        run: |
          set -euo pipefail
          test -n "$SECONDARY_STORAGE_TOKEN"
          cat > "$RUNNER_TEMP/rechercher-askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$SECONDARY_STORAGE_TOKEN"
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-askpass" GIT_TERMINAL_PROMPT=0
          git ls-remote "https://github.com/${RECHERCHER_SECONDARY_STORAGE_REPO}.git" >/dev/null
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://github.com/${RECHERCHER_SECONDARY_STORAGE_REPO}.git" .secondary-storage
          cd .secondary-storage
          git lfs install
          if git rev-parse --verify HEAD >/dev/null 2>&1; then git lfs fetch --all origin || true; git lfs checkout || true; else git switch --orphan main; fi
          python3 ../scripts/rechercher_pdf_storage_hygiene.py --root "$PWD" --glob 'artifacts/permanent-pdfs/**/*.pdf' --glob 'artifacts/**/*.pdf'
          find . -type f \( -name '*.pdf.enc' -o -name '*.enc' -o -name '*.encrypted' \) -delete
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore(rechercher): remove encrypted and invalid PDF storage artifacts'; git lfs push --dry-run origin HEAD; git push origin HEAD; fi

      - name: Persist every verified PDF to secondary storage by SHA-256
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rechercher-askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$SECONDARY_STORAGE_TOKEN"
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-askpass" GIT_TERMINAL_PROMPT=0
          cd .secondary-storage
          mkdir -p artifacts/permanent-pdfs/by-sha256
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('..')/'artifacts'; dst=Path('artifacts/permanent-pdfs/by-sha256'); dst.mkdir(parents=True,exist_ok=True)
          records=[]
          for pdf in sorted(src.glob('*.pdf')):
              b=pdf.read_bytes()
              if not b.startswith(b'%PDF-') or not b: raise SystemExit(f'not a real PDF: {pdf}')
              sha=hashlib.sha256(b).hexdigest(); target=dst/f'{sha}.pdf'
              if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest()!=sha: raise SystemExit(f'corrupt existing object: {target}')
              if not target.exists(): target.write_bytes(b)
              records.append({'sha256':sha,'source':pdf.name,'bytes':len(b)})
          idx=Path('artifacts/permanent-pdfs/index.json'); old=json.loads(idx.read_text(encoding='utf-8')) if idx.exists() else {'records':[]}
          merged={r['sha256']:r for r in old.get('records',[])}; merged.update({r['sha256']:r for r in records})
          idx.write_text(json.dumps({'schema':'din-allah-encyclopedia/permanent-real-pdf-corpus/v2','format':'.pdf','records':sorted(merged.values(),key=lambda r:r['sha256'])},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git lfs track 'artifacts/permanent-pdfs/by-sha256/*.pdf'
          git add artifacts/permanent-pdfs .gitattributes
          if ! git diff --cached --quiet; then git commit -m 'data(rechercher): persist verified real PDFs in secondary LFS pool'; git lfs fsck --pointers HEAD; git lfs push --dry-run origin HEAD; git push origin HEAD; fi

      - name: Verify both PDF stores end-to-end
        run: |
          set -euo pipefail
          cd .secondary-storage
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          primary=Path('..')/'artifacts'; secondary=Path('artifacts/permanent-pdfs/by-sha256'); count=0
          for pdf in sorted(primary.glob('*.pdf')):
              b=pdf.read_bytes(); sha=hashlib.sha256(b).hexdigest(); target=secondary/f'{sha}.pdf'
              if not b.startswith(b'%PDF-') or not target.exists() or hashlib.sha256(target.read_bytes()).hexdigest()!=sha: raise SystemExit(f'proof failed: {pdf.name}')
              count += 1
          Path('../artifacts/governance/storage-end-to-end-proof.json').write_text(json.dumps({'status':'VERIFIED','verified_real_pdfs':count,'primary':'artifacts/*.pdf','secondary':'artifacts/permanent-pdfs/by-sha256/<sha256>.pdf','encrypted_final_artifacts':False},indent=2)+'\n',encoding='utf-8')
          print(f'PERMANENT_REAL_PDF_STORAGE=VERIFIED count={count}')
          PY
          git lfs fsck --pointers HEAD
