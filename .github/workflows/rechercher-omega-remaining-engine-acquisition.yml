          - id: flux1-schnell
            model_id: black-forest-labs/FLUX.1-schnell
            revision: f095d56c608128f5ec5e80e7c515697d15d02fa6
            release_tag: rechercher-omega-flux1-schnell-v1.0.0
            license: apache-2.0
            release_mode: prerelease
            chunk_bytes: 536870912
          - id: nllb-200-600m
            model_id: facebook/nllb-200-distilled-600M
            revision: main
            release_tag: rechercher-omega-nllb200-600m-v1.0.0
            license: cc-by-nc-4.0
            release_mode: prerelease
            chunk_bytes: 536870912
          - id: seamless-m4t-v2-large
            model_id: facebook/seamless-m4t-v2-large
            revision: main
            release_tag: rechercher-omega-seamless-m4t-v2-large-v1.0.0
            license: cc-by-nc-4.0
            release_mode: prerelease
            chunk_bytes: 536870912
          - id: pyannote-speaker-diarization-3.1
            model_id: pyannote/speaker-diarization-3.1
            revision: main
            release_tag: rechercher-omega-pyannote-speaker-diarization31-v1.0.0
            license: mit-gated-upstream-terms
            release_mode: prerelease
            chunk_bytes: 536870912
          - id: spark-x2.5-4b
            model_id: XHToken/Spark-X2.5-4B
            revision: main
            release_tag: rechercher-omega-spark-x25-4b-v1.0.0
            license: apache-2.0
            license_asset: LICENSE-APACHE-2.0
            license_url: https://www.apache.org/licenses/LICENSE-2.0.txt
            release_mode: prerelease
            chunk_bytes: 536870912

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Omega storage access
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          TARGET_REPOSITORY: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "RECHERCHER_OMEGA_STORAGE_TOKEN is missing"; exit 1; }
          actual="$(gh api "repos/$TARGET_REPOSITORY" --jq '.full_name')"
          test "$actual" = "$TARGET_REPOSITORY"
          can_push="$(gh api "repos/$TARGET_REPOSITORY" --jq '.permissions.push // false')"
          test "$can_push" = "true" || { echo "Token does not have push permission on $TARGET_REPOSITORY"; exit 1; }
          echo "[OK] Storage target: $TARGET_REPOSITORY"
          echo "[OK] Token has repository write access"

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Validate gated Hugging Face file access
        id: gated_access
        if: matrix.id == 'flux1-schnell'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_ID: ${{ matrix.model_id }}
          REQUESTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "state=blocked" >> "$GITHUB_OUTPUT"
            echo "[BLOCKED] HF_TOKEN is not configured for gated FLUX.1-schnell; acquisition will remain gated."
            exit 0
          fi
          python - <<'PY'
          import os
          import requests
          from huggingface_hub import HfApi
          model = os.environ["MODEL_ID"]
          revision = os.environ["REQUESTED_REVISION"]
          token = os.environ["HF_TOKEN"]
          HfApi(token=token).model_info(model, revision=revision, files_metadata=False)
          url = f"https://huggingface.co/{model}/resolve/{revision}/text_encoder/model.safetensors"
          response = requests.head(
              url,
              headers={"Authorization": f"Bearer {token}"},
              allow_redirects=True,
              timeout=30,
          )
          if response.status_code in (401, 403):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("state=blocked\n")
              print(f"[BLOCKED] The actual FLUX weight file is not authorized (HTTP {response.status_code}); no release or download will be attempted.")
              raise SystemExit(0)
          if response.status_code >= 400:
              raise SystemExit(f"Weight-file access preflight failed with HTTP {response.status_code}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("state=ready\n")
          print("[OK] Actual gated FLUX weight-file access is authorized.")
          PY

      - name: Mark non-gated jobs as ready
        id: gated_access_default
        if: matrix.id != 'flux1-schnell'
        run: echo "state=ready" >> "$GITHUB_OUTPUT"

      - name: Check both authoritative storage targets
        id: storage_reconciliation
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          OMEGA_PRIMARY_REPOSITORY: lalibimohamed-maker/-dorar-hadith-api-official
          OMEGA_STORAGE_REPOSITORY: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          OMEGA_RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          python scripts/rechercher-omega-storage-reconcile.py

      - name: Check existing Omega Release assets before streaming
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" 2>/dev/null || true)"
          complete="false"
          if [ -n "$json" ]; then
            if python -c 'import json,sys; j=json.loads(sys.argv[1]); assets={x.get("name") for x in j.get("assets",[])}; raise SystemExit(0 if ("release-manifest.json" in assets and any(str(n).startswith("omega__") for n in assets)) else 1)' "$json"; then
              complete="true"
            fi
          fi
          if [ "$complete" = "true" ]; then
            echo "Existing complete Release detected: $RELEASE_TAG"
          else
            echo "Release is not complete; acquisition may proceed: $RELEASE_TAG"
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable revision
        id: revision
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && steps.existing_release.outputs.complete != 'true' && matrix.id != 'hunyuanvideo-1.5' && matrix.id != 'ltx-2' && (matrix.id != 'flux1-schnell' || steps.gated_access.outputs.state == 'ready')
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REQUESTED_REVISION: ${{ matrix.revision }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          info=HfApi().model_info(
              os.environ["MODEL_ID"],
              revision=os.environ["REQUESTED_REVISION"],
              files_metadata=False,
          )
          if not re.fullmatch(r"[0-9a-f]{40}", info.sha):
              raise SystemExit("Requested revision did not resolve to a full immutable SHA")
          print("Resolved revision:", info.sha)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("sha="+info.sha+"\n")
          PY

      - name: Ensure dedicated Release exists
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && steps.existing_release.outputs.complete != 'true' && matrix.id != 'hunyuanvideo-1.5' && matrix.id != 'ltx-2' && (matrix.id != 'flux1-schnell' || steps.gated_access.outputs.state == 'ready')
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          RELEASE_MODE: ${{ matrix.release_mode }}
        run: |
          set -euo pipefail
          RELEASE_MODE="${RELEASE_MODE:-prerelease}"
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
          elif [ "$RELEASE_MODE" = "draft" ]; then
            gh release create "$RELEASE_TAG" --repo "$REPO" --draft --title "$RELEASE_TAG" --notes "Rechercher Omega draft: license/territory review required."
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --prerelease --title "$RELEASE_TAG" --notes "Rechercher Omega prerelease: license terms accompany redistribution."
          fi
          release_id="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId --jq '.databaseId')"
          test -n "$release_id"
          echo "OMEGA_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "[OK] Release ID: $release_id"
      # Acquisition gates: HunyuanVideo-1.5/LTX-2 remain review-only; CogVideoX-2B waits for an explicit runner-readiness repository variable before any weight streaming.
      - name: Stream weights directly into Release
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.id != 'hunyuanvideo-1.5' && matrix.id != 'ltx-2' && (matrix.id != 'cogvideox-2b' || vars.COGVIDEOX_RUNNER_READY == 'true') && (matrix.id != 'flux1-schnell' || steps.gated_access.outputs.state == 'ready')
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          OMEGA_STORAGE_REPOSITORY: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          LICENSE_ID: ${{ matrix.license }}
          CHUNK_BYTES: ${{ matrix.chunk_bytes }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/rechercher-omega-release-stream.py

      - name: Attach SANA-Sprint license from immutable HF revision
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.id == 'sana-sprint-1.6b'
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          path=hf_hub_download(repo_id=os.environ["MODEL_ID"], filename="LICENSE", revision=os.environ["REVISION"])
          print(path)
          with open(path,"rb") as src, open("/tmp/SANA-LICENSE","wb") as dst:
              dst.write(src.read())
          PY
          test -s /tmp/SANA-LICENSE
          gh release upload "$RELEASE_TAG" /tmp/SANA-LICENSE#LICENSE --repo "$REPO" --clobber

      - name: Publish canonical Apache-2.0 license asset
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.license == 'apache-2.0' && matrix.id != 'sana-sprint-1.6b' && (matrix.id != 'flux1-schnell' || steps.gated_access.outputs.state == 'ready')
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          LICENSE_ASSET: ${{ matrix.license_asset }}
          LICENSE_URL: ${{ matrix.license_url }}
        run: |
          set -euo pipefail
          test -n "${LICENSE_URL:-}"
          curl --fail --location --retry 3 --silent --show-error "$LICENSE_URL" -o "${RUNNER_TEMP}/$LICENSE_ASSET"
          test -s "${RUNNER_TEMP}/$LICENSE_ASSET"
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/$LICENSE_ASSET#$LICENSE_ASSET" --repo "$REPO" --clobber

      - name: Build SANA-Sprint 1.6B runtime metadata
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.id == 'sana-sprint-1.6b'
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/sana-sprint16-runtime
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR/runtime-files"
          python - <<'PY'
          import os, json
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          model=os.environ["MODEL_ID"]; revision=os.environ["REVISION"]
          out=Path(os.environ["OUTPUT_DIR"])
          downloaded=[]
          for name in ["README.md","config.json",".gitattributes"]:
              try:
                  src=Path(hf_hub_download(repo_id=model, filename=name, revision=revision))
                  (out/"runtime-files"/name).write_bytes(src.read_bytes())
                  downloaded.append(name)
              except Exception as exc:
                  print(f"[INFO] optional runtime file {name} unavailable: {exc}")
          deps=[
            {"id":"gemma-2-2b-it","model_id":"google/gemma-2-2b-it","required":True,"embedded":False,"status":"clearance_required"},
            {"id":"dc-ae","model_id":"mit-han-lab/dc-ae-lite-f32c32-sana-1.1-diffusers","required":False,"embedded":False,"status":"optional_acceleration_dependency"}
          ]
          readiness={
            "logical_id":"sana-sprint-1.6b",
            "status":"dependency_blocked",
            "weights_acquired":True,
            "weights_release_manifest":"release-manifest.json",
            "runtime":"diffusers:SanaSprintPipeline",
            "resolution":"1024px",
            "recommended_steps":[1,2],
            "max_steps":4,
            "dtype":"bfloat16",
            "runtime_dependency_required":"google/gemma-2-2b-it",
            "runtime_dependency_embedded":False,
            "reason":"SANA-Sprint requires Gemma2-2B-IT as its fixed pretrained text encoder; no bypass or unlicensed redistribution is attempted.",
            "runtime_files":downloaded
          }
          (out/"sana-sprint16-dependencies.json").write_text(json.dumps(deps,indent=2)+"\n")
          (out/"sana-sprint16-release-readiness.json").write_text(json.dumps(readiness,indent=2)+"\n")
          PY
          tar -C "$OUTPUT_DIR/runtime-files" -czf "$OUTPUT_DIR/sana-sprint16-runtime-files.tar.gz" .
          test -s "$OUTPUT_DIR/sana-sprint16-runtime-files.tar.gz"

      - name: Publish SANA-Sprint runtime metadata
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.id == 'sana-sprint-1.6b'
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/sana-sprint16-runtime
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/sana-sprint16-runtime-files.tar.gz" \
            "$OUTPUT_DIR/sana-sprint16-dependencies.json" \
            "$OUTPUT_DIR/sana-sprint16-release-readiness.json" \
            --repo "$REPO" --clobber

      - name: Attach LTX-2 license from the immutable HF model revision
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          LICENSE_ASSET: ${{ matrix.license_asset }}
          LICENSE_SOURCE_REPO: ${{ matrix.license_source_repo }}
          LICENSE_SOURCE_COMMIT: ${{ matrix.license_source_commit }}
          LICENSE_SOURCE_PATH: ${{ matrix.license_source_path }}
        run: |
          set -euo pipefail
          license="${RUNNER_TEMP}/${LICENSE_ASSET}"
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/${LICENSE_SOURCE_REPO}/${LICENSE_SOURCE_COMMIT}/${LICENSE_SOURCE_PATH}"             -o "$license"
          test -s "$license"
          gh release upload "$RELEASE_TAG" "$license" --repo "$REPO" --clobber

      - name: Normalize Hunyuan license assets
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            case "$name" in
              tmp.*)
                echo "Removing obsolete temporary license/notice asset: $name"
                gh release delete-asset "$RELEASE_TAG" "$name" --repo "$REPO" --yes
                ;;
            esac
          done < <(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name')

      - name: Attach Hunyuan license and notice with canonical names
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/Tencent-Hunyuan/HunyuanVideo-1.5/60783e704160023913bee78f0b47036d393d4dfa/LICENSE"             -o "${RUNNER_TEMP}/LICENSE"
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/Tencent-Hunyuan/HunyuanVideo-1.5/60783e704160023913bee78f0b47036d393d4dfa/NOTICE"             -o "${RUNNER_TEMP}/NOTICE"
          test -s "${RUNNER_TEMP}/LICENSE"
          test -s "${RUNNER_TEMP}/NOTICE"
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/LICENSE" "${RUNNER_TEMP}/NOTICE" --repo "$REPO" --clobber

      - name: Build HunyuanVideo 1.5 runtime bundle
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
          SOURCE_REPO: Tencent-Hunyuan/HunyuanVideo-1.5
          SOURCE_COMMIT: 60783e704160023913bee78f0b47036d393d4dfa
          OUTPUT_DIR: ${{ runner.temp }}/hunyuanvideo15-runtime
          CONFIG_PATH: ${{ github.workspace }}/config/rechercher-omega-hunyuanvideo15-runtime.json
        run: |
          set -euo pipefail
          python scripts/rechercher-omega-hunyuan-runtime.py

      - name: Publish HunyuanVideo 1.5 runtime bundle
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/hunyuanvideo15-runtime
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG"             "$OUTPUT_DIR/omega__hunyuanvideo15__runtime.tar.gz"             "$OUTPUT_DIR/hunyuanvideo15-runtime-manifest.json"             "$OUTPUT_DIR/hunyuanvideo15-dependencies.json"             "$OUTPUT_DIR/hunyuanvideo15-release-readiness.json"             --repo "$REPO" --clobber

      - name: Record SANA 2K/4K runtime dependency metadata
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && (matrix.id == 'sana-1600m-2k' || matrix.id == 'sana-1600m-4k')
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/sana-runtime-dependencies.json" <<JSON
          {
            "model_id": "$MODEL_ID",
            "revision": "$REVISION",
            "license": "Apache-2.0",
            "runtime_status": "dependency_blocked",
            "required_external_dependency": "google/gemma-2-2b-it",
            "embedded": false,
            "reason": "The SANA 2K/4K model card identifies Gemma2-2B-IT as a fixed pretrained text encoder; no dependency redistribution or bypass is attempted."
          }
          JSON
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/sana-runtime-dependencies.json" --repo "$REPO" --clobber

      # release-manifest.json is a weights-only manifest; it never declares runtime completeness.
      - name: Verify Release manifest after acquisition
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && matrix.id != 'hunyuanvideo-1.5' && matrix.id != 'ltx-2' && (matrix.id != 'cogvideox-2b' || vars.COGVIDEOX_RUNNER_READY == 'true') && (matrix.id != 'flux1-schnell' || steps.gated_access.outputs.state == 'ready')
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "release-manifest.json"
          echo "[OK] Weights manifest exists for $RELEASE_TAG"
      - name: Verify Hunyuan runtime completeness
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          VERIFY_DIR: ${{ runner.temp }}/hunyuanvideo15-verify
        run: |
          set -euo pipefail
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          assets="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          for required in             "release-manifest.json"             "LICENSE"             "NOTICE"             "omega__hunyuanvideo15__runtime.tar.gz"             "hunyuanvideo15-runtime-manifest.json"             "hunyuanvideo15-dependencies.json"             "hunyuanvideo15-release-readiness.json"
          do
            grep -Fxq "$required" <<<"$assets" || { echo "Missing Release asset: $required"; exit 1; }
          done
          if grep -Eq '^tmp\.' <<<"$assets"; then
            echo "Temporary license/notice assets remain in Hunyuan Release"
            exit 1
          fi
          gh release download "$RELEASE_TAG"             --repo "$REPO"             --pattern "hunyuanvideo15-release-readiness.json"             --dir "$VERIFY_DIR"
          status="$(python3 -c "import json; print(json.load(open('$VERIFY_DIR/hunyuanvideo15-release-readiness.json'))['status'])")"
          test "$status" = "dependency_blocked"
          echo "[OK] Runtime completeness gate passed: core packaged, runnable state explicitly blocked by declared external dependencies."

      - name: Enforce runtime completeness semantics
        if: steps.storage_reconciliation.outputs.complete_anywhere != 'true' && false
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: ${{ env.RECHERCHER_OMEGA_STORAGE_REPOSITORY }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          test -n "$(grep -Fx "hunyuanvideo15-release-readiness.json" <<<"$assets")"
          echo "[OK] release-manifest.json is not the runtime completeness signal"

      - name: Record blocked gated model state
        if: matrix.id == 'flux1-schnell' && steps.gated_access.outputs.state == 'blocked'
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/flux1-schnell-access-state.json" <<'JSON'
          {
            "model_id": "black-forest-labs/FLUX.1-schnell",
            "status": "blocked",
            "reason": "Hugging Face gated-access authorization is unavailable to this runtime.",
            "download_attempted": false,
            "release_promotion": false,
            "next_action": "obtain_authorized_model_access_and_rerun",
            "rights_required": true
          }
          JSON

      - name: Upload blocked gated model state
        if: matrix.id == 'flux1-schnell' && steps.gated_access.outputs.state == 'blocked'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-flux1-schnell-access-state
          path: ${{ runner.temp }}/flux1-schnell-access-state.json
          if-no-files-found: error

