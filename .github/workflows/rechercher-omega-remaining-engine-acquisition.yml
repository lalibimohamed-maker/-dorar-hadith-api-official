name: Rechercher Ω — acquire remaining engine fleet

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-remaining-engine-releases.json"
      - ".github/workflows/rechercher-omega-remaining-engine-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped upload of model binaries to dedicated Releases. No Git source or Corpus writes.
# Hunyuan/LTX use draft releases pending license review. FLUX is gated and is not downloaded.

concurrency:
  group: rechercher-omega-remaining-engine-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: cosyvoice2-0.5b
            model_id: FunAudioLLM/CosyVoice2-0.5B
            revision: eec1ae6c79877dbd9379285cf8789c9e0879293d
            release_tag: rechercher-omega-cosyvoice2-0.5b-v1.0.0
            license: apache-2.0
          - id: qwen3-vl
            model_id: Qwen/Qwen3-VL-4B-Instruct
            revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
            release_tag: rechercher-omega-qwen3-vl-v1.0.0
            license: apache-2.0
          - id: cogvideox-2b
            model_id: zai-org/CogVideoX-2b
            revision: 1137dacfc2c9c012bed6a0793f4ecf2ca8e7ba01
            release_tag: rechercher-omega-cogvideox2b-v1.0.0
            license: apache-2.0
          - id: wan2.2-ti2v-5b
            model_id: Wan-AI/Wan2.2-TI2V-5B
            revision: 37685f96025fc1425edccdd4b2bca3836ae917ff
            release_tag: rechercher-omega-wan22-ti2v5b-v1.0.0
            license: apache-2.0
          - id: qwen3-omni
            model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
            revision: 12a3ac6661e685620bbc6616b7217b26469a81dd
            release_tag: rechercher-omega-qwen3-omni-v1.0.0
            license: apache-2.0
          - id: hunyuanvideo-1.5
            model_id: tencent/HunyuanVideo-1.5
            revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
            release_tag: rechercher-omega-hunyuanvideo15-v1.0.0
            license: tencent-hunyuan-community
          - id: ltx-2
            model_id: Lightricks/LTX-2
            revision: dfcc210
            release_tag: rechercher-omega-ltx2-v1.0.0
            license: ltx-2-community-license-agreement

    steps:
      - name: Verify GitHub CLI
        run: gh --version

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Resolve immutable revision
        id: revision
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REQUESTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"], revision=os.environ["REQUESTED_REVISION"], files_metadata=False)
          sha=info.sha
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Revision was not resolved to a full SHA")
          print("Resolved revision:", sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("sha="+sha+"\n")
          PY

      - name: Download and publish model files with HTTP Range streaming
        env:
          GH_TOKEN: \${{ github.token }}
          MODEL_ID: \${{ matrix.model_id }}
          REVISION: \${{ steps.revision.outputs.sha }}
          RELEASE_TAG: \${{ matrix.release_tag }}
          LICENSE_ID: \${{ matrix.license }}
          WORKDIR: \${{ runner.temp }}/omega-range
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          from urllib.parse import quote
          from huggingface_hub import HfApi

          model=os.environ["MODEL_ID"]
          revision=os.environ["REVISION"]
          tag=os.environ["RELEASE_TAG"]
          work=Path(os.environ["WORKDIR"])

          allowed={".safetensors",".bin",".pt",".pth",".onnx",".json",".txt",".md",".yaml",".yml",".py",".model"}
          skip={".png",".jpg",".jpeg",".webp",".gif",".mp4",".wav",".mp3",".flac",".pdf",".zip"}

          info=HfApi().model_info(model,revision=revision,files_metadata=True)
          files=[]
          for sibling in info.siblings:
              name=sibling.rfilename
              suffix=Path(name).suffix.lower()
              base=Path(name).name
              if base==".gitattributes" or suffix in skip:
                  continue
              if suffix in allowed or base.upper() in {"LICENSE","NOTICE"}:
                  files.append((name,int(sibling.size or 0)))
          files.sort()

          chunk_size=1536*1024*1024
          records=[]
          for filename, expected_size in files:
              safe=re.sub(r"[^A-Za-z0-9._-]+","__",filename.replace("/","__"))
              url="https://huggingface.co/"+model+"/resolve/"+revision+"/"+quote(filename,safe="/")+"?download=true"
              total=0
              digest=hashlib.sha256()
              parts=[]

              for start in range(0,expected_size,chunk_size):
                  end=min(expected_size-1,start+chunk_size-1)
                  need=end-start+1
                  part_name="omega__"+safe
                  if expected_size > chunk_size:
                      part_name += ".part-"+f"{len(parts):04d}"
                  chunk=work/part_name

                  subprocess.run([
                      "curl","--fail","--location","--retry","5","--retry-all-errors",
                      "--connect-timeout","30","--max-time","3600",
                      "--header","Accept: application/octet-stream",
                      "--range",f"{start}-{end}",
                      "--output",str(chunk),url
                  ],check=True)

                  actual=chunk.stat().st_size
                  if actual != need:
                      raise SystemExit(f"Range mismatch for {filename}: expected {need}, got {actual}")

                  with chunk.open("rb") as fh:
                      while True:
                          data=fh.read(8*1024*1024)
                          if not data:
                              break
                          digest.update(data)
                  total += actual

                  subprocess.run(["gh","release","upload",tag,str(chunk),"--clobber"],check=True)
                  parts.append(part_name)
                  chunk.unlink()

              if total != expected_size:
                  raise SystemExit(f"Size mismatch for {filename}: expected {expected_size}, got {total}")

              records.append({
                  "source_path":filename,
                  "bytes":total,
                  "sha256":digest.hexdigest(),
                  "release_assets":parts
              })

          manifest={
              "schema_version":"1.0.0",
              "model_id":model,
              "revision":revision,
              "license":os.environ["LICENSE_ID"],
              "transport":"http_range_streaming",
              "chunk_bytes":chunk_size,
              "files":records
          }
          out=work/"release-manifest.json"
          out.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          subprocess.run(["gh","release","upload",tag,str(out),"--clobber"],check=True)
          PY

      - name: Verify Release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,url,assets
