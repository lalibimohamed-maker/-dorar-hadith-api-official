name: Rechercher Ω — acquire remaining engine fleet

on:
  # Every push to this acquisition branch is an explicit continuation trigger.
  # Path filters are intentionally avoided so a recovery/fix commit cannot
  # leave the fleet idle after a failed acquisition attempt.
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - synchronize

run-name: Rechercher Omega — acquire/resume remaining engine fleet

# review-only-storage-boundary-2026-10: HunyuanVideo-1.5 and LTX-2 weights already exist in private Omega engine storage. No automated acquisition, release creation, license attachment, runtime packaging, or promotion is allowed until license review clears.

# storage-target-enforced: private Rechercher Omega engine storage via dedicated GitHub Releases

# continuation-touch: trigger an explicit acquisition continuation after the repair.

# network-write-justification: publishes immutable model acquisition assets to dedicated GitHub Releases; no repository files are written.
permissions:
  contents: read

# security-justification: publishes immutable, license-cleared model artifacts to dedicated GitHub Releases; no model bytes are committed to git or Corpus.

concurrency:
  group: rechercher-omega-remaining-engine-acquisition
  # Keep long-running model acquisitions queued instead of cancelling matrix jobs on a newer push.
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number == 566 }}
    name: ${{ matrix.id }}
    env:
      RECHERCHER_OMEGA_STORAGE_REPOSITORY: lalibimohamed-maker/rechercher-omega-engine-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
