name: Rechercher Ω — acquire remaining engine fleet

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-remaining-engine-releases.json"
      - ".github/workflows/rechercher-omega-remaining-engine-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped upload of model binaries to dedicated Releases. No Git source or Corpus writes.
# Hunyuan/LTX use draft releases pending license review. FLUX is gated and is not downloaded.

concurrency:
  group: rechercher-omega-remaining-engine-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: cosyvoice2-0.5b
            model_id: FunAudioLLM/CosyVoice2-0.5B
            revision: eec1ae6c79877dbd9379285cf8789c9e0879293d
            release_tag: rechercher-omega-cosyvoice2-0.5b-v1.0.0
            license: apache-2.0
          - id: qwen3-vl
            model_id: Qwen/Qwen3-VL-4B-Instruct
            revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
            release_tag: rechercher-omega-qwen3-vl-v1.0.0
            license: apache-2.0
          - id: cogvideox-2b
            model_id: zai-org/CogVideoX-2b
            revision: 1137dacfc2c9c012bed6a0793f4ecf2ca8e7ba01
            release_tag: rechercher-omega-cogvideox2b-v1.0.0
            license: apache-2.0
          - id: wan2.2-ti2v-5b
            model_id: Wan-AI/Wan2.2-TI2V-5B
            revision: 37685f96025fc1425edccdd4b2bca3836ae917ff
            release_tag: rechercher-omega-wan22-ti2v5b-v1.0.0
            license: apache-2.0
          - id: qwen3-omni
            model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
            revision: 12a3ac6661e685620bbc6616b7217b26469a81dd
            release_tag: rechercher-omega-qwen3-omni-v1.0.0
            license: apache-2.0
          - id: hunyuanvideo-1.5
            model_id: tencent/HunyuanVideo-1.5
            revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
            release_tag: rechercher-omega-hunyuanvideo15-v1.0.0
            license: tencent-hunyuan-community
          - id: ltx-2
            model_id: Lightricks/LTX-2
            revision: dfcc210
            release_tag: rechercher-omega-ltx2-v1.0.0
            license: ltx-2-community-license-agreement

    steps:
      - name: Verify GitHub CLI
        run: gh --version

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Resolve immutable revision
        id: revision
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REQUESTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"], revision=os.environ["REQUESTED_REVISION"], files_metadata=False)
          sha=info.sha
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Revision was not resolved to a full SHA")
          print("Resolved revision:", sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("sha="+sha+"\n")
          PY

      - name: Download and publish weight files with disk-safe policy
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          LICENSE_ID: ${{ matrix.license }}
          WORKDIR: ${{ runner.temp }}/omega-weight-release
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/source"

          python3 - <<'PY' > "$WORKDIR/files.txt"
          from huggingface_hub import HfApi
          import os
          from pathlib import Path
          info=HfApi().model_info(os.environ["MODEL_ID"],revision=os.environ["REVISION"],files_metadata=False)
          allowed_weights={".safetensors",".bin",".pt",".pth",".onnx"}
          names=[]
          for name in info.siblings:
              p=Path(name.rfilename)
              if p.suffix.lower() in allowed_weights or p.name == "model.safetensors.index.json" or p.name.endswith(".index.json") or p.name in {"config.json","configuration.json","generation_config.json"}:
                  names.append(name.rfilename)
          for name in sorted(set(names)):
              print(name)
          PY

          MAX_SOURCE_FILE_BYTES=$((7*1024*1024*1024))
          : > "$WORKDIR/manifest.tsv"
          : > "$WORKDIR/deferred.tsv"

          while IFS= read -r source_path; do
            [ -n "$source_path" ] || continue
            echo "=== $source_path ==="

            remote_meta=$(python3 - "$source_path" <<'PY'
          import sys, os
          from pathlib import Path
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"],revision=os.environ["REVISION"],files_metadata=True)
          target=sys.argv[1]
          for s in info.siblings:
              if s.rfilename == target:
                  print(int(s.size or 0)); break
          else: print(0)
          PY
            )
            if [ "$remote_meta" -gt "$MAX_SOURCE_FILE_BYTES" ]; then
              printf '%s\t%s\n' "$source_path" "$remote_meta" >> "$WORKDIR/deferred.tsv"
              echo "DEFERRED: source file exceeds 7 GiB runner safety limit"
              continue
            fi

            rm -rf "$WORKDIR/source"
            mkdir -p "$WORKDIR/source"
            hf download "$MODEL_ID" "$source_path" --revision "$REVISION" --local-dir "$WORKDIR/source"
            file="$WORKDIR/source/$source_path"
            test -s "$file"
            actual_size="$(stat -c '%s' "$file")"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            safe="$(printf '%s' "$source_path" | sed 's#[^A-Za-z0-9._-]#__#g')"
            assets=""

            if [ "$actual_size" -lt 2147483647 ]; then
              asset="$WORKDIR/omega__$safe"
              cp "$file" "$asset"
              upload_url="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".upload_url" | sed "s/{?name,label}//")"
              gh api --method POST "$upload_url?name=$(basename "$asset")" --header "Content-Type: application/octet-stream" --input "$asset" >/dev/null
              assets="$(basename "$asset")"
              rm -f "$asset"
            else
              chunk_bytes=$((1536*1024*1024))
              offset=0
              part=0
              while [ "$offset" -lt "$actual_size" ]; do
                remaining=$((actual_size-offset))
                count="$chunk_bytes"
                if [ "$remaining" -lt "$count" ]; then count="$remaining"; fi
                skip_mb=$((offset/1048576))
                count_mb=$(((count+1048575)/1048576))
                chunk="$WORKDIR/omega__$safe.part-$(printf '%04d' "$part")"
                dd if="$file" of="$chunk" bs=1M skip="$skip_mb" count="$count_mb" iflag=fullblock status=none
                if [ "$(stat -c '%s' "$chunk")" -gt "$count" ]; then truncate -s "$count" "$chunk"; fi
                test "$(stat -c '%s' "$chunk")" -lt 2147483647
                upload_url="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".upload_url" | sed "s/{?name,label}//")"
                gh api --method POST "$upload_url?name=$(basename "$chunk")" --header "Content-Type: application/octet-stream" --input "$chunk" >/dev/null
                name="$(basename "$chunk")"
                if [ -n "$assets" ]; then assets="$assets,$name"; else assets="$name"; fi
                rm -f "$chunk"
                offset=$((offset+count))
                part=$((part+1))
              done
            fi

            printf '%s\t%s\t%s\t%s\n' "$source_path" "$actual_size" "$digest" "$assets" >> "$WORKDIR/manifest.tsv"
            rm -f "$file"
          done < "$WORKDIR/files.txt"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ["WORKDIR"])
          rows=[]
          for line in (work/"manifest.tsv").read_text().splitlines():
              source,size,sha,assets=line.split("\t",3)
              rows.append({"source_path":source,"bytes":int(size),"sha256":sha,"release_assets":assets.split(",")})
          deferred=[]
          for line in (work/"deferred.tsv").read_text().splitlines():
              if line: source,size=line.split("\t",1); deferred.append({"source_path":source,"bytes":int(size),"reason":"runner_storage_safety_limit_7GiB"})
          payload={"schema_version":"1.0.0","model_id":os.environ["MODEL_ID"],"revision":os.environ["REVISION"],"license":os.environ["LICENSE_ID"],"transport":"huggingface_hub_download","files":rows,"deferred":deferred}
          (work/"release-manifest.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          PY

          upload_url="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".upload_url" | sed "s/{?name,label}//")"
          gh api --method POST "$upload_url?name=release-manifest.json" --header "Content-Type: application/json" --input "$WORKDIR/release-manifest.json" >/dev/null
      - name: Verify Release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,url,assets
