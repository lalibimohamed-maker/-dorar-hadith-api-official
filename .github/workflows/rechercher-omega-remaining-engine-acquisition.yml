name: Rechercher Ω — acquire remaining engine fleet

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-remaining-engine-releases.json"
      - ".github/workflows/rechercher-omega-remaining-engine-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped upload of model binaries to dedicated Releases. No Git source or Corpus writes.
# Community-license models are draft-only. Gated FLUX is intentionally excluded.
# Large files are streamed from Hugging Face to GitHub Releases and never stored as complete files on the runner.

concurrency:
  group: rechercher-omega-remaining-engine-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: qwen3-vl
            model_id: Qwen/Qwen3-VL-4B-Instruct
            revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
            release_tag: rechercher-omega-qwen3-vl-v1.0.0
            license: apache-2.0
          - id: cosyvoice2-0.5b
            model_id: FunAudioLLM/CosyVoice2-0.5B
            revision: eec1ae6c79877dbd9379285cf8789c9e0879293d
            release_tag: rechercher-omega-cosyvoice2-0.5b-v1.0.0
            license: apache-2.0
          - id: cogvideox-2b
            model_id: zai-org/CogVideoX-2b
            revision: 1137dacfc2c9c012bed6a0793f4ecf2ca8e7ba01
            release_tag: rechercher-omega-cogvideox2b-v1.0.0
            license: apache-2.0
          - id: wan2.2-ti2v-5b
            model_id: Wan-AI/Wan2.2-TI2V-5B
            revision: 37685f96025fc1425edccdd4b2bca3836ae917ff
            release_tag: rechercher-omega-wan22-ti2v5b-v1.0.0
            license: apache-2.0
          - id: qwen3-omni
            model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
            revision: 12a3ac6661e685620bbc6616b7217b26469a81dd
            release_tag: rechercher-omega-qwen3-omni-v1.0.0
            license: apache-2.0
          - id: hunyuanvideo-1.5
            model_id: tencent/HunyuanVideo-1.5
            revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
            release_tag: rechercher-omega-hunyuanvideo15-v1.0.0
            license: tencent-hunyuan-community
          - id: ltx-2
            model_id: Lightricks/LTX-2
            revision: dfcc210
            release_tag: rechercher-omega-ltx2-v1.0.0
            license: ltx-2-community-license-agreement

    steps:
      - name: Verify GitHub CLI
        run: gh --version

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Resolve immutable revision
        id: revision
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REQUESTED_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"], revision=os.environ["REQUESTED_REVISION"], files_metadata=False)
          sha=info.sha
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Revision was not resolved to a full SHA")
          print("Resolved revision:", sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("sha="+sha+"\n")
          PY

      - name: Stream model files as 512 MiB resumable Release parts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ steps.revision.outputs.sha }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          LICENSE_ID: ${{ matrix.license }}
          WORKDIR: ${{ runner.temp }}/omega-stream
        run: |
          set -euo pipefail
          CHUNK_BYTES=$((512*1024*1024))
          MAX_ASSET_BYTES=2147483647
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          existing="$(gh api "/repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.assets[].name' 2>/dev/null || true)"
          if grep -Fxq "release-manifest.json" <<< "$existing"; then
            echo "Release already has a verified manifest; no duplicate download for $MODEL_ID."
            exit 0
          fi

          python3 - <<'PY' > "$WORKDIR/files.tsv"
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"],revision=os.environ["REVISION"],files_metadata=True)
          allowed={".safetensors",".bin",".pt",".pth",".onnx"}
          selected=[]
          release_assets=0
          chunk=512*1024*1024
          for s in sorted(info.siblings,key=lambda x:x.rfilename):
              name=s.rfilename
              p=Path(name)
              if p.suffix.lower() not in allowed and p.name != "model.safetensors.index.json" and not p.name.endswith(".index.json"):
                  continue
              size=int(s.size or 0)
              if size <= 0:
                  continue
              parts=(size+chunk-1)//chunk
              release_assets += parts
              selected.append((name,size))
          if release_assets > 1000:
              raise SystemExit(f"Release asset budget exceeded: {release_assets}")
          for name,size in selected:
              print(name+"\t"+str(size))
          PY

          : > "$WORKDIR/manifest.tsv"

          while IFS=$'\t' read -r source_path source_size; do
            [ -n "$source_path" ] || continue
            safe="$(printf '%s' "$source_path" | sed 's#[^A-Za-z0-9._-]#__#g')"
            parts=$(( (source_size + CHUNK_BYTES - 1) / CHUNK_BYTES ))

            for ((part=0; part<parts; part++)); do
              start_byte=$((part * CHUNK_BYTES))
              end_byte=$((start_byte + CHUNK_BYTES - 1))
              if [ "$end_byte" -ge "$source_size" ]; then end_byte=$((source_size - 1)); fi
              length=$((end_byte - start_byte + 1))
              if [ "$parts" -eq 1 ]; then
                asset_name="omega__$safe"
              else
                asset_name="omega__${safe}.part-$(printf '%04d' "$part")"
              fi

              if grep -Fxq "$asset_name" <<< "$existing"; then
                echo "Already published: $asset_name"
                printf '%s\t%s\t%s\t%s\n' "$source_path" "$source_size" "$part" "$asset_name" >> "$WORKDIR/manifest.tsv"
                continue
              fi

              encoded_path="$(python3 - "$source_path" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe="/"))
          PY
              )"
              source_url="https://huggingface.co/$MODEL_ID/resolve/$REVISION/$encoded_path?download=true"
              chunk_file="$WORKDIR/$asset_name"

              echo "Downloading range $start_byte-$end_byte from $source_path"
              curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 3600 \
                -H "Range: bytes=$start_byte-$end_byte" \
                -o "$chunk_file" "$source_url"
              test -s "$chunk_file"
              actual="$(stat -c '%s' "$chunk_file")"
              test "$actual" -eq "$length"
              test "$actual" -lt "$MAX_ASSET_BYTES"

              upload_url="$(gh api "/repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.upload_url' | sed 's/{?name,label}//')"
              echo "Uploading $asset_name ($actual bytes)"
              curl --fail-with-body --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 3600 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$chunk_file" \
                "$upload_url?name=$asset_name"

              printf '%s\t%s\t%s\t%s\n' "$source_path" "$source_size" "$part" "$asset_name" >> "$WORKDIR/manifest.tsv"
              rm -f "$chunk_file"
              existing="$existing"$'\n'"$asset_name"
            done
          done < "$WORKDIR/files.tsv"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ["WORKDIR"])
          rows=[]
          for line in (work/"manifest.tsv").read_text().splitlines():
              if line:
                  source,size,part,asset=line.split("\t",3)
                  rows.append({"source_path":source,"source_bytes":int(size),"part":int(part),"release_asset":asset})
          payload={"schema_version":"1.0.0","model_id":os.environ["MODEL_ID"],"revision":os.environ["REVISION"],"license":os.environ["LICENSE_ID"],"transport":"huggingface_http_range_to_github_release","chunk_bytes":512*1024*1024,"files":rows}
          (work/"release-manifest.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          PY

          upload_url="$(gh api "/repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.upload_url' | sed 's/{?name,label}//')"
          curl --fail-with-body --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            --data-binary "@$WORKDIR/release-manifest.json" \
            "$upload_url?name=release-manifest.json"
      - name: Verify Release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          manifest_name="release-manifest.json"
          if ! gh api "/repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.assets[].name' | grep -Fxq "$manifest_name"; then
            echo "Missing release manifest for $RELEASE_TAG"
            exit 1
          fi
          echo "Verified manifest asset in $RELEASE_TAG"
