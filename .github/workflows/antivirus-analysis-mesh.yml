name: Free Antivirus Analysis Mesh

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antivirus-analysis-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clamav:
    name: ClamAV malware scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav clamav-daemon

      - name: Refresh ClamAV signatures
        run: sudo freshclam --stdout

      - name: Scan repository
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/security
          clamscan --recursive --infected \
            --exclude-dir='^./.git$' \
            --exclude-dir='^./node_modules$' \
            --exclude-dir='^./artifacts/security$' \
            . | tee artifacts/security/clamav.txt

      - name: Preserve ClamAV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-clamav
          path: artifacts/security/clamav.txt
          if-no-files-found: ignore
          retention-days: 14

  yara:
    name: YARA malware-pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install YARA and helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yara unzip
          mkdir -p security-rules artifacts/security

      - name: Download curated YARA Forge core rules
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            -o security-rules/yara-forge-rules-core.zip \
            https://github.com/YARAHQ/yara-forge/releases/download/20260726/yara-forge-rules-core.zip
          unzip -q security-rules/yara-forge-rules-core.zip -d security-rules
          test -s security-rules/packages/core/yara-rules-core.yar

      - name: Run YARA core rules
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/security
          yara -w -r security-rules/packages/core/yara-rules-core.yar . > artifacts/security/yara.txt 2>&1
          rc=$?
          if [ -s artifacts/security/yara.txt ]; then
            echo "YARA produced detections or diagnostics. Review the report before changing source content."
            cat artifacts/security/yara.txt
          fi
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

      - name: Preserve YARA report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-yara
          path: artifacts/security/yara.txt
          if-no-files-found: ignore
          retention-days: 14

  trivy:
    name: Trivy vulnerability, misconfiguration and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trivy repository shield
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: repo
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table

  gitleaks:
    name: Gitleaks secret-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full Git history
        run: |
          mkdir -p artifacts/security
          gitleaks git --redact --report-format sarif --report-path artifacts/security/gitleaks.sarif .

      - name: Preserve Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gitleaks
          path: artifacts/security/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependency tree
        run: npm audit --audit-level=high
