name: Rechercher Omega — live Redis adapter verification
on:
  push:
    branches: [feat/rechercher-omega-multimodal-intelligence]
    paths:
      - src/rechercher-omega-redis-memory.js
      - test/rechercher-omega-redis-live.integration.test.js
      - runtime/redis/docker-compose.yml
      - .github/workflows/rechercher-omega-redis-live.yml
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Start Redis
        run: docker compose -f runtime/redis/docker-compose.yml up -d
      - name: Wait for Redis
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            cid="$(docker ps -qf name=redis-1)"
            if [ -n "$cid" ] && docker exec "$cid" redis-cli ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real adapter round trip
        run: node --test test/rechercher-omega-redis-live.integration.test.js
      - name: Shutdown
        if: always()
        run: docker compose -f runtime/redis/docker-compose.yml down -v
