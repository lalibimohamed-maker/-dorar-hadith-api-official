name: Rechercher Omega — GraphRAG and Memory Integration
on:
  push:
    branches: [feat/rechercher-omega-multimodal-intelligence]
    paths:
      - src/rechercher-omega-graphrag-runtime.js
      - src/rechercher-omega-qdrant.js
      - src/rechercher-omega-redis-memory.js
      - test/rechercher-omega-graphrag-runtime.test.js
      - test/rechercher-omega-redis-memory*.test.js
      - runtime/redis/docker-compose.yml
      - .github/workflows/rechercher-omega-graphrag-memory-integration.yml
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: GraphRAG deterministic integration
        run: node --test test/rechercher-omega-graphrag-runtime.test.js test/rechercher-omega-redis-memory.unit.test.js test/rechercher-omega-redis-memory.integration.test.js
