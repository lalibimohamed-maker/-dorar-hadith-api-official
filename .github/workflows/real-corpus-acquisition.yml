          set -euo pipefail
          mkdir -p artifacts/waqfeya-books/pdf
          jq -c '.books[] | select(.download != "")' artifacts/waqfeya-books/manifest.json | while read -r book; do
            id="$(jq -r '.id' <<<"$book")"
            url="$(jq -r '.download' <<<"$book")"
            echo "Downloading $id"
            curl --fail --location --silent --show-error --retry 5 --connect-timeout 30 --max-time 900 "$url" \
              -o "artifacts/waqfeya-books/pdf/${id}.pdf"
            test -s "artifacts/waqfeya-books/pdf/${id}.pdf"
          done
          find artifacts/waqfeya-books/pdf -type f -printf '%f %s bytes\n' | sort

