name: Real Corpus Acquisition
# security-justification: contents: write is required only to commit verified machine-readable corpus artifacts back to this dedicated feature branch; the protected main branch is never updated by this workflow.
# rechercher-trigger: re-run governed Waqfeya harvest without changing the verified 15-book manifest.

on:
  push:
    branches: [feat/real-corpus-acquisition-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    name: Acquire licensed Quran and Arabic hadith corpus
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Acquire real Quran and Arabic hadith corpus
        run: node scripts/real-corpus-acquire.mjs
      - name: Verify acquired corpus artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s data/corpus/quran/quran-uthmani.txt
          test -s data/corpus/acquisition-state-2026.json
          test -s data/corpus/hadith/catalog-2026.json
          test -d data/corpus/hadith/collections
          collection_count="$(find data/corpus/hadith/collections -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$collection_count" -ge 10
          wc -l -c data/corpus/quran/quran-uthmani.txt
          echo "Hadith collection files: $collection_count"
          wc -c data/corpus/hadith/catalog-2026.json
      - name: Commit acquired corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus
          if git diff --cached --quiet; then echo 'No corpus changes to commit.'; exit 0; fi
          git commit -m 'data(corpus): materialize licensed Quran and Arabic hadith corpus'
          git push origin HEAD:feat/real-corpus-acquisition-2026

  quran-manuscripts:
    name: Preserve public-domain Quran manuscript evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Discover public-domain Quran manuscripts from The Met Open Access API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/quran-manuscripts
          curl --fail --silent --show-error --retry 4 'https://collectionapi.metmuseum.org/public/collection/v1/search?q=Qur%27an%20Manuscript&hasImages=true' -o artifacts/quran-manuscripts/search.json
          jq -r '.objectIDs[]?' artifacts/quran-manuscripts/search.json | head -n 250 > artifacts/quran-manuscripts/object-ids.txt
          : > artifacts/quran-manuscripts/manifest.jsonl
          while IFS= read -r object_id; do
            curl --fail --silent --show-error --retry 4 "https://collectionapi.metmuseum.org/public/collection/v1/objects/${object_id}" -o "artifacts/quran-manuscripts/object-${object_id}.json"
            jq -c 'select(.isPublicDomain == true and (.primaryImage != "" or ((.additionalImages // []) | length > 0))) | {objectID,accessionNumber,title,objectDate,culture,department,isPublicDomain,primaryImage,additionalImages,objectURL}' "artifacts/quran-manuscripts/object-${object_id}.json" >> artifacts/quran-manuscripts/manifest.jsonl || true
          done < artifacts/quran-manuscripts/object-ids.txt
          test -s artifacts/quran-manuscripts/manifest.jsonl
          jq -s '.' artifacts/quran-manuscripts/manifest.jsonl > artifacts/quran-manuscripts/manifest.json
      - name: Download public-domain manuscript images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/quran-manuscripts/images
          count=0
          while IFS= read -r url; do
            count=$((count + 1)); base="$(basename "${url%%\?*}")"
            curl --fail --silent --show-error --retry 4 --location "$url" -o "artifacts/quran-manuscripts/images/${count}-${base}"
            test -s "artifacts/quran-manuscripts/images/${count}-${base}"
          done < <(jq -r '.[].primaryImage, .[].additionalImages[]?' artifacts/quran-manuscripts/manifest.json | head -n 100)
          test "$count" -gt 0
      - name: Hash downloaded manuscript evidence
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/quran-manuscripts/images -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/quran-manuscripts/images.sha256
      - name: Preserve Quran manuscript evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quran-manuscripts-public-domain-${{ github.run_id }}
          path: artifacts/quran-manuscripts
          if-no-files-found: error
          retention-days: 30

  waqfeya-books:
    name: Harvest explicitly waqf/free source books
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build verified Waqfeya manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/waqfeya-books/pdf
          cat > artifacts/waqfeya-books/manifest.json <<'JSON'
          {
            "policy": "Download only when the Waqfeya record explicitly describes the edition as waqf/free distribution. Waqf status is not treated as a blanket copyright license; provenance and evidence are preserved per edition.",
            "sourceIndex": "https://waqfeya.net/books",
            "books": [
              {"id":"sahih-bukhari-afkar","title":"صحيح البخاري - ط. الأفكار","sourcePage":"https://waqfeya.net/books/صحيح-البخاري-ط-الأفكار-bc1eab2741b746fca5531f69a651bc89","download":"https://archive.org/download/FP54454/54454.pdf","waqfEvidence":"طبع على نفقة الشيخ محمد بن صالح الراجحي - وقف لله تعالى.","category":"hadith"},
              {"id":"sunan-abu-dawud-afkar","title":"سنن أبي داود - ط. الأفكار","sourcePage":"https://waqfeya.net/books/سنن-أبي-داود-ط-الأفكار-62b45b4d81704c8794decea85a924b9c","download":"https://archive.org/download/FP54451/54451.pdf","waqfEvidence":"طبع على نفقة الشيخ محمد بن صالح الراجحي - وقف لله تعالى.","category":"hadith"},
              {"id":"jami-tirmidhi-afkar","title":"جامع الترمذي = سنن الترمذي - ط. الأفكار","sourcePage":"https://waqfeya.net/books/جامع-الترمذي-سنن-الترمذي-ط-الأفكار-0f02c1074be347a1b5acfdf025268700","download":"https://archive.org/download/FPsutraf/sutraf.pdf","waqfEvidence":"طبع على نفقة الشيخ محمد بن صالح الراجحي - وقف لله تعالى.","category":"hadith"},
              {"id":"sunan-ibn-majah-afkar","title":"سنن ابن ماجه = سنن ابن ماجة - ط. الأفكار","sourcePage":"https://waqfeya.net/books/سنن-ابن-ماجه-سنن-ابن-ماجة-ط-الأفكار-13e0aba15694465c9b873e91e5805696","download":"https://archive.org/download/SuibmaafSuibmaaf/suibmaaf.pdf","waqfEvidence":"طبع على نفقة الشيخ محمد بن صالح الراجحي - وقف لله تعالى.","category":"hadith"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-1","title":"فقه الإسلام شرح بلوغ المرام - ج 1","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm01.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-2","title":"فقه الإسلام شرح بلوغ المرام - ج 2","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm02.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-3","title":"فقه الإسلام شرح بلوغ المرام - ج 3","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm03.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-4","title":"فقه الإسلام شرح بلوغ المرام - ج 4","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm04.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-5","title":"فقه الإسلام شرح بلوغ المرام - ج 5","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm05.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-6","title":"فقه الإسلام شرح بلوغ المرام - ج 6","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm06.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-7","title":"فقه الإسلام شرح بلوغ المرام - ج 7","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm07.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-8","title":"فقه الإسلام شرح بلوغ المرام - ج 8","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm08.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-9","title":"فقه الإسلام شرح بلوغ المرام - ج 9","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm09.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"fiqh-islam-bulugh-al-maram-volume-10","title":"فقه الإسلام شرح بلوغ المرام - ج 10","sourcePage":"https://waqfeya.net/books/فقه-الإسلام-شرح-بلوغ-المرام-ط-1-30819b14ce2d40a9aa120f662dfa5b85","download":"https://archive.org/download/FPfisbmfisbm/fisbm10.pdf","waqfEvidence":"وقف لله تعالى على طلبة العلم","category":"fiqh"},
              {"id":"quran-and-refutation-of-monks","title":"القرآن ونقض مطاعن الرهبان - ط. أوقاف قطر","sourcePage":"https://waqfeya.net/books/القرآن-ونقض-مطاعن-الرهبان-ط-الأوقاف-القطرية-9a836d53472d4e97b96f2bc6c0fb8b40","download":"https://archive.org/download/FP163468/163468.pdf","waqfEvidence":"هذا الكتاب وقف لله تعالى، طبع على نفقة وزارة الأوقاف والشؤون الإسلامية بدولة قطر، وهو يوزع مجانا ولا يجوز بيعه.","category":"quran"}
            ]
          }
          JSON
          jq empty artifacts/waqfeya-books/manifest.json
      - name: Download and verify each eligible PDF without stopping the harvest
        shell: bash
        run: |
          set -u
          tmp='artifacts/waqfeya-books/manifest.tmp.json'
          cp artifacts/waqfeya-books/manifest.json "$tmp"
          jq empty "$tmp"
          jq -c '.books[]' artifacts/waqfeya-books/manifest.json | while IFS= read -r book; do
            id="$(jq -r '.id' <<<"$book")"; url="$(jq -r '.download' <<<"$book")"; out="artifacts/waqfeya-books/pdf/${id}.pdf"
            echo "=== $id ==="
            if curl --fail --location --silent --show-error --retry 5 --connect-timeout 30 --max-time 900 "$url" -o "$out" && test -s "$out" && file "$out" | grep -qi 'PDF'; then
              bytes="$(wc -c < "$out" | tr -d ' ')"; sha256="$(sha256sum "$out" | awk '{print $1}')"
              jq --arg id "$id" --argjson bytes "$bytes" --arg sha256 "$sha256" '.books |= map(if .id == $id then . + {verified:true,bytes:$bytes,sha256:$sha256} else . end)' "$tmp" > "$tmp.next" && mv "$tmp.next" "$tmp"
              echo "VERIFIED $id bytes=$bytes sha256=$sha256"
            else
              rm -f "$out"
              jq --arg id "$id" '.books |= map(if .id == $id then . + {verified:false,error:"download-or-pdf-validation-failed"} else . end)' "$tmp" > "$tmp.next" && mv "$tmp.next" "$tmp"
              echo "FAILED $id (harvest continues)"
            fi
          done
          mv "$tmp" artifacts/waqfeya-books/manifest.json
          verified="$(jq '[.books[] | select(.verified == true)] | length' artifacts/waqfeya-books/manifest.json)"
          failed="$(jq '[.books[] | select(.verified == false)] | length' artifacts/waqfeya-books/manifest.json)"
          echo "Verified PDFs: $verified"; echo "Failed PDFs: $failed"
          test "$verified" -ge 1
      - name: Write verified PDF hash register
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.books[] | select(.verified == true) | [.id,.bytes,.sha256,.sourcePage,.download] | @tsv' artifacts/waqfeya-books/manifest.json > artifacts/waqfeya-books/verified.tsv
          find artifacts/waqfeya-books/pdf -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/waqfeya-books/pdfs.sha256
          test -s artifacts/waqfeya-books/pdfs.sha256
      - name: Preserve Waqfeya source evidence and PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: waqfeya-source-books-${{ github.run_id }}
          path: artifacts/waqfeya-books
          if-no-files-found: error
          retention-days: 30
