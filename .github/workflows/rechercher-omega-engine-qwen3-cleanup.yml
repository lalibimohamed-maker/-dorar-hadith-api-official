name: Rechercher Omega — remove retired duplicate Qwen3 assets

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-engine-qwen3-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rechercher-omega-qwen3-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove retired duplicate Qwen3 assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify shared Qwen3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view rechercher-free-local-models-2026-10 --json isDraft,isPrerelease,assets,url > /tmp/shared.json
          python3 - <<'PY'
          import json

          data = json.load(open("/tmp/shared.json", encoding="utf-8"))
          if data.get("isDraft") or data.get("isPrerelease"):
              raise SystemExit("shared Qwen3 release is not stable; refusing cleanup")
          names = {a["name"] for a in data["assets"]}
          if "qwen3-0.6b.tar.zst" not in names:
              raise SystemExit("shared Qwen3 payload missing; refusing cleanup")
          print("Shared release gate passed:", data["url"])
          PY

      - name: Delete retired Qwen3 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh release view rechercher-omega-engines-v0.1.0 --json databaseId --jq '.databaseId')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[] | [.id,.name] | @tsv' > /tmp/assets.tsv

          while IFS=$'\t' read -r asset_id asset_name; do
            case "$asset_name" in
              qwen3-model.safetensors|qwen3-runtime-files.tar.gz|qwen3-release-manifest.json)
                echo "Deleting retired Qwen3 asset: $asset_name ($asset_id)"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                ;;
            esac
          done < /tmp/assets.tsv

      - name: Verify Qwen3 assets are gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh release view rechercher-omega-engines-v0.1.0 --json databaseId --jq '.databaseId')"
          remaining="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[].name' | grep -E '^qwen3-(model\.safetensors|runtime-files\.tar\.gz|release-manifest\.json)$' || true)"
          if [ -n "$remaining" ]; then
            echo "Retired Qwen3 assets remain:"
            echo "$remaining"
            exit 1
          fi
          echo "Legacy Qwen3 assets removed successfully."

      - name: Verify release has only active Omega starter engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[].name' 2>/dev/null || true)"
          echo "Cleanup verification complete."
