name: Rechercher — Permanent real-PDF corpus acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

# This workflow is a permanent-acquisition entry point only. The reviewed
# central engine owns catalog materialization, acquisition, validation and
# primary/secondary LFS persistence. Sharing the concurrency group prevents
# this entry point from racing the chronological caller against the same queue.
concurrency:
  group: rechercher-continuous-whole-encyclopedia
  cancel-in-progress: false

jobs:
  acquire:
    name: Whole-encyclopedia continuous real-PDF acquisition and permanent retention
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@main
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
