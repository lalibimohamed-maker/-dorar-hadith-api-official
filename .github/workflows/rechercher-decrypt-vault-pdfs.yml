name: Rechercher — Permanent real-PDF corpus acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  # security-justification: This workflow requires contents: write solely to invoke the reviewed central acquisition engine and persist verified PDF acquisition results; it does not bypass protected branches.
  contents: write

# All acquisition callers share the same rights-gated Release destinations. A shared
# group prevents concurrent acquisition runs from racing on persistence state.
concurrency:
  group: rechercher-release-persistence
  cancel-in-progress: false

jobs:
  acquire:
    name: Whole-encyclopedia continuous real-PDF acquisition and permanent retention
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@ea793f5b1d52a3ea7595767f7cd7a0701971bd65 # pinned reviewed commit
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_PUBLIC_PDF_STORAGE_TOKEN: ${{ secrets.RECHERCHER_PUBLIC_PDF_STORAGE_TOKEN }}
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
