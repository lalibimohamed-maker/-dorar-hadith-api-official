name: Rechercher — Reacquire real PDFs from saved sources

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

env:
  REVIEW_BRANCH: rechercher/salaf-01-400h-developer-review-acquisition
  SECONDARY_REPO: lalibimohamed82-coder/rechercher-pdf-storage

jobs:
  reacquire:
    name: Re-download and verify real PDF files
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install PDF validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf git-lfs
          git lfs install --local

      - name: Recover authoritative acquisition manifest
        env:
          REVIEW_BRANCH: ${{ env.REVIEW_BRANCH }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH"
          git show "origin/$REVIEW_BRANCH:books-batches/salaf-01-400h/developer-review-manifest.json" > developer-review-manifest.json
          test -s developer-review-manifest.json

      - name: Re-download every previously acquired PDF from saved sources
        run: |
          set -euo pipefail
          rm -rf recovered
          mkdir -p recovered
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path

          manifest = json.loads(Path('developer-review-manifest.json').read_text(encoding='utf-8'))
          records = manifest.get('records')
          if not isinstance(records, list) or not records:
              raise SystemExit('ERROR: acquisition manifest has no records')

          seen = {}
          for record in records:
              acquired = record.get('acquired') or []
              if not isinstance(acquired, list):
                  continue
              expected = str(record.get('sha256') or '').lower()
              for item in acquired:
                  if not isinstance(item, dict):
                      continue
                  url = item.get('url') or item.get('source_url')
                  if not isinstance(url, str) or not url.startswith(('http://','https://')):
                      continue
                  sha = str(item.get('sha256') or expected).lower()
                  key = sha if re.fullmatch(r'[0-9a-f]{64}', sha) else url
                  seen.setdefault(key, {'url': url, 'sha256': sha, 'title': record.get('title') or record.get('book') or 'book'})

          report=[]
          for idx, item in enumerate(seen.values(), 1):
              url=item['url']
              safe=re.sub(r'[^0-9A-Za-z._-]+','-', item['title']).strip('-')[:100] or 'book'
              target=Path('recovered')/f'{idx:04d}-{safe}.pdf'
              tmp=target.with_suffix('.download')
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Din-Allah-Rechercher/real-pdf-reacquisition'})
                  with urllib.request.urlopen(req, timeout=120) as r, tmp.open('wb') as out:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          out.write(chunk)
                  with tmp.open('rb') as f:
                      header=f.read(5)
                  if header != b'%PDF-':
                      raise RuntimeError('not-a-pdf')
                  subprocess.run(['qpdf','--check',str(tmp)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  digest=hashlib.sha256(tmp.read_bytes()).hexdigest()
                  expected=item['sha256']
                  if re.fullmatch(r'[0-9a-f]{64}', expected) and digest != expected:
                      raise RuntimeError(f'sha256-mismatch expected={expected} actual={digest}')
                  tmp.replace(target)
                  report.append({'url':url,'file':target.name,'bytes':target.stat().st_size,'sha256':digest,'validation':'%PDF- + qpdf --check: ok','status':'reacquired'})
              except Exception as exc:
                  if tmp.exists(): tmp.unlink()
                  report.append({'url':url,'status':'failed','error':str(exc)})

          Path('reacquisition-report.json').write_text(json.dumps({
              'schema':'din-allah-encyclopedia/rechercher-real-pdf-reacquisition/v1',
              'attempted_sources':len(seen),
              'verified_real_pdfs':sum(1 for r in report if r.get('status')=='reacquired'),
              'failed':sum(1 for r in report if r.get('status')=='failed'),
              'records':report
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not any(r.get('status')=='reacquired' for r in report):
              raise SystemExit('ERROR: zero real PDFs were reacquired')
          PY

      - name: Upload real PDFs as protected workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-real-pdfs-${{ github.run_id }}
          path: |
            recovered/*.pdf
            reacquisition-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Mirror verified real PDFs to secondary repository with Git LFS
        env:
          SECONDARY_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
          SECONDARY_REPO: ${{ env.SECONDARY_REPO }}
        run: |
          set -euo pipefail
          test -n "$SECONDARY_TOKEN" || { echo 'ERROR: RECHERCHER_SECONDARY_STORAGE_TOKEN is required for secondary PDF storage.'; exit 1; }
          rm -rf secondary
          git clone "https://x-access-token:${SECONDARY_TOKEN}@github.com/${SECONDARY_REPO}.git" secondary || {
            mkdir secondary
            cd secondary
            git init -b main
            cd ..
          }
          cd secondary
          git lfs install
          git lfs track '*.pdf' >/dev/null
          mkdir -p artifacts/recovered-pdfs
          cd ..
          cp recovered/*.pdf secondary/artifacts/recovered-pdfs/
          cd secondary
          git config user.name 'Rechercher PDF Acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes artifacts/recovered-pdfs/*.pdf
          if git diff --cached --quiet; then
            echo 'No new PDF bytes to persist in secondary storage.'
            exit 0
          fi
          git commit -m "data(rechercher): persist verified real PDFs"
          git push origin HEAD:main

      - name: Publish reacquisition audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-real-pdf-audit-${{ github.run_id }}
          path: reacquisition-report.json
          if-no-files-found: error
          retention-days: 90
