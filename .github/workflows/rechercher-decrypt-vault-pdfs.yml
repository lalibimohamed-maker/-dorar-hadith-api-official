name: Rechercher — Permanent real-PDF corpus acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  # security-justification: This workflow requires contents: write solely to invoke the reviewed central acquisition engine and persist verified PDF acquisition results; it does not bypass protected branches.
  contents: write

# All governed acquisition callers write to the same secondary PDF LFS repository.
# Serialize them globally so a successful LFS push cannot race another caller.
concurrency:
  group: rechercher-secondary-lfs-persistence
  cancel-in-progress: false

jobs:
  acquire:
    name: Whole-encyclopedia continuous real-PDF acquisition and permanent retention
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@196d83e6bcd7132bbb4250f7617395bd07591efa # pinned reviewed commit
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
