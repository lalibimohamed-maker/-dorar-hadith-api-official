name: Rechercher — Permanent real-PDF corpus acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  # security-justification: this caller only invokes the current governed acquisition
  # workflow; publication-eligible PDF bytes are persisted as Release assets in the
  # unified 6,384-matrix storage repository.
  contents: write

concurrency:
  group: rechercher-unified-release-persistence
  cancel-in-progress: false

jobs:
  acquire:
    name: Whole-encyclopedia continuous real-PDF acquisition and permanent retention
    uses: ./.github/workflows/rechercher-governed-acquisition.yml
    with:
      target_branch: rechercher/encyclopedia-continuous-acquisition
    secrets:
      RECHERCHER_MATRIX_STORAGE_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
