name: Rechercher — Recover encrypted vault PDFs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Vault release tag to recover (blank = latest rechercher-vault release)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# security-justification: this workflow reads existing encrypted vault release assets and
# decrypts them only inside an ephemeral runner; recovered PDFs are uploaded only as a
# private-to-repository workflow artifact and are never published as release assets.

env:
  GIT_TERMINAL_PROMPT: '0'

jobs:
  recover:
    name: Recover encrypted books as verified PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Require vault key
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_VAULT_KEY" || { echo 'REVIEW_VAULT_KEY is required.'; exit 1; }

      - name: Select vault release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("rechercher-vault-"))][0].tagName')
          fi
          test -n "$TAG" || { echo 'No rechercher-vault release found.'; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          printf '%s\n' "$TAG" > /tmp/vault-tag
          echo "Recovering vault release: $TAG"

      - name: Download encrypted vault assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/vault-tag)
          mkdir -p recovered encrypted
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pdf.enc' --dir encrypted --clobber
          shopt -s nullglob
          files=(encrypted/*.pdf.enc)
          test "${#files[@]}" -gt 0 || { echo 'No encrypted PDF assets found in selected release.'; exit 1; }
          echo "Encrypted assets: ${#files[@]}"

      - name: Decrypt and verify every PDF
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p recovered
          shopt -s nullglob
          count=0
          for enc in encrypted/*.pdf.enc; do
            base=$(basename "$enc" .enc)
            pdf="recovered/$base"
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
              -pass env:REVIEW_VAULT_KEY -in "$enc" -out "$pdf"
            test -s "$pdf"
            head -c 5 "$pdf" | grep -qx '%PDF-' || { echo "ERROR: invalid PDF header: $pdf"; exit 1; }
            qpdf --check "$pdf"
            sha256sum "$pdf"
            count=$((count + 1))
          done
          echo "RECOVERED_VERIFIED_PDFS=$count" >> "$GITHUB_ENV"

      - name: Write recovery manifest
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/vault-tag)
          {
            echo '{'
            printf '  "schema": "din-allah-encyclopedia/rechercher-vault-pdf-recovery/v1",\n'
            printf '  "release_tag": %s,\n' "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$TAG")"
            printf '  "verified_pdf_count": %s,\n' "$RECOVERED_VERIFIED_PDFS"
            printf '  "public_release": false,\n'
            echo '  "note": "Recovered PDFs are for authenticated repository-owner review only; no plaintext PDF is published as a release asset."'
            echo '}'
          } > recovered/recovery-manifest.json

      - name: Upload verified PDFs as protected workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rechercher-recovered-pdfs-${{ github.run_id }}
          path: recovered/
          if-no-files-found: error
          retention-days: 90
