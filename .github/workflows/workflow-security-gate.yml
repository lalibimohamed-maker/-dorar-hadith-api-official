name: Workflow Security Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '53 3 * * 1'

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit all workflow files
        shell: bash
        run: node scripts/workflow-security-gate.mjs
