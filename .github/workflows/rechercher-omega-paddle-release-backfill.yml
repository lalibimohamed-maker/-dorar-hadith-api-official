name: Rechercher Ω — PaddleOCR-VL Release backfill

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-paddle-release-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped binary upload into the dedicated model Release; no repository source or Corpus writes.

concurrency:
  group: rechercher-omega-paddle-release-backfill
  cancel-in-progress: false

jobs:
  paddle:
    name: Backfill PaddleOCR-VL shards
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Upload PaddleOCR-VL shards
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ runner.temp }}/paddle-release
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          REVISION="7fa00a8c55b735ba51ba49a9058f3f9c57a99a11"
          MODEL="PaddlePaddle/PaddleOCR-VL"
          SOURCE_URL="https://huggingface.co/PaddlePaddle/PaddleOCR-VL/tree/$REVISION"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/model"
          hf download "$MODEL" model.safetensors --revision "$REVISION" --local-dir "$WORKDIR/model"
          split -b 128M -d -a 2 "$WORKDIR/model/model.safetensors" "$WORKDIR/paddleocr-vl-model.safetensors.part-"
          rm "$WORKDIR/model/model.safetensors"

          for shard in "$WORKDIR"/paddleocr-vl-model.safetensors.part-*; do
            size="$(stat -c '%s' "$shard")"
            test "$size" -lt 2147483647
            gh release upload "$TAG" "$shard" --clobber
          done

          manifest="$WORKDIR/paddleocr-vl-release-manifest.json"
          printf '{\n  "schema_version":"1.0.0",\n  "logical_id":"paddleocr-vl",\n  "model_id":"%s",\n  "revision":"%s",\n  "license":"apache-2.0",\n  "source_url":"%s",\n  "reconstruction":{"method":"cat_sorted_parts","output":"model.safetensors","part_size_bytes":134217728},\n  "assets":[\n' "$MODEL" "$REVISION" "$SOURCE_URL" > "$manifest"

          first=1
          for shard in "$WORKDIR"/paddleocr-vl-model.safetensors.part-*; do
            [ "$first" -eq 1 ] || printf ',\n' >> "$manifest"
            first=0
            printf '    {"name":"%s","bytes":%s,"sha256":"%s"}' "$(basename "$shard")" "$(stat -c '%s' "$shard")" "$(sha256sum "$shard" | awk '{print $1}')" >> "$manifest"
          done
          printf ',\n    {"name":"paddleocr-vl-runtime-files.tar.gz","note":"pre-existing verified runtime bundle"}\n  ]\n}\n' >> "$manifest"

          gh release upload "$TAG" "$manifest" --clobber
          gh release delete-asset "$TAG" paddleocr-vl-model.safetensors --yes 2>/dev/null || true
          gh release view "$TAG" --json tagName,url,assets

