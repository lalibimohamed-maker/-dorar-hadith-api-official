name: Rechercher Omega — repair video Release parts

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
  workflow_dispatch:

run-name: Rechercher Omega — repair LTX/Hunyuan Release parts

permissions:
  contents: read

concurrency:
  group: rechercher-omega-video-release-repair
  cancel-in-progress: false

jobs:
  repair:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: ltx-2
            model_id: Lightricks/LTX-2
            revision: dfcc2108383fe1aaa0584bdf55d368a4bdadd90c
            release_tag: rechercher-omega-ltx2-v1.0.0
          - id: hunyuanvideo-1.5
            model_id: tencent/HunyuanVideo-1.5
            revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
            release_tag: rechercher-omega-hunyuanvideo15-v1.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Audit and repair only missing video Release parts
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMEGA_STORAGE_REPOSITORY: lalibimohamed-maker/rechercher-omega-engine-storage
          OMEGA_STORAGE_RELEASE_TAG: ${{ matrix.release_tag }}
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ matrix.revision }}
          CHUNK_BYTES: "536870912"
        run: python scripts/rechercher-omega-video-release-repair.py

      - name: Upload exact video Release audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-video-release-audit-${{ matrix.id }}
          path: ${{ runner.temp }}/omega-video-release-audit.json
          if-no-files-found: error
