name: Rechercher - governed multi-volume book acquisition
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Acquire and unify approved Waqfeya records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf
          git lfs install
          git clone --branch "${GITHUB_HEAD_REF}" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 scripts/rechercher_waqfeya_acquire.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches artifacts .gitattributes
          if git diff --cached --quiet; then echo 'No changes to persist.'; exit 0; fi
          git commit -m 'data(rechercher): acquire verified multi-volume books'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
