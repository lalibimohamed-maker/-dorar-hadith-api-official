name: Rechercher — Deep IslamContent + TerminologyEnc discovery

on:
  pull_request:
    branches: [feat/rechercher-world-knowledge-engines-v1]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate deep contracts
        run: node --test test/rechercher-deep-islamcontent-terminology.test.js
      - name: Probe IslamContent
        run: node scripts/rechercher-deep-islamcontent-terminology.mjs islamcontent
      - name: Probe TerminologyEnc
        run: node scripts/rechercher-deep-islamcontent-terminology.mjs terminology
      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: rechercher-deep-islamcontent-terminology
          path: artifacts/rechercher-deep-*.json
