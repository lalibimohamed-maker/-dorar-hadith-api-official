name: Rechercher Ω — finalize starter Release inventory

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-engine-release-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: scoped normalization of the dedicated model Release assets only.

concurrency:
  group: rechercher-omega-engine-release-normalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize exact starter Release inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Restore required monolithic model assets
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ runner.temp }}/omega-release-finalize
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          ensure_asset() {
            local id="$1"
            local model="$2"
            local revision="$3"
            local name="$4"
            local dir="$WORKDIR/$id"

            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Present: $name"
              return 0
            fi

            mkdir -p "$dir"
            hf download "$model" model.safetensors               --revision "$revision"               --local-dir "$dir"
            test -s "$dir/model.safetensors"
            test "$(stat -c '%s' "$dir/model.safetensors")" -lt 2147483647
            gh release upload "$TAG" "$dir/model.safetensors#${name}" --clobber
            rm -rf "$dir"
          }

          ensure_asset             "qwen3"             "Qwen/Qwen3-0.6B"             "c1899de289a04d12100db370d81485cdf75e47ca"             "qwen3-model.safetensors"

          ensure_asset             "paddleocr-vl"             "PaddlePaddle/PaddleOCR-VL"             "7fa00a8c55b735ba51ba49a9058f3f9c57a99a11"             "paddleocr-vl-model.safetensors"

          ensure_asset             "whisper-tiny"             "openai/whisper-tiny"             "169d4a4341b33bc18d8881c4b69c2e104e1cc0af"             "whisper-tiny-model.safetensors"

      - name: Remove all temporary shard assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          while IFS= read -r name; do
            case "$name" in
              *.safetensors.part-*)
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

      - name: Remove unexpected assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          while IFS= read -r name; do
            case "$name" in
              qwen3-model.safetensors|qwen3-runtime-files.tar.gz|qwen3-release-manifest.json|              paddleocr-vl-model.safetensors|paddleocr-vl-runtime-files.tar.gz|paddleocr-vl-release-manifest.json|              whisper-tiny-model.safetensors|whisper-tiny-runtime-files.tar.gz|whisper-tiny-release-manifest.json)
                ;;
              "")
                ;;
              *)
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

      - name: Verify exact nine-asset Release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="rechercher-omega-engines-v0.1.0"
          expected=$'qwen3-model.safetensors\nqwen3-runtime-files.tar.gz\nqwen3-release-manifest.json\npaddleocr-vl-model.safetensors\npaddleocr-vl-runtime-files.tar.gz\npaddleocr-vl-release-manifest.json\nwhisper-tiny-model.safetensors\nwhisper-tiny-runtime-files.tar.gz\nwhisper-tiny-release-manifest.json'
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          expected_sorted="$(printf '%s\n' "$expected" | sort)"
          if [ "$actual" != "$expected_sorted" ]; then
            echo "Expected:"
            printf '%s\n' "$expected_sorted"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi
          gh release view "$TAG" --json tagName,url,assets
