name: Arab World Free Source Harvest

on:
  push:
    branches:
      - feat/portal-knowledge-v3-2026
  workflow_dispatch:
    inputs:
      start:
        description: 'Starting Waqfeya book ID to scan'
        required: false
        default: '1'
      batch_size:
        description: 'Maximum explicit-rights candidates to download per run'
        required: false
        default: '25'
      book_id_batch:
        description: 'Maximum Waqfeya numeric book IDs to inspect per run'
        required: false
        default: '400'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  registry-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Arab-world source registry
        shell: bash
        run: |
          set -euo pipefail
          test -s config/arab-world-source-registry-2026.json
          jq -e '.countries | length == 23' config/arab-world-source-registry-2026.json >/dev/null
          jq -e '([.countries[].country] | length) >= 20' config/arab-world-source-registry-2026.json >/dev/null
          echo 'Arab-world source registry validated.'

  waqfeya-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: registry-check
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harvest and ACTUALLY DOWNLOAD Waqfeya books
        env:
          WAQFEYA_START: ${{ github.event.inputs.start || '1' }}
          WAQFEYA_BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
          WAQFEYA_BOOK_ID_BATCH: ${{ github.event.inputs.book_id_batch || '400' }}
          # Deterministic proof page. The downloader follows the page's real "تحميل الكتاب" link,
          # accepts redirect/bridge URLs, verifies the resulting file begins with %PDF-, and hashes it.
          WAQFEYA_PROOF_URLS: >-
            https://waqfeya.net/books/%D8%B3%D9%86%D9%86-%D8%A3%D8%A8%D9%8A-%D8%AF%D8%A7%D9%88%D8%AF-%D8%B7-%D8%A7%D9%84%D8%A3%D9%81%D9%83%D8%A7%D8%B1-62b45b4d81704c8794decea85a924b9c
          WAQFEYA_MAX_DOWNLOAD_MB: '200'
        run: |
          set -euo pipefail
          node scripts/waqfeya-batch-harvest.mjs

      - name: Show real download proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/waqfeya-books/manifest.json
          jq '{downloaded, books: [.books[] | {title, bytes, sha256, sourcePage, downloadUrl, proof}]}' artifacts/waqfeya-books/manifest.json

      - name: Preserve downloaded books and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arab-world-waqfeya-books-${{ github.run_id }}
          path: artifacts/waqfeya-books
          if-no-files-found: warn
          retention-days: 90

  official-source-register:
    runs-on: ubuntu-latest
    needs: registry-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate official-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/arab-world-registry
          cp config/arab-world-source-registry-2026.json artifacts/arab-world-registry/
          printf '%s\n' 'This snapshot records official Arabic-world discovery sources. It does not equate free reading/downloading with republication permission.' > artifacts/arab-world-registry/RIGHTS.txt
          jq -r '.countries[] | [.country,.source,.url,.status,.reuse] | @tsv' config/arab-world-source-registry-2026.json > artifacts/arab-world-registry/countries.tsv
      - name: Preserve registry snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arab-world-source-registry-${{ github.run_id }}
          path: artifacts/arab-world-registry
          retention-days: 90
