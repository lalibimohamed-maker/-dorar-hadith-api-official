name: Rechercher — Legacy branch PDF migration

on:
  push:
    branches:
      - rechercher/encyclopedia-master-unbounded-acquisition
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rechercher/encyclopedia-master-unbounded-acquisition
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Smoke test
        run: |
          set -euo pipefail
          git status --short
          echo "LEGACY_PDF_POINTER_COUNT=$(git ls-files '*.pdf' | wc -l | tr -d ' ')"
