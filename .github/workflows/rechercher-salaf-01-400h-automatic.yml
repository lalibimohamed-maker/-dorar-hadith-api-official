name: Rechercher — Encyclopedia continuous PDF downloader

# security-justification: reviewed; contents: write is required only so the governed acquisition workflow can persist verified PDF artifacts/manifests.
# Scope is the whole encyclopedia: Prophet era -> Companions -> Followers ->
# 1-400H -> 401-800H -> 801-1200H -> 1201H -> Modern era -> future books.
# Operating contract: acquire multiple books concurrently; for each book fail over
# through every saved source; seek a real .pdf first (never .pdf.enc); validate it;
# preserve completed PDFs; resume incomplete books automatically; a failed source/book
# must not stop other workers.
# Acquisition and user distribution are separate decisions: a book may be retained
# for governed developer/research review only when its acquisition is lawful, while
# browser download is exposed only when redistribution/download permission is verified.
# If one source is read-only or unsuitable, continue to the next saved source that
# legally provides a downloadable PDF; never bypass access controls or protections.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: rechercher-encyclopedia-pdf-download
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    # Pin to the merged main commit containing PR #426's LFS persistence fix.
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@1a2be3cbc02a4fe2f7aa607857050b1029cf7f8e
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    permissions:
      contents: write
