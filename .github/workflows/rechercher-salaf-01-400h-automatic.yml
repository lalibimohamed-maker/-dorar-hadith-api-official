name: Rechercher — Encyclopedia continuous PDF downloader

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# security-justification: contents: write is required only to invoke the
# acquire-first workflow, which persists encrypted review-vault evidence;
# the caller itself never publishes unverified content.
permissions:
  contents: write

concurrency:
  group: rechercher-encyclopedia-pdf-download
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-acquire-first-reusable.yml@e25326c18e393a033923e4c76cc3f43f396c0cb8
    secrets:
      REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
    permissions:
      contents: write
