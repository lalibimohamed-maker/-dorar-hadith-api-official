name: Rechercher — Encyclopedia continuous PDF downloader

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# security-justification: contents: write is required only to invoke the governed acquisition workflow with permission to persist verified PDF artifacts/manifests; the caller itself does not publish unverified content.
permissions:
  contents: write

concurrency:
  group: rechercher-encyclopedia-pdf-download
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    # Pin to the commit containing the Dorar supplementary book-index integration.
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@324a598f31eba827c13b5ce8d469e83833fa9c2c
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    permissions:
      contents: write
