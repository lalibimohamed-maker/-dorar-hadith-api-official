name: Rechercher — Encyclopedia continuous PDF downloader

on:
  workflow_dispatch:
  # The governed acquisition job can run for up to 6 hours.
  schedule:
    - cron: '0 */6 * * *'

# security-justification: contents: write is required by the governed reusable
# acquisition workflow to persist only verified PDF/state outputs; PDF bytes
# themselves are published only as Release assets in the unified matrix store.
permissions:
  contents: write

concurrency:
  group: rechercher-unified-release-persistence
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    uses: ./.github/workflows/rechercher-governed-acquisition.yml
    with:
      target_branch: rechercher/encyclopedia-master-unbounded-acquisition
    secrets:
      RECHERCHER_MATRIX_STORAGE_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
    permissions:
      contents: write
