name: Rechercher — Encyclopedia continuous PDF downloader

# security-justification: reviewed; contents: write is required only so the governed acquisition workflow can persist verified PDF artifacts/manifests.
# Scope is the whole encyclopedia: Prophet era -> Companions -> Followers ->
# 1-400H -> 401-800H -> 801-1200H -> 1201H -> Modern era -> future books.
# Operating contract: acquire multiple books concurrently; for each book fail over
# through every saved source; persist completed PDFs; resume incomplete books
# automatically without requiring a manual Run workflow action.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: rechercher-encyclopedia-pdf-download
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@ad35eb0dca57a390979ad7b3040b330acc9c71a2
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    permissions:
      contents: write
