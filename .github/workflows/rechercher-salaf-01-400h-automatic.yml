name: Rechercher — Encyclopedia continuous PDF downloader

on:
  workflow_dispatch:
  # The governed acquisition job can run for up to 6 hours. Keep the scheduled
  # cadence at the timeout boundary so scheduled runs do not build a waiting
  # queue that supersedes earlier requests. Manual dispatch remains available.
  schedule:
    - cron: '0 */6 * * *'

# security-justification: contents: write is required by the governed reusable
# acquisition workflow to persist only verified PDFs and resumable governance state.
permissions:
  contents: write

# All callers share the same rights-gated Release destinations. A shared group is
# mandatory so different acquisition queues cannot race on persistence state.
concurrency:
  group: rechercher-release-persistence
  cancel-in-progress: false

jobs:
  download:
    name: Continuous whole-encyclopedia PDF download
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@ea793f5b1d52a3ea7595767f7cd7a0701971bd65 # governed acquisition workflow
    with:
      target_branch: rechercher/encyclopedia-master-unbounded-acquisition
    secrets:
      RECHERCHER_PUBLIC_PDF_STORAGE_TOKEN: ${{ secrets.RECHERCHER_PUBLIC_PDF_STORAGE_TOKEN }}
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    permissions:
      contents: write
