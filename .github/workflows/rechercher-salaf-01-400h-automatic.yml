name: Rechercher — Salaf 01-400H continuous acquisition

on:
  # Start immediately when this workflow reaches main, and whenever main changes.
  push:
    branches: [main]
  # Keep working continuously across runner lifetimes. Each run resumes from
  # the governed acquisition branch and retries failures recorded by the script.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel an active acquisition. At most one pending run is kept so the
# next available runner continues from the persisted acquisition state.
concurrency:
  group: rechercher-salaf-01-400h-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    name: Continuous governed Salaf 01–400H acquisition
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@38ed044dffbcb4957909d10e9c55b383a2fc9225
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    permissions:
      contents: write
