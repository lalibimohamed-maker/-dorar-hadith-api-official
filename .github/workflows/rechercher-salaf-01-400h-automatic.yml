name: Rechercher — Encyclopedia continuous PDF downloader

# security-justification: reviewed; contents: write is required only so the governed acquisition workflow can persist verified PDF artifacts/manifests.
on:
  # Start immediately when the corrected downloader reaches main.
  push:
    branches: [main]
  # Continue automatically and retry incomplete/failed books.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rechercher-encyclopedia-pdf-download
  cancel-in-progress: false

jobs:
  download:
    name: Continuous encyclopedia PDF download
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@a96005bb64fd4d6deca73ab125e6de17ee770abb
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    permissions:
      contents: write
