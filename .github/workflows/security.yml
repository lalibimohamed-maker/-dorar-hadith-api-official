name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create an ephemeral lockfile for the audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Install from the ephemeral lockfile
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Detect accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' \) -not -path './.git/*' | grep -q .; then
            echo "Potential environment/secret file found"
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='SECURITY.md' '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' .; then
            echo "Potential secret material detected"
            exit 1
          fi

  workflow-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Require explicit workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            grep -q '^permissions:' "$f" || { echo "Missing explicit permissions in $f"; exit 1; }
          done
