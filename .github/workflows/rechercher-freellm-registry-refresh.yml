name: Rechercher — FreeLLM registry health evidence

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - feat/rechercher-freellm-free-models-2026
    paths:
      - .github/workflows/rechercher-freellm-registry-refresh.yml
      - config/freellm-discovery-registry-2026.json
      - src/freellm-discovery-registry.js

permissions:
  contents: read

concurrency:
  group: rechercher-freellm-registry-refresh
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify canonical FreeLLM sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, urllib.request
          cfg=json.load(open('config/freellm-discovery-registry-2026.json', encoding='utf-8'))
          urls=[
              ('home', cfg['canonicalSource']['url'], b'Free LLM API Resources'),
              ('models', cfg['canonicalSource']['modelsUrl'], b'Directory of Free LLM APIs'),
              ('llms', cfg['canonicalSource']['agentIndexUrl'], b'# FreeLLM Hub'),
              ('status', cfg['canonicalSource']['statusUrl'], b'Free LLM API Status'),
          ]
          evidence={'schema':'dinullah.freellm-source-evidence.v2','sources':{}}
          for name,url,marker in urls:
              req=urllib.request.Request(url, headers={
                  'User-Agent':'Dinullah-Rechercher/2026',
                  'Accept':'text/html,application/xhtml+xml,text/plain',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  body=r.read()
                  status=r.status
              if status != 200:
                  raise SystemExit(f'{url} returned HTTP {status}')
              if marker not in body:
                  raise SystemExit(f'FreeLLM marker missing for {name}')
              item={
                  'url':url,
                  'httpStatus':status,
                  'retrievedBytes':len(body),
                  'sha256':hashlib.sha256(body).hexdigest(),
                  'markerVerified':True,
              }
              if name in ('home','models'):
                  text=body.decode('utf-8', errors='ignore')
                  m=re.search(rb'(?:Browse|View all)\s+(\d+)\s+models?', body, re.I)
                  if m:
                      item['directoryModelCountObserved']=int(m.group(1))
                  p=re.search(rb'(\d+)\s+Providers', body, re.I)
                  if p:
                      item['providerCountObserved']=int(p.group(1))
              evidence['sources'][name]=item
          json.dump(evidence, open('/tmp/freellm-source-evidence.json','w'), ensure_ascii=False, indent=2)
          print(json.dumps(evidence, ensure_ascii=False))
          PY
      - name: Validate registry contract
        run: |
          set -euo pipefail
          node --test test/freellm-discovery-registry.test.js
