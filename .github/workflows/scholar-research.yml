name: Scholar Research Batch

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Batch offset"
        required: false
        default: "0"
      limit:
        description: "Batch size"
        required: false
        default: "25"
      query:
        description: "Optional scholar name or ID"
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: scholar-research
  cancel-in-progress: true

jobs:
  research-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build first scholar batch
        env:
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '25' }}
          QUERY: ${{ inputs.query || '' }}
        run: node scripts/run-scholar-opinions-batch.js --offset="$OFFSET" --limit="$LIMIT" --query="$QUERY" > scholar-opinion-batch.json
      - name: Probe official web sources
        env:
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '25' }}
          QUERY: ${{ inputs.query || '' }}
        run: node scripts/probe-official-scholar-sources.js --offset="$OFFSET" --limit="$LIMIT" --query="$QUERY" > scholar-official-source-probe.json
      - name: Upload research artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholar-research-batch
          path: |
            scholar-opinion-batch.json
            scholar-official-source-probe.json
