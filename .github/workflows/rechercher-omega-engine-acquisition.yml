name: Rechercher Omega — verify starter engine releases

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-engine-release.json"
      - ".github/workflows/rechercher-omega-engine-acquisition.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

# The four-hour job verifies persistent Release assets; it never re-downloads model weights.

permissions:
  contents: read

concurrency:
  group: rechercher-omega-engine-acquisition
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify persistent starter engine release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify GitHub CLI
        run: gh --version

      - name: Verify release manifest and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          m=json.load(open("config/rechercher-omega-engine-release.json"))
          tag=m["release_tag"]
          raw=subprocess.check_output(["gh","release","view",tag,"--json","tagName,url,assets"],text=True)
          data=json.loads(raw)
          actual={a["name"] for a in data["assets"]}
          expected={name for e in m["engines"] for name in e["asset_plan"]}
          missing=sorted(expected-actual)
          if missing:
              raise SystemExit("missing persistent release assets: "+", ".join(missing))
          print("Release:",data["url"])
          print("Verified assets:",len(expected))

          shared_tag="rechercher-free-local-models-2026-10"
          shared_raw=subprocess.check_output(["gh","release","view",shared_tag,"--json","isDraft,isPrerelease,assets,url"],text=True)
          shared=json.loads(shared_raw)
          if shared.get("isDraft") or shared.get("isPrerelease"):
              raise SystemExit("shared Qwen3 release must be stable: "+shared_tag)
          shared_assets={a["name"] for a in shared["assets"]}
          required_shared="qwen3-0.6b.tar.zst"
          if required_shared not in shared_assets:
              raise SystemExit("missing shared Qwen3 asset: "+required_shared)
          print("Shared Qwen3 release verified:",shared["url"])
          PY

      - name: Enforce no scheduled weight downloads
        run: |
          set -euo pipefail
          if grep -nE "hf download|wget .*model|curl .*model" .github/workflows/rechercher-omega-engine-acquisition.yml; then
            echo "Scheduled acquisition workflow must not download model weights."
            exit 1
          fi
