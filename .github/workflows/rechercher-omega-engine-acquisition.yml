name: Rechercher Omega — acquire starter engines

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - "config/rechercher-omega-engine-acquisition.json"
      - ".github/workflows/rechercher-omega-engine-acquisition.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: rechercher-omega-engine-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire ${{ matrix.logical_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical_id: qwen3
            model_id: Qwen/Qwen3-0.6B
            revision: c1899de
          - logical_id: paddleocr-vl
            model_id: PaddlePaddle/PaddleOCR-VL
            revision: 7fa00a8
    steps:
      - name: Install Hugging Face Hub client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Acquire model weights
        env:
          MODEL_ID: ${{ matrix.model_id }}
          REVISION: ${{ matrix.revision }}
          OUT_DIR: ${{ github.workspace }}/engine-${{ matrix.logical_id }}
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          hf download "$MODEL_ID" --revision "$REVISION" --local-dir "$OUT_DIR"
          test -d "$OUT_DIR"
          find "$OUT_DIR" -type f ! -name "SHA256SUMS" ! -name "acquisition.json" -print0 | sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["OUT_DIR"])
          files = []
          for p in sorted(out.rglob("*")):
              if not p.is_file() or p.name == "acquisition.json":
                  continue
              files.append({
                  "path": str(p.relative_to(out)),
                  "bytes": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest()
              })
          canonical = "".join(f"{item["path"]}={item["sha256"]}\n" for item in files if item["path"] != "SHA256SUMS")
          manifest_sha256 = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          (out/"acquisition.json").write_text(json.dumps({
              "model_id": os.environ["MODEL_ID"],
              "revision": os.environ["REVISION"],
              "manifest_sha256": manifest_sha256,
              "files": files
          }, ensure_ascii=False, indent=2)+"\n")
          PY

      - name: Verify downloaded manifest
        env:
          OUT_DIR: ${{ github.workspace }}/engine-${{ matrix.logical_id }}
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/SHA256SUMS"
          test -s "$OUT_DIR/acquisition.json"
          sha256sum -c "$OUT_DIR/SHA256SUMS"
          test "$(find "$OUT_DIR" -type f | wc -l)" -gt 2
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["OUT_DIR"])
          manifest = json.loads((out/"acquisition.json").read_text())
          listed = {item["path"]: item["sha256"] for item in manifest["files"]}
          canonical = "".join(f"{path}={listed[path]}\n" for path in sorted(listed) if path != "SHA256SUMS")
          assert hashlib.sha256(canonical.encode("utf-8")).hexdigest() == manifest["manifest_sha256"]
          for path, expected in listed.items():
              if path == "SHA256SUMS":
                  continue
              actual = hashlib.sha256((out/path).read_bytes()).hexdigest()
              assert actual == expected, (path, expected, actual)
          PY

      - name: Upload engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rechercher-omega-engine-${{ matrix.logical_id }}
          path: engine-${{ matrix.logical_id }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
