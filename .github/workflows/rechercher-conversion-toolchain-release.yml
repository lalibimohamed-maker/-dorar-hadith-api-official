name: Rechercher — Publish conversion toolchain to Releases
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RECHERCHER_MATRIX_STORAGE_REPO: lalibimohamed-maker/dinullah-matrix-6384-storage-01
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout governed conversion layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/rechercher-document-fallback-to-pdf
          persist-credentials: false
          lfs: false
      - name: Install and capture conversion sources
        env:
          MATRIX_STORAGE_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${MATRIX_STORAGE_TOKEN:-}"
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils libreoffice-writer pandoc ocrmypdf tesseract-ocr tesseract-ocr-ara python3-pip img2pdf gh
          python3 -m pip install --break-system-packages --no-cache-dir pdf2docx PyMuPDF python-pptx
          mkdir -p /tmp/rechercher-toolchain/{packages,pip,metadata}
          python3 -m pip download --no-deps --dest /tmp/rechercher-toolchain/pip pdf2docx PyMuPDF python-pptx ocrmypdf img2pdf
          for p in qpdf poppler-utils libreoffice-writer pandoc ocrmypdf tesseract-ocr tesseract-ocr-ara img2pdf; do (cd /tmp/rechercher-toolchain/packages && apt-get download "$p") || true; done
          {
            echo '{"schema":"din-allah-encyclopedia/rechercher-conversion-source-capture/v1","captured_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","packages":['
            qpdf --version | sed 's/^/{"name":"qpdf","version":"/; s/$/"},/'
            pandoc --version | head -1 | sed 's/^/{"name":"pandoc","version":"/; s/$/"},/'
            ocrmypdf --version 2>&1 | head -1 | sed 's/^/{"name":"ocrmypdf","version":"/; s/$/"},/'
            pdf2docx --version 2>&1 | head -1 | sed 's/^/{"name":"pdf2docx","version":"/; s/$/"},/'
            python3 -c 'import fitz; print(fitz.VersionBind)' | sed 's/^/{"name":"PyMuPDF","version":"/; s/$/"},/'
            python3 -c 'import pptx; print(pptx.__version__)' | sed 's/^/{"name":"python-pptx","version":"/; s/$/"},/'
            echo '{"name":"captured-package-artifacts","captured":true}],"sha256_manifest":"SHA256SUMS.txt","licenses":"license-manifest.json"}'
          } > /tmp/rechercher-toolchain/metadata/install-manifest.json
          (cd /tmp/rechercher-toolchain && find packages pip -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat > /tmp/rechercher-toolchain/metadata/license-manifest.json <<'JSON'
          {"policy":"Redistribute only artifacts permitted by upstream licenses/terms. Other artifacts are retained as source-reference/install metadata and must be fetched from official channels.","notices":["PyMuPDF is AGPL-3.0; review AGPL obligations before redistribution.","Pandoc is GPL-2.0-or-later.","OCRmyPDF core is MPL-2.0 with additional component licenses.","pdf2docx is MIT but upstream states it is no longer actively maintained."]}
          JSON
      - name: Verify source capture integrity
        run: |
          set -euo pipefail
          test -s /tmp/rechercher-toolchain/SHA256SUMS.txt
          (cd /tmp/rechercher-toolchain && sha256sum -c SHA256SUMS.txt)
          python3 -m py_compile scripts/rechercher_pdf_conversion_engine.py
      - name: Publish immutable conversion-toolchain release
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_MATRIX_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          tag="rechercher-conversion-toolchain-${GITHUB_RUN_ID}"
          mkdir -p /tmp/rechercher-toolchain/release
          cp config/rechercher-conversion-toolchain.json /tmp/rechercher-toolchain/release/
          cp scripts/rechercher_pdf_conversion_engine.py /tmp/rechercher-toolchain/release/
          cp /tmp/rechercher-toolchain/metadata/* /tmp/rechercher-toolchain/release/
          cp /tmp/rechercher-toolchain/SHA256SUMS.txt /tmp/rechercher-toolchain/release/
          gh release create "$tag" --repo "$RECHERCHER_MATRIX_STORAGE_REPO" --target main --title "Rechercher conversion toolchain — $tag" --notes "Canonical PDF remains the master. This release captures toolchain installation artifacts, source/version metadata and SHA-256 manifest. Redistribution is governed by each upstream license; artifacts not cleared for redistribution must be fetched from official channels." --latest=false
          find /tmp/rechercher-toolchain/packages /tmp/rechercher-toolchain/pip -type f -print0 | sort -z | while IFS= read -r -d '' f; do gh release upload "$tag" "$f" --repo "$RECHERCHER_MATRIX_STORAGE_REPO" --clobber=false; done
          gh release upload "$tag" /tmp/rechercher-toolchain/release/rechercher-conversion-toolchain.json /tmp/rechercher-toolchain/release/rechercher_pdf_conversion_engine.py /tmp/rechercher-toolchain/release/install-manifest.json /tmp/rechercher-toolchain/release/license-manifest.json /tmp/rechercher-toolchain/release/SHA256SUMS.txt --repo "$RECHERCHER_MATRIX_STORAGE_REPO" --clobber=false
