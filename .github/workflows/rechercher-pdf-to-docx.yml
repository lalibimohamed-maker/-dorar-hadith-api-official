name: Rechercher — PDF to DOCX engine tests
on:
  push:
    branches:
      - feat/rechercher-global-multilingual-resource-discovery-v9
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  pull_request:
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Run PDF to DOCX tests
        run: node --test test/rechercher-pdf-to-docx.test.js
