name: Rechercher — PDF to DOCX engine tests
on:
  push:
    branches: [feat/rechercher-global-multilingual-resource-discovery-v9]
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'scripts/rechercher_pdf_to_docx.py'
      - 'requirements-rechercher-pdf-docx.txt'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  pull_request:
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'scripts/rechercher_pdf_to_docx.py'
      - 'requirements-rechercher-pdf-docx.txt'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      - name: Install structural PDF/DOCX engine
        run: python -m pip install --disable-pip-version-check -r requirements-rechercher-pdf-docx.txt
      - name: Install Arabic font and OCR support
        run: sudo apt-get update && sudo apt-get install -y fonts-hosny-amiri tesseract-ocr tesseract-ocr-ara
      - name: Run existing PDF to DOCX regression test
        run: node --test test/rechercher-pdf-to-docx.test.js
      - name: Run structural Arabic engine regression test
        run: |
          python3 - <<'PY'
          import pymupdf
          print("PyMuPDF", pymupdf.__doc__.splitlines()[0] if pymupdf.__doc__ else "installed")
          PY
          node --test test/rechercher-pdf-to-docx-arabic.test.js
