name: Rechercher — PDF to DOCX engine tests
on:
  push:
    branches: [feat/rechercher-global-multilingual-resource-discovery-v9]
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'scripts/rechercher_pdf_to_docx.py'
      - 'requirements-rechercher-pdf-docx.txt'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'test/rechercher-pdf-to-docx-arabic.test.js'
      - 'test/rechercher-pdf-to-docx-python.test.py'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  pull_request:
    paths:
      - 'scripts/rechercher_pdf_to_docx.mjs'
      - 'scripts/rechercher_pdf_to_docx.py'
      - 'requirements-rechercher-pdf-docx.txt'
      - 'test/rechercher-pdf-to-docx.test.js'
      - 'test/rechercher-pdf-to-docx-arabic.test.js'
      - 'package.json'
      - '.github/workflows/rechercher-pdf-to-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - name: Pin workflow Python executable for PDF→DOCX engine
        run: sudo ln -sf "$(command -v python3)" /usr/local/bin/rechercher-python3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      - name: Install structural PDF/DOCX engine
        run: python -m pip install --disable-pip-version-check -r requirements-rechercher-pdf-docx.txt
      - name: Install Arabic font and OCR support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-hosny-amiri tesseract-ocr tesseract-ocr-ara
          fc-cache -f -v
          tesseract --list-langs
          test -n "${TESSDATA_PREFIX:-}" || TESSDATA_PREFIX="$(dirname "$(find /usr/share/tesseract-ocr -type f -name ara.traineddata -print -quit)")"
          test -f "${TESSDATA_PREFIX}/ara.traineddata"
          echo "TESSDATA_PREFIX=${TESSDATA_PREFIX}" >> "$GITHUB_ENV"
      - name: Run existing PDF to DOCX regression test
        run: node --test test/rechercher-pdf-to-docx.test.js
      - name: Run structural Arabic engine regression test
        run: node --test test/rechercher-pdf-to-docx-arabic.test.js
      - name: Run Python engine regression tests
        run: python3 test/rechercher-pdf-to-docx-python.test.py
      - name: Build CI DOCX/manifest artifact
        if: always()
        run: |
          mkdir -p artifacts/rechercher-pdf-to-docx-fixture/input artifacts/rechercher-pdf-to-docx-fixture/output
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Count 1/Kids[3 0 R]>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<<>>/Contents 4 0 R>>endobj\n4 0 obj<</Length 0>>stream\nendstream\nendobj\nxref\n0 5\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000211 00000 n \ntrailer<</Size 5/Root 1 0 R>>\nstartxref\n260\n%%EOF\n' > artifacts/rechercher-pdf-to-docx-fixture/input/sample.pdf
          python3 scripts/rechercher_pdf_to_docx.py --input artifacts/rechercher-pdf-to-docx-fixture/input --output artifacts/rechercher-pdf-to-docx-fixture/output --manifest artifacts/rechercher-pdf-to-docx-fixture/output/manifest.json
          find artifacts/rechercher-pdf-to-docx-fixture/output -type f -print
          find artifacts/rechercher-pdf-to-docx-fixture/output -type f -name '*.docx' -size +4095c -print
      - name: Upload DOCX and manifest artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rechercher-pdf-to-docx-v3
          path: |
            artifacts/**/*.docx
            artifacts/**/*.json
          if-no-files-found: warn
