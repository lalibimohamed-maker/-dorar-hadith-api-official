name: Rechercher — Global Structured Islamic Knowledge Source Census

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'config/rechercher-global-structured-islamic-knowledge-census-v1.js'
      - 'scripts/rechercher-global-structured-islamic-knowledge-census.mjs'
      - 'test/rechercher-global-structured-islamic-knowledge-census.test.js'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test census contract
        run: node --test test/rechercher-global-structured-islamic-knowledge-census.test.js

      - name: Build census
        run: node scripts/rechercher-global-structured-islamic-knowledge-census.mjs

      - name: Upload census artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rechercher-global-structured-islamic-knowledge-census
          path: artifacts/rechercher/global-structured-islamic-knowledge-census.json
          if-no-files-found: error
