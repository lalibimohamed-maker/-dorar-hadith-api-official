name: Source anomaly quarantine gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/source-anomaly-gate.mjs'
      - 'config/source-refresh-baselines.json'

permissions:
  contents: read

jobs:
  anomaly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate anomaly gate
        run: node --check scripts/source-anomaly-gate.mjs
