name: Global Readiness Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: global-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  global-readiness:
    name: global-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate JSON governance files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("config/content-gateway-living-knowledge-2026.json"),
              Path("config/keyboard-engines-2026.json"),
              Path("config/settings-governance-2026.json"),
          ]
          for p in paths:
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"valid-json: {p}")
          PY

      - name: Enforce global readiness policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -E '^(^|/)Corpus/|(^|/)corpus/|(^|/)data/corpus/'; then
            echo "FAIL: global readiness PRs may not modify Corpus paths."
            exit 1
          fi

          needs_gate=0
          if printf '%s\n' "$changed" | grep -E '\.(json|jsonl|ya?ml|yaml|md|ts|tsx|js|jsx|py|rs|go)$' >/dev/null; then
            needs_gate=1
          fi

          if [ "$needs_gate" -eq 1 ]; then
            test -f docs/governance/global-readiness-gate-2026.md
            grep -q "license" docs/governance/global-readiness-gate-2026.md
            grep -q "provenance" docs/governance/global-readiness-gate-2026.md
            grep -q "fallback" docs/governance/global-readiness-gate-2026.md
            grep -q "observability" docs/governance/global-readiness-gate-2026.md
            grep -q "rollback" docs/governance/global-readiness-gate-2026.md
            grep -q "Corpus isolation" docs/governance/global-readiness-gate-2026.md
          fi

      - name: Check external action pinning
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              action="$(sed -nE 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/p' <<<"$line")"
              if [ -z "$action" ]; then
                continue
              fi
              case "$action" in
                ./|docker://*) continue ;;
                */*)
                  ref="${action##*@}"
                  if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                    echo "FAIL: unpinned GitHub Action: $action in $file"
                    bad=1
                  fi
                  ;;
              esac
            done < <(grep -E '^[[:space:]]+uses:[[:space:]]+' "$file" || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [ "$bad" -ne 0 ]; then exit 1; fi

      - name: Verify settings hard stops
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/settings-governance-2026.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          required = {
              "secureByDefault": True,
              "privacyByDefault": True,
              "leastPrivilege": True,
              "originalContentImmutable": True,
              "rightsFailClosed": True,
              "localFirstVoice": True,
              "noSilentExternalUpload": True,
              "sacredRecitationSeparated": True,
              "voiceIdentityRequiresAuthorization": True,
          }
          for key, expected in required.items():
              if data["principles"].get(key) != expected:
                  raise SystemExit(f"FAIL: settings principle {key} is not {expected!r}")
          voice = data["domains"]["voice"]
          for key in ("wakeWord", "sttEngineSelection", "denoiseEngineSelection", "ttsEngineSelection", "quranRecitationMode"):
              if key not in voice:
                  raise SystemExit(f"FAIL: missing voice control: {key}")
          print("settings-governance: PASS")
          PY

      - name: Verify content governance hard stops
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/content-gateway-living-knowledge-2026.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          principles = data["principles"]
          hard = data["hardStops"]
          checks = {
              "sourceFirst": True,
              "preserveOriginalText": True,
              "provenanceRequired": True,
              "rightsRequired": True,
              "noSilentSubstitution": True,
              "scientificClaimsRequireIndependentEvidence": True,
              "quranicMiracleClaimsRequireScholarlyAndScientificReview": True,
          }
          for key, expected in checks.items():
              if principles.get(key) != expected:
                  raise SystemExit(f"FAIL: content principle {key}")
          for key in ("unknownRights", "brokenProvenance", "singleSourceExtraordinaryClaim"):
              if key not in hard:
                  raise SystemExit(f"FAIL: missing content hard stop: {key}")
          print("content-governance: PASS")
          PY

      - name: Gate result
        run: echo "GLOBAL READINESS GATE: PASS"
