name: Corpus validation

on:
  pull_request:
    paths:
      - 'config/corpus-*.json'
      - 'scripts/validate-corpus-ingestion.js'
      - '.github/workflows/corpus-validation.yml'
  push:
    branches: [main]
    paths:
      - 'config/corpus-*.json'
      - 'scripts/validate-corpus-ingestion.js'
      - '.github/workflows/corpus-validation.yml'

permissions:
  contents: read

concurrency:
  group: corpus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # v7.x verified commit
        with:
          node-version: 20

      - name: Validate corpus ingestion
        run: node scripts/validate-corpus-ingestion.js
