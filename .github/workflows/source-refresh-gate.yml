name: Secure source refresh gate

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-source-refresh
  cancel-in-progress: false

jobs:
  refresh-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate secure source refresh
        run: node scripts/source-refresh-gate.mjs

      - name: Upload signed-off refresh manifest as workflow artifact
        uses: actions/upload-artifact@4cec3d8a8e1c5b1e6a4b7f8f8c0a6a4f6c8b2d1e # v4.6.2
        with:
          name: source-refresh-manifest
          path: artifacts/source-refresh/manifest.json
          if-no-files-found: error
          retention-days: 14
