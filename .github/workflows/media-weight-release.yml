name: Media Model Weights — Release Cache

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published/prerelease tag to populate"
        required: true
        default: "dinullah-media-weights-v2026.09.29"
      publish:
        description: "Publish only when every model/weight redistribution review is verified"
        required: true
        default: "false"
  push:
    branches:
      - main
      - feat/open-interoperability-fabric-2026
    paths:
      - config/media-weight-release-manifest-2026.json
      - .github/workflows/media-weight-release.yml

# security-justification: this workflow publishes only verified release assets from pinned upstream sources after checksum, size and security gates.
permissions:
  contents: read

jobs:
  populate:
    permissions:
      contents: write

    name: Verify and cache approved model weights in GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare sources
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'dinullah-media-weights-v2026.09.29' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('config/media-weight-release-manifest-2026.json',encoding='utf-8'))
          assert d['releaseModel']['maxAssetBytes'] < 2**31
          allowed_hosts=('https://github.com/','https://paddle-model-ecology.bj.bcebos.com/')
          for item in d['weights']:
              assert item['upstreamUrl'].startswith(allowed_hosts), item['upstreamUrl']
              assert item['assetName'].endswith(('.pth','.pt','.onnx','.safetensors','.bin','.tar'))
          print('STATIC_WEIGHT_MANIFEST_OK')
          PY

      - name: Download exact pinned model weights
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open('config/media-weight-release-manifest-2026.json',encoding='utf-8'))
          for item in d['weights']:
              out='release-assets/'+item['assetName']
              subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--tlsv1.2','-o',out,item['upstreamUrl']],check=True)
          PY

      - name: Download pinned Video2X RIFE weights
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          d=json.load(open('config/media-weight-release-manifest-2026.json',encoding='utf-8'))
          src=d['dynamicSources'][0]
          api='https://api.github.com/repos/'+src['upstreamRepository']+'/releases/tags/'+src['upstreamRelease']
          req=urllib.request.Request(api,headers={'Accept':'application/vnd.github+json','User-Agent':'Din-Allah-media-weight-release'})
          with urllib.request.urlopen(req,timeout=30) as r:
              release=json.load(r)
          rx=re.compile(src['assetSelectionRegex'])
          selected=[a for a in release.get('assets',[]) if rx.match(a.get('name',''))]
          if not selected:
              raise SystemExit('No pinned RIFE model assets matched the verified Video2X release.')
          for a in selected:
              name=a['name']
              out='release-assets/video2x-'+name
              subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--tlsv1.2','-o',out,a['browser_download_url']],check=True)
          print('SELECTED_RIFE_ASSETS=', [a['name'] for a in selected])
          PY

      - name: Verify weights and generate immutable lock manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('release-assets')
          entries=[]
          for p in sorted(root.iterdir()):
              if not p.is_file(): continue
              size=p.stat().st_size
              if size >= 2**31: raise SystemExit(f'RELEASE_ASSET_TOO_LARGE {p.name} {size}')
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              entries.append({'assetName':p.name,'size':size,'sha256':h.hexdigest()})
          assert entries
          payload={'schemaVersion':'1.0.0','releaseModel':'runtime-model-weights','sourceManifest':'config/media-weight-release-manifest-2026.json','generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'assets':entries,'verification':['exact-upstream-url-or-pinned-release','size-under-github-release-limit','sha256']}
          Path('release-assets/media-weight-lock.json').write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

      - name: Malware/integrity gate for model files
        run: |
          set -euo pipefail
          command -v file >/dev/null
          while IFS= read -r -d '' f; do
            file --brief --mime-type "$f"
          done < <(find release-assets -type f ! -name 'media-weight-lock.json' -print0)
          if find release-assets -type f -perm /111 -print -quit | grep -q .; then
            echo "Executable model payload blocked."
            exit 1
          fi

      - name: Create or update release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'dinullah-media-weights-v2026.09.29' }}
          PUBLISH: ${{ inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            if [ "$PUBLISH" = "true" ]; then
              gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Model Weights $RELEASE_TAG" --notes "Verified model-weight cache. Every asset was retrieved from its pinned upstream source/release, size-checked, hashed with SHA-256, and kept separate from Corpus and source PDFs. Software activation still requires runtime verification and license/security gates."
            else
              gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Din Allah Media Model Weights $RELEASE_TAG" --notes "Draft model-weight cache. At least one model-specific redistribution review is still pending; assets remain non-promoted until rights evidence is complete." --draft
            fi
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,assets

  activation-self-test:
    needs: populate
    if: ${{ needs.populate.result == 'success' }}
    name: Smoke-test release-backed media engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'dinullah-media-weights-v2026.09.29' }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release-backed weights
        run: |
          set -euo pipefail
          mkdir -p runtime-data/weights
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'media-weight-lock.json'             --pattern '*.pth'             --pattern '*.tar'             --dir runtime-data/weights --clobber

      - name: Verify required weight set and SHA-256 lock
        run: |
          set -euo pipefail
          for f in             RealESRGAN_x4plus.pth             RealESRGAN_x2plus.pth             realesr-general-x4v3.pth             realesr-general-wdn-x4v3.pth             PP-OCRv5_mobile_det_infer.tar             arabic_PP-OCRv5_mobile_rec_infer.tar             media-weight-lock.json; do
            test -s "runtime-data/weights/$f" || { echo "MISSING_RELEASE_ASSET $f"; exit 1; }
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("runtime-data/weights")
          lock=json.loads((root/"media-weight-lock.json").read_text())
          by_name={x["assetName"]:x for x in lock.get("assets",[])}
          checked=0
          for p in root.iterdir():
              if p.name=="media-weight-lock.json" or not p.is_file(): continue
              entry=by_name.get(p.name)
              if not entry: raise SystemExit(f"UNLOCKED_RELEASE_ASSET {p.name}")
              if hashlib.sha256(p.read_bytes()).hexdigest()!=entry["sha256"]:
                  raise SystemExit(f"SHA256_MISMATCH {p.name}")
              checked+=1
          if checked < 6: raise SystemExit(f"TOO_FEW_LOCKED_ASSETS {checked}")
          print("SHA256_VERIFIED",checked)
          PY

      - name: Install CPU-safe media runtime smoke dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input             "paddlepaddle==3.2.0"             "paddleocr==3.7.0"             "realesrgan==0.3.0"             "open3d==0.20.0"             "pycolmap==4.2.0"             "usd-core==26.8"             "opentimelineio==0.18.1"

      - name: Run runtime and engine smoke tests
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ffmpeg -version | head -n 1
          tesseract --version | head -n 1
          python - <<'PY'
          import importlib
          for name in ["paddle","paddleocr","realesrgan","open3d","pycolmap","pxr","opentimelineio"]:
              importlib.import_module(name)
              print("IMPORT_OK",name)
          import paddle
          print("PADDLE_DEVICE_OK",paddle.device.get_device())
          PY
          tar -tf runtime-data/weights/PP-OCRv5_mobile_det_infer.tar >/dev/null
          tar -tf runtime-data/weights/arabic_PP-OCRv5_mobile_rec_infer.tar >/dev/null
          echo OCR_MODEL_ARCHIVES_READABLE

      - name: Probe pinned Video2X runtime
        run: |
          set -euo pipefail
          docker pull ghcr.io/k4yt3x/video2x:6.4.0@sha256:e21b6893269b4cb6f5603802726fd7537be241f6b39217b73530478861acbca1
          docker run --rm ghcr.io/k4yt3x/video2x:6.4.0@sha256:e21b6893269b4cb6f5603802726fd7537be241f6b39217b73530478861acbca1 --help >/dev/null
          echo VIDEO2X_RUNTIME_OK

      - name: Write activation report
        if: always()
        run: |
          cat > media-engine-activation-report.json <<EOF
          {
            "releaseTag": "$RELEASE_TAG",
            "artifactState": "release-assets-verified",
            "activationStages": [
              "registered",
              "installed",
              "sha256_verified",
              "runtime_import_verified",
              "engine_smoke_tested"
            ],
            "rightsState": "kept-separate; ambiguous model redistribution remains non-promoted",
            "corpusMutation": false
          }
          EOF

      - name: Preserve activation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-engine-activation-report
          path: media-engine-activation-report.json
          if-no-files-found: error
          retention-days: 30
