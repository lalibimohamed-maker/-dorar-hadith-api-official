name: Supply Chain Attestation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: supply-chain-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest:
    name: Build, attest and verify source bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          git archive --format=tar --prefix=dorar-hadith-api-official/ HEAD > artifacts/supply-chain/source.tar
          sha256sum artifacts/supply-chain/source.tar | tee artifacts/supply-chain/source.tar.sha256
          git ls-files -z | xargs -0 sha256sum > artifacts/supply-chain/files.sha256
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@b4f4f7d6358f0f1a9c18e64e9f2f2c0c9b8b5d86 # v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: artifacts/supply-chain/sbom.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign source bundle with Sigstore
        working-directory: artifacts/supply-chain
        run: cosign sign-blob source.tar --bundle source.tar.sigstore.json --yes
      - name: Verify source bundle signature
        working-directory: artifacts/supply-chain
        run: |
          cosign verify-blob source.tar \
            --bundle source.tar.sigstore.json \
            --certificate-identity-regexp='^https://github\.com/lalibimohamed-maker/-dorar-hadith-api-official/\.github/workflows/supply-chain-attestation\.yml@refs/(heads/main|heads/[^/]+|tags/v.*)$' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Create GitHub artifact attestation
        uses: actions/attest-build-provenance@977bb373ede497ca404e3987e11acfb6ea52e6c0 # v3.1.0
        with:
          subject-path: artifacts/supply-chain/source.tar
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: artifacts/supply-chain
          if-no-files-found: error
          retention-days: 30
