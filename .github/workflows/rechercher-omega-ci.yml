name: Rechercher Ω — architecture and boundary tests

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
  pull_request:
    branches:
      - main
    paths:
      - "src/rechercher-omega-orchestrator.js"
      - "src/rechercher-omega-execution-router.js"
      - "src/rechercher-omega-adapters.js"
      - "config/rechercher-omega-model-registry.json"
      - "config/rechercher-omega-execution-backends.json"
      - "config/rechercher-omega-model-weights.json"
      - "test/rechercher-omega-orchestrator.test.js"
      - "test/rechercher-omega-execution-router.test.js"
      - "test/rechercher-omega-adapters.test.js"
      - "test/rechercher-omega-phase3.test.js"
      - "test/rechercher-omega-integration.test.js"
      - "src/rechercher-omega-runtime-gate.js"
      - "src/rechercher-omega-council.js"
      - "src/rechercher-omega-weight-verifier.js"
      - "docs/RECHERCHER-OMEGA-PHASE3.md"
      - "docs/RECHERCHER-OMEGA.md"
      - "docs/RECHERCHER-OMEGA-EXECUTION.md"
      - ".github/workflows/rechercher-omega-ci.yml"

permissions:
  contents: read

jobs:
  omega-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Ω boundary tests
        run: node --test test/rechercher-omega-orchestrator.test.js test/rechercher-omega-execution-router.test.js test/rechercher-omega-adapters.test.js test/rechercher-omega-integration.test.js

  omega-engine-acquisition:
    if: \${{ github.event_name == 'push' }}
    name: acquire-\${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: ltx-2
            model_id: Lightricks/LTX-2
            revision: dfcc210
            release_tag: rechercher-omega-ltx2-v1.0.0
            license: ltx-2-community-license-agreement
            release_mode: prerelease
            chunk_bytes: 536870912
          - id: hunyuanvideo-1.5
            model_id: tencent/HunyuanVideo-1.5
            revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
            release_tag: rechercher-omega-hunyuanvideo15-v1.0.0
            license: tencent-hunyuan-community
            release_mode: draft
            chunk_bytes: 536870912
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Omega storage access
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          TARGET_REPOSITORY: lalibimohamed-maker/rechercher-omega-engine-storage
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "RECHERCHER_OMEGA_STORAGE_TOKEN is missing"; exit 1; }
          actual="$(gh api "repos/$TARGET_REPOSITORY" --jq '.full_name')"
          test "$actual" = "$TARGET_REPOSITORY"
          can_push="$(gh api "repos/$TARGET_REPOSITORY" --jq '.permissions.push // false')"
          test "$can_push" = "true" || { echo "Token does not have push permission on $TARGET_REPOSITORY"; exit 1; }
          echo "[OK] Storage target: $TARGET_REPOSITORY"
          echo "[OK] Token has repository write access"

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Resolve immutable revision
        id: revision
        env:
          MODEL_ID: \${{ matrix.model_id }}
          REQUESTED_REVISION: \${{ matrix.revision }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          info=HfApi().model_info(
              os.environ["MODEL_ID"],
              revision=os.environ["REQUESTED_REVISION"],
              files_metadata=False,
          )
          if not re.fullmatch(r"[0-9a-f]{40}", info.sha):
              raise SystemExit("Requested revision did not resolve to a full immutable SHA")
          print("Resolved revision:", info.sha)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("sha="+info.sha+"\\n")
          PY

      - name: Ensure dedicated Release exists
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: lalibimohamed-maker/rechercher-omega-engine-storage
          RELEASE_TAG: \${{ matrix.release_tag }}
          RELEASE_MODE: \${{ matrix.release_mode }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
          elif [ "$RELEASE_MODE" = "draft" ]; then
            gh release create "$RELEASE_TAG" --repo "$REPO" --draft --title "$RELEASE_TAG" --notes "Rechercher Omega draft: license/territory review required."
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --prerelease --title "$RELEASE_TAG" --notes "Rechercher Omega prerelease: license terms accompany redistribution."
          fi
          release_id="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json databaseId --jq '.databaseId')"
          test -n "$release_id"
          echo "OMEGA_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "[OK] Release ID: $release_id"

      - name: Stream weights directly into Release
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          OMEGA_STORAGE_REPOSITORY: lalibimohamed-maker/rechercher-omega-engine-storage
          MODEL_ID: \${{ matrix.model_id }}
          REVISION: \${{ steps.revision.outputs.sha }}
          RELEASE_TAG: \${{ matrix.release_tag }}
          LICENSE_ID: \${{ matrix.license }}
          CHUNK_BYTES: \${{ matrix.chunk_bytes }}
        run: python scripts/rechercher-omega-release-stream.py

      - name: Attach LTX-2 license
        if: \${{ matrix.id == 'ltx-2' }}
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: lalibimohamed-maker/rechercher-omega-engine-storage
          RELEASE_TAG: \${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/Lightricks/LTX-2/\${{ steps.revision.outputs.sha }}/LICENSE-2_x" \
            -o "$tmp"
          gh release upload "$RELEASE_TAG" "$tmp#LICENSE-2_x" --repo "$REPO" --clobber
          rm -f "$tmp"

      - name: Attach Hunyuan license and notice
        if: \${{ matrix.id == 'hunyuanvideo-1.5' }}
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: lalibimohamed-maker/rechercher-omega-engine-storage
          RELEASE_TAG: \${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          for spec in \
            "LICENSE|https://raw.githubusercontent.com/Tencent-Hunyuan/HunyuanVideo-1.5/\${{ steps.revision.outputs.sha }}/LICENSE" \
            "NOTICE|https://raw.githubusercontent.com/Tencent-Hunyuan/HunyuanVideo-1.5/\${{ steps.revision.outputs.sha }}/NOTICE"
          do
            name="\${spec%%|*}"
            url="\${spec#*|}"
            tmp="$(mktemp)"
            curl --fail --location --retry 3 --silent --show-error "$url" -o "$tmp"
            gh release upload "$RELEASE_TAG" "$tmp#$name" --repo "$REPO" --clobber
            rm -f "$tmp"
          done

      - name: Verify Release manifest
        env:
          GH_TOKEN: \${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          REPO: lalibimohamed-maker/rechercher-omega-engine-storage
          RELEASE_TAG: \${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "release-manifest.json"
          echo "Verified Release manifest for $RELEASE_TAG"
