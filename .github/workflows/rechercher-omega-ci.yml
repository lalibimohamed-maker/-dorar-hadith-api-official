name: Rechercher Ω — architecture and boundary tests

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
  pull_request:
    branches:
      - main
    paths:
      - "src/rechercher-omega-orchestrator.js"
      - "src/rechercher-omega-execution-router.js"
      - "src/rechercher-omega-adapters.js"
      - "config/rechercher-omega-model-registry.json"
      - "config/rechercher-omega-execution-backends.json"
      - "config/rechercher-omega-model-weights.json"
      - "test/rechercher-omega-orchestrator.test.js"
      - "test/rechercher-omega-execution-router.test.js"
      - "test/rechercher-omega-adapters.test.js"
      - "test/rechercher-omega-phase3.test.js"
      - "test/rechercher-omega-integration.test.js"
      - "src/rechercher-omega-global-deep-search.js"
      - "src/rechercher-omega-scholarly-fleet.js"
      - "config/rechercher-omega-scholarly-fleet.json"
      - "test/rechercher-omega-scholarly-fleet.test.js"
      - "src/rechercher-ai-mcp-server.js"
      - "src/rechercher-ai-gateway.js"
      - "test/rechercher-ai-mcp-server.test.js test/rechercher-omega-sana-sprint16-runtime.test.js test/rechercher-ai-gateway.test.js"
      - "test/rechercher-ai-gateway.test.js"
      - "schemas/islamic-corpus-node.schema.json"
      - "schemas/hadith-evidence.schema.json"
      - "schemas/quran-evidence.schema.json"
      - "config/rechercher-ai-api-mcp-2026.json"
      - "openapi.yaml"
      - "docs/RECHERCHER-OMEGA-SCHOLARLY-FLEET.md"
      - "test/rechercher-omega-global-deep-search.test.js"
      - "src/rechercher-omega-runtime-gate.js"
      - "src/rechercher-omega-council.js"
      - "src/rechercher-omega-weight-verifier.js"
      - "docs/RECHERCHER-OMEGA-PHASE3.md"
      - "docs/RECHERCHER-OMEGA.md"
      - "docs/RECHERCHER-OMEGA-EXECUTION.md"
      - "src/rechercher-omega-video-engine-profiles.js"
      - "src/rechercher-omega-video-engine-readiness.js"
      - "src/rechercher-omega-video-orchestrator.js"
      - "src/rechercher-omega-media-runtimes.js"
      - "test/rechercher-omega-video-engine-profiles.test.js"
      - "test/rechercher-omega-video-engine-readiness.test.js"
      - "test/rechercher-omega-video-orchestrator.test.js"
      - "config/rechercher-omega-video-engine-profiles-2026.json"
      - "config/rechercher-omega-video-engine-readiness-2026.json"
      - "config/rechercher-omega-video-runtime-environments-2026.json"
      - "config/rechercher-omega-video-license-compliance-2026.json"
      - "scripts/rechercher-omega-selective-materialize.py"
      - ".github/workflows/rechercher-omega-ci.yml"

permissions:
  contents: read

concurrency:
  group: rechercher-omega-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omega-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Ω boundary tests
        run: node --test test/rechercher-omega-orchestrator.test.js test/rechercher-omega-execution-router.test.js test/rechercher-omega-adapters.test.js test/rechercher-omega-ai-capability-registry.test.js test/rechercher-omega-ai-runtime.test.js test/rechercher-omega-repository-intelligence.test.js test/rechercher-omega-integration.test.js test/rechercher-omega-global-deep-search.test.js test/rechercher-omega-hunyuan-runtime.test.js test/rechercher-omega-scholarly-fleet.test.js test/rechercher-ai-mcp-server.test.js
      - name: Validate video runtime Python scripts
        run: |
          python3 -m py_compile scripts/rechercher-omega-selective-materialize.py scripts/rechercher-omega-video-runtime-smoke.py
      - name: Validate video engine contracts
        run: |
          node --test test/rechercher-omega-video-engine-profiles.test.js test/rechercher-omega-video-engine-readiness.test.js test/rechercher-omega-video-orchestrator.test.js test/rechercher-omega-multimodal-router.test.js

