name: Rechercher — PDF corpus hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */2 * * *'

# security-justification: trusted default-branch code only; no pull-request code is executed.
permissions:
  contents: write

env:
  REVIEW_BRANCH: rechercher/salaf-01-400h-developer-review-acquisition
  GIT_TERMINAL_PROMPT: '0'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Audit Releases for legacy encrypted PDF assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/governance
          : > artifacts/governance/release-encrypted-assets.txt
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^rechercher-vault-.*$' || true)
          for tag in "${tags[@]}"; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '\.(pdf\.enc|enc|encrypted)$' | sed "s#^#$tag/#" >> artifacts/governance/release-encrypted-assets.txt || true
          done
          count=$(wc -l < artifacts/governance/release-encrypted-assets.txt | tr -d ' ')
          echo "LEGACY_ENCRYPTED_RELEASE_ASSETS=$count"
          test "$count" -eq 0 || { echo 'ERROR: legacy encrypted PDF release assets remain.'; exit 1; }

      - name: Verify acquisition branches contain no PDF payload paths
        run: |
          set -euo pipefail
          for branch in rechercher/encyclopedia-continuous-acquisition rechercher/encyclopedia-master-unbounded-acquisition rechercher/salaf-01-400h-developer-review-acquisition; do
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
            count=$(git ls-tree -r --name-only "refs/remotes/origin/$branch" -- '*.pdf' 2>/dev/null | wc -l | tr -d ' ')
            echo "BRANCH_PDF_PATHS $branch=$count"
            test "$count" -eq 0 || { echo "ERROR: PDF payload paths remain on $branch"; exit 1; }
          done
      - name: Recover authoritative acquisition manifest
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          mkdir -p books-batches/salaf-01-400h
          git show "origin/$REVIEW_BRANCH:books-batches/salaf-01-400h/developer-review-manifest.json" > books-batches/salaf-01-400h/developer-review-manifest.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json

      - name: Audit the whole recovered encyclopedia PDF vault
        run: |
          set -euo pipefail
          python3 scripts/rechercher_pdf_hygiene.py \
            --root "$GITHUB_WORKSPACE" \
            --pdf-root artifacts/developer-review-vault \
            --manifest books-batches/salaf-01-400h/developer-review-manifest.json \
            --out artifacts/governance/pdf-hygiene-report.json \
            --quarantine artifacts/developer-review-quarantine
          cat artifacts/governance/pdf-hygiene-report.json

      - name: Validate every remaining PDF recursively
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            test "$(head -c 5 "$f")" = '%PDF-'
            qpdf --check "$f"
          done < <(find artifacts/developer-review-vault -type f -name '*.pdf' -print0)

      - name: Persist hygiene report and reconciled state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The authoritative manifest was materialized from REVIEW_BRANCH above.
          # It is intentionally untracked while this job is still on main. A direct
          # checkout of REVIEW_BRANCH would therefore abort because that branch tracks
          # the same path. Remove only this exact generated copy; REVIEW_BRANCH will
          # restore its tracked copy immediately after checkout.
          REVIEW_MANIFEST='books-batches/salaf-01-400h/developer-review-manifest.json'
          test -s "$REVIEW_MANIFEST"
          rm -f -- "$REVIEW_MANIFEST"

          git add artifacts/governance/pdf-hygiene-report.json
          git diff --cached --quiet || git commit -m 'data(rechercher): persist whole-encyclopedia PDF hygiene report'
          STATE_COMMIT=$(git rev-parse HEAD)

          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          test -s "$REVIEW_MANIFEST"

          git checkout "$STATE_COMMIT" -- artifacts/governance/pdf-hygiene-report.json
          git add artifacts/governance/pdf-hygiene-report.json
          git diff --cached --quiet || git commit -m 'data(rechercher): reconcile whole-encyclopedia PDF hygiene state'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"

      - name: Upload compact hygiene report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-pdf-hygiene-${{ github.run_id }}
          path: artifacts/governance/pdf-hygiene-report.json
          if-no-files-found: error
          retention-days: 90
