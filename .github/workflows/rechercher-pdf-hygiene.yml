name: Rechercher — PDF corpus hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */2 * * *'

# security-justification: trusted default-branch code only; no pull-request code is executed.
permissions:
  contents: write

env:
  REVIEW_BRANCH: rechercher/salaf-01-400h-developer-review-acquisition
  GIT_TERMINAL_PROMPT: '0'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Audit repository and release PDF storage boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/governance
          report=artifacts/governance/release-storage-hygiene.json
          encrypted=0
          lfs_refs=0
          tree_pdfs=0
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^rechercher-' || true)
          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '\.(pdf\.enc|enc|encrypted)$' -q; then encrypted=1; fi
          done
          if [ -f .gitattributes ] && grep -E 'filter=lfs.*artifacts/.*\.pdf|artifacts/.*\.pdf.*filter=lfs' .gitattributes -q; then lfs_refs=1; fi
          if git ls-tree -r --name-only HEAD -- '*.pdf' | grep -q .; then tree_pdfs=1; fi
          branches='rechercher/encyclopedia-continuous-acquisition rechercher/encyclopedia-master-unbounded-acquisition rechercher/salaf-01-400h-developer-review-acquisition'
          branch_pdfs=0
          for branch in $branches; do
            if git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch" >/dev/null 2>&1; then
              if git ls-tree -r --name-only "refs/remotes/origin/$branch" -- '*.pdf' | grep -q .; then branch_pdfs=1; fi
            fi
          done
          python3 - "$encrypted" "$lfs_refs" "$tree_pdfs" "$branch_pdfs" <<'PY'
import json,sys
from pathlib import Path
encrypted,lfs_refs,tree_pdfs,branch_pdfs=map(int,sys.argv[1:])
out={
 'schema':'din-allah-encyclopedia/rechercher-release-storage-hygiene/v1',
 'pdf_backend':'github-releases-assets',
 'git_lfs':False,
 'github_actions_artifacts_as_pdf_storage':False,
 'encrypted_pdf_final_format':False,
 'checks':{'legacy_encrypted_release_assets':encrypted==0,'gitattributes_lfs_pdf_rules':lfs_refs==0,'default_tree_pdf_payloads':tree_pdfs==0,'acquisition_branch_pdf_payloads':branch_pdfs==0},
 'report_artifact_only':True
}
Path('artifacts/governance/release-storage-hygiene.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
print(json.dumps(out,ensure_ascii=False,sort_keys=True))
if not all(out['checks'].values()): raise SystemExit('ERROR: PDF release storage boundary is not clean.')
PY

      - name: Recover authoritative acquisition manifest
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          mkdir -p books-batches/salaf-01-400h
          git show "origin/$REVIEW_BRANCH:books-batches/salaf-01-400h/developer-review-manifest.json" > books-batches/salaf-01-400h/developer-review-manifest.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json

      - name: Persist hygiene report without storing PDF payloads
        run: |
          set -euo pipefail
          rm -f -- books-batches/salaf-01-400h/developer-review-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/governance/release-storage-hygiene.json
          git diff --cached --quiet || git commit -m 'data(rechercher): persist Releases storage hygiene report'
          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git checkout HEAD@{1} -- artifacts/governance/release-storage-hygiene.json 2>/dev/null || true
          git add artifacts/governance/release-storage-hygiene.json
          git diff --cached --quiet || git commit -m 'data(rechercher): reconcile Releases storage hygiene state'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
      - name: Upload compact hygiene report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-pdf-hygiene-${{ github.run_id }}
          path: artifacts/governance/pdf-hygiene-report.json
          if-no-files-found: error
          retention-days: 90
