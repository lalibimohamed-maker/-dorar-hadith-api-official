name: Rechercher — official institutional Quran translation acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - 'rechercher-quran-official-api-registry-2026-09-22'

permissions:
  contents: read
  actions: read

jobs:
  acquire-institutional-quran:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore previous acquisition checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/quran-institutional-acquisition"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=quran-institutional-translation-acquisition&per_page=100" --jq --argjson current "$GITHUB_RUN_ID" --arg branch "$GITHUB_REF_NAME" '[.artifacts[] | select(.expired == false and .workflow_run.id != $current and .workflow_run.head_branch == $branch)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$artifact_id" ]; then
            echo "Restoring acquisition checkpoint artifact $artifact_id"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/previous-acquisition.zip
            unzip -q /tmp/previous-acquisition.zip -d "artifacts/quran-institutional-acquisition"
            rm -f /tmp/previous-acquisition.zip
          else
            echo "No previous checkpoint artifact found; starting from the first pending language."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Acquire official institutional assets
        run: node scripts/rechercher-acquire-quran-institutional.mjs
      - name: Validate institutional acquisition manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('artifacts/quran-institutional-acquisition/manifest.json','utf8')); if(m.edition_count!==3) process.exit(1); if(m.corpus_write!==false || m.ai_generated_translation!==false || m.canonical_arabic_separate!==true) process.exit(1); if((m.validation_or_source_error_editions||0)!==0) process.exit(1); console.log('Institutional acquisition manifest structurally valid', {acquired:m.acquired_editions, network_unavailable:m.network_unavailable_editions||0, languages:m.languages});"
      - name: Upload research-only institutional acquisition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quran-institutional-translation-acquisition
          path: artifacts/quran-institutional-acquisition
          retention-days: 90
