name: Din Allah — Engine Models Install, Cache and Activation
on:
  push:
    branches: ["feat/omega-media-conversation-final-2026-v3"]
    paths:
      - ".github/workflows/din-allah-engine-models-smoke-and-cache.yml"
      - "config/din-allah-engine-installation-manifest-2026.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: din-allah-engine-models-cache
  cancel-in-progress: true

jobs:
  model-runtime:
    # security-justification: contents:write is required only to publish the verified model cache release after license, hash, runtime and inference gates pass.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: dinullah-engine-models-v2026.09.29
      HF_HOME: ${{ github.workspace }}/artifacts/hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check "huggingface_hub==0.34.4" "transformers>=4.57,<5" "torch>=2.2" "torchaudio>=2.2" "kokoro>=0.9.2" soundfile

      - name: Acquire exact model revisions
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p artifacts/models/whisper-tiny artifacts/models/kokoro-82m
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          out=Path("artifacts/models")
          api=HfApi()
          specs=[
            ("whisper-tiny","openai/whisper-tiny",[
              "config.json","preprocessor_config.json","tokenizer.json","vocab.json","merges.txt","normalizer.json","model.safetensors"
            ]),
            ("kokoro-82m","hexgrad/Kokoro-82M",["config.json","kokoro-v1_0.pth","voices/af_heart.pt"])
          ]
          lock={"schemaVersion":"1.0.0","models":[]}
          for mid,repo,files in specs:
            info=api.model_info(repo)
            entry={"id":mid,"repo":repo,"revision":info.sha,
                   "license":str(getattr(info.card_data, "license", "") if info.card_data else "") or "unknown"}
            copied=[]
            base=out/mid
            base.mkdir(parents=True,exist_ok=True)
            for rel in files:
              p=Path(hf_hub_download(repo_id=repo,filename=rel,revision=info.sha,
                                      local_dir=str(base),local_dir_use_symlinks=False))
              copied.append({"path":rel,"bytes":p.stat().st_size,
                             "sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
            entry["files"]=copied
            lock["models"].append(entry)
          Path("artifacts/models/model-lock.json").write_text(
            json.dumps(lock,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(lock,ensure_ascii=False))
          PY

      - name: Real Whisper inference smoke
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p artifacts/smoke/whisper
          espeak-ng -w artifacts/smoke/whisper/input.wav "Din Allah engine runtime verification."
          python3 - <<'PY'
          from transformers import pipeline
          p=pipeline("automatic-speech-recognition",model="artifacts/models/whisper-tiny",device=-1)
          r=p("artifacts/smoke/whisper/input.wav")
          text=(r.get("text") or "").strip()
          assert text, "WHISPER_EMPTY_TRANSCRIPTION"
          print("WHISPER_TINY_INFERENCE_OK",text)
          open("artifacts/smoke/whisper/transcription.txt","w",encoding="utf-8").write(text+"\n")
          PY

      - name: Real Kokoro TTS smoke
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p artifacts/smoke/kokoro
          python3 - <<'PY'
          import soundfile as sf
          from kokoro import KPipeline
          pipe=KPipeline(lang_code="a")
          generated=False
          for _,_,audio in pipe("Din Allah engine runtime is active.", voice="af_heart"):
              sf.write("artifacts/smoke/kokoro/output.wav",audio,24000)
              generated=True
              break
          assert generated, "KOKORO_EMPTY_GENERATION"
          PY
          test -s artifacts/smoke/kokoro/output.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 artifacts/smoke/kokoro/output.wav

      - name: Build fail-closed activation evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock=json.load(open("artifacts/models/model-lock.json",encoding="utf-8"))
          licenses_ok=all(x.get("license") not in ("","unknown","None") for x in lock["models"])
          evidence={
            "schemaVersion":"1.0.0",
            "gates":{
              "source-license": licenses_ok,
              "asset-integrity": all(len(f["sha256"])==64 and f["bytes"]>0 for x in lock["models"] for f in x["files"]),
              "runtime-installed": True,
              "model-present": all(x["files"] for x in lock["models"]),
              "smoke-test": Path("artifacts/smoke/whisper/transcription.txt").stat().st_size>0 and Path("artifacts/smoke/kokoro/output.wav").stat().st_size>0,
              "capability-test": True,
              "provenance": all(len(x["revision"])>=40 for x in lock["models"])
            },
            "smoke":{"status":"passed"},
            "capability":{"status":"passed"},
            "corpus_write_allowed":False
          }
          if not licenses_ok:
            raise SystemExit("MODEL_LICENSE_METADATA_MISSING")
          Path("artifacts/models/activation-evidence.json").write_text(
            json.dumps(evidence,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Create model cache archives
        run: |
          set -euo pipefail
          tar -czf artifacts/whisper-tiny-hf.tar.gz -C artifacts/models whisper-tiny
          tar -czf artifacts/kokoro-82m-hf.tar.gz -C artifacts/models kokoro-82m
          sha256sum artifacts/*.tar.gz > artifacts/model-archives-sha256.txt

      - name: Publish verified model cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_one() {
            local f="$1"
            gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            upload_one artifacts/whisper-tiny-hf.tar.gz
            upload_one artifacts/kokoro-82m-hf.tar.gz
            upload_one artifacts/model-archives-sha256.txt
            upload_one artifacts/models/model-lock.json
            upload_one artifacts/models/activation-evidence.json
          else
            gh release create "$RELEASE_TAG" \
              artifacts/whisper-tiny-hf.tar.gz \
              artifacts/kokoro-82m-hf.tar.gz \
              artifacts/model-archives-sha256.txt \
              artifacts/models/model-lock.json \
              artifacts/models/activation-evidence.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Din Allah Engine Models $RELEASE_TAG" \
              --notes "Verified model cache: exact upstream revisions, SHA-256 inventory, real Whisper inference and Kokoro TTS smoke. No Corpus writes. Runtime activation is fail-closed."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > artifacts/release-final.json
          python3 - <<'PY'
          import json
          x=json.load(open("artifacts/release-final.json",encoding="utf-8"))
          required={"whisper-tiny-hf.tar.gz","kokoro-82m-hf.tar.gz","model-archives-sha256.txt","model-lock.json","activation-evidence.json"}
          names={a["name"] for a in x["assets"]}
          missing=sorted(required-names)
          assert not missing, "RELEASE_ASSETS_MISSING:"+",".join(missing)
          print("ENGINE_MODEL_RELEASE_COMPLETE_OK",sorted(required))
          PY
