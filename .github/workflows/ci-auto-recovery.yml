name: CI Auto Recovery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed jobs once
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

      - name: Diagnose failed run after retry
        if: ${{ github.event.workflow_run.run_attempt > 1 }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              }
            );

            const failedJobs = jobs.filter(j => j.conclusion !== 'success');
            const labelName = 'ci-auto-recovery';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  description: 'Automatic CI failure and recovery tracking',
                  color: 'B60205'
                });
              } else {
                throw error;
              }
            }

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              }
            );

            for (const job of failedJobs) {
              const failedSteps = (job.steps || [])
                .filter(step => step.conclusion !== 'success' && step.conclusion !== 'skipped')
                .map(step => `- **${step.name}** — ${step.conclusion}`)
                .join('\n');

              const title = `CI failure requires repair: ${run.name} / ${job.name}`;
              const body = [
                '## Automatic CI recovery report',
                '',
                `Workflow: ${run.name}`,
                `Run: ${run.run_number}`,
                `Commit: ${run.head_sha}`,
                `Attempt: ${run.run_attempt}`,
                `Job: ${job.name}`,
                `URL: ${run.html_url}`,
                '',
                '### Failed steps',
                failedSteps || '- No failed step summary returned by the Actions API.',
                '',
                'This issue is intentionally deduplicated by workflow and job. New runs update the same open tracking issue instead of creating a new issue for every failed run.',
                'Source files, books, corpus records, references, and scholarly content must not be deleted or replaced blindly. Repairs must target the smallest deterministic cause and pass CI before merging.'
              ].join('\n');

              const sameFailure = existing.find(i => i.title === title);
              if (sameFailure) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sameFailure.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [labelName]
                });
              }
            }
