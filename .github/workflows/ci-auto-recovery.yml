name: CI Auto Recovery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed jobs once
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

      - name: Open/update automatic failure report
        if: ${{ github.event.workflow_run.run_attempt > 1 }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `CI failure requires repair: run #${run.run_number}`;
            const body = [
              '## Automatic CI recovery report',
              '',
              `Workflow: ${run.name}`,
              `Run: ${run.run_number}`,
              `Commit: ${run.head_sha}`,
              `Attempt: ${run.run_attempt}`,
              `URL: ${run.html_url}`,
              '',
              'The first automatic retry did not pass. This issue is intentionally opened instead of deleting or replacing source files blindly.',
              'A repair must be based on the failing job logs and the smallest deterministic code change.'
            ].join('\\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-auto-recovery',
              per_page: 100
            });
            const sameRun = existing.data.find(i => i.title === title);
            if (!sameRun) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-auto-recovery']
              });
            }
