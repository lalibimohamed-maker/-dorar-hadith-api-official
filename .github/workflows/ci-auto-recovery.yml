name: CI Auto Recovery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect failed jobs and retry only transient failures once
        id: retry
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | {name,conclusion,steps}]' \
            | jq -s 'add')"

          transient="$(jq '[ .[]?.steps[]? | select(.conclusion != "success" and .conclusion != "skipped") | .name ] | if length == 0 then false else all(.[]; test("^(Checkout|Setup Node\\.js|Install dependencies|Set up job|Complete job)")) end' <<<"$jobs_json")"

          if [ "$transient" = "true" ]; then
            echo "transient=true" >> "$GITHUB_OUTPUT"
            echo "All failed steps are transient runner/setup failures; retrying failed jobs once."
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          else
            echo "transient=false" >> "$GITHUB_OUTPUT"
            echo "At least one failed step is project/test related; skipping automatic retry."
            echo "Create the recovery issue from this failed run."
          fi

      - name: Diagnose failed run
        if: ${{ github.event.workflow_run.run_attempt > 1 || steps.retry.outputs.transient != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              }
            );

            const failedJobs = jobs.filter(j => j.conclusion !== 'success' && j.conclusion !== 'skipped');
            if (!failedJobs.length) return;

            const labelName = 'ci-auto-recovery';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  description: 'Automatic CI failure and recovery tracking',
                  color: 'B60205'
                });
              } else {
                throw error;
              }
            }

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              }
            );

            for (const job of failedJobs) {
              const failedSteps = (job.steps || [])
                .filter(step => step.conclusion !== 'success' && step.conclusion !== 'skipped')
                .map(step => `- **${step.name}** — ${step.conclusion}`)
                .join('\n');

              const title = `CI failure requires repair: ${run.name} / ${job.name}`;
              const body = [
                '## Automatic CI recovery report',
                '',
                `Workflow: ${run.name}`,
                `Run: ${run.run_number}`,
                `Commit: ${run.head_sha}`,
                `Attempt: ${run.run_attempt}`,
                `Job: ${job.name}`,
                `URL: ${run.html_url}`,
                '',
                '### Failed steps',
                failedSteps || '- No failed step summary returned by the Actions API.',
                '',
                'Automatic retry is intentionally limited to transient runner/setup failures. Project/test failures are reported without blind retries.',
                'This issue is deduplicated by workflow and job. Source files, books, corpus records, references, and scholarly content must not be deleted or replaced blindly. Repairs must target the smallest deterministic cause and pass CI before merging.'
              ].join('\n');

              const sameFailure = existing.find(i => i.title === title);
              if (sameFailure) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sameFailure.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [labelName]
                });
              }
            }
