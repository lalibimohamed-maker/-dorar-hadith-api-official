name: Rechercher Ω — Qwen3-VL disk diagnostic

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-qwen3vl-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3vl-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Show runner disk
        run: |
          set -euxo pipefail
          df -h /
          df -B1 /
          free -h

      - name: Install HF client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Resolve model metadata
        env:
          MODEL_ID: Qwen/Qwen3-VL-4B-Instruct
          REVISION: ebb281ec70b05090aa6165b016eac8ec08e71b17
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"],revision=os.environ["REVISION"],files_metadata=True)
          for s in info.siblings:
              if s.rfilename.endswith(".safetensors"):
                  print(s.rfilename, s.size)
          PY

      - name: Download first Qwen3-VL weight with cache only
        env:
          MODEL_ID: Qwen/Qwen3-VL-4B-Instruct
          REVISION: ebb281ec70b05090aa6165b016eac8ec08e71b17
          CACHE_DIR: ${{ runner.temp }}/qwen-cache
        run: |
          set -euxo pipefail
          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"
          python3 - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(
              repo_id=os.environ["MODEL_ID"],
              filename="model-00001-of-00002.safetensors",
              revision=os.environ["REVISION"],
              cache_dir=os.environ["CACHE_DIR"]
          )
          print(p)
          PY
          find "$CACHE_DIR" -type f -printf '%p %s bytes\n'
          df -h /
