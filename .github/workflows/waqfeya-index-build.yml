name: Waqfeya Century 15 Index
# security-justification: contents: write is required only to commit the machine-readable Waqfeya index and discovery state to this dedicated feature branch; no production branch is modified.

on:
  push:
    branches: [feat/real-corpus-acquisition-2026]
    paths-ignore:
      - data/corpus/waqfeya/century-15/index.jsonl
      - data/corpus/waqfeya/century-15/index-state.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-index:
    name: Discover the complete requested Waqfeya century index
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build complete century-15 index
        run: node scripts/waqfeya-century-index.mjs
      - name: Verify index integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s data/corpus/waqfeya/century-15/index.jsonl
          test -s data/corpus/waqfeya/century-15/index-state.json
          node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('data/corpus/waqfeya/century-15/index.jsonl','utf8').trim().split(/\r?\n/);
          if (lines.length < 6000) throw new Error(`Index too small: ${lines.length}`);
          const books = lines.map(JSON.parse);
          if (new Set(books.map(x => x.sourcePage)).size !== books.length) throw new Error('Duplicate source pages found');
          if (books.some(x => x.century !== 15)) throw new Error('Non-century-15 record found');
          console.log(`Indexed books: ${books.length}`);
          NODE
      - name: Commit index and state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus/waqfeya/century-15/index.jsonl data/corpus/waqfeya/century-15/index-state.json
          if git diff --cached --quiet; then echo 'Index unchanged.'; exit 0; fi
          git commit -m 'data(waqfeya): update century-15 complete index'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/real-corpus-acquisition-2026
