name: Rechercher voice runtime acquisition

"on":
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - feat/rechercher-voice-harmony-acquisition-v2
      - main
    paths:
      - .github/workflows/rechercher-voice-runtime-acquisition.yml
      - config/voice-model-acquisition-manifest-2026.json

permissions:
  contents: write

concurrency:
  group: rechercher-voice-runtime-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Inspect runtime Release
        id: release
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: rechercher-voice-runtime-2026-10
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > /tmp/release.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"assets":[]}' > /tmp/release.json
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          jq -r '.assets[].name' /tmp/release.json | sort > /tmp/assets.txt
          grep -Fxq 'Qwen3-ASR-0.6B.tar.bz2' /tmp/assets.txt && echo "qwen06=true" >> "$GITHUB_OUTPUT" || echo "qwen06=false" >> "$GITHUB_OUTPUT"
          grep -Fxq 'Qwen3-ASR-1.7B.parts.SHA256SUMS.txt' /tmp/assets.txt && echo "qwen17=true" >> "$GITHUB_OUTPUT" || echo "qwen17=false" >> "$GITHUB_OUTPUT"
          grep -Fxq 'silero_vad.onnx' /tmp/assets.txt && echo "silero=true" >> "$GITHUB_OUTPUT" || echo "silero=false" >> "$GITHUB_OUTPUT"
          if grep -Fxq 'Qwen3-ASR-0.6B.tar.bz2' /tmp/assets.txt &&
             grep -Fxq 'Qwen3-ASR-1.7B.parts.SHA256SUMS.txt' /tmp/assets.txt &&
             grep -Fxq 'silero_vad.onnx' /tmp/assets.txt; then
            echo "any_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install acquisition and inference tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip tar bzip2
          python3 -m pip install --disable-pip-version-check --no-cache-dir qwen-asr onnxruntime numpy scipy soundfile

      - name: Validate approved runtime targets
        if: "${{ steps.release.outputs.any_missing == 'true' }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("config/voice-model-acquisition-manifest-2026.json").read_text())
          by_id={x["id"]:x for x in manifest["targets"]}
          required=["qwen3-asr-0.6b","qwen3-asr-1.7b","sherpa-onnx-vad-silero"]
          for target_id in required:
              target=by_id[target_id]
              assert target.get("releaseEligible") is not False, target_id
              assert target.get("status","").startswith("acquire"), target_id
          assert by_id["qwen3-asr-0.6b"]["license"]=="Apache-2.0"
          assert by_id["qwen3-asr-1.7b"]["license"]=="Apache-2.0"
          print("approved runtime targets validated:", required)
          PY

      - name: Acquire Qwen3-ASR 0.6B
        if: "${{ steps.release.outputs.qwen06 != 'true' }}"
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          hf download Qwen/Qwen3-ASR-0.6B --local-dir voice-release-assets/Qwen3-ASR-0.6B
          test -s voice-release-assets/Qwen3-ASR-0.6B/config.json
          test -s voice-release-assets/Qwen3-ASR-0.6B/model.safetensors
          test -s voice-release-assets/Qwen3-ASR-0.6B/preprocessor_config.json

      - name: Acquire Qwen3-ASR 1.7B
        if: "${{ steps.release.outputs.qwen17 != 'true' }}"
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          hf download Qwen/Qwen3-ASR-1.7B --local-dir voice-release-assets/Qwen3-ASR-1.7B
          test -s voice-release-assets/Qwen3-ASR-1.7B/config.json
          test -s voice-release-assets/Qwen3-ASR-1.7B/model-00001-of-00002.safetensors
          test -s voice-release-assets/Qwen3-ASR-1.7B/model-00002-of-00002.safetensors
          test -s voice-release-assets/Qwen3-ASR-1.7B/model.safetensors.index.json

      - name: Acquire Silero VAD
        if: "${{ steps.release.outputs.silero != 'true' }}"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -o voice-release-assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          test -s voice-release-assets/silero_vad.onnx

      - name: Runtime verify Qwen3-ASR 0.6B
        if: "${{ steps.release.outputs.qwen06 != 'true' }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import torch
          from qwen_asr import Qwen3ASRModel
          model=Qwen3ASRModel.from_pretrained(
              "voice-release-assets/Qwen3-ASR-0.6B",
              dtype=torch.float32,
              device_map="cpu",
              max_inference_batch_size=1,
              max_new_tokens=128,
              local_files_only=True
          )
          result=model.transcribe(
              audio="https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-ASR-Repo/asr_en.wav",
              language=None,
              return_time_stamps=False
          )[0]
          assert result.language
          assert result.text.strip()
          print("qwen3-asr-0.6b runtime verified:", result.language)
          PY

      - name: Runtime verify Qwen3-ASR 1.7B
        if: "${{ steps.release.outputs.qwen17 != 'true' }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import torch
          from qwen_asr import Qwen3ASRModel
          model=Qwen3ASRModel.from_pretrained(
              "voice-release-assets/Qwen3-ASR-1.7B",
              dtype=torch.float32,
              device_map="cpu",
              max_inference_batch_size=1,
              max_new_tokens=128,
              local_files_only=True
          )
          result=model.transcribe(
              audio="https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-ASR-Repo/asr_en.wav",
              language=None,
              return_time_stamps=False
          )[0]
          assert result.language
          assert result.text.strip()
          print("qwen3-asr-1.7b runtime verified:", result.language)
          PY

      - name: Runtime verify Silero VAD
        if: "${{ steps.release.outputs.silero != 'true' }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import numpy as np
          import onnxruntime as ort
          path="voice-release-assets/silero_vad.onnx"
          session=ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          names={x.name for x in session.get_inputs()}
          assert {"input","state","sr"} <= names, names
          meta={x.name:x for x in session.get_inputs()}
          def zeros(meta, fallback):
              shape=[]
              for d in meta.shape:
                  shape.append(fallback if not isinstance(d,int) or d < 1 else d)
              return np.zeros(tuple(shape),dtype=np.float32) if shape else np.array(fallback,dtype=np.float32)
          state=zeros(meta["state"],128)
          sr=np.array(16000,dtype=np.int64) if len(meta["sr"].shape)==0 else np.full(tuple(1 if not isinstance(d,int) or d<1 else d for d in meta["sr"].shape),16000,dtype=np.int64)
          ok=False
          for size in (512,576,1024,256):
              try:
                  audio=zeros(meta["input"],size)
                  out=session.run(None,{"input":audio,"state":state,"sr":sr})
                  assert len(out)>=2 and np.asarray(out[0]).size and np.asarray(out[1]).size
                  ok=True
                  break
              except Exception:
                  pass
          assert ok, "Silero VAD runtime verification failed"
          print("silero_vad runtime verified")
          PY

      - name: Package verified Release assets
        if: "${{ steps.release.outputs.any_missing == 'true' }}"
        run: |
          set -euo pipefail
          mkdir -p voice-release-assets
          test -f voice-release-assets/silero_vad.onnx || true
          cd voice-release-assets
          if [ -d Qwen3-ASR-0.6B ]; then tar -cjf Qwen3-ASR-0.6B.tar.bz2 Qwen3-ASR-0.6B; rm -rf Qwen3-ASR-0.6B; fi
          if [ -d Qwen3-ASR-1.7B ]; then
            tar -cjf - Qwen3-ASR-1.7B | split -b 1900m - Qwen3-ASR-1.7B.tar.bz2.part-
            sha256sum Qwen3-ASR-1.7B.tar.bz2.part-* > Qwen3-ASR-1.7B.parts.SHA256SUMS.txt
            rm -rf Qwen3-ASR-1.7B
          fi
          cp ../config/voice-model-acquisition-manifest-2026.json manifest.json
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish verified assets automatically to Release
        if: "${{ steps.release.outputs.any_missing == 'true' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: rechercher-voice-runtime-2026-10
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automatic Rechercher voice runtime acquisition. Verified assets only."
          fi
          for asset in voice-release-assets/*; do
            [ -f "$asset" ] || continue
            name=$(basename "$asset")
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets | jq -e --arg n "$name" '.assets[] | select(.name==$n)' >/dev/null; then
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

  build-al-huda-kws:
    if: "${{ true }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Inspect Al-Huda KWS Release
        id: kws
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: al-huda-kws-2026-10
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: "${{ steps.kws.outputs.exists != 'true' }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install KWS runtime
        if: "${{ steps.kws.outputs.exists != 'true' }}"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y espeak-ng python3 python3-pip libsndfile1
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy scipy soundfile scikit-learn skl2onnx onnx onnxruntime

      - name: Train Al-Huda KWS
        if: "${{ steps.kws.outputs.exists != 'true' }}"
        run: |
          set -euo pipefail
          rm -rf al-huda-kws-release
          mkdir -p al-huda-kws-release
          python3 scripts/train-al-huda-kws.py --out-dir al-huda-kws-release --samples 720
          test -s al-huda-kws-release/al-huda-kws.onnx
          test -s al-huda-kws-release/al-huda-kws-metadata.json

      - name: Verify Al-Huda KWS inference
        if: "${{ steps.kws.outputs.exists != 'true' }}"
        run: |
          set -euo pipefail
          espeak-ng -v ar -s 165 -p 50 -a 140 -w al-huda-positive.wav 'الهُدَى'
          espeak-ng -v ar -s 165 -p 50 -a 140 -w al-huda-negative.wav 'الحمد لله'
          positive="$(printf '%s\n' '{"model":"al-huda-kws-release/al-huda-kws.onnx","audio":"al-huda-positive.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          negative="$(printf '%s\n' '{"model":"al-huda-kws-release/al-huda-kws.onnx","audio":"al-huda-negative.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          python3 - "$positive" "$negative" <<'PY'
          import json,sys
          pos=json.loads(sys.argv[1]); neg=json.loads(sys.argv[2])
          assert pos["ok"] and neg["ok"], (pos,neg)
          assert pos["detected"], pos
          assert not neg["detected"], neg
          json.dump(
              {
                "assistant":"Al-Huda",
                "wakeWord":"الهُدَى",
                "runtime":"onnxruntime-cpu",
                "positive":pos,
                "negative":neg
              },
              open("al-huda-kws-release/runtime-verification.json","w"),
              ensure_ascii=False,
              indent=2
          )
          PY
          rm -f al-huda-positive.wav al-huda-negative.wav

      - name: Publish Al-Huda KWS Release automatically
        if: "${{ steps.kws.outputs.exists != 'true' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: al-huda-kws-2026-10
        run: |
          set -euo pipefail
          cd al-huda-kws-release
          sha256sum al-huda-kws.onnx al-huda-kws-metadata.json runtime-verification.json > SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Al-Huda KWS" --notes "Automatically built and runtime-verified wake-word model."
          gh release upload "$TAG" al-huda-kws.onnx al-huda-kws-metadata.json runtime-verification.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
