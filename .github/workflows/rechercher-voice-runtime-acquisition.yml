name: Rechercher — Voice Runtime acquisition
on:
  push:
    branches:
      - feat/rechercher-voice-harmony-acquisition-v2
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create
        required: true
        default: rechercher-voice-runtime-2026-10
      model:
        description: Qwen3-ASR model to acquire
        required: true
        default: both
        type: choice
        options: [0.6b, 1.7b, both]
      dry_run:
        description: Verify sources, checksums and real inference without publishing binaries
        required: true
        default: "true"
        type: boolean
permissions:
  # SECURITY-JUSTIFICATION: contents: write is required only when workflow_dispatch sets dry_run=false; gh release create/upload publishes verified acquisition payloads and checksums as Release assets. Checkout uses persist-credentials:false.
  contents: write
concurrency:
  group: rechercher-voice-runtime-acquisition
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Inspect existing runtime Release
        id: runtime_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'rechercher-voice-runtime-2026-10' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'rechercher-voice-runtime-2026-10' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no duplicate acquisition."
            exit 0
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install acquisition and inference tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip tar bzip2 espeak-ng
          python3 -m pip install --disable-pip-version-check --no-cache-dir qwen-asr onnxruntime numpy scipy soundfile scikit-learn skl2onnx onnx
      - name: Prepare
        run: |
          set -euo pipefail
          rm -rf voice-release-assets
          mkdir -p voice-release-assets
          cp config/voice-model-acquisition-manifest-2026.json voice-release-assets/manifest.json
      - name: Acquire fixed runtime targets
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors -o voice-release-assets/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          test -s voice-release-assets/silero_vad.onnx
      - name: Acquire Qwen3-ASR 0.6B
        if: ${{ (github.event_name == 'push' || inputs.model == '0.6b' || inputs.model == 'both') && steps.runtime_release.outputs.exists != 'true' }}
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          hf download Qwen/Qwen3-ASR-0.6B --local-dir voice-release-assets/Qwen3-ASR-0.6B
          test -s voice-release-assets/Qwen3-ASR-0.6B/config.json
          test -s voice-release-assets/Qwen3-ASR-0.6B/model.safetensors
          test -s voice-release-assets/Qwen3-ASR-0.6B/preprocessor_config.json
      - name: Acquire Qwen3-ASR 1.7B
        if: ${{ (github.event_name == 'push' || inputs.model == '1.7b' || inputs.model == 'both') && steps.runtime_release.outputs.exists != 'true' }}
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          hf download Qwen/Qwen3-ASR-1.7B --local-dir voice-release-assets/Qwen3-ASR-1.7B
          test -s voice-release-assets/Qwen3-ASR-1.7B/config.json
          test -s voice-release-assets/Qwen3-ASR-1.7B/model-00001-of-00002.safetensors
          test -s voice-release-assets/Qwen3-ASR-1.7B/model-00002-of-00002.safetensors
          test -s voice-release-assets/Qwen3-ASR-1.7B/model.safetensors.index.json
      - name: Acquire remaining voice runtime weights
        run: |
          set -euo pipefail
          mkdir -p voice-release-assets/remaining
          curl -fL --retry 5 --retry-all-errors -o voice-release-assets/remaining/punctuation.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8.tar.bz2
          curl -fL --retry 5 --retry-all-errors -o voice-release-assets/remaining/speaker.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          curl -fL --retry 5 --retry-all-errors -o voice-release-assets/remaining/audio-tagging.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/audio-tagging-models/sherpa-onnx-zipformer-small-audio-tagging-2024-04-15.tar.bz2
          curl -fL --retry 5 --retry-all-errors -o voice-release-assets/remaining/kws-base.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          for f in voice-release-assets/remaining/*; do test -s "$f"; done
          sha256sum voice-release-assets/remaining/* > voice-release-assets/remaining/SHA256SUMS.txt

      - name: Validate real payloads and provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("voice-release-assets/manifest.json"))
          assert p["policy"]["noGitLFS"] is True
          assert p["policy"]["checksumRequired"] is True
          assert p["policy"]["runtimeVerificationAfterDownload"] is True
          selected="${{ inputs.model || 'both' }}"
          roots=[]
          if selected in ("0.6b","both"): roots.append(Path("voice-release-assets/Qwen3-ASR-0.6B"))
          if selected in ("1.7b","both"): roots.append(Path("voice-release-assets/Qwen3-ASR-1.7B"))
          for root in roots: assert root.is_dir(), root
          assert Path("voice-release-assets/silero_vad.onnx").stat().st_size > 0
          print("manifest targets:", len(p["targets"]))
          PY
      - name: Runtime inference verification — Qwen3-ASR
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import torch
          from qwen_asr import Qwen3ASRModel
          selected="${{ inputs.model }}"
          targets=[]
          if selected in ("0.6b","both"): targets.append(("qwen3-asr-0.6b","voice-release-assets/Qwen3-ASR-0.6B"))
          if selected in ("1.7b","both"): targets.append(("qwen3-asr-1.7b","voice-release-assets/Qwen3-ASR-1.7B"))
          sample="https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-ASR-Repo/asr_en.wav"
          evidence=[]
          for target_id, model_path in targets:
              model=Qwen3ASRModel.from_pretrained(model_path,dtype=torch.float32,device_map="cpu",max_inference_batch_size=1,max_new_tokens=128,local_files_only=True)
              result=model.transcribe(audio=sample,language=None,return_time_stamps=False)[0]
              if not result.language or not result.text.strip(): raise SystemExit(f"{target_id}: empty inference result")
              evidence.append({"id":target_id,"runtime":"verified","language":result.language,"text_nonempty":True})
              del model
          json.dump(evidence,open("voice-release-assets/runtime-verification.json","w"),ensure_ascii=False,indent=2)
          print(json.dumps(evidence,ensure_ascii=False))
          PY
      - name: Runtime inference verification — Silero VAD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import numpy as np
          import onnxruntime as ort
          path="voice-release-assets/silero_vad.onnx"
          session=ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          metas={x.name:x for x in session.get_inputs()}
          assert {"input","state","sr"} <= set(metas), [x.name for x in session.get_inputs()]
          def zeros_for(meta, fallback):
              shape=[]
              for d in meta.shape:
                  shape.append(fallback if not isinstance(d,int) or d < 1 else d)
              if not shape: return np.array(fallback)
              return np.zeros(tuple(shape),dtype=np.float32)
          audio=zeros_for(metas["input"],576)
          state=zeros_for(metas["state"],128)
          sr_meta=metas["sr"]
          if len(sr_meta.shape)==0:
              sr_value=np.array(16000,dtype=np.int64)
          else:
              sr_shape=tuple(1 if (not isinstance(d,int) or d<1) else d for d in sr_meta.shape)
              sr_value=np.full(sr_shape,16000,dtype=np.int64)
          out=session.run(None,{"input":audio,"state":state,"sr":sr_value})
          assert len(out) >= 2
          probability=np.asarray(out[0])
          next_state=np.asarray(out[1])
          assert probability.size >= 1
          assert next_state.size >= 1
          print("silero_vad runtime verified; speech_probability=",float(probability.reshape(-1)[0]),"state_shape=",tuple(next_state.shape))
          PY

      - name: Verify Silero VAD payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("voice-release-assets/silero_vad.onnx")
          if p.stat().st_size < 100000: raise SystemExit(f"silero_vad.onnx unexpectedly small: {p.stat().st_size}")
          print("silero_vad.onnx verified:",p.stat().st_size)
          PY
      - name: Runtime verification — Quran recitation source and mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          cfg=json.load(open("config/quran-recitation-qiraat-2026.json"))
          mapping=cfg["reciterMappings"]["ar.alafasy"]
          assert mapping["qiraah"] == "asim"
          assert mapping["riwayah"] == "hafs"
          with urllib.request.urlopen("https://api.alquran.cloud/v1/ayah/1/ar.alafasy", timeout=30) as r:
              payload=json.load(r)
          data=payload["data"]
          audio=data["audio"]
          assert audio.startswith("https://")
          req=urllib.request.Request(audio, headers={"Range":"bytes=0-15"})
          with urllib.request.urlopen(req, timeout=30) as r:
              assert r.status in (200,206)
              content_type=(r.headers.get("content-type") or "").lower()
              assert "audio" in content_type or audio.endswith(".mp3")
          evidence={
              "edition":"ar.alafasy",
              "reciter":mapping["reciter"],
              "qiraah":mapping["qiraah"],
              "riwayah":mapping["riwayah"],
              "audioUrlReachable":True,
              "providerEditionReachable":True
          }
          json.dump(evidence,open("voice-release-assets/quran-recitation-runtime-verification.json","w"),ensure_ascii=False,indent=2)
          print(json.dumps(evidence,ensure_ascii=False))
          PY

      - name: Train Al-Huda KWS on deterministic synthetic Arabic corpus
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'trigger Al-Huda KWS training') && steps.runtime_release.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          rm -rf voice-release-assets/al-huda-kws
          mkdir -p voice-release-assets/al-huda-kws
          python3 scripts/train-al-huda-kws.py --out-dir voice-release-assets/al-huda-kws --samples 720
          espeak-ng -v ar -s 165 -p 50 -a 140 -w voice-release-assets/al-huda-positive.wav 'الهُدَى'
          espeak-ng -v ar -s 165 -p 50 -a 140 -w voice-release-assets/al-huda-negative.wav 'الحمد لله'
          positive="$(printf '%s\\n' '{"model":"voice-release-assets/al-huda-kws/al-huda-kws.onnx","audio":"voice-release-assets/al-huda-positive.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          negative="$(printf '%s\\n' '{"model":"voice-release-assets/al-huda-kws/al-huda-kws.onnx","audio":"voice-release-assets/al-huda-negative.wav","threshold":0.80}' | python3 scripts/al-huda-kws-runner.py)"
          python3 - "$positive" "$negative" <<'PY'
          import json,sys
          pos=json.loads(sys.argv[1]); neg=json.loads(sys.argv[2])
          assert pos["ok"] and neg["ok"], (pos,neg)
          assert pos["detected"], pos
          assert not neg["detected"], neg
          evidence={
              "assistant":"Al-Huda",
              "wakeWord":"الهُدَى",
              "runtime":"onnxruntime-cpu",
              "positive":pos,
              "negative":neg,
              "deviceRuntimeStillRequired":True
          }
          json.dump(evidence,open("voice-release-assets/al-huda-kws/runtime-verification.json","w"),ensure_ascii=False,indent=2)
          print(json.dumps(evidence,ensure_ascii=False))
          PY
          rm -f voice-release-assets/al-huda-positive.wav voice-release-assets/al-huda-negative.wav

      - name: Package Release assets without Git LFS
        run: |
          set -euo pipefail
          cd voice-release-assets
          rm -f SHA256SUMS.txt *.tar.bz2 *.part-* *.parts.SHA256SUMS.txt
          if [ "${{ inputs.model }}" = "0.6b" ] || [ "${{ inputs.model }}" = "both" ]; then tar -cjf Qwen3-ASR-0.6B.tar.bz2 Qwen3-ASR-0.6B; fi
          if [ "${{ inputs.model }}" = "1.7b" ] || [ "${{ inputs.model }}" = "both" ]; then tar -cjf - Qwen3-ASR-1.7B | split -b 1900m - Qwen3-ASR-1.7B.tar.bz2.part-; sha256sum Qwen3-ASR-1.7B.tar.bz2.part-* > Qwen3-ASR-1.7B.parts.SHA256SUMS.txt; fi
          rm -rf Qwen3-ASR-0.6B Qwen3-ASR-1.7B
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Publish Release
        if: ${{ inputs.dry_run != 'true' && steps.runtime_release.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Rechercher voice runtime acquisition. Payloads are checksum-recorded and runtime-verified before publication; no Git LFS."
          gh release upload "$TAG" voice-release-assets/SHA256SUMS.txt voice-release-assets/manifest.json voice-release-assets/runtime-verification.json voice-release-assets/quran-recitation-runtime-verification.json voice-release-assets/silero_vad.onnx voice-release-assets/al-huda-kws/al-huda-kws.onnx voice-release-assets/al-huda-kws/al-huda-kws-metadata.json voice-release-assets/al-huda-kws/runtime-verification.json --repo "$GITHUB_REPOSITORY"
          for asset in voice-release-assets/*.tar.bz2 voice-release-assets/*.part-* voice-release-assets/*parts.SHA256SUMS.txt; do
            [ -f "$asset" ] || continue
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
