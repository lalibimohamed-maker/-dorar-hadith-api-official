name: Monitor source freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check registered source URLs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['config/source-registry.json','config/official-islamic-sources-2026.json'];
          const urls = new Map();
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            for (const s of [...(data.sources||[]), ...(data.officialSources||[])]) {
              if (s.url && /^https?:\/\//.test(s.url)) urls.set(s.id || s.nameAr || s.url, s.url);
            }
          }
          const failures = [];
          for (const [id,url] of urls) {
            let lastError = null;
            let response = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                response = await fetch(url, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(10000),
                  headers: { 'user-agent': 'DinAllah-source-monitor/1.0' }
                });
                if (response.ok) break;
                lastError = new Error(`HTTP ${response.status}`);
              } catch (e) {
                lastError = e;
              }
              if (attempt < 3) await new Promise(r => setTimeout(r, attempt * 1000));
            }
            if (response?.ok) {
              console.log(`OK ${id} ${response.status} ${response.url}`);
            } else {
              const detail = lastError?.message || `HTTP ${response?.status ?? 'unknown'}`;
              console.warn(`WARN ${id} ${url} ${detail}`);
              failures.push({ id, url, detail });
            }
          }
          if (failures.length) {
            console.warn(`Source monitor: ${failures.length}/${urls.size} registered source(s) need attention; retained for retry and review.`);
          } else {
            console.log(`Source monitor: ${urls.size} registered source(s) reachable.`);
          }
          NODE

      - name: Verify live Dorar client without masking real client failures
        run: |
          set +e
          node --input-type=module <<'NODE' >"$RUNNER_TEMP/dorar-client-check.log" 2>&1
          import { searchDorar } from './src/dorar-client.js';
          const data = await searchDorar('الله');
          if (!data) throw new Error('Empty Dorar response');
          console.log('Dorar live API reachable and queried successfully.');
          NODE
          status=$?
          cat "$RUNNER_TEMP/dorar-client-check.log"
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq 'Dorar\.net returned HTTP (401|403|429)' "$RUNNER_TEMP/dorar-client-check.log"; then
            echo "::warning::Dorar.net declined the GitHub-hosted runner request (HTTP 401/403/429). The external service is treated as degraded for this monitor run; repository source data remains unchanged."
            exit 0
          fi
          exit "$status"
