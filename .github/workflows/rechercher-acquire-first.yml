name: Rechercher — Acquire first, store first

on:
  workflow_dispatch:

# Acquire-first pipeline: a successfully acquired copy is stored before any
# downstream research/governance stage can block persistence.
permissions:
  contents: write

# security-justification: contents: write is used only for auditable PDF/manifest persistence; new .pdf.enc creation is forbidden.

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'

jobs:
  acquire-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce PDF-only primary storage policy
        run: |
          set -euo pipefail
          python3 scripts/rechercher_pdf_storage_policy_check.py

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Acquire copies — first persistence boundary
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE" \
            --discovery books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            --discovery books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('books-batches/salaf-01-400h/developer-review-manifest.json').read_text(encoding='utf-8'))
          c=d.get('counts',{})
          print('ACQUIRE_FIRST_COUNTS', json.dumps(c, ensure_ascii=False, sort_keys=True))
          if c.get('acquired_files',0) < 1:
              raise SystemExit('ERROR: zero files acquired; nothing will be persisted.')
          PY

      - name: Verify acquired PDFs before storage
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: no acquired PDFs found.'; exit 1; }
          for f in "${files[@]}"; do
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "ERROR: not a PDF: $f"; exit 1; }
            test -s "$f"
            qpdf --check "$f"
            sha256sum "$f"
          done

      - name: Persist original PDFs as the primary representation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-acquire-first-pdfs-${{ github.run_id }}
          path: artifacts/developer-review-vault/*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Persist original PDFs to GitHub Release without encryption
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: no original PDFs available for release persistence.'; exit 1; }
          tag="rechercher-vault-${GITHUB_RUN_ID}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "Rechercher acquire-first: original PDF files. No encryption and no deletion of primary PDFs."
          gh release upload "$tag" "${files[@]}" --clobber

          python3 - "$tag" <<'PY'
          import json, os, subprocess
          from pathlib import Path
          files=sorted(Path("artifacts/developer-review-vault").glob("*.pdf"))
          rows=[]
          for f in files:
              sha=subprocess.check_output(["sha256sum",str(f)],text=True).split()[0]
              rows.append({"path":str(f),"filename":f.name,"sha256":sha,"bytes":f.stat().st_size,"representation":"original-pdf"})
          evidence={
              "schema":"rechercher/pdf-release-evidence/v1",
              "release_tag":os.environ["tag"] if "tag" in os.environ else "rechercher-vault-"+os.environ["GITHUB_RUN_ID"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "commit":os.environ["GITHUB_SHA"],
              "encrypted":False,
              "primary_files_deleted":False,
              "asset_extension":".pdf",
              "files":rows,
          }
          Path("artifacts/governance").mkdir(parents=True,exist_ok=True)
          Path("artifacts/governance/vault-release.json").write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Persist manifest and release evidence to review branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches/salaf-01-400h/developer-review-manifest.json artifacts/governance/vault-release.json
          git commit -m 'data(rechercher): persist original PDFs and release evidence'
          ACQ_COMMIT=$(git rev-parse HEAD)
          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git checkout "$ACQ_COMMIT" -- books-batches/salaf-01-400h/developer-review-manifest.json artifacts/governance/vault-release.json
          python3 - "$ACQ_COMMIT" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          path='books-batches/salaf-01-400h/developer-review-manifest.json'
          incoming=json.loads(subprocess.check_output(['git','show',f'{sys.argv[1]}:{path}'],text=True))
          try: existing=json.loads(subprocess.check_output(['git','show',f'HEAD:{path}'],text=True))
          except subprocess.CalledProcessError: existing=None
          if not existing:
              merged=incoming
          else:
              old={r.get('id'):r for r in existing.get('records',[]) if r.get('id')}
              for rec in incoming.get('records',[]):
                  rid=rec.get('id')
                  if not rid: continue
                  if rid not in old: old[rid]=rec; continue
                  cur=old[rid]
                  for key in ('discovery_registries','candidates','acquired'):
                      vals=[]
                      for src in (cur.get(key,[]),rec.get(key,[])):
                          for v in src:
                              if v not in vals: vals.append(v)
                      if vals: cur[key]=vals
                  if rec.get('acquired_count',0) > cur.get('acquired_count',0):
                      cur.update({k:v for k,v in rec.items() if k not in ('discovery_registries','candidates','acquired')})
              merged=dict(existing); merged['records']=list(old.values()); merged['counts']=incoming.get('counts',merged.get('counts',{}))
          Path(path).write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add books-batches/salaf-01-400h/developer-review-manifest.json
          git commit -m 'data(rechercher): reconcile acquire-first manifest'
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=${GIT_AUTH_HEADER}" push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "ACQUIRE_FIRST_PERSISTED=$ACQ_COMMIT"
