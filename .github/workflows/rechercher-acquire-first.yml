name: Rechercher — Acquire first, store first

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  # security-justification: This caller delegates acquisition to the pinned governed reusable workflow and only needs contents: write for governed acquisition/release evidence; it does not write Corpus content.
  contents: write

concurrency:
  group: rechercher-acquire-first
  cancel-in-progress: false

jobs:
  acquire-and-store:
    name: Delegate to the central governed real-PDF acquisition
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@636bd721b0715f61b0073ea90aae2e8eee8c15c9
    with:
      target_branch: rechercher/salaf-01-400h-developer-review-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
