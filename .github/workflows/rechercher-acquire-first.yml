name: Rechercher — Acquire first, store first

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  # security-justification: This workflow requires contents: write to persist verified acquisition manifests and release evidence to the protected review branch; it does not bypass protected branches or force-push.
  contents: write

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'
  CATALOG_PATH: 'books-batches/encyclopedia-master/catalog.json'

concurrency:
  group: rechercher-acquire-first
  cancel-in-progress: false

jobs:
  acquire-and-store:
    name: Acquire actual PDFs into protected review vault
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Require vault key
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_VAULT_KEY" || { echo 'REVIEW_VAULT_KEY is required; refusing to acquire or persist copies.'; exit 1; }

      - name: Materialize central unbounded master catalog
        run: |
          set -euo pipefail
          python3 scripts/rechercher_materialize_master_catalog.py --root "$GITHUB_WORKSPACE"
          test -s "$CATALOG_PATH"
          python3 - "$CATALOG_PATH" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('ACQUIRE_FIRST_MASTER_CATALOG records=%d with_sources=%d' % (len(d.get('books',[])), sum(bool(b.get('sources')) for b in d.get('books',[]))))
          PY

      - name: Restore cumulative discovery registries
        run: |
          set -euo pipefail
          mkdir -p books-batches/salaf-01-400h
          git fetch origin "$REVIEW_BRANCH" || true
          restore_registry() {
            local path="$1"
            local fallback='{"entries":[]}';
            if test -s "$path"; then
              python3 - "$path" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d,dict) and isinstance(d.get('entries',[]),list)
          PY
              return
            fi
            if git show "origin/$REVIEW_BRANCH:$path" > "$path" 2>/dev/null; then
              python3 - "$path" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          if not (isinstance(d,dict) and isinstance(d.get('entries',[]),list)):
              raise SystemExit(1)
          print('RESTORED_DISCOVERY_REGISTRY', p)
          PY
              return
            fi
            printf '%s\n' "$fallback" > "$path"
          }
          restore_registry books-batches/salaf-01-400h/master-discovery-additions-2026.json
          restore_registry books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for raw in ('books-batches/salaf-01-400h/master-discovery-additions-2026.json','books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json'):
              d=json.loads(Path(raw).read_text(encoding='utf-8'))
              print('DISCOVERY_REGISTRY',raw,'entries=',len(d.get('entries',[])))
          PY

      - name: Acquire copies — first persistence boundary
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE" \
            --catalog "$CATALOG_PATH" \
            --discovery books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            --discovery books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('books-batches/salaf-01-400h/developer-review-manifest.json').read_text(encoding='utf-8'))
          c=d.get('counts',{})
          print('ACQUIRE_FIRST_COUNTS',json.dumps(c,ensure_ascii=False,sort_keys=True))
          if c.get('acquired_files',0)<1: raise SystemExit('ERROR: zero files acquired; nothing will be persisted.')
          PY

      - name: Verify acquired PDFs before storage
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: no acquired PDFs found.'; exit 1; }
          for f in "${files[@]}"; do
            head -c 5 "$f" | grep -qx '%PDF-'
            test -s "$f"
            qpdf --check "$f"
            sha256sum "$f"
          done

      - name: Encrypt and persist acquired copies immediately
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0
          mkdir -p artifacts/governance
          for f in "${files[@]}"; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 -pass env:REVIEW_VAULT_KEY -in "$f" -out "$f.enc"
            rm -f -- "$f"
          done
          enc=(artifacts/developer-review-vault/*.enc)
          test "${#enc[@]}" -gt 0
          VAULT_TAG="rechercher-vault-${GITHUB_RUN_ID}"
          gh release create "$VAULT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rechercher acquired vault ${GITHUB_RUN_ID}" --notes "Acquire-first persistence boundary. Every asset was downloaded, checked as PDF, hashed, then encrypted before storage."
          : > artifacts/governance/vault-release.jsonl
          for f in "${enc[@]}"; do gh release upload "$VAULT_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; sha256sum "$f" >> artifacts/governance/vault-release.jsonl; done
          python3 - "$VAULT_TAG" <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          tag=sys.argv[1]; assets=[]
          for raw in Path('artifacts/governance/vault-release.jsonl').read_text(encoding='utf-8').splitlines():
              digest,path=raw.split(None,1); assets.append({'sha256':digest,'file':path})
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--json','url,tagName'],text=True))
          Path('artifacts/governance/vault-release.json').write_text(json.dumps({'schema':'din-allah-encyclopedia/rechercher-vault-release/v1','persistence_boundary':'acquire-first','release':release,'assets':assets},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f artifacts/governance/vault-release.jsonl

      - name: Persist manifest, discovery memory and release evidence to review branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git diff --cached --quiet || git commit -m 'data(rechercher): persist acquisition state and cumulative discovery memory'
          ACQ_COMMIT=$(git rev-parse HEAD)
          # The central catalog is materialized for this run only. Restore the tracked
          # catalog before switching branches so generated catalog state never blocks checkout
          # and is never accidentally carried into the protected review branch or Corpus.
          git restore --worktree --staged -- "$CATALOG_PATH" 2>/dev/null || true
          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git checkout "$ACQ_COMMIT" -- \
            artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git add artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git diff --cached --quiet || git commit -m 'data(rechercher): reconcile acquire-first state and discovery memory'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "ACQUIRE_FIRST_PERSISTED=$ACQ_COMMIT"
