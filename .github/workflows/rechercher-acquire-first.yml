name: Rechercher — Acquire first, store first

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# Acquire-first pipeline: a successfully acquired copy is stored before any
# downstream research/governance stage can block persistence.
permissions:
  contents: write

# security-justification: contents: write is required to persist encrypted, verified acquisition evidence and release assets; plaintext book copies are never committed.

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'
  CATALOG_PATH: 'books-batches/encyclopedia-master/catalog.json'

concurrency:
  group: rechercher-acquire-first
  cancel-in-progress: false
