name: Rechercher — Acquire first, store first

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  # security-justification: This workflow requires contents: write to persist verified acquisition manifests and release evidence to the protected review branch; it does not bypass protected branches or force-push.
  contents: write

env:
  GIT_TERMINAL_PROMPT: '0'
  REVIEW_BRANCH: 'rechercher/salaf-01-400h-developer-review-acquisition'
  CATALOG_PATH: 'books-batches/encyclopedia-master/catalog.json'

concurrency:
  group: rechercher-acquire-first
  cancel-in-progress: false

jobs:
  acquire-and-store:
    name: Acquire actual PDFs into protected review vault
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Materialize central unbounded master catalog
        run: |
          set -euo pipefail
          python3 scripts/rechercher_materialize_master_catalog.py --root "$GITHUB_WORKSPACE"
          test -s "$CATALOG_PATH"
          python3 - "$CATALOG_PATH" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('ACQUIRE_FIRST_MASTER_CATALOG records=%d with_sources=%d' % (len(d.get('books',[])), sum(bool(b.get('sources')) for b in d.get('books',[]))))
          PY

      - name: Restore cumulative discovery registries
        run: |
          set -euo pipefail
          mkdir -p books-batches/salaf-01-400h
          git fetch origin "$REVIEW_BRANCH" || true
          restore_registry() {
            local path="$1"
            local fallback='{"entries":[]}';
            if test -s "$path"; then
              python3 - "$path" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d,dict) and isinstance(d.get('entries',[]),list)
          PY
              return
            fi
            if git show "origin/$REVIEW_BRANCH:$path" > "$path" 2>/dev/null; then
              python3 - "$path" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          if not (isinstance(d,dict) and isinstance(d.get('entries',[]),list)):
              raise SystemExit(1)
          print('RESTORED_DISCOVERY_REGISTRY', p)
          PY
              return
            fi
            printf '%s\n' "$fallback" > "$path"
          }
          restore_registry books-batches/salaf-01-400h/master-discovery-additions-2026.json
          restore_registry books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for raw in ('books-batches/salaf-01-400h/master-discovery-additions-2026.json','books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json'):
              d=json.loads(Path(raw).read_text(encoding='utf-8'))
              print('DISCOVERY_REGISTRY',raw,'entries=',len(d.get('entries',[])))
          PY

      - name: Acquire copies — first persistence boundary
        run: |
          set -euo pipefail
          python3 scripts/rechercher_developer_review_acquisition.py --root "$GITHUB_WORKSPACE" \
            --catalog "$CATALOG_PATH" \
            --discovery books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            --discovery books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          test -s books-batches/salaf-01-400h/developer-review-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('books-batches/salaf-01-400h/developer-review-manifest.json').read_text(encoding='utf-8'))
          c=d.get('counts',{})
          print('ACQUIRE_FIRST_COUNTS',json.dumps(c,ensure_ascii=False,sort_keys=True))
          if c.get('acquired_files',0)<1: raise SystemExit('ERROR: zero files acquired; nothing will be persisted.')
          PY

      - name: Verify acquired PDFs before storage
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: no acquired PDFs found.'; exit 1; }
          for f in "${files[@]}"; do
            head -c 5 "$f" | grep -qx '%PDF-'
            test -s "$f"
            qpdf --check "$f"
            sha256sum "$f"
          done

      - name: Persist each acquired PDF exactly once as the correct Releases asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTECTED_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0
          test -n "$PROTECTED_TOKEN"
          PROTECTED_REPO='lalibimohamed82-coder/rechercher-pdf-storage'
          visibility=$(GH_TOKEN="$PROTECTED_TOKEN" gh repo view "$PROTECTED_REPO" --json visibility --jq .visibility)
          test "$visibility" = PRIVATE || { echo 'ERROR: protected Releases repository must be private.'; exit 1; }
          public_tag="rechercher-public-${GITHUB_RUN_ID}"
          protected_tag="rechercher-protected-${GITHUB_RUN_ID}"
          mkdir -p artifacts/governance
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          out=[]
          for f in sorted(Path('artifacts/developer-review-vault').glob('*.pdf')):
              side=Path('artifacts')/(f.stem+'.manifest.json')
              rights='private-protected'; public=False
              if side.exists():
                  try:
                      d=json.loads(side.read_text(encoding='utf-8')); rights=d.get('storage_visibility') or rights; public=d.get('public_browser') is True
                  except Exception: pass
              route='public' if rights=='publication-eligible' and public else 'protected'
              out.append({'file':str(f),'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'route':route})
          Path('artifacts/governance/release-input.json').write_text(json.dumps({'assets':out},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          pub_count=$(python3 -c "import json; d=json.load(open('artifacts/governance/release-input.json')); print(sum(x['route']=='public' for x in d['assets']))")
          pro_count=$(python3 -c "import json; d=json.load(open('artifacts/governance/release-input.json')); print(sum(x['route']=='protected' for x in d['assets']))")
          [ "$pub_count" -eq 0 ] || gh release create "$public_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rechercher public plaintext PDFs ${GITHUB_RUN_ID}" --notes "Verified redistributable PDFs only. PDF storage is Releases assets; no Git LFS."
          [ "$pro_count" -eq 0 ] || GH_TOKEN="$PROTECTED_TOKEN" gh release create "$protected_tag" --repo "$PROTECTED_REPO" --title "Rechercher protected plaintext PDFs ${GITHUB_RUN_ID}" --notes "Verified PDFs retained privately. No .pdf.enc and no Git LFS."
          while IFS= read -r -d '' f; do
            route=$(python3 - "$f" <<'PY2'
          import json,sys
          d=json.load(open('artifacts/governance/release-input.json'))
          print(next(x['route'] for x in d['assets'] if x['file']==sys.argv[1]))
          PY2
            )
            if [ "$route" = public ]; then gh release upload "$public_tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber; else GH_TOKEN="$PROTECTED_TOKEN" gh release upload "$protected_tag" "$f" --repo "$PROTECTED_REPO" --clobber; fi
            rm -f -- "$f"
          done < <(find artifacts/developer-review-vault -maxdepth 1 -type f -name '*.pdf' -print0)
          python3 - "$public_tag" "$protected_tag" <<'PY3'
          import json,sys
          from pathlib import Path
          p=Path('artifacts/governance/release-input.json'); d=json.loads(p.read_text(encoding='utf-8'))
          for x in d['assets']:
              tag=sys.argv[1] if x['route']=='public' else sys.argv[2]
              repo='${{ github.repository }}' if x['route']=='public' else 'lalibimohamed82-coder/rechercher-pdf-storage'
              x.update({'release_tag':tag,'release_repository':repo,'access':'public' if x['route']=='public' else 'private','download_url':f'https://github.com/{repo}/releases/download/{tag}/{Path(x["file"]).name}'})
          Path('artifacts/governance/vault-release.json').write_text(json.dumps({'schema':'din-allah-encyclopedia/rechercher-vault-release/v5','storage_model':'github-releases-assets','git_lfs':False,'encrypted_pdf_final_format':False,'assets':d['assets'],'counts':{'pdf':len(d['assets']),'pdf_enc':0}},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY3
      - name: Persist manifest, discovery memory and release evidence to review branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git diff --cached --quiet || git commit -m 'data(rechercher): persist acquisition state and cumulative discovery memory'
          ACQ_COMMIT=$(git rev-parse HEAD)
          # The central catalog is materialized for this run only. Restore the tracked
          # catalog before switching branches so generated catalog state never blocks checkout
          # and is never accidentally carried into the protected review branch or Corpus.
          git restore --worktree --staged -- "$CATALOG_PATH" 2>/dev/null || true
          git fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          git checkout "$ACQ_COMMIT" -- \
            artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git add artifacts/governance/vault-release.json \
            books-batches/salaf-01-400h/developer-review-manifest.json \
            books-batches/salaf-01-400h/master-discovery-additions-2026.json \
            books-batches/salaf-01-400h/worldwide-deep-research-wave-2026-09.json
          git diff --cached --quiet || git commit -m 'data(rechercher): reconcile acquire-first state and discovery memory'
          # Checkout disables persisted credentials, so explicitly provide the workflow token
          # to the final review-branch push. Never allow an interactive credential prompt.
          cat > "$RUNNER_TEMP/rechercher-review-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/rechercher-review-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/rechercher-review-askpass" GIT_TERMINAL_PROMPT=0
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "ACQUIRE_FIRST_PERSISTED=$ACQ_COMMIT"
