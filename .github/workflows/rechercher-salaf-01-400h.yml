name: Rechercher — Salaf 01-400H chronological acquisition

on:
  workflow_dispatch:

# security-justification: the acquisition workflow must write verified book artifacts and manifests to this governed acquisition branch.
permissions:
  contents: write

concurrency:
  group: rechercher-salaf-01-400h-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    uses: lalibimohamed-maker/-dorar-hadith-api-official/.github/workflows/rechercher-governed-acquisition.yml@main
    with:
      target_branch: rechercher/salaf-01-400h-chronological-acquisition
    secrets:
      RECHERCHER_SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
    # security-justification: the reusable acquisition workflow persists verified artifacts/manifests to the governed acquisition branch and mirrors verified PDFs to the separately owned LFS storage repository.
    permissions:
      contents: write
