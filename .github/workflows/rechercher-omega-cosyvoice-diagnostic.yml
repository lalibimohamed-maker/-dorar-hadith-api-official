name: Rechercher Ω — CosyVoice acquisition diagnostic

on:
  push:
    branches:
      - feat/rechercher-omega-multimodal-intelligence
    paths:
      - ".github/workflows/rechercher-omega-cosyvoice-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

# security-justification: diagnostic upload to the dedicated CosyVoice prerelease only.

jobs:
  diagnose:
    name: CosyVoice transport diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install HF client
        run: python3 -m pip install --disable-pip-version-check --no-input "huggingface_hub>=0.35,<1"

      - name: Inspect model metadata
        env:
          MODEL_ID: FunAudioLLM/CosyVoice2-0.5B
          REVISION: eec1ae6c79877dbd9379285cf8789c9e0879293d
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          info=HfApi().model_info(os.environ["MODEL_ID"],revision=os.environ["REVISION"],files_metadata=True)
          print("resolved_sha=",info.sha)
          for s in info.siblings:
              print(s.rfilename, s.size)
          PY

      - name: Download config only
        run: |
          set -euxo pipefail
          rm -rf diagnostic
          mkdir diagnostic
          hf download "FunAudioLLM/CosyVoice2-0.5B" config.json             --revision "eec1ae6c79877dbd9379285cf8789c9e0879293d"             --local-dir diagnostic
          cat diagnostic/config.json

      - name: Upload a tiny diagnostic asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          printf 'rechercher-omega-cosyvoice-diagnostic\n' > diagnostic.txt
          upload_url="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/rechercher-omega-cosyvoice2-0.5b-v1.0.0" --jq ".upload_url" | sed "s/{?name,label}//")"
          gh api --method POST "$upload_url?name=diagnostic.txt" --header "Content-Type: text/plain" --input diagnostic.txt >/dev/null

      - name: Upload medium weight with curl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf diagnostic-medium
          mkdir diagnostic-medium
          hf download "FunAudioLLM/CosyVoice2-0.5B" flow.decoder.estimator.fp32.onnx             --revision "eec1ae6c79877dbd9379285cf8789c9e0879293d"             --local-dir diagnostic-medium
          test -s diagnostic-medium/flow.decoder.estimator.fp32.onnx
          upload_url="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/rechercher-omega-cosyvoice2-0.5b-v1.0.0" --jq ".upload_url" | sed 's/{?name,label}//')"
          curl --fail --location --retry 4 --retry-all-errors             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/octet-stream"             --data-binary "@diagnostic-medium/flow.decoder.estimator.fp32.onnx"             "$upload_url?name=diagnostic-flow-decoder.onnx"

      - name: Download one representative weight
        run: |
          set -euxo pipefail
          rm -rf diagnostic-weight
          mkdir diagnostic-weight
          hf download "FunAudioLLM/CosyVoice2-0.5B" hift.pt             --revision "eec1ae6c79877dbd9379285cf8789c9e0879293d"             --local-dir diagnostic-weight
          stat -c '%n %s bytes' diagnostic-weight/hift.pt
