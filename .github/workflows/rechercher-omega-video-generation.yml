name: Rechercher Ω — guarded local video generation

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Video engine"
        required: true
        type: choice
        options:
          - ltx-2
          - hunyuanvideo-1.5
      profile:
        description: "Exact engine profile"
        required: true
        type: string
      prompt:
        description: "Generation prompt"
        required: true
        type: string
      image_path:
        description: "Optional local image path for image-to-video"
        required: false
        type: string
      run_generation:
        description: "Actually invoke the upstream inference pipeline on the authorized GPU runner"
        required: true
        default: false
        type: boolean
      terms_cleared:
        description: "I have independently verified the applicable upstream license/use terms for this private execution"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    if: ${{ inputs.run_generation && inputs.terms_cleared }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 180
    steps:
      - name: Checkout Ω branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate required runner labels
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          echo "[OK] self-hosted Linux x64 GPU runner selected"

      - name: Validate GPU
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA GPU is required")
          print("CUDA:", torch.version.cuda)
          print("GPUs:", torch.cuda.device_count())
          for i in range(torch.cuda.device_count()):
              print(i, torch.cuda.get_device_name(i))
          PY

      - name: Validate exact profile
        env:
          ENGINE: ${{ inputs.engine }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          cfg=json.load(open("config/rechercher-omega-video-engine-profiles-2026.json", encoding="utf-8"))
          key="ltx2" if os.environ["ENGINE"]=="ltx-2" else "hunyuanvideo15"
          ids={p["id"] for p in cfg[key]["profiles"]}
          if os.environ["PROFILE"] not in ids:
              raise SystemExit(f"unknown profile: {os.environ['ENGINE']}/{os.environ['PROFILE']}")
          print("[OK] profile validated")
          PY

      - name: Validate generation adapter support
        env:
          ENGINE: ${{ inputs.engine }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "${ENGINE}/${PROFILE}" in
            ltx-2/distilled-monolith|hunyuanvideo-1.5/480p-i2v-distilled|hunyuanvideo-1.5/480p-i2v-step-distilled|hunyuanvideo-1.5/480p-t2v-distilled)
              echo "[OK] executable generation adapter is defined"
              ;;
            *)
              echo "No executable generation adapter is defined for ${ENGINE}/${PROFILE}"
              exit 1
              ;;
          esac

      - name: Materialize selected private weight profile
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          OMEGA_STORAGE_REPOSITORY: lalibimohamed-maker/rechercher-omega-engine-storage
          OMEGA_STORAGE_RELEASE_TAG: ${{ inputs.engine == 'ltx-2' && 'rechercher-omega-ltx2-v1.0.0' || 'rechercher-omega-hunyuanvideo15-v1.0.0' }}
          OMEGA_VIDEO_ENGINE_ID: ${{ inputs.engine }}
          OMEGA_VIDEO_PROFILE_ID: ${{ inputs.profile }}
          OMEGA_MATERIALIZE_DIR: ${{ runner.temp }}/omega-video-model
        run: |
          set -euo pipefail
          python3 scripts/rechercher-omega-selective-materialize.py

      - name: Record selected profile and immutable revision
        env:
          ENGINE: ${{ inputs.engine }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          cfg=json.load(open("config/rechercher-omega-video-engine-profiles-2026.json",encoding="utf-8"))
          key="ltx2" if os.environ["ENGINE"]=="ltx-2" else "hunyuanvideo15"
          p=next(x for x in cfg[key]["profiles"] if x["id"]==os.environ["PROFILE"])
          print(json.dumps({"engine":os.environ["ENGINE"],"profile":p["id"],"revision":cfg[key]["model_revision"]},ensure_ascii=False))
          PY

      - name: Install LTX-2 upstream runtime at an immutable code commit
        if: ${{ inputs.engine == 'ltx-2' }}
        env:
          LTX_CODE_COMMIT: 28c3c73fe557666c3de176e1e50a5220152ccfca
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          echo "$LTX_CODE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git clone --filter=blob:none https://github.com/Lightricks/LTX-2.git "$RUNNER_TEMP/LTX-2"
          git -C "$RUNNER_TEMP/LTX-2" fetch --depth 1 origin "$LTX_CODE_COMMIT"
          git -C "$RUNNER_TEMP/LTX-2" checkout --detach "$LTX_CODE_COMMIT"
          cd "$RUNNER_TEMP/LTX-2"
          uv sync --frozen
          uv run python -c 'import ltx_pipelines, ltx_core; print("LTX runtime import: OK")'
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is required to obtain the matching Gemma dependency"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gemma-3-12b"
          HF_TOKEN="$HF_TOKEN" uv run hf download google/gemma-3-12b-it-qat-q4_0-unquantized --local-dir "$RUNNER_TEMP/gemma-3-12b"

      - name: Install HunyuanVideo-1.5 upstream runtime at pinned code commit
        if: ${{ inputs.engine == 'hunyuanvideo-1.5' }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5.git "$RUNNER_TEMP/HunyuanVideo-1.5"
          git -C "$RUNNER_TEMP/HunyuanVideo-1.5" fetch --depth 1 origin 60783e704160023913bee78f0b47036d393d4dfa
          git -C "$RUNNER_TEMP/HunyuanVideo-1.5" checkout --detach 60783e704160023913bee78f0b47036d393d4dfa
          cd "$RUNNER_TEMP/HunyuanVideo-1.5"
          test -f requirements.txt
          python3 -m pip install -r requirements.txt

      - name: Restore Hunyuan private runtime bundle
        if: ${{ inputs.engine == 'hunyuanvideo-1.5' }}
        env:
          GH_TOKEN: ${{ secrets.RECHERCHER_OMEGA_STORAGE_TOKEN }}
          STORAGE_REPO: lalibimohamed-maker/rechercher-omega-engine-storage
          RELEASE_TAG: rechercher-omega-hunyuanvideo15-v1.0.0
          MODEL_DIR: ${{ runner.temp }}/omega-video-model
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          gh release download "$RELEASE_TAG"             --repo "$STORAGE_REPO"             --pattern "omega__hunyuanvideo15__runtime.tar.gz"             --dir "$RUNNER_TEMP/hunyuan-runtime"
          runtime_tar="$RUNNER_TEMP/hunyuan-runtime/omega__hunyuanvideo15__runtime.tar.gz"
          test -s "$runtime_tar"
          tar -xzf "$runtime_tar" -C "$MODEL_DIR"
          test -s "$MODEL_DIR/hunyuanvideo15-runtime-manifest.json"
          echo "[OK] Hunyuan runtime bundle restored"

      - name: Preflight staged model runtime layout
        env:
          ENGINE: ${{ inputs.engine }}
          PROFILE: ${{ inputs.profile }}
          MODEL_PATH: ${{ runner.temp }}/omega-video-model
          GEMMA_ROOT: ${{ runner.temp }}/gemma-3-12b
          REQUIRE_EXTERNAL_DEPENDENCIES: "true"
          REQUIRE_RUNTIME_BUNDLE: ${{ inputs.engine == 'hunyuanvideo-1.5' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 scripts/rechercher-omega-video-runtime-smoke.py

      - name: Generate with LTX-2 DistilledPipeline
        if: ${{ inputs.engine == 'ltx-2' && inputs.profile == 'distilled-monolith' }}
        env:
          PROMPT: ${{ inputs.prompt }}
          IMAGE_PATH: ${{ inputs.image_path }}
          MODEL_DIR: ${{ runner.temp }}/omega-video-model
          GEMMA_ROOT: ${{ runner.temp }}/gemma-3-12b
          OUTPUT_PATH: ${{ runner.temp }}/omega-ltx2-output.mp4
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/LTX-2"
          checkpoint="$MODEL_DIR/ltx-2-19b-distilled.safetensors"
          spatial="$MODEL_DIR/ltx-2-spatial-upscaler-x2-1.0.safetensors"
          test -s "$checkpoint"
          test -s "$spatial"
          test -d "$GEMMA_ROOT"
          args=(
            -m ltx_pipelines.distilled
            --checkpoint-path "$checkpoint"
            --gemma-root "$GEMMA_ROOT"
            --spatial-upsampler-path "$spatial"
            --prompt "$PROMPT"
            --output-path "$OUTPUT_PATH"
            --height 512
            --width 768
            --num-frames 49
            --frame-rate 24
          )
          if [ -n "${IMAGE_PATH:-}" ]; then
            test -f "$IMAGE_PATH"
            args+=(--image "$IMAGE_PATH" 0 1.0)
          fi
          uv run python "${args[@]}"

      - name: Generate with HunyuanVideo-1.5
        if: ${{ inputs.engine == 'hunyuanvideo-1.5' && (inputs.profile == '480p-i2v-distilled' || inputs.profile == '480p-i2v-step-distilled' || inputs.profile == '480p-t2v-distilled') }}
        env:
          PROMPT: ${{ inputs.prompt }}
          IMAGE_PATH: ${{ inputs.image_path }}
          MODEL_DIR: ${{ runner.temp }}/omega-video-model
          OUTPUT_PATH: ${{ runner.temp }}/omega-hunyuan-output.mp4
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/HunyuanVideo-1.5"
          case "${{ inputs.profile }}" in
            480p-i2v-distilled|480p-i2v-step-distilled)
              test -n "${IMAGE_PATH:-}" || { echo "IMAGE_PATH is required for Hunyuan I2V profiles"; exit 1; }
              test -f "$IMAGE_PATH"
              ;;
          esac
          resolution=480p
          cfg_distilled=true
          step_distill=false
          image_args=()
          if [ -n "${IMAGE_PATH:-}" ]; then
            test -f "$IMAGE_PATH"
            image_args+=(--image_path "$IMAGE_PATH")
          fi
          if [ "${{ inputs.profile }}" = "480p-i2v-step-distilled" ]; then
            step_distill=true
          fi
          torchrun --nproc_per_node=1 generate.py             --prompt "$PROMPT"             "${image_args[@]}"             --resolution "$resolution"             --aspect_ratio 16:9             --seed 1             --rewrite false             --cfg_distilled "$cfg_distilled"             --enable_step_distill "$step_distill"             --sparse_attn false --use_sageattn false             --enable_cache false --cache_type deepcache             --overlap_group_offloading false             --sr false --save_pre_sr_video             --output_path "$OUTPUT_PATH"             --model_path "$MODEL_DIR"

      - name: Validate generated MP4 quality gate
        env:
          ENGINE: ${{ inputs.engine }}
          OUTPUT_PATH: ${{ runner.temp }}/omega-${{ inputs.engine == 'ltx-2' && 'ltx2' || 'hunyuan' }}-output.mp4
        run: |
          set -euo pipefail
          test -s "$OUTPUT_PATH"
          command -v ffprobe
          python3 - "$OUTPUT_PATH" <<'PY'
          import json, subprocess, sys
          path=sys.argv[1]
          p=subprocess.run(["ffprobe","-v","error","-show_streams","-show_format","-of","json",path],check=True,capture_output=True,text=True)
          data=json.loads(p.stdout)
          streams=[s for s in data.get("streams",[]) if s.get("codec_type")=="video"]
          if not streams:
              raise SystemExit("generated artifact contains no video stream")
          duration=float(data.get("format",{}).get("duration") or 0)
          if duration <= 0:
              raise SystemExit("generated artifact has no positive duration")
          print(json.dumps({"status":"generated_mp4_validated","duration_seconds":duration,"video_codec":streams[0].get("codec_name"),"width":streams[0].get("width"),"height":streams[0].get("height"),"nb_frames":streams[0].get("nb_frames")},ensure_ascii=False))
          PY
      - name: Write generation manifest
        env:
          ENGINE: ${{ inputs.engine }}
          PROFILE: ${{ inputs.profile }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          engine=os.environ["ENGINE"]
          profile=os.environ["PROFILE"]
          prompt=os.environ["PROMPT"]
          manifest={
            "schema_version":"1.0.0",
            "engine":engine,
            "profile":profile,
            "prompt_sha256":hashlib.sha256(prompt.encode("utf-8")).hexdigest(),
            "runner_platform":platform.platform(),
            "corpus_write_allowed":False,
            "generated_media_is_evidence":False,
            "rights_gate":"operator_terms_cleared",
            "status":"generated_artifact_pending_quality_gate"
          }
          subprocess.run(["python3","-c","import json; print(json.dumps("+repr(manifest)+",ensure_ascii=False,indent=2))"],check=False)
          with open(os.path.join(os.environ["RUNNER_TEMP"],"omega-generation-manifest.json"),"w",encoding="utf-8") as fh:
              json.dump(manifest,fh,ensure_ascii=False,indent=2)
              fh.write("\n")
          PY

      - name: Upload generated video as non-scholarly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omega-video-${{ inputs.engine }}-${{ inputs.profile }}
          path: |
            ${{ runner.temp }}/omega-*-output.mp4
            ${{ runner.temp }}/omega-generation-manifest.json
          if-no-files-found: error
