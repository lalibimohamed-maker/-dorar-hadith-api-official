name: Rechercher — Multi-pass acquisition gap retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# security-justification: trusted default-branch code only; no pull-request code is checked out or executed.
permissions:
  contents: write

concurrency:
  group: rechercher-developer-review-acquisition
  cancel-in-progress: false

env:
  REVIEW_BRANCH: rechercher/salaf-01-400h-developer-review-acquisition
  SECONDARY_STORAGE_REPO: lalibimohamed82-coder/rechercher-pdf-storage

jobs:
  retry:
    name: Retry unresolved PDF acquisitions
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install PDF validator and Git LFS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf git-lfs
          git lfs install

      - name: Require secondary PDF storage key
        env:
          SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
        run: test -n "$SECONDARY_STORAGE_TOKEN"

      - name: Recover persistent plaintext PDF vault
        env:
          SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/developer-review-vault /tmp/rechercher-pdf-storage /tmp/rechercher-legacy-vault

          export GIT_LFS_SKIP_SMUDGE=0
          if git clone "https://x-access-token:${SECONDARY_STORAGE_TOKEN}@github.com/${SECONDARY_STORAGE_REPO}.git" /tmp/rechercher-pdf-storage 2>/tmp/rechercher-storage-clone.err; then
            find /tmp/rechercher-pdf-storage/artifacts -maxdepth 1 -type f -name '*.pdf' -exec cp -n {} artifacts/developer-review-vault/ \; 2>/dev/null || true
          else
            cat /tmp/rechercher-storage-clone.err
            echo 'ERROR: persistent plaintext PDF storage repository could not be cloned.'
            exit 1
          fi

          # One-time migration only: if the persistent PDF pool has not yet
          # been seeded, recover the previous encrypted release into plaintext,
          # then migrate it to the PDF pool and delete the encrypted releases.
          shopt -s nullglob
          legacy_pdfs=(artifacts/developer-review-vault/*.pdf)
          if [ "${#legacy_pdfs[@]}" -eq 0 ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("rechercher-vault-"))] | sort_by(.createdAt) | last | .tagName')
            if [ -n "${tag:-}" ] && [ "$tag" != "null" ]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.enc' --dir /tmp/rechercher-legacy-vault
              for f in /tmp/rechercher-legacy-vault/*.enc; do
                out="artifacts/developer-review-vault/$(basename "${f%.enc}")"
                openssl enc -d -aes-256-cbc -pbkdf2 -salt -md sha256 -pass env:REVIEW_VAULT_KEY -in "$f" -out "$out"
              done
            fi
          fi

          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || echo 'No persistent PDFs found yet; acquisition will start from the current manifest.'
          for f in "${files[@]}"; do
            test "$(head -c 5 "$f")" = '%PDF-'
            qpdf --check "$f"
          done
          printf '%s\n' "${files[@]##*/}" | sort > /tmp/vault-before.txt

      - name: Recover latest acquisition manifest
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          git show "origin/$REVIEW_BRANCH:books-batches/salaf-01-400h/developer-review-manifest.json" > /tmp/developer-review-manifest.json
          test -s /tmp/developer-review-manifest.json

      - name: Run multi-pass gap retry
        run: |
          set -euo pipefail
          python3 scripts/rechercher_no_match_retry.py \
            --manifest /tmp/developer-review-manifest.json \
            --vault artifacts/developer-review-vault \
            --report artifacts/governance/no-match-retry-report.json
          python3 scripts/rechercher_acquisition_metrics.py \
            --manifest /tmp/developer-review-manifest.json \
            --report artifacts/governance/no-match-retry-report.json
          cat artifacts/governance/no-match-retry-report.json
          mkdir -p artifacts/retry-new
          find artifacts/developer-review-vault -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort > /tmp/vault-after.txt
          comm -13 /tmp/vault-before.txt /tmp/vault-after.txt | while IFS= read -r name; do
            cp "artifacts/developer-review-vault/$name" "artifacts/retry-new/$name"
          done
          find artifacts/retry-new -maxdepth 1 -type f -name '*.pdf' | sort

      - name: Preserve newly validated PDFs as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-no-match-retry-pdfs-${{ github.run_id }}
          path: artifacts/retry-new/*.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Persist plaintext PDFs to secondary LFS storage
        env:
          SECONDARY_STORAGE_TOKEN: ${{ secrets.RECHERCHER_SECONDARY_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/rechercher-pdf-storage
          git lfs install
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git switch main 2>/dev/null || true
            git pull --rebase --autostash origin main
          else
            git switch --orphan main
          fi

          git lfs track 'artifacts/*.pdf'
          mkdir -p artifacts
          cp -a "$GITHUB_WORKSPACE/artifacts/developer-review-vault/." artifacts/

          while IFS= read -r -d '' f; do
            case "$f" in
              *.pdf.enc) echo "ERROR: encrypted .pdf.enc is forbidden in persistent PDF storage: $f"; exit 1 ;;
            esac
            head -c 5 "$f" | grep -qx '%PDF-' || { echo "ERROR: stored file is not real PDF bytes: $f"; exit 1; }
            test -s "$f"
          done < <(find artifacts -type f -name '*.pdf' -print0)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts .gitattributes
          if git diff --cached --quiet; then
            echo 'Persistent plaintext PDF storage is already synchronized.'
          else
            git commit -m 'data(rechercher): persist verified PDFs without encryption layer'
            git lfs fsck --pointers HEAD
            git lfs push --dry-run origin HEAD
            git push origin HEAD
          fi

      - name: Remove legacy encrypted vault releases after PDF migration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | while IFS= read -r tag; do
                case "$tag" in
                  rechercher-vault-*) gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes ;;
                esac
              done

      - name: Snapshot generated state before changing branches
        run: |
          set -euo pipefail
          cp /tmp/developer-review-manifest.json /tmp/generated-manifest.json
          cp artifacts/governance/no-match-retry-report.json /tmp/generated-retry-report.json

      - name: Persist retry manifest and detailed audit evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          rm -f artifacts/governance/no-match-retry-report.json
          git -c "http.extraheader=${GIT_AUTH_HEADER}" fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          cp /tmp/generated-manifest.json books-batches/salaf-01-400h/developer-review-manifest.json
          mkdir -p artifacts/governance
          cp /tmp/generated-retry-report.json artifacts/governance/no-match-retry-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches/salaf-01-400h/developer-review-manifest.json artifacts/governance/no-match-retry-report.json
          if git diff --cached --quiet; then
            echo 'No retry state changed; nothing to persist.'
            exit 0
          fi
          git commit -m 'data(rechercher): persist detailed multi-pass acquisition state'
          git -c "http.extraheader=${GIT_AUTH_HEADER}" push origin "HEAD:refs/heads/$REVIEW_BRANCH"
