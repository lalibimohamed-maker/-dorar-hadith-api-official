name: Rechercher — Multi-pass acquisition gap retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# security-justification: trusted default-branch code only; no pull-request code is checked out or executed.
permissions:
  contents: write

concurrency:
  group: rechercher-developer-review-acquisition
  cancel-in-progress: false

env:
  REVIEW_BRANCH: rechercher/salaf-01-400h-developer-review-acquisition

jobs:
  retry:
    name: Retry unresolved PDF acquisitions
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install PDF validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qpdf

      - name: Require review vault key
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: test -n "$REVIEW_VAULT_KEY"

      - name: Recover latest review vault
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/developer-review-vault /tmp/rechercher-vault
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("rechercher-vault-"))] | sort_by(.createdAt) | last | .tagName')
          if [ -n "${tag:-}" ] && [ "$tag" != "null" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.enc' --dir /tmp/rechercher-vault
            shopt -s nullglob
            for f in /tmp/rechercher-vault/*.enc; do
              out="artifacts/developer-review-vault/$(basename "${f%.enc}")"
              openssl enc -d -aes-256-cbc -pbkdf2 -salt -md sha256 -pass env:REVIEW_VAULT_KEY -in "$f" -out "$out"
              test "$(head -c 5 "$out")" = '%PDF-'
              qpdf --check "$out"
            done
          fi
          find artifacts/developer-review-vault -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort > /tmp/vault-before.txt

      - name: Recover latest acquisition manifest
        run: |
          set -euo pipefail
          git fetch origin "$REVIEW_BRANCH"
          git show "origin/$REVIEW_BRANCH:books-batches/salaf-01-400h/developer-review-manifest.json" > /tmp/developer-review-manifest.json
          test -s /tmp/developer-review-manifest.json

      - name: Run multi-pass gap retry
        run: |
          set -euo pipefail
          python3 scripts/rechercher_no_match_retry.py \
            --manifest /tmp/developer-review-manifest.json \
            --vault artifacts/developer-review-vault \
            --report artifacts/governance/no-match-retry-report.json
          python3 scripts/rechercher_acquisition_metrics.py \
            --manifest /tmp/developer-review-manifest.json \
            --report artifacts/governance/no-match-retry-report.json
          cat artifacts/governance/no-match-retry-report.json
          mkdir -p artifacts/retry-new
          find artifacts/developer-review-vault -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort > /tmp/vault-after.txt
          comm -13 /tmp/vault-before.txt /tmp/vault-after.txt | while IFS= read -r name; do
            cp "artifacts/developer-review-vault/$name" "artifacts/retry-new/$name"
          done
          find artifacts/retry-new -maxdepth 1 -type f -name '*.pdf' | sort

      - name: Preserve newly validated PDFs as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rechercher-no-match-retry-pdfs-${{ github.run_id }}
          path: artifacts/retry-new/*.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Encrypt updated vault without deleting plaintext
        env:
          REVIEW_VAULT_KEY: ${{ secrets.REVIEW_VAULT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/developer-review-encrypted
          shopt -s nullglob
          files=(artifacts/developer-review-vault/*.pdf)
          test "${#files[@]}" -gt 0 || { echo 'ERROR: vault is empty after retry; refusing persistence.'; exit 1; }
          for f in "${files[@]}"; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 -pass env:REVIEW_VAULT_KEY \
              -in "$f" -out "artifacts/developer-review-encrypted/$(basename "$f").enc"
          done
          tag="rechercher-vault-${GITHUB_RUN_ID}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Rechercher vault ${GITHUB_RUN_ID}" \
            --notes 'Encrypted retention vault for validated developer-review PDFs. Plaintext publication remains governed separately.'
          gh release upload "$tag" artifacts/developer-review-encrypted/*.enc --repo "$GITHUB_REPOSITORY" --clobber

      - name: Snapshot generated state before changing branches
        run: |
          set -euo pipefail
          cp /tmp/developer-review-manifest.json /tmp/generated-manifest.json
          cp artifacts/governance/no-match-retry-report.json /tmp/generated-retry-report.json

      - name: Persist retry manifest and detailed audit evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # The retry report is generated on trusted main and is untracked there.
          # Remove only this exact generated path before switching to the review branch;
          # the canonical copy is already snapshotted under /tmp.
          rm -f artifacts/governance/no-match-retry-report.json
          git -c "http.extraheader=${GIT_AUTH_HEADER}" fetch origin "$REVIEW_BRANCH"
          git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
          cp /tmp/generated-manifest.json books-batches/salaf-01-400h/developer-review-manifest.json
          mkdir -p artifacts/governance
          cp /tmp/generated-retry-report.json artifacts/governance/no-match-retry-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books-batches/salaf-01-400h/developer-review-manifest.json artifacts/governance/no-match-retry-report.json
          if git diff --cached --quiet; then
            echo 'No retry state changed; nothing to persist.'
            exit 0
          fi
          git commit -m 'data(rechercher): persist detailed multi-pass acquisition state'
          git -c "http.extraheader=${GIT_AUTH_HEADER}" push origin "HEAD:refs/heads/$REVIEW_BRANCH"
