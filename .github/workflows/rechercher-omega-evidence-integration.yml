name: Rechercher Omega — Evidence Gate API/MCP Integration
on:
  push:
    branches: [feat/rechercher-omega-multimodal-intelligence]
    paths:
      - src/rechercher-omega-evidence-gate.js
      - src/rechercher-omega-answer-verifier.js
      - src/rechercher-ai-gateway.js
      - src/rechercher-ai-mcp-server.js
      - test/rechercher-omega-answer-verifier.integration.test.js
      - test/rechercher-omega-evidence-api-mcp.integration.test.js
      - .github/workflows/rechercher-omega-evidence-integration.yml
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rechercher-omega-evidence-integration
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run deterministic evidence gate tests
        run: node --test test/rechercher-omega-answer-verifier.integration.test.js test/rechercher-omega-evidence-api-mcp.integration.test.js test/rechercher-omega-governed-run.test.js test/rechercher-omega-governance-gap-closure.test.js
