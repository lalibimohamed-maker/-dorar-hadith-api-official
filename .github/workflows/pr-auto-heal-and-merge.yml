name: PR Auto-Heal and Gated Auto-Merge

# security-justification: this trusted control-plane workflow never checks out or executes PR code.
# It only reads PR metadata and uses GitHub's protected merge gate after required review/checks.
# No untrusted event value is executed as shell code; event-derived values are captured once at job scope
# and then passed through environment variables. Automatic repair is limited to deterministic merge blockers;
# arbitrary source/content changes are never guessed or silently rewritten.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: pr-auto-heal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  heal-and-arm:
    name: Heal deterministic blockers and arm auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Inspect PR state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          echo "state=$(jq -r '.state' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(jq -r '.mergeable' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "mergeable_state=$(jq -r '.mergeable_state' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.base.ref' <<<"$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Update branch when GitHub reports it is behind
        if: >-
          steps.pr.outputs.state == 'open' &&
          steps.pr.outputs.head_repo == github.repository &&
          steps.pr.outputs.base == 'main' &&
          steps.pr.outputs.draft != 'true' &&
          steps.pr.outputs.mergeable_state == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # GitHub documents 202 as the normal response for update-branch.
          # 502/503/504 are transient server/gateway failures and must not turn
          # an otherwise valid PR into a false Auto-Heal failure.
          for attempt in 1 2 3 4 5; do
            echo "[UPDATE-BRANCH] attempt=${attempt}/5 expected_head_sha=${EXPECTED_HEAD_SHA}"

            response_file="$(mktemp)"
            if gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f update_method=merge \
              -f "expected_head_sha=${EXPECTED_HEAD_SHA}" \
              >"$response_file" 2>&1; then
              echo '[UPDATE-BRANCH] GitHub accepted the branch update.'
              rm -f "$response_file"
              exit 0
            fi

            response="$(cat "$response_file")"
            rm -f "$response_file"

            if grep -Eq 'HTTP/[0-9.]+ (502|503|504)|Server Error \(HTTP (502|503|504)\)' <<<"$response"; then
              if [[ "$attempt" -lt 5 ]]; then
                delay=$((attempt * 5))
                echo "[UPDATE-BRANCH] transient GitHub gateway/server error; retrying in ${delay}s."
                sleep "$delay"
                continue
              fi
              echo '[UPDATE-BRANCH] GitHub continued returning a transient 5xx after 5 attempts.'
              echo "$response"
              exit 1
            fi

            echo '[UPDATE-BRANCH] non-transient failure; refusing to retry blindly.'
            echo "$response"
            exit 1
          done

      - name: Arm protected auto-merge
        if: >-
          steps.pr.outputs.state == 'open' &&
          steps.pr.outputs.head_repo == github.repository &&
          steps.pr.outputs.base == 'main' &&
          steps.pr.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state' <<<"$pr_json")"

            echo "[AUTO-MERGE] attempt=${attempt} mergeable=${mergeable} state=${mergeable_state}"

            if [[ "$mergeable" == "true" ]]; then
              if gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --merge; then
                echo 'Auto-merge armed. GitHub will merge only after every protected requirement, including the required secondary-account approval and required checks, is satisfied.'
                exit 0
              fi
              echo '[AUTO-MERGE] GitHub rejected the merge request; re-checking protected state.'
            elif [[ "$mergeable" == "false" ]]; then
              echo "[AUTO-MERGE] PR is not mergeable yet (mergeable_state=${mergeable_state}); this is a pending protected-gate state, not a workflow failure."
            else
              echo '[AUTO-MERGE] GitHub has not finished calculating mergeability; waiting for the next check.'
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          echo '[AUTO-MERGE] Auto-merge remains pending; GitHub will merge automatically once the protected requirements become satisfied.'
          exit 0
