name: Rechercher — HadeethEnc full multilingual discovery

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Optional HadeethEnc language code; leave empty for every published language'
        required: false
        default: ''
  schedule:
    - cron: '43 2 * * 0'

permissions:
  contents: read

concurrency:
  group: rechercher-hadeethenc-full-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Syntax check
        run: |
          node --check src/rechercher/native-source-connectors.js
          node --check config/rechercher-verified-multilingual-connectors.js
          node --check scripts/rechercher-native-connectors.mjs
      - name: Run complete HadeethEnc discovery
        env:
          HADEETHENC_LANGUAGE: ${{ inputs.language }}
        run: node scripts/rechercher-native-connectors.mjs hadeethenc-discover
      - name: Upload HadeethEnc discovery manifest
        uses: actions/upload-artifact@v6
        with:
          name: rechercher-hadeethenc-full-discovery
          path: artifacts/rechercher-hadeethenc-full-discovery.json
          if-no-files-found: error
          retention-days: 14
