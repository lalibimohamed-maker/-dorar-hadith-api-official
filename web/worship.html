<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو تعليم العبادات — موسوعة دين الله</title><style>body{font-family:system-ui,Arial;max-width:900px;margin:auto;padding:20px;background:#f7fbf8;color:#17352a}button,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #dbe8e0}button{background:#176b4b;color:#fff;border:0;cursor:pointer}.mods{display:flex;gap:8px;flex-wrap:wrap}.mods button.active{background:#0d4b36}.card{background:#fff;border:1px solid #dbe8e0;border-radius:20px;padding:20px;margin:15px 0}.icon{font-size:70px;text-align:center}.bar{height:8px;background:#e6eee9;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#176b4b}.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.muted{color:#63746c}</style><body><h1>🎓 استوديو تعليم العبادات</h1><p class="muted">تعليم تفاعلي سمعي بصري. لا تُعرض الخطوة بوصفها سنة ثابتة إلا بعد ربطها بمصدر موثق في طبقة الأدلة.</p><div class="card"><div id="app"></div></div><div class="card"><h2>🧮 مختبر الزكاة</h2><div class="calc"><label>النقد <input id="cash" type="number" min="0" value="0"></label><label>الذهب <input id="gold" type="number" min="0" value="0"></label><label>الفضة <input id="silver" type="number" min="0" value="0"></label><label>التجارة <input id="trade" type="number" min="0" value="0"></label><label>المبلغ المستبعد وفق قاعدة مرجعية <input id="deduct" type="number" min="0" value="0"></label><label>النصاب <input id="nisab" type="number" min="0" value="0"></label></div><p id="z"></p><p class="muted">هذه حاسبة تعليمية: الأحكام تختلف باختلاف نوع المال والحول والنصاب وما يخصمه الفقهاء، فلا تُعامل النتيجة وحدها كفتوى.</p></div><script>const data={wudu:{n:'الوضوء',i:'💧',s:[['النية','استحضر النية في القلب.'],['غسل الكفين','تعلم الصفة الموثقة لغسل الكفين.'],['غسل الوجه','اغسل الوجه كاملًا وفق الدليل.'],['غسل اليدين','اغسل إلى المرفقين وفق الصفة الموثقة.'],['مسح الرأس','طبّق المسح على الصفة الموثقة.'],['غسل الرجلين','اغسل الرجلين إلى الكعبين مع العناية بالمواضع المطلوبة.']]},prayer:{n:'الصلاة',i:'🕌',s:[['الاستعداد','استقبل القبلة واستحضر الصلاة.'],['تكبيرة الإحرام','تعلم صفة رفع اليدين والتكبير من الدليل.'],['القراءة','اقرأ الفاتحة وما تيسر مع درس التجويد.'],['الركوع','اركع مطمئنًا وطبّق الذكر الثابت.'],['السجود','اسجد مطمئنًا على الصفة الثابتة.'],['التشهد والسلام','أتم التشهد ثم السلام وفق الدليل.']]},janazah:{n:'صلاة الجنازة',i:'🤲',s:[['الأولى','الفاتحة وفق الدليل المعتمد.'],['الثانية','الصلاة على النبي ﷺ بالصلاة الثابتة.'],['الثالثة','الدعاء للميت بالأدعية الثابتة.'],['الرابعة','إتمام الدعاء والسلام على الصفة الموثقة.']]},adhan:{n:'الأذان',i:'🔊',s:[['الأذان','استمع وتعلم ألفاظ الأذان.'],['الحيعلتان','تعلم المتابعة الصحيحة للمؤذن.'],['بعد الأذان','تعلم الصلاة على النبي ﷺ والدعاء الوارد.']]}};let m='wudu',p=0;const app=document.getElementById('app');function say(){if(!('speechSynthesis'in window))return;const x=data[m].s[p];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x[0]+'. '+x[1]);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}function draw(){const d=data[m],x=d.s[p];app.innerHTML='<div class="mods">'+Object.keys(data).map(k=>`<button class="${k===m?'active':''}" data-m="${k}">${data[k].n}</button>`).join('')+'</div><div class="bar"><i style="width:${(p+1)/d.s.length*100}%"></i></div><div class="icon">'+d.i+'</div><h2>'+x[0]+'</h2><p>'+x[1]+'</p><p class="muted">📚 الدليل: يُجلب من سجل الأدلة والتحقق، ولا يُنشأ من الذاكرة.</p><button id="listen">🔊 استمع</button> <button id="next">التالي</button>'}app.addEventListener('click',e=>{if(e.target.dataset.m){m=e.target.dataset.m;p=0;draw()}if(e.target.id==='listen')say();if(e.target.id==='next'){p=Math.min(p+1,data[m].s.length-1);draw()}});function calc(){let a=['cash','gold','silver','trade'].reduce((s,id)=>s+Number(document.getElementById(id).value||0),0);let d=Number(document.getElementById('deduct').value||0),n=Number(document.getElementById('nisab').value||0),net=Math.max(a-d,0);document.getElementById('z').textContent=n?`المبلغ المحتسب: ${net.toFixed(2)} — الزكاة التعليمية عند تحقق شروطها: ${net>=n?(net*.025).toFixed(2):'0.00'}`:`المبلغ المحتسب: ${net.toFixed(2)} — أدخل النصاب المرجعي.`}document.querySelectorAll('.calc input').forEach(x=>x.oninput=calc);draw();calc();</script></body></html>
