services:
  - type: web
    name: deen-allah-encyclopedia-api
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PUBLIC_MAX_PER_MINUTE
        value: 30
      - key: APP_MAX_PER_MINUTE
        value: 120
      - key: REQUEST_TIMEOUT_MS
        value: 10000
      - key: PERFORMANCE_CACHE_ENTRIES
        value: 1500
      - key: PERFORMANCE_CACHE_BYTES
        value: 50331648
      - key: PERFORMANCE_CACHE_MAX_BODY
        value: 2097152
      - key: PERFORMANCE_MIN_COMPRESS_BYTES
        value: 768
