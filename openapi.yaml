openapi: 3.1.0
info:
  title: موسوعة الدرر - Official Research API
  version: 0.4.0
  description: Public research gateway for official Dorar.net hadith retrieval and a curated Sunni Islamic source registry. Source attribution is mandatory.
servers:
  - url: https://YOUR_DEPLOYED_API_HOST
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      responses:
        '200': {description: Healthy}
  /categories:
    get:
      operationId: listCategories
      summary: List encyclopedia research categories
      responses:
        '200': {description: Categories}
  /sources:
    get:
      operationId: listSources
      summary: List configured sources
      parameters:
        - {name: category, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {type: string}}
      responses:
        '200': {description: Source registry}
  /sources/one:
    get:
      operationId: getSource
      summary: Get one source by id
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Source}
        '404': {description: Source not found}
  /maqasid:
    get:
      operationId: getMaqasid
      summary: Get maqasid taxonomy and the five daruriyyat
      responses:
        '200': {description: Maqasid taxonomy}
  /search:
    get:
      operationId: search
      summary: Search official Dorar.net hadith data
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 300}}
      responses:
        '200':
          description: Search results with source attribution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {description: Missing query}
        '429': {description: Rate limit exceeded}
        '502': {description: Upstream source failure}
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    SearchResponse:
      type: object
      required: [query, source, data]
      properties:
        query: {type: string}
        source:
          type: object
          required: [id, nameAr, role]
          properties:
            id: {type: string}
            nameAr: {type: string}
            role: {type: string}
            url: {type: string, format: uri}
        data: {type: object}
        researchPolicy: {type: string}
