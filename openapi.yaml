openapi: 3.1.0
info:
  title: Deen Allah Encyclopedia API
  version: 0.11.0
  description: Multilingual source-attributed research API for Quran, hadith, tafsir, creed, fiqh, sirah, maqasid, faraid and Quran learning. Search and five-second long-press concept cards respond in the selected language without a separate meaning-translation layer.
servers:
  - url: https://YOUR_DEPLOYED_API_HOST
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        '200': {description: Healthy}
  /quran/video/config:
    get:
      operationId: getQuranVideoConfig
      summary: Get Quran recitation video engine configuration
      responses:
        '200': {description: Video configuration}
  /quran/video/validate:
    post:
      operationId: validateQuranVideoSelection
      summary: Validate selected surahs, ayah ranges, reciter and output settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reciterId]
              properties:
                surahs: {type: array, items: {type: integer, minimum: 1, maximum: 114}}
                ranges: {type: array, items: {type: object}}
                reciterId: {type: string}
                format: {type: string, enum: [mp4]}
                resolution: {type: string, enum: [720p, 1080p, 1440p]}
      responses:
        '200': {description: Validated video selection}
        '400': {description: Invalid selection}
  /quran/video/background:
    post:
      operationId: buildQuranVideoBackgroundPrompt
      summary: Build an AI background request without altering Quranic text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: {type: string}
                preset: {type: string}
      responses:
        '200': {description: Background request}
  /quran/scientific-signs/config:
    get:
      operationId: getQuranScientificSignsConfig
      summary: Get Quran scientific signs methodology and video configuration
      responses:
        '200': {description: Scientific signs configuration}
  /quran/scientific-signs/project:
    post:
      operationId: createQuranScientificSignsProject
      summary: Create an evidence-first Quran scientific signs video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, ayahs, primaryLanguage]
              properties:
                topic: {type: string}
                ayahs: {type: array, items: {type: string}}
                primaryLanguage: {type: string}
                additionalLanguages: {type: array, maxItems: 2, items: {type: string}}
                scientificSources: {type: array, items: {type: object}}
                religiousSources: {type: array, items: {type: object}}
      responses:
        '200': {description: Project created for source review and video rendering}
        '400': {description: Invalid project}
  /search:
    get:
      operationId: search
      summary: Multilingual unified source search; Dorar hadith search first, expanding across verified Sunni Islamic source domains
      description: |
        Every returned source record preserves source identity, source type, verification state, rights state, and bibliography when available.
        Hadith collection membership is never treated as authenticity; reported grading remains a separate evidence field.
        Cause-of-revelation links require verified source evidence and thematic similarity alone never proves a cause.
        PDF/DOCX redistribution and Quran recitation download are rights-gated.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 300}}
        - {name: lang, in: query, required: false, schema: {type: string}}
        - {name: comparative, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Search results with source attribution and governed evidence separation
          content:
            application/json:
              schema:
                type: object
                required: [query, sourceMatches, policy]
                properties:
                  query: {type: string}
                  sourceMatches:
                    type: array
                    items:
                      type: object
                      required: [id, domain, title, sourceId, sourceType, source, verificationState, rightsState]
                      properties:
                        id: {type: string}
                        domain: {type: string}
                        title: {type: string}
                        sourceId: {type: [string, "null"]}
                        sourceType: {type: string}
                        source: {type: [string, "null"]}
                        verificationState: {type: string}
                        rightsState: {type: string}
                        bibliographic: {type: [object, "null"], additionalProperties: true}
                  hadithResearch:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceEvidence: {type: object}
                        gradingEvidence: {type: object}
                  policy:
                    type: object
                    additionalProperties: true
  /concept:
    get:
      operationId: getConceptCard
      summary: Medium concept card opened after a five-second long press; no meaning-translation layer
      parameters:
        - {name: term, in: query, required: true, schema: {type: string}}
        - {name: context, in: query, required: false, schema: {type: string}}
        - {name: lang, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Concept card}
  /quran/ayah:
    get:
      operationId: getQuranAyah
      parameters:
        - {name: verse, in: query, required: true, schema: {type: string}}
        - {name: translationIds, in: query, required: false, schema: {type: string}}
        - {name: tafsirIds, in: query, required: false, schema: {type: string}}
        - {name: words, in: query, required: false, schema: {type: boolean}}
      responses:
        '200': {description: Quran ayah context}
  /quran/translations:
    get:
      operationId: listQuranTranslations
      parameters:
        - {name: lang, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Quran translations}
  /tajweed:
    get:
      operationId: getTajweedCurriculum
      responses:
        '200': {description: Tajweed curriculum}
  /tajweed/lesson:
    get:
      operationId: getTajweedLesson
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Tajweed lesson}
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
