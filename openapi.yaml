openapi: 3.1.0
info:
  title: Dorar Encyclopedia API
  version: 0.3.0
  description: Public search contract for Quran, hadith, seerah, tafsir and related sources. Source attribution is mandatory.
servers:
  - url: https://YOUR_DEPLOYED_API_HOST
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      responses:
        '200': {description: Healthy}
  /search:
    get:
      operationId: search
      summary: Smart and advanced search
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: category, in: query, schema: {type: string, enum: [quran, tafsir, tadabbur, hidayat, hadith, seerah, musnads, fiqh, books]}}
        - {name: source, in: query, schema: {type: string}}
      responses:
        '200':
          description: Search results with source attribution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {description: Missing query}
        '502': {description: Upstream source failure}
  /sources:
    get:
      operationId: listSources
      summary: List configured sources
      responses:
        '200': {description: Source registry}
components:
  schemas:
    SearchResponse:
      type: object
      required: [query, results]
      properties:
        query: {type: string}
        results:
          type: array
          items:
            type: object
            required: [title, category, source]
            properties:
              title: {type: string}
              text: {type: string}
              category: {type: string}
              source:
                type: object
                required: [name, url]
                properties:
                  name: {type: string}
                  url: {type: string, format: uri}
              reliability: {type: string}
              attribution: {type: string}
