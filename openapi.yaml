openapi: 3.1.0
info:
  title: Dorar Hadith API Official
  version: 0.2.0
  description: Integration API that retrieves hadith search results through the official Dorar.net JSON API.
servers:
  - url: https://YOUR_DEPLOYED_API_HOST
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, source]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  source: { type: string }
                  timestamp: { type: string, format: date-time }
  /search:
    get:
      operationId: searchHadith
      summary: Search hadith in Dorar.net
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Search results returned from Dorar.net
          content:
            application/json:
              schema:
                type: object
                required: [query, source, data]
                properties:
                  query: { type: string }
                  source: { type: string }
                  data: {}
        '400': { description: Missing query }
        '502': { description: Dorar.net retrieval failed }
