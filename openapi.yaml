openapi: 3.1.0
info:
  title: Deen Allah Encyclopedia API
  version: 0.9.0
  description: Multilingual source-attributed research API for Quran, hadith, tafsir, creed, fiqh, sirah, maqasid, faraid and Quran learning. Scholar inclusion is a research index, not automatic endorsement of every statement.
servers:
  - url: https://YOUR_DEPLOYED_API_HOST
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        '200': {description: Healthy}
  /locales:
    get:
      operationId: listLocales
      responses:
        '200': {description: Supported locales}
  /categories:
    get:
      operationId: listCategories
      responses:
        '200': {description: Categories}
  /sources:
    get:
      operationId: listSources
      parameters:
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: role, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Source registry}
  /search:
    get:
      operationId: search
      summary: Multilingual unified search
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 300}}
        - {name: lang, in: query, required: false, schema: {type: string}}
        - {name: includePotentialMatches, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Search results with provenance}
        '400': {description: Missing query}
        '413': {description: Query too long}
        '429': {description: Rate limit exceeded}
        '502': {description: Upstream failure}
  /research/domains:
    get:
      operationId: listResearchDomains
      summary: List domain-specific research frameworks
      responses:
        '200': {description: Research domains and methodology rules}
  /research/domain:
    get:
      operationId: getResearchDomain
      summary: Get the scholar and methodology framework for one domain
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, enum: [aqeedah, tafsir, hadith, usul-al-fiqh, maqasid, sirah, faraid]}}
      responses:
        '200': {description: Domain framework}
        '400': {description: Missing domain}
        '404': {description: Domain not found}
  /research/scholars:
    get:
      operationId: searchDomainScholars
      summary: Search qualified Sunni scholars by domain
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: domain, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Scholar index}
  /fiqh:
    get:
      operationId: getFiqhFramework
      summary: Comparative Sunni fiqh framework
      parameters:
        - {name: scholar, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Fiqh framework}
  /fiqh/research:
    get:
      operationId: searchFiqhResearch
      summary: Search fiqh scholars and works
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Fiqh research results}
        '400': {description: Missing query}
  /fiqh/template:
    get:
      operationId: buildFiqhResearchTemplate
      summary: Build evidence-first comparative fiqh analysis
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: madhhab, in: query, required: false, schema: {type: string, enum: [hanafi, maliki, shafii, hanbali]}}
      responses:
        '200': {description: Comparative fiqh template}
        '400': {description: Missing query}
  /inheritance/madhahib:
    get:
      operationId: listInheritanceMadhahib
      responses:
        '200': {description: Four Sunni madhhabs}
  /inheritance:
    get:
      operationId: calculateInheritance
      summary: Educational Sunni faraid calculator
      parameters:
        - {name: estate, in: query, required: true, schema: {type: number, minimum: 0}}
        - {name: debts, in: query, required: false, schema: {type: number, minimum: 0, default: 0}}
        - {name: bequest, in: query, required: false, schema: {type: number, minimum: 0, default: 0}}
        - {name: madhhab, in: query, required: false, schema: {type: string, enum: [hanafi, maliki, shafii, hanbali], default: hanbali}}
      responses:
        '200': {description: Calculation}
        '400': {description: Invalid case}
  /quran/ayah:
    get:
      operationId: getQuranAyah
      parameters:
        - {name: verse, in: query, required: true, schema: {type: string}}
        - {name: translationIds, in: query, required: false, schema: {type: string}}
        - {name: tafsirIds, in: query, required: false, schema: {type: string}}
        - {name: words, in: query, required: false, schema: {type: boolean}}
      responses:
        '200': {description: Quran ayah context}
        '404': {description: Ayah not found}
  /quran/translations:
    get:
      operationId: listQuranTranslations
      parameters:
        - {name: lang, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Quran translations}
  /tajweed:
    get:
      operationId: getTajweedCurriculum
      responses:
        '200': {description: Tajweed curriculum}
  /tajweed/lesson:
    get:
      operationId: getTajweedLesson
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Tajweed lesson}
        '404': {description: Lesson not found}
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
